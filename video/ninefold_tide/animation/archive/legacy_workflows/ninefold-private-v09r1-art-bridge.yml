name: Safely transfer private Ninefold v09r1 Drive art to a PRIVATE Kaggle dataset
on:
  pull_request:
    paths:
      - "video/ninefold_tide/ops/private_v09r1_dataset_bridge.py"
      - "video/ninefold_tide/ops/private_v09r1_transfer_seal.json"
      - ".github/workflows/ninefold-private-v09r1-art-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ninefold-one-time-private-art-source-transfer
  cancel-in-progress: false
jobs:
  safe-private-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bridge source before accessing any account
        run: python -m py_compile video/ninefold_tide/ops/private_v09r1_dataset_bridge.py
      - name: Install lightweight encryption and official Kaggle SDK on GitHub hosted runner
        run: python -m pip install -q --disable-pip-version-check cryptography kaggle
      - name: Produce public receiver key only (Kaggle token stays secret)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/private_v09r1_dataset_bridge.py --mode public-key
      - name: Transfer sealed ephemeral Drive URL directly to PRIVATE Kaggle dataset if attached
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/private_v09r1_dataset_bridge.py --mode transfer
