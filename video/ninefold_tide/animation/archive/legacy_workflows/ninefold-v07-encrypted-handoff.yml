name: Ninefold v07 — one-time encrypted private Kaggle transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ninefold-v07-encrypted-handoff.yml']
permissions:
  contents: write
concurrency:
  group: ninefold-v07-encrypted-handoff
  cancel-in-progress: false
jobs:
  secure-private-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      REPOSITORY_NAME: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Receive encrypted original zip, decrypt locally, upload private Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q --disable-pip-version-check kaggle cryptography
          python - <<'PY'
          import base64,hashlib,io,json,os,pathlib,re,subprocess,tempfile,time,urllib.error,urllib.request,zipfile
          from cryptography.hazmat.primitives.ciphers import Cipher,algorithms
          run_id=os.environ['RUN_ID']; repo=os.environ['REPOSITORY_NAME']
          token=os.environ['GH_TOKEN']
          target_ref='aighewieghosa/ninefold-v07-original-assets-private'
          expected_hash='98c5f655860f53d68019605955f3c5e3951b139eb1570153f9fb1cf1a7655e91'
          zipname='NINEFOLD_2D_GREASE_PENCIL_KAGGLE_TRANSFER_v07.zip'
          root=pathlib.Path(tempfile.mkdtemp(prefix='ninefold-ephemeral-'))
          def github(method,endpoint,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,
                  data=None if data is None else json.dumps(data).encode(),method=method,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28','User-Agent':'Ninefold-Private-Intake',
                           'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.loads(response.read())
          def check(cmd,**kw):
              p=subprocess.run(cmd,check=True,capture_output=True,text=True,timeout=150,**kw)
              return p.stdout
          try:
              priv=root/'receiver-private.pem'; pub=root/'receiver-public.pem'
              subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:3072',
                '-out',str(priv)],check=True,capture_output=True,timeout=45)
              subprocess.run(['openssl','pkey','-in',str(priv),'-pubout','-out',str(pub)],
                check=True,capture_output=True,timeout=25)
              public_path='video/ninefold_tide/secure_bridge/receiver_'+run_id+'.pem'
              manifest_path='video/ninefold_tide/secure_bridge/manifest_'+run_id+'.json'
              github('PUT','contents/'+public_path,
                {'message':'chore: publish one-time Ninefold transfer public key',
                 'content':base64.b64encode(pub.read_bytes()).decode(),'branch':'main'})
              print('NINEFOLD_TRANSFER_PUBLIC_KEY_READY',public_path,flush=True)
              print('NINEFOLD_TRANSFER_WAITING_FOR_ENCRYPTED_MANIFEST',manifest_path,flush=True)
              manifest=None
              deadline=time.monotonic()+600
              while time.monotonic()<deadline:
                  try:
                      record=github('GET','contents/'+manifest_path+'?ref=main')
                      manifest=json.loads(base64.b64decode(record['content']).decode())
                      break
                  except urllib.error.HTTPError as ex:
                      if ex.code!=404:raise
                  time.sleep(8)
              if manifest is None:raise RuntimeError('No encrypted asset was deposited during receiver session')
              if str(manifest.get('run_id'))!=run_id or manifest.get('dataset_ref')!=target_ref:
                  raise RuntimeError('Manifest does not match this receiver and private Kaggle target')
              sha=manifest.get('encrypted_blob_sha','')
              if not re.fullmatch(r'[a-f0-9]{40}',sha):raise RuntimeError('Encrypted blob SHA malformed')
              blob=github('GET','git/blobs/'+sha)
              ciphertext=base64.b64decode(blob['content'])
              if len(ciphertext)!=int(manifest.get('ciphertext_bytes',-1)):
                  raise RuntimeError('Ciphertext length mismatch')
              wrapper=base64.b64decode(manifest['wrapped_key_b64'])
              wrapped=root/'wrapped-key.bin';wrapped.write_bytes(wrapper)
              symmetric=root/'unwrapped-key.bin'
              subprocess.run(['openssl','pkeyutl','-decrypt','-inkey',str(priv),
                '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256',
                '-in',str(wrapped),'-out',str(symmetric)],
                check=True,capture_output=True,timeout=25)
              key=symmetric.read_bytes()
              iv=bytes.fromhex(manifest['nonce_hex'])
              if len(key)!=32 or len(iv)!=16 or iv[:8]!=bytes(8):
                  raise RuntimeError('Invalid symmetric key/nonce')
              plaintext=Cipher(algorithms.ChaCha20(key,iv),mode=None).decryptor().update(ciphertext)
              if hashlib.sha256(plaintext).hexdigest()!=expected_hash:
                  raise RuntimeError('Source ZIP SHA-256 differs from Google Drive canon')
              with zipfile.ZipFile(io.BytesIO(plaintext)) as z:
                  names=set(z.namelist())
                  if zipname in names:raise RuntimeError('Unexpected nested outer ZIP')
                  if 'NINEFOLD_Production_Foundation_v05_Blender_GLTF_Assets.zip' not in names or len(names)!=6:
                      raise RuntimeError('Original six source archive members not found')
                  data=z.read('NINEFOLD_Production_Foundation_v05_Blender_GLTF_Assets.zip')
                  if hashlib.sha256(data).hexdigest()!='24c0fb2ae611b4ba50792eb20abc6e192df016401dfa94e0b1eef452dfb77d2c':
                      raise RuntimeError('Original world geometry SHA-256 mismatch')
              staging=root/'private-dataset';staging.mkdir()
              (staging/zipname).write_bytes(plaintext)
              metadata={'id':target_ref,'title':'Ninefold v07 Original Assets Private',
                'licenses':[{'name':'other'}],'is_private':True,
                'description':'Original verified private hand-drawn/3D production archive'}
              (staging/'dataset-metadata.json').write_text(json.dumps(metadata))
              output=check(['kaggle','datasets','version','-p',str(staging),'-m',
                'Verified original Ninefold v07 art archive private source intake'])
              print('NINEFOLD_PRIVATE_DATASET_UPLOAD_ACCEPTED',target_ref,flush=True)
              print('NINEFOLD_SOURCE_SHA256_VERIFIED',expected_hash,flush=True)
              print('NINEFOLD_SOURCE_BYTES',len(plaintext),flush=True)
              try:
                  contents=check(['kaggle','datasets','files',target_ref])
                  if zipname not in contents:
                      print('NINEFOLD_DATASET_VERSION_RECEIVED_LISTING_PENDING',flush=True)
                  else:print('NINEFOLD_PRIVATE_DATASET_FILE_LIST_VERIFIED',flush=True)
              except Exception:
                  print('NINEFOLD_DATASET_LIST_READBACK_PENDING',flush=True)
          finally:
              import shutil
              shutil.rmtree(root,ignore_errors=True)
          PY
