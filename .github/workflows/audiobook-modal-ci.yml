name: Audiobook — Modal offline migration checks
on:
  pull_request:
    paths:
      - "video/audiobook_studio/manhua_pipeline/**"
      - ".github/workflows/manhua-audiobook-private.yml"
      - ".github/workflows/manhua-dual-t4-auto-dispatch.yml"
      - ".github/workflows/audiobook-modal-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline static compilation and Modal contract regressions
        run: |
          python -m unittest -v video.audiobook_studio.manhua_pipeline.test_modal_production
      - name: Explicit GPU and publication block
        run: echo "OFFLINE_TESTS_ONLY—NO_MODAL_TOKEN_NO_GPU_NO_AUDIOBOOK_PUBLISH"
