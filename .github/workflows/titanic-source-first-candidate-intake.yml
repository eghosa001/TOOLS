name: Titanic source-first — exact historical asset intake, no render
on:
  push:
    branches: [fix/titanic-source-first-release-gate]
    paths: [".github/workflows/titanic-source-first-candidate-intake.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image inspection libraries (no video generator)
        run: python -m pip install --disable-pip-version-check requests "Pillow>=10,<13"
      - name: Fetch exactly editor-named Titanic historical images and record source metadata
        run: |
          python -u video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/intake_named_candidates.py
      - name: Confirm every candidate and missing source remains unapproved
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/source_intake_output")
          o=json.loads((p/"TITANIC_EXACT_SOURCE_INTAKE_REPORT.json").read_text())
          assert o["source_count"]==15 and o["publication_approval"] is False
          assert all(x["commercial_reuse_approved"] is False for x in o["source_specific_metadata"])
          assert all(x["visual_content_inspected_by_editor"] is False for x in o["source_specific_metadata"])
          assert all((p/x["file"]).exists() for x in o["source_specific_metadata"] if x["file"])
          print("SOURCE_FIRST_AUTHENTIC_IMAGE_CANDIDATES_ONLY",o["downloaded_count"],"OF",o["source_count"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Titanic-source-first-15-identifiable-real-asset-candidates
          retention-days: 30
          if-no-files-found: warn
          path: |
            video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/source_intake_output/*.jpg
            video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/source_intake_output/*.json
