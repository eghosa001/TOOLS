name: CartoonStudio Import Real DOGWALK and Singularity Cartoon Actors

on:
  workflow_dispatch:
  push:
    paths:
      - video/export_modern_studio_actor_rigs.py
      - .github/workflows/cartoonstudio-import-modern-studio-actors.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dogwalk
            blend: blender-4.5-splash.blend
            blender_version: 4.5.13
            blender_release: Blender4.5
            expected_characters: 2
          - name: singularity
            blend: blender-5.1-splash.blend
            blender_version: 5.1.2
            blender_release: Blender5.1
            expected_characters: 7

    steps:
      - uses: actions/checkout@v4
      - name: Download actual CC-BY Blender Studio professional animation master
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1200 \
            "https://download.blender.org/demo/splash/${{ matrix.blend }}" \
            -o /tmp/modern-studio.blend
          test -s /tmp/modern-studio.blend
      - name: Install original studio's compatible Blender binary (checksum-verified)
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1200 \
            "https://download.blender.org/release/${{ matrix.blender_release }}/blender-${{ matrix.blender_version }}-linux-x64.tar.xz" \
            -o /tmp/blender-original.tar.xz
          curl --fail --location --retry 3 --silent --show-error \
            "https://download.blender.org/release/${{ matrix.blender_release }}/blender-${{ matrix.blender_version }}.sha256" \
            -o /tmp/blender-original.sha256
          grep "blender-${{ matrix.blender_version }}-linux-x64.tar.xz" /tmp/blender-original.sha256 \
            | sed "s|blender-${{ matrix.blender_version }}-linux-x64.tar.xz|/tmp/blender-original.tar.xz|" \
            > /tmp/blender-exact.sha256
          sha256sum --check /tmp/blender-exact.sha256
          mkdir -p /tmp/film-blender
          tar -xJf /tmp/blender-original.tar.xz -C /tmp/film-blender
          test -x "/tmp/film-blender/blender-${{ matrix.blender_version }}-linux-x64/blender"
      - name: Export actual separate actor rigs, geometry and material assignments from original film
        run: |
          mkdir -p artifacts/modern-actors
          "/tmp/film-blender/blender-${{ matrix.blender_version }}-linux-x64/blender" \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_modern_studio_actor_rigs.py -- \
            /tmp/modern-studio.blend artifacts/modern-actors ${{ matrix.name }}
      - name: Verify each character is actually skinned in 3D, source identity, and separate meshes
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'video')
          from verify_original_assets import read_glb
          root=Path('artifacts/modern-actors')
          meta=json.loads((root/'REAL_STUDIO_ACTOR_REPORT.json').read_text())
          count=len(meta['models'])
          assert count==int('${{ matrix.expected_characters }}'),count
          assert len({x['studio_rig_name'] for x in meta['models'].values()})==count
          for name,entry in meta['models'].items():
              source=root/entry['filename']
              gltf=read_glb(source)
              skeletons=len(gltf.get('skins',[]))
              meshes=len(gltf.get('meshes',[]))
              face=sum(len(p.get('targets',[])) for m in gltf.get('meshes',[]) for p in m.get('primitives',[]))
              assert source.stat().st_size>75000 and meshes>0 and skeletons>0
              print('VERIFIED_ORIGINAL_CC_BY_3D_RIG',name,'skins',skeletons,
                  'meshes',meshes,'facial_morph_sets',face,'bytes',entry['glb_bytes'])
          print('REAL_DISTINCT_STUDIO_RIGGED_ASSETS_READY',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-original-modern-${{ matrix.name }}-3d-character-GLBs
          path: artifacts/modern-actors/*
          retention-days: 30
          if-no-files-found: error
