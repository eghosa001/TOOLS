name: CartoonStudio Official Blender Character Asset Download Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - video/discover_official_blender_demo_assets.py
      - .github/workflows/cartoonstudio-official-demo-discovery.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Blender publisher direct demo download links, not scraped mirrors
        run: |
          python video/discover_official_blender_demo_assets.py artifacts/official-blender-downloads.json
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-official-blender-download-discovery
          path: artifacts/official-blender-downloads.json
          retention-days: 14
