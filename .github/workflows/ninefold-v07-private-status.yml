name: Ninefold v07 — inspect existing private Kaggle build status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ninefold-v07-private-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || 'aighewieghosa' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read status and output-file names only; no GPUs or source downloads
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q kaggle
          REF="$KAGGLE_USERNAME/ninefold-v07-source-blender-4-5-private"
          echo "Own Ninefold v07 kernel metadata:"
          kaggle kernels list --mine --page-size 100 --csv | grep -i 'ninefold-v07' || true
          kaggle kernels status "$REF" || true
          kaggle kernels files "$REF" | head -30 || true
          mkdir -p /tmp/ninefold-v07-status-readback
          kaggle kernels output "$REF" -f source_build_report.json -p /tmp/ninefold-v07-status-readback --force
          python - <<'PY'
          import json,pathlib
          files=list(pathlib.Path('/tmp/ninefold-v07-status-readback').rglob('source_build_report.json'))
          if len(files)!=1:raise RuntimeError('Expected one private Kaggle status JSON')
          p=json.loads(files[0].read_text())
          assert p['approved_art'] is False and p['video_created'] is False
          print('NINEFOLD_ACTUAL_PRIVATE_KAGGLE_SOURCE_STATUS',p['status'])
          print('NINEFOLD_ACTUAL_PRIVATE_KAGGLE_SOURCE_ACCESS',p.get('source_access'))
          print('NINEFOLD_ACTUAL_PRIVATE_KAGGLE_QA_PASS',p.get('qa_passed',False))
          print('NINEFOLD_ACTUAL_PRIVATE_KAGGLE_NOTES',json.dumps(p.get('notes',[]))[:700])
          PY
