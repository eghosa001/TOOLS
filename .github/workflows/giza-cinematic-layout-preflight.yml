name: "Giza cinematic shot compositions — visual-only preflight"
on:
  push:
    paths: [".github/workflows/giza-cinematic-layout-preflight.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install tiny image-only tools
        run: |
          python -m pip install --disable-pip-version-check -q Pillow requests numpy soundfile
          python -m py_compile video/history_studio/films/giza_hidden_history_2026/directed_chapter01.py
      - name: Render 36 exact-asset frames from 3 directed storyboards, without narration
        run: |
          set -euo pipefail
          for chapter in 01 05 10; do
            python video/history_studio/films/giza_hidden_history_2026/directed_chapter01.py \
              --chapter "$chapter" --work "preview_$chapter" \
              --model /dev/null --voices /dev/null --layout-preview-only
            test -s "preview_$chapter/CINEMATIC_LAYOUT_PREFLIGHT.jpg"
            test -s "preview_$chapter/ASSET_RIGHTS.json"
          done
      - name: Publish actual preflight contact sheets to separate audit branch
        run: |
          set -euo pipefail
          git config user.name "Facts Uncovered Visual QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c giza/cinematic-design-preflight-2026-10-28
          out=video/history_studio/films/giza_hidden_history_2026/cinematic_design_preflight
          mkdir -p "$out"
          for n in 01 05 10; do
            cp "preview_$n/CINEMATIC_LAYOUT_PREFLIGHT.jpg" "$out/chapter_$n""_cinematic_samples.jpg"
            cp "preview_$n/ASSET_RIGHTS.json" "$out/chapter_$n""_photo_licences.json"
          done
          printf '%s\n' \
            '# Great Pyramid visual design preflight' \
            'Three hand-directed sample boards created with actual verified archival images and authored diagrams.' \
            'No audio or MP4 was synthesized or rendered for this low-cost design check.' \
            'Do not mark the visual compositions editorially approved until examined.' \
            'This branch is separate from the published and source v4 film.' \
            > "$out/README.md"
          git add "$out"
          git commit -m "Add actual cinematic Great Pyramid layout design preflight for chapters 1, 5 and 10"
          git push origin giza/cinematic-design-preflight-2026-10-28
      - uses: actions/upload-artifact@v4
        with:
          name: Giza-Cinematic-Layout-No-Audio-Preflight
          path: |
            preview_*/CINEMATIC_LAYOUT_PREFLIGHT.jpg
            preview_*/ASSET_RIGHTS.json
          retention-days: 30
