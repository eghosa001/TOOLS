name: CartoonStudio Audit Genuine Blender Studio Open-Movie Rigs

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_official_blender_movie.py
      - video/audit_official_movie_scene.py
      - .github/workflows/cartoonstudio-audit-official-openmovie.yml

permissions:
  contents: read

jobs:
  real-animation-scene-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        source: [sprite-fright-shot, pet-projects-splash]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate official Blender Studio source ZIP (not placeholders)
        run: |
          python video/audit_official_blender_movie.py \
            "${{ matrix.source }}" "artifacts/${{ matrix.source }}"
      - name: Install official Blender Debian package for actual rig inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender libegl1 python3-numpy
      - name: Inspect real movie armatures, face shape keys and external dependencies
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_official_movie_scene.py -- \
            "artifacts/${{ matrix.source }}" "artifacts/${{ matrix.source }}/RIG_INSPECTION.json"
      - name: Publish only audited provenance and assessment, no 250MB duplicated files
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-real-movie-rig-report-${{ matrix.source }}
          path: |
            artifacts/${{ matrix.source }}/RIG_INSPECTION.json
            artifacts/${{ matrix.source }}/OFFICIAL_SOURCE.json
          retention-days: 30
          if-no-files-found: error
