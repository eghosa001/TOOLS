name: "Facts Uncovered — Giza premium edit v2 scene test"
on:
  push:
    paths:
      - ".github/workflows/facts-uncovered-giza-v2-scene-test.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chapter01-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small free dependency set
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -q "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31"
      - name: Download original recorded chapter narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice
          gh run download 40382408830 --repo "$GITHUB_REPOSITORY" --name giza-voice-01 --dir voice
          test -s voice/chapter_01.wav
      - name: Compile and render new Giza archival edit with unique views
        run: |
          python -m py_compile video/history_studio/films/giza_hidden_history_2026/produce.py
          python video/history_studio/films/giza_hidden_history_2026/produce.py chapter --index 1 --voice-dir voice --work scratch --output rendered
          test -s rendered/chapter_01.mp4
      - name: Inspect visual variation and actual video specification
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import json,subprocess
          meta=json.loads(Path('rendered/chapter_01.json').read_text())
          all_photos=[shot['media'] for shot in meta['shots'] if shot['media']!='original_programmatic_diagram']
          assert len(set(all_photos))==len(all_photos), 'duplicate archival image in chapter'
          print('INDIVIDUAL_SHOTS',len(meta['shots']),'UNIQUE_PHOTOS',len(all_photos),'DIAGRAMS',len(meta['shots'])-len(all_photos))
          duration=meta['duration_seconds']
          previews=[]
          for i,t in enumerate([.02,.12,.24,.36,.48,.6,.72,.84,.96]):
            out=Path(f'frame_{i}.jpg')
            subprocess.run(['ffmpeg','-v','error','-y','-ss',str(round(duration*t,1)),'-i','rendered/chapter_01.mp4','-frames:v','1',str(out)],check=True)
            im=Image.open(out).convert('RGB')
            im.thumbnail((480,270))
            previews.append(im.copy())
          sheet=Image.new('RGB',(480*3,310*3),(241,241,241));d=ImageDraw.Draw(sheet)
          for i,im in enumerate(previews):
            x=(i%3)*480;y=(i//3)*310;sheet.paste(im,(x,y));d.text((x+9,y+276),f'Shot {i+1}',fill=(30,30,30))
          sheet.save('giza_v2_quality_contact.jpg',quality=88)
          print('PREMIUM_V2_QC_SUCCEEDED',duration)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Giza-v2-Film-QC-Preview
          path: |
            giza_v2_quality_contact.jpg
            rendered/chapter_01.mp4
            rendered/chapter_01.json
            rendered/chapter_01_cover.jpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
