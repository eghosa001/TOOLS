name: "ASMR AI — Kandinsky 6 Lite foam pilot on Kaggle"
on:
  push:
    branches:
      - experiment/kandinsky6-foam-ai-pilot-20261030
    paths:
      - "video/ai_asmr_experiments/kandinsky6_foam/**"
      - ".github/workflows/asmr-kandinsky6-foam-kaggle.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kandinsky6-foam-kaggle-fixed
  cancel-in-progress: true
jobs:
  submit-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: aighewieghosa
      KERNEL_ID: aighewieghosa/kandinsky6-lite-foam-compress-5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source and existing Kaggle credentials
        run: |
          set -eu
          test -n "$KAGGLE_API_TOKEN" || { echo "BLOCKED: KAGGLE_API_TOKEN secret missing"; exit 1; }
          python -m py_compile video/ai_asmr_experiments/kandinsky6_foam/kaggle_generate.py
          python -m pip install -q --disable-pip-version-check kaggle
      - name: Submit isolated private Kaggle notebook (no paid providers)
        run: |
          set -eu
          mkdir -p artifacts/kandinsky6-kaggle/kernel
          cp video/ai_asmr_experiments/kandinsky6_foam/kaggle_generate.py artifacts/kandinsky6-kaggle/kernel/kaggle_generate.py
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("artifacts/kandinsky6-kaggle/kernel")
          data={"id":os.environ["KERNEL_ID"],
                "title":"Kandinsky 6 Lite — Turquoise Foam ASMR Pilot",
                "code_file":"kaggle_generate.py","language":"python",
                "kernel_type":"script","is_private":True,
                "enable_gpu":True,"enable_internet":True,
                "dataset_sources":[],"competition_sources":[],"kernel_sources":[],"model_sources":[]}
          (p/"kernel-metadata.json").write_text(json.dumps(data,indent=2))
          PY
          kaggle kernels push -p artifacts/kandinsky6-kaggle/kernel
      - name: Check actual execution, collect real MP4 only when complete
        if: success()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/kandinsky6-kaggle/output
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "No Kaggle token; no render"; exit 0; fi
          for n in $(seq 1 75); do
            r=$(kaggle kernels status "$KERNEL_ID" 2>&1)
            echo "POLL $n: $r"
            if echo "$r" | grep -Eiq 'COMPLETE|ERROR|CANCEL'; then break; fi
            sleep 30
          done
          kaggle kernels output "$KERNEL_ID" -p artifacts/kandinsky6-kaggle/output --force
          find artifacts/kandinsky6-kaggle/output -type f -printf '%p %s bytes\n'
          if [ -f artifacts/kandinsky6-kaggle/output/kandinsky6_foam_status.json ]; then
            cat artifacts/kandinsky6-kaggle/output/kandinsky6_foam_status.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kandinsky6-foam-real-kaggle-output
          path: artifacts/kandinsky6-kaggle/output/
          retention-days: 14
          if-no-files-found: warn
