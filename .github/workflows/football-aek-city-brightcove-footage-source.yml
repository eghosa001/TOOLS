name: "Football: examine 2026 City AEK tactical match clip Brightcove"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-aek-city-brightcove-footage-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q yt-dlp
      - run: |
          mkdir -p candidate
          set +e
          u='https://players.brightcove.net/10228001001/D6p7NidPjY_default/index.html?videoId=6407154170112'
          yt-dlp --no-warnings --socket-timeout 12 --retries 1 --skip-download --print 'VIDEO_METADATA %(id)s %(title)s %(duration)s %(extractor)s' "$u"
          echo "METADATA_STATUS=$?"
          yt-dlp --no-warnings --socket-timeout 12 --retries 1 -f 'bv*[height<=720]+ba/b[height<=720]/b' --download-sections '*00:00:17-00:00:27' --force-keyframes-at-cuts --merge-output-format mp4 -o 'candidate/man_city_aek_20261020_excerpt.%(ext)s' "$u"
          echo "EXCERPT_STATUS=$?"
          ls -lh candidate
          for v in candidate/*.mp4; do test -f "$v" && ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$v"; done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-v-City-2026-Genuine-Footage-Candidate-for-Editorial-Assessment
          path: candidate/*
          if-no-files-found: warn
          retention-days: 7