name: "Facts Uncovered - Apollo 11 eight-minute finished original film"
on:
  push:
    branches: [production/apollo11-8min-real-archival-20261104]
    paths: ["video/history_studio/productions/apollo11_eight_minute/trigger_assemble.txt"]
permissions:
  contents: read
  actions: read
jobs:
  full-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Download eight completed authentic Qwen3 Ryan voice artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 41761973681
          github-token: ${{ github.token }}
          pattern: Apollo11Eight-QwenRyan-Chapter-*
          merge-multiple: true
          path: delivery/apollo11_eight/qwen
      - name: Download corrected authentic Qwen Ryan chapter 2
        uses: actions/download-artifact@v4
        with:
          run-id: 41764316547
          github-token: ${{ github.token }}
          name: Apollo11Eight-QwenRyan-Chapter-2
          path: delivery/apollo11_eight/qwen
      - name: Verify eight full Qwen script ledgers and 32 audio files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("delivery/apollo11_eight/qwen")
          seen=set()
          for ch in range(1,9):
              p=root/f"ch{ch:02d}_timings.json"
              if not p.is_file():p=root/f"ch{ch:02d}"/f"ch{ch:02d}_timings.json"
              assert p.is_file(),f"Missing Qwen audio chapter {ch}: {list(root.iterdir())}"
              x=json.loads(p.read_text())
              assert x["speaker"]=="Ryan" and x["model"]=="Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
              for b in x["beats"]:
                  file=root/b["file"]
                  if not file.is_file():file=root/f"ch{ch:02d}"/b["file"]
                  assert file.is_file() and file.stat().st_size>200000,(b["id"],file)
                  seen.add(b["id"])
          assert len(seen)==32,len(seen)
          print("ALL_32_ORIGINAL_QWEN_RYAN_NARRATION_BEATS_PRESENT")
          PY
      - name: Install video assembly, subtitle and source-rights utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core libass9
          python -m pip install -q "Pillow>=10,<13" "soundfile>=0.12"
      - name: Build complete 16x9 8-minute film, no generated visuals
        run: |
          set -euo pipefail
          python video/history_studio/productions/apollo11_eight_minute/assemble.py
      - name: Archive finished review master
        uses: actions/upload-artifact@v4
        with:
          name: Apollo11-FactsUncovered-8Min-RealNASA-QwenRyan-REVIEW
          path: |
            delivery/apollo11_eight/finished/Facts_Uncovered_Apollo11_The_Landing_That_Nearly_Failed_8_Min_Documentary_REVIEW.mp4
            delivery/apollo11_eight/finished/Apollo11_8_Minute_Real_NASA_Cover.jpg
            delivery/apollo11_eight/finished/subtitles.srt
            delivery/apollo11_eight/finished/Review_Contact_Sheet.jpg
            delivery/apollo11_eight/finished/FINAL_REVIEW_QC.json
            delivery/apollo11_eight/finished/CREDITS_AND_YOUTUBE_DESCRIPTION.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
