name: "YouTube ASMR — verify API access (read-only)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-asmr-api-verify.yml"
      - "video/youtube_research_cloud/tools/check_asmr_owner_api.mjs"
      - "video/youtube_research_cloud/tools/audit_asmr_channel.mjs"
      - "video/youtube_research_cloud/src/auth.mjs"
permissions:
  contents: read
jobs:
  public:
    name: Public channel metadata using existing owner OAuth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public channel identity and metadata with existing credentials
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node video/youtube_research_cloud/tools/audit_asmr_channel.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: surreal-asmr-verified-public-data
          path: audit-output/surreal-asmr-public.json
          retention-days: 7
  oauth:
    name: Surreal ASMR owner OAuth identity verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check read-only YouTube owner identity with OAuth
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node video/youtube_research_cloud/tools/check_asmr_owner_api.mjs
