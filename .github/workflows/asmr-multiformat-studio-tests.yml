name: ASMR multi-format studio tests
on:
  pull_request:
    paths:
      - "video/satisfying_studio/**"
      - ".github/workflows/asmr-multiformat-studio-tests.yml"
  push:
    branches: [main, "feature/asmr-*"]
    paths:
      - "video/satisfying_studio/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure FFmpeg available for actual AV decode tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
      - name: Syntax and regression tests, zero paid services or media downloads
        working-directory: video/satisfying_studio
        run: |
          python -m compileall -q studio_formats.py quality_gate.py physics_verify.py production/assemble_reviewed.py production/blender_mechanical_rigs.py production/cgi_scene_factory.py production/studio_foley.py production/test_assemble_reviewed.py production/test_studio_foley.py
          python -m unittest -v test_studio_formats test_quality_gate production.test_assemble_reviewed production.test_studio_foley
          python -m compileall -q production/licensed_footage_gate.py production/test_licensed_footage_gate.py production/render_four_pours.py
          python -m unittest -v production.test_licensed_footage_gate
          python -m compileall -q production/av_signal_quality.py production/post_render_av_review.py production/reference_parity_scan.py test_av_signal_quality.py
          PYTHONPATH=production:. python -m unittest -v test_av_signal_quality production.test_post_render_av_review test_reference_parity_scan
          python studio_formats.py list > /tmp/asmr-47-formats.txt
          test "$(wc -l < /tmp/asmr-47-formats.txt)" -eq 47
      - name: Verify all 47 are recipe-only, no fabricated quality status
        working-directory: video/satisfying_studio
        run: |
          python - <<'PY'
          import json
          from studio_formats import catalogue
          rows=catalogue()['formats']
          assert len(rows)==47
          assert all(row['rollout']=='cgi_recipe_awaiting_individual_physics_and_av_proof' for row in rows)
          assert all(row['built_in_autogeneration'] is False and row['production_mode']=='blender' for row in rows)
          assert all(row['user_supplied_audio_required'] is False and row['user_supplied_footage_required'] is False for row in rows)
          print('47 formats registered. No artistic/video approval is implied.')
          PY
