name: "FACTS UNCOVERED — Great Pyramid Long Documentary and 7 Shorts"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/facts-uncovered-giza-long-documentary.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: facts-uncovered-giza-full-production
  cancel-in-progress: false
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tested Kokoro voice and free sound libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "soundfile>=0.12" "kokoro-onnx>=0.6" "misaki[en]" "Pillow>=10,<13" "requests>=2.31"
      - name: Download legitimate Kokoro Apache-2.0 narrator
        run: |
          set -euo pipefail
          mkdir -p model
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -L --fail --retry 4 --retry-delay 3 "$BASE/kokoro-v1.0.onnx" -o model/kokoro-v1.0.onnx
          curl -L --fail --retry 4 --retry-delay 3 "$BASE/voices-v1.0.bin" -o model/voices-v1.0.bin
          test "$(stat -c %s model/kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s model/voices-v1.0.bin)" -gt 25000000
      - name: Validate narrative before synthesis
        run: |
          python -m py_compile video/history_studio/films/giza_hidden_history_2026/produce.py
          python - <<'PY'
          from pathlib import Path
          p=Path('video/history_studio/films/giza_hidden_history_2026/chapters')
          files=sorted(p.glob('*.txt'))
          assert len(files)==15
          words=sum(len(x.read_text().split()) for x in files)
          assert words>=10000,words
          print('ORIGINAL_RESEARCH_NARRATION',len(files),'chapters',words,'words')
          PY
      - name: Generate all fifteen narrated chapters and seven original Shorts
        run: |
          python video/history_studio/films/giza_hidden_history_2026/produce.py synth --model model/kokoro-v1.0.onnx --voices-file model/voices-v1.0.bin --voice-dir voices
      - name: Deliver narrated chapter 01
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-01
          path: |
            voices/chapter_01.wav
            voices/chapter_01.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 02
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-02
          path: |
            voices/chapter_02.wav
            voices/chapter_02.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 03
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-03
          path: |
            voices/chapter_03.wav
            voices/chapter_03.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 04
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-04
          path: |
            voices/chapter_04.wav
            voices/chapter_04.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 05
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-05
          path: |
            voices/chapter_05.wav
            voices/chapter_05.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 06
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-06
          path: |
            voices/chapter_06.wav
            voices/chapter_06.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 07
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-07
          path: |
            voices/chapter_07.wav
            voices/chapter_07.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 08
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-08
          path: |
            voices/chapter_08.wav
            voices/chapter_08.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 09
        uses: actions/upload-artifact@v4
        with:
