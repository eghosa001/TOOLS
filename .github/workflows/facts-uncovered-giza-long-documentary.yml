      - name: Deliver narrated chapter 13
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-13
          path: |
            voices/chapter_13.wav
            voices/chapter_13.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 14
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-14
          path: |
            voices/chapter_14.wav
            voices/chapter_14.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver narrated chapter 15
        uses: actions/upload-artifact@v4
        with:
          name: giza-voice-15
          path: |
            voices/chapter_15.wav
            voices/chapter_15.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 01
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-01
          path: |
            voices/short_01.wav
            voices/short_01.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 02
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-02
          path: |
            voices/short_02.wav
            voices/short_02.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 03
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-03
          path: |
            voices/short_03.wav
            voices/short_03.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 04
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-04
          path: |
            voices/short_04.wav
            voices/short_04.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 05
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-05
          path: |
            voices/short_05.wav
            voices/short_05.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 06
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-06
          path: |
            voices/short_06.wav
            voices/short_06.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
      - name: Deliver Short narration 07
        uses: actions/upload-artifact@v4
        with:
          name: giza-shortvoice-07
          path: |
            voices/short_07.wav
            voices/short_07.json
          retention-days: 30
          compression-level: 2
          if-no-files-found: error
  render-chapters:
    needs: voices
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        index: ["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image renderer and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31"
      - name: Download only this chapter's licensed narration
        uses: actions/download-artifact@v4
        with:
          name: giza-voice-${{ matrix.index }}
          path: voices
      - name: Render unique licensed archival shots aligned to narration
        run: |
          python video/history_studio/films/giza_hidden_history_2026/produce.py chapter --index "${{ matrix.index }}" --voice-dir voices --work scratch --output rendered
      - name: Confirm actual voice, HD image and matching chapter duration
        run: |
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 rendered/chapter_${{ matrix.index }}.mp4
          test -s rendered/chapter_${{ matrix.index }}.json
          test -s rendered/chapter_${{ matrix.index }}_cover.jpg
      - name: Save chapter for final master
        uses: actions/upload-artifact@v4
        with:
          name: chapter-${{ matrix.index }}
          path: rendered/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  render-shorts:
    needs: voices
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        index: ["01","02","03","04","05","06","07"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31"
      - uses: actions/download-artifact@v4
        with:
          name: giza-shortvoice-${{ matrix.index }}
          path: voices
      - name: Render independent branded vertical Short
        run: |
          python video/history_studio/films/giza_hidden_history_2026/produce.py short --index "${{ matrix.index }}" --voice-dir voices --work scratch --output rendered
      - name: Save Short MP4 and metadata
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.index }}
          path: rendered/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  assemble:
    needs: [render-chapters, render-shorts]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install finalization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12" "requests>=2.31"
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-*
          path: chapter_output
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: short-*
          path: short_output
          merge-multiple: true
      - name: Produce full uninterrupted documentary, score, captions and seven Shorts
        run: |
          python video/history_studio/films/giza_hidden_history_2026/produce.py assemble --chapters chapter_output --shorts short_output --output delivery
          cp video/history_studio/films/giza_hidden_history_2026/RESEARCH_BIBLE.md delivery/RESEARCH_BIBLE.md
          cp video/history_studio/films/giza_hidden_history_2026/production.json delivery/production.json
          cat delivery/QC_REPORT.json
      - name: Verify all final output assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('delivery')
          manifest=json.loads((p/'QC_REPORT.json').read_text())
          assert manifest['chapter_count']==15 and manifest['short_count']==7
          main=p/'Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4'
          v=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(main)]))
          assert float(v['format']['duration']) > 3000
          assert all((p/f'short_{i:02}.mp4').exists() for i in range(1,8))
          assert len((p/'subtitles.srt').read_text())>10000
          assert (p/'thumbnail.jpg').stat().st_size>100000
          print('GIZA_LONG_DOCUMENTARY_AND_SEVEN_SHORTS_QC_PASSED')
          PY
      - name: Upload verified full documentary and Shorts with credits and subtitles
        uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Giza-Long-Film-1080p-and-Seven-Shorts
          path: |
            delivery/Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4
            delivery/short_*.mp4
            delivery/short_*.srt
            delivery/subtitles.srt
            delivery/thumbnail.jpg
            delivery/CHAPTERS.json
            delivery/IMAGE_CREDITS.json
            delivery/QC_REPORT.json
            delivery/RESEARCH_BIBLE.md
            delivery/production.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
