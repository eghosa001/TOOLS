name: CartoonStudio Genuine 17 Character Visual Review Board

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cartoonstudio-professional-cast-contact-sheet.yml

permissions:
  contents: read
  actions: read

jobs:
  light-review-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch already-built real Blender Studio 17 original character candidates
        uses: actions/download-artifact@v4
        with:
          run-id: 40233910527
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-15plus-licensed-professional-original-rig-candidates
          path: /tmp/source-candidates
      - name: Extract ONLY the small visual review sheet and truthful provenance
        run: |
          mkdir -p artifacts/quick-visual-approval
          cp /tmp/source-candidates/NATIVE_STUDIO_CAST_VISUAL_REVIEW.jpg \
            artifacts/quick-visual-approval/
          cp /tmp/source-candidates/PROFESSIONAL_REUSABLE_CAST_CANDIDATES.json \
            artifacts/quick-visual-approval/
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/quick-visual-approval')
          a=json.loads((root/'PROFESSIONAL_REUSABLE_CAST_CANDIDATES.json').read_text())
          assert a['model_count']>=15
          assert a['at_least_15_distinct_original_model_sources']
          assert a['visual_approval_status'].startswith('candidate')
          assert a['actual_episode_video_rendered']==False
          print('REAL_17_LICENSED_STUDIO_CANDIDATES_VISUAL_BOARD_READY',a['model_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-17-real-character-design-review-small
          path: artifacts/quick-visual-approval/*
          retention-days: 14
          if-no-files-found: error
