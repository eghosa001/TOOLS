name: "History Studio — archive and retire original Kaggle kernel"
on:
  workflow_dispatch:
    inputs:
      confirm_kernel:
        description: "Type exactly: retire-cartoonstudio-kernel"
        type: string
        required: true
permissions:
  contents: read
jobs:
  archive-then-delete:
    if: ${{ inputs.confirm_kernel == 'retire-cartoonstudio-kernel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: aighewieghosa/cartoonstudio-3d-video-pipeline
    steps:
      - name: Require Kaggle credentials
        shell: bash
        run: test -n "$KAGGLE_API_TOKEN"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade kaggle
      - name: Pull source notebook and metadata before deletion
        run: |
          mkdir -p /tmp/kaggle-archive/kernel
          kaggle kernels pull "$KERNEL_REF" -p /tmp/kaggle-archive/kernel -m
          test -f /tmp/kaggle-archive/kernel/kernel-metadata.json
          find /tmp/kaggle-archive/kernel -type f -name '*.ipynb' | grep -q .
      - name: Backup published kernel output (abort deletion on failure)
        run: |
          mkdir -p /tmp/kaggle-archive/output
          kaggle kernels output "$KERNEL_REF" -p /tmp/kaggle-archive/output
      - name: Store source and outputs in a downloadable GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: retired-cartoonstudio-kaggle-kernel-backup
          path: /tmp/kaggle-archive/
          if-no-files-found: error
          retention-days: 90
      - name: Delete only the explicitly named old kernel
        run: kaggle kernels delete "$KERNEL_REF" --yes
