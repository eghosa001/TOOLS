name: CartoonStudio Tiny Trails E01 — MANUAL Real-Asset Three-Second Preview (No Full Render)

on:
  workflow_dispatch:
    inputs:
      preview_authorization:
        description: "Type RUN_EP01_3_SECOND_PREVIEW (never triggers a full render)"
        type: string
        required: true
      confirm_public_preview:
        description: "The public TOOLS repository may expose preview MP4 and story dialogue"
        type: boolean
        required: true
        default: false

concurrency:
  group: tiny-trails-ep01-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-artist-rig-stage-and-voice-inspection:
    name: Explicitly authorized native original-actor 72-frame MP4 preview only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require named public preview authorization before fetching or rendering
        shell: bash
        env:
          EP01_REQUEST: ${{ inputs.preview_authorization }}
          EP01_PUBLIC_OK: ${{ inputs.confirm_public_preview }}
        run: |
          if [[ "$EP01_REQUEST" != "RUN_EP01_3_SECOND_PREVIEW" || "$EP01_PUBLIC_OK" != "true" ]]; then
            echo "::error::Preview requires explicit named authorization AND public-output confirmation."
            exit 1
          fi
          echo "Authorized only Episode 1 first 3 seconds, NOT full episode."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure genuine Blender tooling and source decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd libegl1
          curl --fail --location --retry 3 --silent --show-error --max-time 1200 \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            -o /tmp/blender-3.6.23-linux-x64.tar.xz
          curl --fail --location --retry 3 --silent --show-error \
            https://download.blender.org/release/Blender3.6/blender-3.6.23.sha256 \
            -o /tmp/blender-checksums.txt
          grep blender-3.6.23-linux-x64.tar.xz /tmp/blender-checksums.txt \
            | sed 's|blender-3.6.23-linux-x64.tar.xz|/tmp/blender-3.6.23-linux-x64.tar.xz|' \
            > /tmp/blender-expected.sha256
          sha256sum -c /tmp/blender-expected.sha256
          tar -xJf /tmp/blender-3.6.23-linux-x64.tar.xz -C /tmp
          /tmp/blender-3.6.23-linux-x64/blender -b --factory-startup --disable-autoexec --version | head -2
      - name: Fetch authentic first-party Sprite Fright original Blender source
        run: |
          python video/audit_official_blender_movie.py \
            sprite-fright-shot artifacts/ep01/sprite-first-party
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ep01/sprite-first-party/OFFICIAL_SOURCE.json')
          record=json.loads(p.read_text())
          assert record['download_url']=='https://download.blender.org/demo/sprite_fright_030_0020_A.zip'
          assert record['blender_scenes']
          source=record['blender_scenes'][0]['filename']
          assert Path(source).is_file()
          Path('/tmp/ep01_sprite_master_path').write_text(source)
          print('GENUINE_SPRITE_FRIGHT_AUTHOR_SOURCE_READY',source)
          PY
      - name: Extract original Blender Studio Elder Sprite source, preserve publisher SHA
        run: |
          mkdir -p artifacts/ep01/pack/actors
          curl --fail --location --retry 3 --silent --show-error --max-time 360 \
            https://studio.blender.org/download-source/files/ae/ae8df61cc1daf7d3d1a2ac41c992f3ca/ae8df61cc1daf7d3d1a2ac41c992f3ca.blend \
            -o /tmp/ep01_elder_source
          python - <<'PY'
          from pathlib import Path
          import subprocess,shutil
          src=Path('/tmp/ep01_elder_source')
          out=Path('artifacts/ep01/pack/actors/elder_sprite.blend')
          if src.open('rb').read(4)==bytes.fromhex('28b52ffd'):
              subprocess.run(['zstd','-d','--force','-q',str(src),'-o',str(out)],check=True)
          elif src.open('rb').read(7)==b'BLENDER':
              shutil.copyfile(src,out)
          else:raise RuntimeError('Elder source not native Blender or Zstandard-wrapped')
          assert out.open('rb').read(7)==b'BLENDER'
          PY
          echo "fba58c5a2779c0ebd32527e218362348c92842bf154f9d4abbf51532a514ecbe  artifacts/ep01/pack/actors/elder_sprite.blend" \
            | sha256sum -c -
      - name: Export the source original Sprite skin + rig, never a procedural substitute
        run: |
          /tmp/blender-3.6.23-linux-x64/blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_reusable_sprite_fright_rigs.py -- \
            "$(cat /tmp/ep01_sprite_master_path)" artifacts/ep01/pack/actors sprite
          test -s artifacts/ep01/pack/actors/sprite_blender_studio.glb
      - name: Download the existing verified Kenney and Poly Haven CC0 packs
        run: |
          python video/free_asset_imports.py --output artifacts/ep01/kenney.zip
          mkdir -p artifacts/ep01/kenney
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifacts/ep01/kenney.zip') as z:
              for entry in z.namelist():
                  if entry.startswith('/') or '..' in entry.split('/'):
                      raise ValueError('Unsafe CC0 pack member')
              z.extractall('artifacts/ep01/kenney')
          PY
          python video/quality_asset_downloads.py --output artifacts/ep01/quality --resolution 1k
      - name: Assemble actual CC0 woodland GLB, Poly Haven HDRI and reusable scene props
        run: |
          /tmp/blender-3.6.23-linux-x64/blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/episodes/tiny-trails/ep01/build_cc0_woodland.py -- \
            --kenney artifacts/ep01/kenney \
            --quality artifacts/ep01/quality \
            --out artifacts/ep01/pack
      - name: Pin actual downloaded and exported source bytes, never overwrite planned source
        run: |
          python video/episodes/tiny-trails/ep01/attest_asset_pack.py \
            --pack artifacts/ep01/pack \
            --output artifacts/ep01/pack/assets-verified.json
      - name: Generate and verify actual provisional licensed Episode 1 Piper voices
        run: |
          python -m pip install --disable-pip-version-check "piper-tts>=1.2,<2"
          python video/episodes/tiny-trails/ep01/generate_voice_tracks.py \
            --out artifacts/ep01/voices
      - name: Actual mesh, jaw, dialogue WAV, stage, HDRI and prop integration — inspection ONLY
        run: |
          python video/episodes/tiny-trails/ep01/episode_preflight.py \
            --assets artifacts/ep01/pack/assets-verified.json \
            --asset-dir artifacts/ep01/pack \
            --audio-dir artifacts/ep01/voices \
            --output artifacts/ep01/timeline
          /tmp/blender-3.6.23-linux-x64/blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/episodes/tiny-trails/ep01/render_ep01_native.py -- \
            --assets artifacts/ep01/pack/assets-verified.json \
            --asset-dir artifacts/ep01/pack \
            --audio-dir artifacts/ep01/voices \
            --output artifacts/ep01/native-scene-evidence.json \
            --mode inspect
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ep01/native-scene-evidence.json')
          d=json.loads(p.read_text())
          assert d['no_procedural_character_substitution'] and d['real_environment_imported']
          assert set(d['true_original_cast'])=={'sprite','elder_sprite'}
          assert not d['preview_rendered'] and not d['kaggle_rendered']
          assert not list(Path('artifacts/ep01').rglob('*.mp4'))
          print('EP01_ALL_REAL_ACTOR_AND_CC0_STAGE_INSPECTION_PASS_NO_VIDEO')
          PY
      - name: Render exactly 72 frames with original real models and licensed WAV (manual request only)
        env:
          CARTOONSTUDIO_EXPLICIT_EP01_PREVIEW: "YES"
        run: |
          /tmp/blender-3.6.23-linux-x64/blender -b -t 4 --disable-autoexec --python-exit-code 1 \
            --python video/episodes/tiny-trails/ep01/render_ep01_native.py -- \
            --assets artifacts/ep01/pack/assets-verified.json \
            --asset-dir artifacts/ep01/pack \
            --audio-dir artifacts/ep01/voices \
            --output artifacts/ep01/tiny-trails-ep01-preview-3s.mp4 \
            --mode preview --authorize-preview
      - name: Decode and verify actual 3-second H264/AAC MP4 and first original spoken WAV
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('artifacts/ep01/tiny-trails-ep01-preview-3s.mp4')
          if not p.is_file() or p.stat().st_size<10000:
              raise RuntimeError('MISSING_OR_EMPTY_ACTUAL_EP01_PREVIEW_MP4')
          result=subprocess.run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],
                                check=True,capture_output=True,text=True)
          media=json.loads(result.stdout)
          streams=media.get('streams',[])
          video=[x for x in streams if x.get('codec_type')=='video']
          audio=[x for x in streams if x.get('codec_type')=='audio']
          if len(video)!=1 or video[0].get('codec_name')!='h264':
              raise RuntimeError('Missing H.264 episode video')
          if (video[0].get('width'),video[0].get('height'))!=(1280,720):
              raise RuntimeError('Wrong preview frame size')
          if not audio or not any(s.get('codec_name')=='aac' for s in audio):
              raise RuntimeError('Episode audio stream missing')
          d=float(media['format']['duration'])
          if not 2.8<=d<=3.3:
              raise RuntimeError(f'Preview must last only three seconds, got {d}')
          subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],check=True,timeout=180)
          print('REAL_NATIVE_EP01_PREVIEW_MP4_CODEC_FRAME_DURATION_AND_DECODE_PASS',round(d,3))
          print('NOT_FULL_EPISODE; NOT_VISUALLY_APPROVED')
          PY
      - name: Upload ONLY actual three-second MP4, captions and evidence for user review
        uses: actions/upload-artifact@v4
        with:
          name: tiny-trails-ep01-genuine-72-frame-user-review-preview
          path: |
            artifacts/ep01/tiny-trails-ep01-preview-3s.mp4
            artifacts/ep01/timeline/subtitles.srt
            artifacts/ep01/native-scene-evidence.json
            artifacts/ep01/pack/assets-verified.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish technical reports, never raw copyrighted actor binaries or unapproved MP4
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-trails-ep01-native-assets-actual-inspection-only
          path: |
            artifacts/ep01/pack/assets-verified.json
            artifacts/ep01/pack/STAGE_BUILD_EVIDENCE.json
            artifacts/ep01/pack/actors/STUDIO_CAST_PROVENANCE.json
            artifacts/ep01/voices/voice-evidence.json
            artifacts/ep01/timeline/timeline.json
            artifacts/ep01/timeline/subtitles.srt
            artifacts/ep01/native-scene-evidence.json
          if-no-files-found: warn
          retention-days: 30
