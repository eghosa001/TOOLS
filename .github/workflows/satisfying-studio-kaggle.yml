name: "Satisfying Studio — separate CC0 assets and Kaggle Blender lookdev"

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Stage assets only, or publish a PRIVATE dataset and Blender still job to Kaggle"
        required: true
        type: choice
        options:
          - stage-assets-only
          - publish-to-private-kaggle
        default: stage-assets-only

permissions:
  contents: read

concurrency:
  group: satisfying-studio-kaggle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-or-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install asset downloader and Kaggle CLI
        run: python -m pip install --disable-pip-version-check requests kaggle
      - name: Prepare the CC0 ASMR library
        env:
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ "${{ inputs.destination }}" = "publish-to-private-kaggle" ]; then
            python video/satisfying_studio/kaggle/kaggle_bridge.py --publish
          else
            python video/satisfying_studio/kaggle/kaggle_bridge.py
          fi
      - name: Preserve source ledger and licensing records
        uses: actions/upload-artifact@v4
        with:
          name: satisfying-studio-cc0-sound-pbr-library
          path: artifacts/satisfying-studio-kaggle/dataset/
          retention-days: 30
          if-no-files-found: error

# Separate from every historical pipeline; no edits to video/history_studio.
# Creates one photoreal look-development still only. No AI or video autopublishing.
