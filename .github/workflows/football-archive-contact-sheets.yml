name: 'Football: capture actual Ronaldo goal sequences for manual shot selection'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-archive-contact-sheets.yml'
      - 'video/football_edits/produce_contact_sheet.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  footage-review:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core; fi
      - name: Download license-verified real archive footage
        run: |
          set -euo pipefail
          mkdir -p football_edit_source
          curl --fail --location --retry 5 --retry-delay 3 --max-time 520 'https://upload.wikimedia.org/wikipedia/commons/7/77/All_48_goals_of_Cristiano_Ronaldo%2C_in_35_league_matches_for_Real_Madrid_%282014-15%29.ogv' -o football_edit_source/ronaldo_48_goals_2014_15.ogv
          echo '6a75c744421acb76b827441fd9967d778cc19a4a  football_edit_source/ronaldo_48_goals_2014_15.ogv' | sha1sum -c -
      - name: Create labelled shot review contact sheets
        run: python3 video/football_edits/produce_contact_sheet.py
      - name: Persist text-encoded review contact sheets for editorial inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video/football_edits/reviews/*.txt video/football_edits/reviews/*.json
          git commit -m 'Evidence: Ronaldo archive labelled contact sheets for manual scene timing'
          git push origin HEAD:main
