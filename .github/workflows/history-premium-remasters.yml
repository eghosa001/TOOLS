name: "Facts Uncovered Remasters - Two Documentaries and Six Shorts"
on:
  workflow_dispatch:
  push:
    paths:
      - 'video/history_studio/remasters_2026/**'
      - '.github/workflows/history-premium-remasters.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        episode: [molasses, herculaneum]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core ffmpeg
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3' 'piper-tts==1.3.0'
      - name: Validate research and Python
        run: |
          python -m py_compile video/history_studio/remasters_2026/render_remasters.py
          python - <<'PY'
          import json
          e=json.load(open('video/history_studio/remasters_2026/episode_research_and_scripts.json'))['episodes']
          assert set(e)=={'molasses','herculaneum'}
          for ep in e.values():
              assert len(ep['scenes'])==24 and len(ep['shorts'])==3
              assert all(len(x['narration'].split())>30 for x in ep['scenes'])
              assert len({s['id'] for s in ep['scenes']})==24
          print('MANIFEST_QA_PASS')
          PY
      - name: Download reviewed public-domain-dataset neural voice
        run: |
          python - <<'PY'
          import pathlib,urllib.request,time
          root=pathlib.Path('artifacts/voice');root.mkdir(parents=True,exist_ok=True)
          model='en_US-ljspeech-high'
          base='https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/high/'
          for name in [model+'.onnx',model+'.onnx.json','MODEL_CARD']:
              for retry in range(4):
                  try:
                      req=urllib.request.Request(base+name,headers={'User-Agent':'FactsUncoveredResearch/2026'})
                      with urllib.request.urlopen(req,timeout=200) as data,(root/name).open('wb') as file:
                          while True:
                              block=data.read(1048576)
                              if not block:break
                              file.write(block)
                      print('VOICE_FILE',name,(root/name).stat().st_size)
                      break
                  except Exception as e:
                      print('DOWNLOAD_RETRY',name,retry,str(e)[:120])
                      time.sleep(retry+2)
              else:raise RuntimeError('Voice download failed: '+name)
          card=(root/'MODEL_CARD').read_text().lower()
          if 'license: public domain' not in card:raise RuntimeError('Voice license not verified')
          if (root/(model+'.onnx')).stat().st_size<10_000_000:raise RuntimeError('Truncated model')
          PY
      - name: Build final-file drafts with distinct scenes
        env:
          PIPER_MODEL: artifacts/voice/en_US-ljspeech-high.onnx
          PIPER_CONFIG: artifacts/voice/en_US-ljspeech-high.onnx.json
        run: |
          python video/history_studio/remasters_2026/render_remasters.py --episode ${{ matrix.episode }} --only all
      - name: Check master reports and unique image counts
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('video/history_studio/remasters_2026/output')/'${{ matrix.episode }}'
          reports=list(root.glob('*.qa.json'))
          assert len(reports)==4,len(reports)
          for p in reports:
              obj=json.loads(p.read_text())
              assert obj['distinct_image_hashes']==obj['shots']
              assert obj['editorial_status']=='RENDERED_UNREVIEWED_NOT_APPROVED'
              assert not obj['human_review_completed'] and not obj['publication_approved']
              assert obj['audio_sample_rate']=='48000'
              assert obj['video_size']==([1080,1920] if obj['short'] else [1920,1080])
              assert pathlib.Path(obj['file']).stat().st_size>300_000
              print('TECHNICAL_QA',p.name,obj['shots'],obj['duration'])
          PY
      - name: Save remastered movies, Shorts, captions and quality reports
        uses: actions/upload-artifact@v4
        with:
          name: facts-uncovered-${{ matrix.episode }}-remastered-DRAFT
          path: |
            video/history_studio/remasters_2026/output/${{ matrix.episode }}/*.mp4
            video/history_studio/remasters_2026/output/${{ matrix.episode }}/*.srt
            video/history_studio/remasters_2026/output/${{ matrix.episode }}/*.qa.json
            video/history_studio/remasters_2026/output/${{ matrix.episode }}/IMAGE_CREDITS.json
            video/history_studio/remasters_2026/output/${{ matrix.episode }}/RESEARCH_SOURCES.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
