name: CartoonStudio Fast Production Checks

on:
  workflow_dispatch:
  push:
    paths:
      - video/godot_episode_timeline.py
      - video/test_godot_episode_timeline.py
      - video/proposed_cast.json
      - video/story.json
      - video/export_expanded_cast.py
      - video/verify_expanded_cast.py
      - video/build_godot_studio.py
      - video/import_distinct_cartoon_cast.py
      - video/build_distinct_cartoon_production.py
      - video/validate_production_render.py
      - .github/workflows/cartoonstudio-manual-video.yml
      - .github/workflows/cartoonstudio-fast-validation.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate production Python syntax (no Blender required)
        run: |
          python -m py_compile \
            video/godot_episode_timeline.py \
            video/export_expanded_cast.py \
            video/verify_expanded_cast.py \
            video/build_godot_studio.py \
            video/import_distinct_cartoon_cast.py \
            video/build_distinct_cartoon_production.py \
            video/validate_production_render.py
      - name: Run canonical dialogue, roster, voice and Rhubarb timeline tests
        run: python -m unittest discover -s video -p "test_godot_episode_timeline.py" -v
      - name: Validate manual MP4 preview and full-render authorization guard
        run: |
          python video/validate_production_render.py --mode preview --approval false
          if python video/validate_production_render.py --mode full --approval false; then
            echo "Full render improperly allowed without approval"
            exit 1
          fi
          if python video/validate_production_render.py --mode full --approval true --preview-run-id ""; then
            echo "Full render improperly allowed without reviewed preview ID"
            exit 1
          fi
          echo "GODOT_RENDER_GATES_PASS"
      - name: Confirm preview-only policy and public-safe config
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/cartoonstudio-kaggle.yml").read_text()
          story=Path("video/story.json").read_text()
          assert "confirm_full" in wf or "confirm" in wf
          assert "KAGGLE_API_TOKEN" not in story
          print("SAFE_PRODUCTION_POLICY story contains no Kaggle secret")
          PY
