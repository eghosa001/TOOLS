name: Temporary VSS EP04 Figma Artwork Private Drive Handoff
on:
  push:
    paths:
      - .github/workflows/temp-vss-ep04-figma-art-handoff.yml
jobs:
  copy-art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch five Figma source-accurate art files
        shell: bash
        run: |
          set -eu
          mkdir -p assets
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 'https://www.figma.com/api/mcp/asset/49a783bf-2f37-4ad7-b222-22803512ce32.jpg' -o assets/VSS_EP04_NEW_A01_Duke_Signet.jpg
          test $(wc -c < assets/VSS_EP04_NEW_A01_Duke_Signet.jpg) -gt 30000
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 'https://www.figma.com/api/mcp/asset/6d9a271d-4457-4679-a750-682717670f4e.jpg' -o assets/VSS_EP04_NEW_A02_Bridge_Chain.jpg
          test $(wc -c < assets/VSS_EP04_NEW_A02_Bridge_Chain.jpg) -gt 30000
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 'https://www.figma.com/api/mcp/asset/234737a5-dddb-4b1e-a788-13c204de5d95.jpg' -o assets/VSS_EP04_NEW_A03_Courier_Clues.jpg
          test $(wc -c < assets/VSS_EP04_NEW_A03_Courier_Clues.jpg) -gt 30000
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 'https://www.figma.com/api/mcp/asset/eb9adb47-a6a2-4615-a922-71c8bdfedd43.jpg' -o assets/VSS_EP04_NEW_A04_Warehouse_Standoff.jpg
          test $(wc -c < assets/VSS_EP04_NEW_A04_Warehouse_Standoff.jpg) -gt 30000
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 'https://www.figma.com/api/mcp/asset/63c5d861-cb44-4fe5-b5f9-6030482ae9f7.jpg' -o assets/VSS_EP04_NEW_A05_Inventory.jpg
          test $(wc -c < assets/VSS_EP04_NEW_A05_Inventory.jpg) -gt 30000
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 'https://www.figma.com/api/mcp/asset/9ba97a5f-98fd-45ad-99e2-9860380adafa.jpg' -o assets/VSS_EP04_NEW_A06_Keys_Signet_Closeup.jpg
          test $(wc -c < assets/VSS_EP04_NEW_A06_Keys_Signet_Closeup.jpg) -gt 30000
          file assets/*.jpg
      - name: Handoff originals for private Drive upload
        uses: actions/upload-artifact@v4
        with:
          name: VSS_EP04_CORRECTION_ART_6
          path: assets/*.jpg
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
