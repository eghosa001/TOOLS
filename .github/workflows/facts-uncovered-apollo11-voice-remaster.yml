name: Facts Uncovered - Apollo 11 fast pronunciation-safe narration
on:
  push:
    branches: [production/apollo11-narration-fast-20261104]
    paths:
      - 'video/history_studio/productions/apollo11_real/**'
      - '.github/workflows/facts-uncovered-apollo11-voice-remaster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaster-real-archive-short:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools and original licensed speech model runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'kokoro-onnx>=0.4' 'numpy>=1.26,<3' 'soundfile>=0.12'
      - name: Retrieve pretrained commercially reusable natural voice model
        run: |
          set -euo pipefail
          mkdir -p models
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 3 "$BASE/kokoro-v1.0.onnx" -o models/kokoro-v1.0.onnx
          curl -fL --retry 3 "$BASE/voices-v1.0.bin" -o models/voices-v1.0.bin
          test "$(stat -c %s models/kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s models/voices-v1.0.bin)" -gt 25000000
      - name: Produce fast-paced new narration with genuine NASA source footage
        run: |
          set -euo pipefail
          python -m py_compile video/history_studio/productions/apollo11_real/produce.py
          python video/history_studio/productions/apollo11_real/produce.py \
            --media archive --output delivery \
            --model models/kokoro-v1.0.onnx --voices models/voices-v1.0.bin
      - name: Check speed, word preservation, final MP4, licence sources and subtitles
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, json, hashlib
          p=pathlib.Path('delivery')
          qc=json.loads((p/'PREVIEW_QC.json').read_text())
          film=p/'Facts_Uncovered_Apollo11_Real_Footage_Short.mp4'
          assert film.stat().st_size>1000000,film
          assert qc['status']=='PREVIEW_NOT_APPROVED_FOR_PUBLICATION'
          assert qc['no_ai_images_or_video'] and qc['real_film_share']>=.99
          assert qc['shot_count']==10
          assert qc['narration_words_per_minute']>=155, qc
          assert 31<=qc['duration_seconds']<=63
          assert film.is_file() and hashlib.sha256(film.read_bytes()).hexdigest()==qc['master_sha256']
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(film)]))
          video=next(x for x in info['streams'] if x['codec_type']=='video')
          audio=next(x for x in info['streams'] if x['codec_type']=='audio')
          assert (video['width'],video['height'])==(1080,1920)
          assert audio['codec_name']=='aac'
          captions=(p/'subtitles.srt').read_text()
          assert 'nineteen sixty nine' in captions.lower()
          assert '1969' not in captions
          assert captions.count(' --> ')>=10
          print('FAST_PACED_REAL_FOOTAGE_NARRATION_PASSED',qc)
          PY
      - name: Deliver remastered film, script, subtitles and rights record
        uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Apollo11-Faster-Clearer-Narration-REVIEW
          path: |
            delivery/Facts_Uncovered_Apollo11_Real_Footage_Short.mp4
            delivery/apollo11_real_frame_thumbnail.jpg
            delivery/REAL_ONLY_SOURCE_MANIFEST.json
            delivery/REAL_ONLY_MOTION_MANIFEST.json
            delivery/PREVIEW_QC.json
            delivery/subtitles.srt
            delivery/VIDEO_DESCRIPTION.txt
            delivery/SOURCES_AND_RIGHTS.md
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
