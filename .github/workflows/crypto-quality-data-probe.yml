name: Crypto - one-off Kraken OI historical coverage probe
# Automatic research runs paused; use Run workflow when needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check authoritative Kraken open-interest history without secrets
        run: python crypto-consensus/quality_data_probe.py
