name: Voice A-B audition — Qwen natural fast vs current Apollo speech
on:
  push:
    branches: [audio/universal-natural-speech-20261104]
    paths:
      - 'video/audio_quality/qwen_apollo_voice_audition.py'
      - '.github/workflows/qwen-natural-voice-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-genuine-voice-models:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve actual approved-speed reference speech without redownloading footage
        uses: actions/download-artifact@v4
        with:
          name: Facts-Uncovered-Apollo11-Faster-Clearer-Narration-REVIEW
          run-id: 41741044228
          github-token: ${{ github.token }}
          path: reference
      - name: Install CPU-based licensed Qwen3-TTS runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libsndfile1 sox
          python -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -q --disable-pip-version-check 'transformers==4.57.3' 'accelerate==1.12.0' soundfile librosa sox onnxruntime einops
          python -m pip install -q --no-deps 'qwen-tts==0.1.1'
          python -c 'import qwen_tts,torch; print("QWEN_LICENSED_VOICE_RUNNER_READY",torch.__version__)'
      - name: Audition difficult date, Armstrong and normal connected prosody
        run: |
          set -euo pipefail
          python -m py_compile video/audio_quality/qwen_apollo_voice_audition.py
          python video/audio_quality/qwen_apollo_voice_audition.py             --baseline reference/Facts_Uncovered_Apollo11_Real_Footage_Short.mp4             --source-manifest reference/REAL_ONLY_SOURCE_MANIFEST.json             --out audition
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("audition/A_B_VOICE_COMPARISON.json").read_text())
          assert not m["human_audio_quality_approved"]
          assert 1 <= m["qwen_speedup_factor"] <= 1.25
          assert Path("audition/CANDIDATE_Qwen3_Ryan_fast_natural.wav").stat().st_size>250000
          print("QWEN_CANDIDATE_READY_FOR_REAL_LISTENING",m["qwen_final_wpm"])
          PY
      - name: Save audio comparison as private editorial review only
        uses: actions/upload-artifact@v4
        with:
          name: Apollo11-Qwen3-Ryan-AB-HumanVoice-Cadence-Audition
          path: |
            audition/*.wav
            audition/*.json
            audition/*.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
