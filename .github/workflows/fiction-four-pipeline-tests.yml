name: Fiction Studio four-novel pipeline — safety tests
on:
  pull_request:
    paths:
      - "video/audiobook_studio/fiction_four_kaggle_runner.py"
      - "video/audiobook_studio/prepare_four_novel_private_bundle.py"
      - "video/audiobook_studio/tests/test_fiction_four_kaggle_runner.py"
      - ".github/workflows/fiction-studio-four-novels-kaggle.yml"
      - ".github/workflows/fiction-four-pipeline-tests.yml"
      - ".github/workflows/fiction-four-source-preflight.yml"
      - "video/audiobook_studio/kaggle_four_dataset_resolver.py"
      - "video/audiobook_studio/tests/test_kaggle_four_dataset_resolver.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate workflow YAML
        run: |
          python -m pip install -q pyyaml
          python - <<'PY'
          import pathlib,yaml
          for p in [".github/workflows/fiction-studio-four-novels-kaggle.yml", ".github/workflows/fiction-four-source-preflight.yml"]:
              x=yaml.safe_load(pathlib.Path(p).read_text())
              assert x.get("jobs") and "workflow_dispatch" in pathlib.Path(".github/workflows/fiction-studio-four-novels-kaggle.yml").read_text()
          PY
      - name: Parse without connecting to private services
        run: |
          python -m py_compile video/audiobook_studio/fiction_four_kaggle_runner.py
          python -m py_compile video/audiobook_studio/prepare_four_novel_private_bundle.py
          python -m py_compile video/audiobook_studio/kaggle_four_dataset_resolver.py
      - name: Test isolation, source hashes, human-release gates and chunking
        run: |
          python -m unittest discover -s video/audiobook_studio/tests -p "test_*four*.py" -v
      - name: Confirm no GPU, paid generator or publishing step was executed
        run: echo "PUBLIC_SAFE_TESTS_ONLY — no private assets accessed or generated"
