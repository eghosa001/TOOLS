name: Crypto consensus - public feed reachability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crypto-consensus-provider-probe.yml'
permissions:
  contents: read
jobs:
  probe-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test public DATA access ONLY (no accounts or credentials)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          urls={
            "Binance fapi": "https://fapi.binance.com/fapi/v1/ping",
            "Binance fapi1": "https://fapi1.binance.com/fapi/v1/ping",
            "Binance fapi2": "https://fapi2.binance.com/fapi/v1/ping",
            "Binance api-gcp": "https://api-gcp.binance.com/api/v3/ping",
            "Binance archive": "https://data.binance.vision/data/futures/um/monthly/klines/ETHUSDT/12h/ETHUSDT-12h-2026-10.zip",
            "Kraken futures": "https://futures.kraken.com/derivatives/api/v3/tickers",
            "Kraken chart": "https://futures.kraken.com/api/charts/v1/trade/PFI_ETHUSD/12h",
            "Kraken spot": "https://api.kraken.com/0/public/Time",
            "OKX": "https://www.okx.com/api/v5/public/time",
            "Hyperliquid": "https://api.hyperliquid.xyz/info"
          }
          for name,url in urls.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"CryptoResearchAudit/1.0"}),timeout=8) as r:
                print(name,'HTTP',r.status,'bytes',len(r.read(256)))
            except urllib.error.HTTPError as e:
              print(name,'HTTP',e.code)
            except Exception as e:
              print(name,type(e).__name__,str(e)[:130])
          PY
