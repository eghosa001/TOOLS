name: ASMR CC0 Soft-Fruit Foley Acquisition
on:
  pull_request:
    paths:
      - "video/satisfying_studio/production/acquire_soft_fig_foley.py"
      - ".github/workflows/asmr-cc0-soft-fruit-foley.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFprobe and Python requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q requests
      - name: Verify original CC0 license and fetch HQ soft tomato slicing audio
        run: python video/satisfying_studio/production/acquire_soft_fig_foley.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ASMR_CC0_Real_Soft_Tomato_Foley_Source
          path: /tmp/asmr-natural-fig/
          retention-days: 3
          if-no-files-found: error
