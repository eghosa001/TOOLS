name: Ninefold v07 — inspect private Kaggle dataset version
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ninefold-v07-dataset-debug.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect private dataset metadata and processing state (no raw assets)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q kaggle
          python - <<'PY'
          import subprocess,json,csv,io
          ref='aighewieghosa/ninefold-v07-original-assets-private'
          calls=[['datasets','list','--mine','--csv','--page-size','100'],
                 ['datasets','files',ref],
                 ['datasets','status',ref]]
          for args in calls:
              p=subprocess.run(['kaggle',*args],capture_output=True,text=True,timeout=45)
              if args[1]=='list':
                  rows=list(csv.DictReader(io.StringIO(p.stdout)))
                  matching=[r for r in rows if 'ninefold-v07' in json.dumps(r).lower()]
                  print('PRIVATE_DATASET_CATALOG',json.dumps(matching)[:2000])
              else:
                  print('KAGGLE_DATASET_DIAGNOSTIC',args[1],'code',p.returncode,
                        'stdout',repr(p.stdout[:2200]),'stderr',repr(p.stderr[:800]))
          PY
