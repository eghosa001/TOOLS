name: "Facts Uncovered — Giza asset and scene preflight"
on:
  push:
    paths:
      - ".github/workflows/facts-uncovered-giza-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal layout dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31"
      - name: Check all chapter lengths, historically accurate labels, and 3 licensing searches
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("video/history_studio/films/giza_hidden_history_2026/produce.py")
          spec=importlib.util.spec_from_file_location("film",p)
          x=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(x)
          assert len(x.FILES)==15 and len(x.CFG["short_scripts"])==7
          for i in range(1,16):
              title,parts=x.chapter_paragraphs(i)
              assert len(parts)>=7,(i,len(parts))
              print("CHAPTER_VERIFIED",i,title,sum(len(p.split()) for p in parts))
          for index in [1,7,14]:
              images=x.get_assets(x.CFG["image_queries"][index-1],Path("preflight")/str(index),limit=5)
              assert len(images)>=3,(index,len(images))
              x.scene_plate(x.CFG["names"][index-1],"Archaeological evidence not unsupported claims.",images[0]["local"],0,0).save("preflight/scene_%02d.jpg"%index)
              print("ARCHIVAL_PHOTOGRAPH_LICENSE_VALID",index,len(images))
          print("PREFLIGHT_PASSED",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Giza-Preflight-Sample-Images
          path: preflight/scene_*.jpg
          if-no-files-found: error
