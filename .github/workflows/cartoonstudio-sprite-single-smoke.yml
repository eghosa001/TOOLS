name: CartoonStudio Verify One Original Sprite Fright Rig Export

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cartoonstudio-sprite-single-smoke.yml

permissions:
  contents: read
  actions: read

jobs:
  butterfly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reuse genuine source models already inspected and packaged in an earlier successful run
        uses: actions/download-artifact@v4
        with:
          name: cartoonstudio-eight-original-blender-studio-rig-masters
          run-id: 40230434307
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/masters
      - name: Install publisher's compatible Blender 3.6 LTS binary (verified checksum)
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://ftp.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            --output /tmp/blender-3.6.23-linux-x64.tar.xz
          curl --fail --location --retry 3 --silent --show-error \
            https://ftp.blender.org/release/Blender3.6/blender-3.6.23.sha256 \
            --output /tmp/blender-3.6.23.sha256
          grep 'blender-3.6.23-linux-x64.tar.xz' /tmp/blender-3.6.23.sha256 > /tmp/this-blender.sha256
          (cd /tmp && sha256sum --check this-blender.sha256)
          mkdir -p /tmp/hq-blender
          tar -xJf /tmp/blender-3.6.23-linux-x64.tar.xz -C /tmp/hq-blender
          /tmp/hq-blender/blender-3.6.23-linux-x64/blender --version
      - name: Export only the original separately authored butterfly rig
        run: |
          /tmp/hq-blender/blender-3.6.23-linux-x64/blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_reusable_sprite_fright_rigs.py -- \
            artifacts/masters/sprite_fright/030_0020_A/lib/char/butterfly/butterfly.blend \
            artifacts/single-actor butterfly
      - name: Verify authentic skin and geometry (no procedural impostor)
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'video')
          from verify_original_assets import read_glb
          p=Path('artifacts/single-actor/butterfly_blender_studio.glb')
          gltf=read_glb(p)
          print('REAL_BUTTERFLY_ACTOR',p.stat().st_size,
                'skins',len(gltf.get('skins',[])),
                'meshes',len(gltf.get('meshes',[])))
          assert p.stat().st_size>200_000
          assert len(gltf.get('skins',[]))>=1
          assert len(gltf.get('meshes',[]))>=1
          print('REAL_BUTTERFLY_IMPORTED_FROM_BLENDER_STUDIO_SOURCE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-original-studio-butterfly-one-verified
          path: artifacts/single-actor/*
          retention-days: 30
          if-no-files-found: error
