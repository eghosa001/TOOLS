name: ASMR license-cleared free footage availability probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/satisfying-studio-stock-media-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Pexels free commercial-use footage URLs using only headers
        run: |
          for id in 6150663 6872061 7640342 8298623 3933935 5871325; do
            for template in "hd_1920_1080_25fps" "hd_1080_1920_25fps" "hd_1280_720_25fps" "sd_640_360_25fps" "hd_1920_1080_24fps"; do
              URL="https://videos.pexels.com/video-files/$id/$id-$template.mp4"
              CODE="$(curl -ILs --max-time 8 -o /dev/null -w '%{http_code}' "$URL" || true)"
              if test "$CODE" != "403" -a "$CODE" != "404"; then echo "CANDIDATE $id $template $CODE"; fi
            done
          done
          echo "A robust chooser can also parse the source website's official download options."
