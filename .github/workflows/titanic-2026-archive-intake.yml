name: "Titanic — 22 hand-selected archive rights intake (no video)"
on:
  push:
    paths:
      - ".github/workflows/titanic-2026-archive-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: titanic-2026-archive-intake
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only archival download/image inspection tools
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" requests
      - name: Fetch ONLY the hand-selected source items and retain explicit rights report
        run: python -u video/history_studio/episodes/titanic-1912/2026_rebuild/intake_verified_archives.py
      - name: Verify actual assets and source ledger
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('video/history_studio/episodes/titanic-1912/2026_rebuild/archive_intake')
          s=json.loads((p/'ARCHIVE_ASSET_LEDGER.json').read_text())
          assert s['source_count']==22
          assert all((p/x['file']).is_file() for x in s['images'] if x['file'])
          assert s['publication_approved'] is False
          print('ARCHIVE_REVIEW_INTAKE',s['retrieved'],'OF',s['source_count'],'MISSING',s['missing'])
          PY
      - name: Preserve verified photograph candidates with individually recorded rights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-2026-Source-Specific-Archive-Intake-REVIEW
          retention-days: 30
          if-no-files-found: warn
          path: |
            video/history_studio/episodes/titanic-1912/2026_rebuild/archive_intake/*.jpg
            video/history_studio/episodes/titanic-1912/2026_rebuild/archive_intake/*.json
