name: Recover existing Kaggle history 64s videos (no render)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-kaggle-outputs-recover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover_existing:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        topic: [london, constantinople]
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      TOPIC: ${{ matrix.topic }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kaggle CLI only; never launch another render
        run: python -m pip install --quiet kaggle
      - name: Retrieve exactly the private notebook Kaggle actually created
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing KAGGLE_API_TOKEN: cannot retrieve existing private output"
            exit 2
          fi
          python - <<'PY'
          import os,subprocess,pathlib,json,sys
          topic=os.environ['TOPIC']
          username=os.environ['KAGGLE_USERNAME'].strip()
          slug='history-3d-'+topic+'-64s-private-review'
          kernel=username+'/'+slug
          output=pathlib.Path('recover')/topic
          output.mkdir(parents=True,exist_ok=True)
          status=subprocess.run(
              ['kaggle','kernels','status',kernel],
              capture_output=True,text=True,timeout=50)
          state=(status.stdout+' '+status.stderr).strip()
          print("KAGGLE_CORRECT_SLUG",kernel)
          print("KAGGLE_KERNEL_STATE",state[-1800:])
          (output/'kaggle-status.txt').write_text(state)
          if status.returncode!=0:
              print("Cannot access Kaggle status even with actual notebook URL.")
              sys.exit(3)
          fetch=subprocess.run(
              ['kaggle','kernels','output',kernel,'-p',str(output),'--force'],
              capture_output=True,text=True,timeout=240)
          logs=(fetch.stdout+' '+fetch.stderr)
          (output/'fetch-log.txt').write_text(logs)
          print("OUTPUT_FETCH_EXIT_CODE",fetch.returncode)
          print("OUTPUT_FETCH_MESSAGE",logs[-2400:])
          files=[{'name':str(p.relative_to(output)),'bytes':p.stat().st_size}
                  for p in output.rglob('*') if p.is_file()]
          print('RECOVERED_FILES',json.dumps(files))
          expected=topic+'-64s-3d-qwen-REVIEW.mp4'
          found=[p for p in output.rglob(expected) if p.stat().st_size>100000]
          print("VERIFIED_MP4",bool(found))
          if fetch.returncode!=0 or not found:
              print('Kaggle kernel may have failed or output was never generated. Inspect fetched logs.')
              sys.exit(4)
          print('RECOVERED_EXISTING_RENDER',found[0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-history-64s-${{ matrix.topic }}-retrieval
          path: recover/${{ matrix.topic }}/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
