name: CartoonStudio Original 3D Assets

on:
  workflow_dispatch:
  push:
    paths:
      - video/studio_world.py
      - video/studio_contract.py
      - video/blender_asset_export.py
      - video/build_original_assets.py
      - video/cartoonstudio_source_patch.py
      - .github/workflows/cartoonstudio-original-assets.yml

permissions:
  contents: read

concurrency:
  group: cartoonstudio-original-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source Blender (no Kaggle needed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
      - name: Export original characters and garden GLBs
        run: python video/build_original_assets.py artifacts/original-blender-assets
      - name: Upload reusable 3D asset pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-original-3d-assets
          path: artifacts/original-blender-assets/*
          if-no-files-found: error
          retention-days: 30
