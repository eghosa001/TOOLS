name: Mythveil - stop superseded large parquet scans
on:
  push:
    branches: [assets/mythveil-1000-cc0]
    paths: [.github/workflows/mythveil-stop-obsolete-scans.yml]
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only three superseded experimental parquet runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in 42717237891 42717688480 42717713284; do
            gh api --method POST repos/eghosa001/TOOLS/actions/runs/$id/cancel \
              && echo "Cancelled superseded run $id" \
              || echo "Already ended or cannot cancel $id"
          done
