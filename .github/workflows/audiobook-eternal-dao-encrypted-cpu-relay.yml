name: Eternal Dao — encrypted relay from verified private CPU MP4 to connected Drive
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobook-eternal-dao-encrypted-cpu-relay.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eternal-dao-ep01-private-encrypted-cpu-relay
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      DRIVE_HANDOFF_RECIPIENT_B64: laqbx56p5H9pz9fQxuOKfb+rT7QlDSUO1A8h71bhjkU=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authorized Kaggle SDK and FFmpeg
        run: |
          python -m pip install -q --disable-pip-version-check kaggle kagglesdk requests six cryptography
          command -v ffmpeg && command -v ffprobe || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: Rebuild a playable private MP4 from original 28 scenes and approved Ryan M4A
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          import requests
          from kagglesdk import KaggleClient
          from kagglesdk.kernels.types.kernels_api_service import ApiListKernelSessionOutputRequest
          owner=os.environ.get('KAGGLE_USERNAME','')
          if owner!='aighewieghosa' or not os.environ.get('KAGGLE_API_TOKEN'):
              raise SystemExit('Expected authorized private Kaggle owner')
          source=owner+'/eternal-dao-d03-ep01-fast-review-recovered'
          dataset=owner+'/eternal-dao-d03-ep01-fast-private-review'
          api=KaggleClient(api_token=os.environ['KAGGLE_API_TOKEN']).kernels.kernels_api_client
          req=ApiListKernelSessionOutputRequest()
          req.user_name,req.kernel_slug=source.split('/')
          req.page_size=200
          result=api.list_kernel_session_output(req)
          allfiles=list(result.files or [])
          selected=[x for x in allfiles if pathlib.Path(x.file_name).suffix.lower() in ('.png','.m4a','.json')]
          print('PRIVATE_EP01_CPU_SALVAGE_EXPECTED_ASSETS',json.dumps({
              'png_count':sum(pathlib.Path(x.file_name).suffix.lower()=='.png' for x in selected),
              'audio_count':sum(pathlib.Path(x.file_name).name=='narration_review.m4a' for x in selected),
              'json_count':sum(pathlib.Path(x.file_name).suffix.lower()=='.json' for x in selected),
          }),flush=True)
          if sum(pathlib.Path(x.file_name).suffix.lower()=='.png' for x in selected)<30:
              raise RuntimeError('Missing original generated pictures; no invented filler')
          if sum(pathlib.Path(x.file_name).name=='narration_review.m4a' for x in selected)!=1:
              raise RuntimeError('Original Ryan master M4A unavailable')
          root=pathlib.Path('owner-private-work');root.mkdir()
          def safe_target(name):
              q=pathlib.PurePosixPath(name)
              if q.is_absolute() or '..' in q.parts or len(q.parts)>12 or '\\' in name:
                  raise ValueError('Unsafe Kaggle output path')
              return root.joinpath(*q.parts)
          downloaded=0
          for item in selected:
              dest=safe_target(item.file_name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              with requests.get(item.url,stream=True,timeout=(30,120)) as response:
                  response.raise_for_status()
                  n=0
                  with dest.open('wb') as out:
                      for chunk in response.iter_content(1<<20):
                          n+=len(chunk)
                          if n>50_000_000: raise RuntimeError('Single private asset unexpectedly huge')
                          out.write(chunk)
              if n==0:raise RuntimeError('Empty original asset')
              downloaded+=1
          print('PRIVATE_EP01_CPU_SALVAGE_RETRIEVED_ORIGINAL_ASSETS',downloaded,flush=True)
          def one(name):
              p=list(root.rglob(name))
              if len(p)!=1:raise RuntimeError('Missing or ambiguous original '+name)
              return p[0]
          timeline=one('PRIVATE_SCENE_TIMELINE.json')
          plan=one('PRIVATE_SCENE_PLAN.json')
          qa=one('PRIVATE_VISUAL_QA_REPORT.json')
          master=one('narration_review.m4a')
          thumb=one('THUMBNAIL_REVIEW.png')
          parts=json.loads(timeline.read_text())
          story_plan=json.loads(plan.read_text())
          if story_plan.get('story_id')!='eternal-dao-of-the-lost-epoch' or story_plan.get('episode')!=1:
              raise RuntimeError('Recovered output does not match approved episode')
          if len(parts)!=28 or len(story_plan.get('scenes',[]))!=28:
              raise RuntimeError('Expected original 28 source-timed illustrated scenes')
          for i,(item,scene) in enumerate(zip(parts,story_plan['scenes'])):
              if item.get('source_sha256')!=scene.get('source_sha256'):
                  raise RuntimeError('Recovered scene source ordering or source hash mismatch')
              path=timeline.parent/item.get('image','')
              if not path.is_file():
                  raise RuntimeError('Original scene image unavailable at timeline index '+str(i))
              if hashlib.sha256(path.read_bytes()).hexdigest()!=item.get('image_sha256'):
                  raise RuntimeError('Recovered scene image hash mismatch')
          print('PRIVATE_EP01_ALL_28_STORY_ORDER_AND_IMAGE_HASHES_PASS',True,flush=True)
          out=root/'Eternal_Dao_D03_Ep01_FAST_PRIVATE_REVIEW.mp4'
          command=[sys.executable,'-m','video.audiobook_studio.manhua_pipeline.assemble_existing',
                   '--audio',str(master),'--timeline',str(timeline),
                   '--thumbnail',str(thumb),'--visual-qa-report',str(qa),
                   '--output',str(out),'--motion','none','--preset','ultrafast']
          print('PRIVATE_EP01_CPU_REASSEMBLY_STARTED',flush=True)
          subprocess.run(command,check=True,timeout=1600)
          result_path=out.with_name(out.stem+'.assembly.json')
          report=json.loads(result_path.read_text())
          check=report.get('technical_review',{})
          print('PRIVATE_EP01_CPU_REASSEMBLY_REPORT',json.dumps({
              'mp4_exists':out.is_file(),'mp4_bytes':out.stat().st_size,
              'duration_seconds':report.get('duration_seconds'),
              'assembly_seconds':report.get('assembly_seconds'),
              'visual_quality_status':(report.get('visual_quality') or {}).get('status'),
              'ready_for_youtube':report.get('ready_for_youtube'),
              'audio_decoded':(check.get('audio_levels') or {}).get('audible_audio_decoded'),
          }),flush=True)
          if report.get('ready_for_youtube') is not False:
              raise RuntimeError('Review release gate violated')
          # The connected Drive uploader can accept container files, so
          # encrypt the reviewed MP4 + thumbnail before crossing GitHub Actions.
          # Only the public X25519 key is visible in this repository.
          import base64,zipfile,secrets
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives.ciphers import Cipher,algorithms,modes
          source_files=[out,out.with_name(out.stem+'.thumbnail.png'),result_path]
          if not all(p.is_file() for p in source_files):
              raise RuntimeError('Owner review MP4/thumbnail/report is not intact')
          if out.stat().st_size<150_000_000:
              raise RuntimeError('CPU salvage produced abnormally small MP4')
          bundle=pathlib.Path('owner_private_review.zip')
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_STORED,allowZip64=True) as z:
              for f in source_files:
                  z.write(f,f.name)
          recipient=X25519PublicKey.from_public_bytes(base64.b64decode(os.environ['DRIVE_HANDOFF_RECIPIENT_B64']))
          ephemeral=X25519PrivateKey.generate()
          salt=secrets.token_bytes(16)
          nonce=secrets.token_bytes(12)
          secret=HKDF(algorithm=hashes.SHA256(),length=32,salt=salt,
                      info=b'private-eternal-dao-ep01-google-drive-relay-v1').derive(ephemeral.exchange(recipient))
          encryptor=Cipher(algorithms.AES(secret),modes.GCM(nonce)).encryptor()
          encryptor.authenticate_additional_data(b'eternal-dao-d03-ep01-approved-review')
          cipher=pathlib.Path('cipher');cipher.mkdir()
          part_bytes=32*1024*1024
          index=0;current=None;used=0;total=0
          def append_cipher(data):
              global index,current,used,total
              while data:
                  if current is None:
                      current=(cipher/('part-%02d.bin'%index)).open('wb')
                      used=0
                  portion=data[:part_bytes-used]
                  current.write(portion)
                  total+=len(portion);used+=len(portion);data=data[len(portion):]
                  if used==part_bytes:
                      current.close();current=None;index+=1
          with bundle.open('rb') as source:
              for block in iter(lambda:source.read(4*1024*1024),b''):
                  append_cipher(encryptor.update(block))
          append_cipher(encryptor.finalize())
          if current:current.close()
          parts=sorted(cipher.glob('part-*.bin'))
          if len(parts)!=7:raise RuntimeError('Expected seven encrypted 32 MiB chunks')
          digest=hashlib.sha256()
          with bundle.open('rb') as f:
              for b in iter(lambda:f.read(4*1024*1024),b''):digest.update(b)
          manifest={
              'version':1,'algorithm':'AES-256-GCM + X25519 + HKDF-SHA256',
              'ephemeral_public_b64':base64.b64encode(ephemeral.public_key().public_bytes(
                  serialization.Encoding.Raw,serialization.PublicFormat.Raw)).decode(),
              'salt_b64':base64.b64encode(salt).decode(),
              'nonce_b64':base64.b64encode(nonce).decode(),
              'tag_b64':base64.b64encode(encryptor.tag).decode(),
              'package_sha256':digest.hexdigest(),
              'video_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
              'total_cipher_bytes':total,'number_of_parts':len(parts),
              'names':[f.name for f in source_files],
          }
          (cipher/'manifest.json').write_text(json.dumps(manifest))
          import shutil
          shutil.rmtree(root)
          bundle.unlink()
          print('PRIVATE_EP01_ENCRYPTED_VIDEO_RELAY_READY',json.dumps({
              'part_count':len(parts),'cipher_bytes':total,
              'source_mp4_verified':True,'plaintext_public_artifacts':False}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-meta, path: cipher/manifest.json, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-00, path: cipher/part-00.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-01, path: cipher/part-01.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-02, path: cipher/part-02.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-03, path: cipher/part-03.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-04, path: cipher/part-04.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-05, path: cipher/part-05.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-drive-relay-06, path: cipher/part-06.bin, retention-days: 1, compression-level: 0}
      - name: Confirm plaintext video was never uploaded as a public artifact
        run: |
          test -f cipher/manifest.json
          test ! -e owner_private_review.zip
          test ! -e owner-private-work
          echo 'ONLY X25519+AES-GCM ENCRYPTED MEDIA WAS RELAYED; PRIVATE KEY REMAINS OUTSIDE GITHUB'
