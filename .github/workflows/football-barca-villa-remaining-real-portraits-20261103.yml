name: "Football: genuine CC real photo portraits for second Barca Villa matchup"
on:
  push:
    branches: [main]
    paths: [".github/workflows/football-barca-villa-remaining-real-portraits-20261103.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests Pillow
      - name: Fetch original author-licensed photographs, reject substitutes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          from urllib.parse import quote
          from hashlib import md5
          import requests,json,time
          out=Path('football_players_v2');out.mkdir(exist_ok=True)
          specs=[
           ('Cubarsi_REAL','Pau Cubarsí.jpg','CC BY 4.0','Biso',
            'https://commons.wikimedia.org/wiki/File:Pau_Cubars%C3%AD.jpg'),
           ('Jackson_REAL','Nicolas Jackson France v Senegal 16 June 2026-369 (cropped).jpg',
             'CC BY-SA 4.0','Bryan Berlin / WikiPortraits',
             'https://commons.wikimedia.org/wiki/File:Nicolas_Jackson_France_v_Senegal_16_June_2026-369_(cropped).jpg'),
          ]
          report=[]
          for key,name,lic,creator,origin in specs:
            normal=name.replace(' ','_')
            dig=md5(normal.encode()).hexdigest()
            urls=['https://upload.wikimedia.org/wikipedia/commons/'+dig[0]+'/'+dig[:2]+'/'+quote(normal),
                  'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+quote(normal)]
            result=None
            for k in range(4):
              for url in urls:
                try:
                  resp=requests.get(url,timeout=19,headers={'User-Agent':'Football-Video-Editorial-CC-Attribution/1.0'})
                  resp.raise_for_status()
                  im=Image.open(BytesIO(resp.content)).convert('RGB')
                  if min(im.size)<450:raise RuntimeError('Image too small')
                  target=out/(key+'.jpg');im.save(target,quality=90)
                  result={'id':key,'origin':origin,'licence':lic,'creator':creator,'width':im.width,
                          'height':im.height,'bytes':target.stat().st_size}
                  print('PHOTO_OK',result,flush=True)
                  break
                except Exception as e:print('PHOTO_RETRY',key,k,str(e)[:130],flush=True)
              if result:break
              time.sleep(2)
            if not result:raise RuntimeError('Cannot obtain genuine player photo '+key)
            report.append(result)
          (out/'rights.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Real-Cubarsi-Jackson-Photo-Portraits-2026
          path: football_players_v2/*
          if-no-files-found: error
          retention-days: 14
