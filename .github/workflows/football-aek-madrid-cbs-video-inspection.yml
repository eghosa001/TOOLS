name: "Football: Inspect exact 2026 City AEK and Madrid Leipzig CBS footage"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/football-aek-madrid-cbs-video-inspection.yml','video/football_edits/aek_madrid_cbs_source_inspection.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q beautifulsoup4 requests
      - name: Verify named match and inspect public video (never infer rights)
        run: python video/football_edits/aek_madrid_cbs_source_inspection.py
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-Madrid-2026-CBS-Actual-Match-Editorial-Inspection
          path: football_edit_output/aek_madrid_2026_cbs_candidates/*
          if-no-files-found: error
          retention-days: 3