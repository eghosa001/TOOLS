name: Audiobook — repair existing Kaggle credential routing
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobook-kaggle-credential-route.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_REFRESH_TOKEN: ${{ secrets.KAGGLE_REFRESH_TOKEN }}
      KAGGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.KAGGLE_OAUTH_REFRESH_TOKEN }}
      KAGGLE_API_REFRESH_TOKEN: ${{ secrets.KAGGLE_API_REFRESH_TOKEN }}
      KAGGLE_REFRESH: ${{ secrets.KAGGLE_REFRESH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'kagglesdk' requests
      - name: Test existing credential through legacy, token, and direct SDK paths
        run: |
          python - <<'PY'
          import os,subprocess,pathlib,json
          token=os.environ.get('KAGGLE_API_TOKEN','').strip()
          print('KAGGLE_SECRET_SHAPE',{'present':bool(token),'length':len(token),
           'new_style':token.startswith('kgat_'),'looks_like_json':token.startswith('{'),
           'has_whitespace':any(c.isspace() for c in token),
           'has_legacy_key_separately':bool(os.environ.get('KAGGLE_KEY',''))},flush=True)
          def test(label,env):
            p=subprocess.run(['kaggle','quota'],env=env,capture_output=True,text=True,timeout=40)
            err=(p.stdout+p.stderr).lower()
            print('KAGGLE_AUTH_TEST',label,{'exit':p.returncode,
              'authentication_required':'authentication required' in err,
              'not_authorized':'unauthorized' in err or 'forbidden' in err,
              'rate_limited':'429' in err,'not_found':'404' in err},flush=True)
          import requests,time
          print('KAGGLE_TOKEN_FAMILY',{'KGAT_access':token.upper().startswith('KGAT_'),
                'KGRT_refresh':token.upper().startswith('KGRT_'),
                'refresh_secret_present':any(os.environ.get(n) for n in (
                'KAGGLE_REFRESH_TOKEN','KAGGLE_OAUTH_REFRESH_TOKEN',
                'KAGGLE_API_REFRESH_TOKEN','KAGGLE_REFRESH'))},flush=True)
          try:
            r=requests.post('https://www.kaggle.com/api/v1/oauth2/introspect',
                json={'token':token},timeout=20)
            data=r.json() if r.ok else {}
            print('KAGGLE_OFFICIAL_INTROSPECT',{'http':r.status_code,
              'active':data.get('active'),
              'expiration_present':'exp' in data,
              'expired': data.get('exp',10**12)<time.time(),
              'has_kernels_editor':'kernels.editor' in str(data.get('scope','')),
              'has_datasets_editor':'datasets.editor' in str(data.get('scope',''))},flush=True)
          except Exception as err:
            print('KAGGLE_INTROSPECT_FAILED',type(err).__name__,flush=True)
          test('token_as_supplied',dict(os.environ))
          e=dict(os.environ);e.pop('KAGGLE_API_TOKEN',None)
          e['KAGGLE_KEY']=token
          test('token_as_legacy_key',e)
          try:
            from kagglesdk import KaggleClient
            from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelSessionStatusRequest
            req=ApiGetKernelSessionStatusRequest()
            req.user_name,req.kernel_slug=os.environ['KAGGLE_USERNAME'],'eternal-dao-d03-ep01-fast-review-recovered'
            client=KaggleClient(api_token=token).kernels.kernels_api_client
            s=client.get_kernel_session_status(req)
            print('KAGGLE_DIRECT_SDK_AUTH',{'ok':True,'status':str(getattr(s,'status',''))[:60]},flush=True)
          except Exception as e:
            print('KAGGLE_DIRECT_SDK_AUTH',{'ok':False,'class':type(e).__name__,'http_status':getattr(getattr(e,'response',None),'status_code',None)},flush=True)
          PY
