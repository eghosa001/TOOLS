name: Audiobook — smoke-test-001 private five-second review
on:
  push:
    paths:
      - .github/workflows/audiobook-manhua-smoke-001.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: audiobook-manhua-smoke-001
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private smoke submission tools
        run: python -m pip install -q --disable-pip-version-check kaggle six
      - name: Build source-accurate PRIVATE synthetic one-line story pack
        run: |
          python - <<'PY'
          import pathlib
          from video.audiobook_studio.manhua_pipeline.core import create_package
          folder=pathlib.Path('private-smoke')
          folder.mkdir(exist_ok=True)
          line="The young cultivator opened his eyes as spiritual light gathered around him."
          source=folder/'episode01.txt'
          source.write_text(line,encoding='utf-8')
          chars=[{'id':'young-cultivator','name':'Young Cultivator','visual_description':'A young male cultivator with straight dark hair, modest indigo hanfu robe, clear eyes, slender build, no facial hair'}]
          # Private, noncommercial synthetic smoke; model license checked against stability.ai/license. Not commercial release clearance.
          result=create_package(story_id='smoke-test-001',title='The Awakening (Technical Test)',manuscript=source,
              episodes={1:source},output=folder/'MANHUA_STORY_PACKAGE.zip',style='cultivation',
              characters=chars,source_approved=True,image_model_rights_reviewed=True,
              thumbnail_hook='SPIRITUAL AWAKENING',
              scene_briefs={1:['A young cultivator opens his eyes in a moonlit cultivation chamber, luminous spiritual aura gathering around his face, Chinese fantasy setting, cinematic 16:9 composition']})
          print('PRIVATE_SMOKE_PACKAGE_READY',result['story_id'],len(result['episodes']))
          PY
      - name: Submit private Kaggle GPU smoke without inaccessible private dataset API
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo KAGGLE_API_TOKEN_MISSING; exit 1; fi
          python - <<'PY'
          import base64,json,os,pathlib,re
          stage=pathlib.Path('artifacts/manhua-smoke-direct')
          stage.mkdir(parents=True,exist_ok=True)
          runner='import base64,sys,types,subprocess,os,pathlib\n'
          for name in ('video','video.audiobook_studio','video.audiobook_studio.manhua_pipeline'):
              runner+=f"m=types.ModuleType({name!r});m.__path__=[];sys.modules[{name!r}]=m\n"
          srcs={
              'video.audiobook_studio.episode_fastlane':'video/audiobook_studio/episode_fastlane.py',
              'video.audiobook_studio.manhua_pipeline.core':'video/audiobook_studio/manhua_pipeline/core.py',
              'video.audiobook_studio.manhua_pipeline.kaggle_runner':'video/audiobook_studio/manhua_pipeline/kaggle_runner.py'
          }
          for name,path in srcs.items():
              payload=base64.b64encode(pathlib.Path(path).read_bytes()).decode()
              runner+=(f"m=types.ModuleType({name!r});m.__package__={name.rpartition('.')[0]!r};"
                      f"sys.modules[{name!r}]=m;"
                      f"exec(compile(base64.b64decode({payload!r}),{path!r},'exec'),m.__dict__)\n")
          runner+="""
          base=pathlib.Path('/kaggle/working/private-manhua-smoke')
          base.mkdir(parents=True,exist_ok=True)
          source=base/'episode01.txt'
          source.write_text('The young cultivator opened his eyes as spiritual light gathered around him.',encoding='utf-8')
          core=sys.modules['video.audiobook_studio.manhua_pipeline.core']
          core.create_package(
              story_id='smoke-test-001',title='The Awakening (Technical Test)',
              manuscript=source,episodes={1:source},
              output=base/'MANHUA_STORY_PACKAGE.zip',style='cultivation',
              characters=[{'id':'young-cultivator','name':'Young Cultivator','visual_description':'A young male cultivator with dark straight hair, indigo hanfu robe, clear eyes, slender build'}],
              source_approved=True,image_model_rights_reviewed=True,
              thumbnail_hook='SPIRITUAL AWAKENING',
              scene_briefs={1:['A young cultivator opens his eyes in a moonlit cultivation chamber; luminous spiritual aura gathering around his face, original Chinese fantasy manhua, 16:9']})
          os.environ['MANHUA_INPUT_DIR']=str(base)
          subprocess.run([sys.executable,'-m','pip','install','-q',
                          'qwen-tts','accelerate','soundfile','diffusers',
                          'transformers','safetensors','pillow'],check=True)
          result=sys.modules['video.audiobook_studio.manhua_pipeline.kaggle_runner'].process(
              story_id='smoke-test-001',episode=1,phase='review',quality='fast')
          if result.get('status')!='PRIVATE_REVIEW_GENERATED':
              raise SystemExit('SMOKE_REVIEW_NOT_GENERATED')
          print('MANHUA_SMOKE_GPU_RESULT',result,flush=True)
          """
          (stage/'runner.py').write_text(runner)
          owner=os.environ.get('KAGGLE_USERNAME') or 'aighewieghosa'
          if not re.fullmatch(r'[A-Za-z0-9_-]+',owner):
              raise SystemExit('INVALID_KAGGLE_OWNER')
          meta={'id':owner+'/manhua-smoke-001','title':'Private synthetic 5-second manhua smoke test',
                'code_file':'runner.py','language':'python','kernel_type':'script',
                'is_private':True,'enable_gpu':True,'enable_internet':True,
                'dataset_sources':[],'competition_sources':[],'kernel_sources':[],'model_sources':[]}
          (stage/'kernel-metadata.json').write_text(json.dumps(meta,indent=2))
          print('PRIVATE_KAGGLE_NOTEBOOK',meta['id'])
          PY
          kaggle kernels push -p artifacts/manhua-smoke-direct
          echo "PRIVATE_SMOKE_KAGGLE_JOB_SUBMITTED_NOT_YET_COMPLETE"
      - name: Publication safety
        run: echo "NO_PUBLIC_ARTIFACT_OR_YOUTUBE_UPLOAD; private review only"
