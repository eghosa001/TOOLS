name: CartoonStudio Find More Genuine High-Quality Cast in Modern Blender Studio

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_modern_blender_splash_cast.py
      - .github/workflows/cartoonstudio-modern-studio-cast-audit.yml

permissions:
  contents: read

jobs:
  inspect-authentic-studio-splash:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dogwalk-2025
            splash: blender-4.5-splash.blend
            blender: '4.5.13'
            release: Blender4.5
          - name: singularity-2026
            splash: blender-5.1-splash.blend
            blender: '5.1.2'
            release: Blender5.1
    steps:
      - uses: actions/checkout@v4
      - name: Download actual original artist-created CC-BY character scene from blender.org
        run: |
          curl --fail --location --retry 3 --retry-delay 3 --silent --show-error \
            --max-time 1200 \
            "https://download.blender.org/demo/splash/${{ matrix.splash }}" \
            -o "/tmp/${{ matrix.splash }}"
          test -s "/tmp/${{ matrix.splash }}"
          file "/tmp/${{ matrix.splash }}"
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/${{ matrix.splash }}")
          assert 100_000_000<p.stat().st_size<800_000_000
          print("FIRST_PARTY_CC_BY_SCENE_BYTES",p.stat().st_size)
          PY
      - name: Install matching published Blender binary and verify official checksum
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1000 \
            "https://download.blender.org/release/${{ matrix.release }}/blender-${{ matrix.blender }}-linux-x64.tar.xz" \
            -o /tmp/original-blender.tar.xz
          curl --fail --location --retry 3 --silent --show-error \
            "https://download.blender.org/release/${{ matrix.release }}/blender-${{ matrix.blender }}.sha256" \
            -o /tmp/blender-reference.sha256
          grep "blender-${{ matrix.blender }}-linux-x64.tar.xz" /tmp/blender-reference.sha256 \
            | sed "s|blender-${{ matrix.blender }}-linux-x64.tar.xz|/tmp/original-blender.tar.xz|" \
            > /tmp/blender-verify.sha256
          sha256sum --check /tmp/blender-verify.sha256
          mkdir -p /tmp/real-blender
          tar -xJf /tmp/original-blender.tar.xz -C /tmp/real-blender
          test -x "/tmp/real-blender/blender-${{ matrix.blender }}-linux-x64/blender"
      - name: Inspect actual 3D skeletons and morphs without running any production Python scripts
        run: |
          mkdir -p artifacts/studio-source-audits
          "/tmp/real-blender/blender-${{ matrix.blender }}-linux-x64/blender" \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_modern_blender_splash_cast.py -- \
            "/tmp/${{ matrix.splash }}" \
            "artifacts/studio-source-audits/${{ matrix.name }}.json"
      - name: Publish audit, never make up reusable character counts or run an episode
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-audit-real-modern-${{ matrix.name }}
          path: artifacts/studio-source-audits/*.json
          retention-days: 30
          if-no-files-found: error
