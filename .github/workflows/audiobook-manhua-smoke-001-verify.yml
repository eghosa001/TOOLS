name: Audiobook — verify private Ryan/manhua smoke MP4 and Drive delivery
on:
  push:
    paths:
      - .github/workflows/audiobook-manhua-smoke-001-verify.yml
  workflow_run:
    workflows:
      - "Audiobook — smoke-test-001 private five-second review"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiobook-smoke-test-001-private-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 43
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.DRIVE_OAUTH_CLIENT_JSON }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ vars.AUDIOBOOK_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private inspection utilities
        run: |
          python -m pip install -q kaggle six requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Confirm GPU notebook completion and retrieve PRIVATE files
        run: |
          python - <<'PY'
          import os,pathlib,re,subprocess,time
          account=os.environ.get('KAGGLE_USERNAME') or 'aighewieghosa'
          possible=[account+'/manhua-smoke-001',account+'/private-synthetic-5-second-manhua-smoke-test']
          chosen=None
          for attempt in range(108):
              outputs=[]
              for ref in possible:
                  p=subprocess.run(['kaggle','kernels','status',ref],text=True,capture_output=True,timeout=60)
                  if p.returncode==0:
                      outputs.append((ref,p.stdout+p.stderr))
              if not outputs:
                  if attempt>=3:
                      raise SystemExit('PRIVATE_KAGGLE_KERNEL_STATUS_NOT_ACCESSIBLE')
                  time.sleep(12)
                  continue
              for ref,value in outputs:
                  state=value.upper()
                  if re.search(r'COMPLETE|SUCCEEDED',state):
                      chosen=ref
                      break
                  if re.search(r'\bERROR\b|FAILED|CANCELLED',state):
                      raise SystemExit('KAGGLE_SMOKE_KERNEL_FAILED '+ref)
              if chosen:
                  break
              if attempt%8==0:
                  print('KAGGLE_SMOKE_RENDER_PENDING',attempt,flush=True)
              time.sleep(20)
          if not chosen:
              raise SystemExit('KAGGLE_SMOKE_STILL_NOT_COMPLETE_WITHIN_VERIFICATION_WINDOW')
          out=pathlib.Path('private-review')
          out.mkdir(exist_ok=True)
          r=subprocess.run(['kaggle','kernels','output',chosen,'-p',str(out),'--force'],
                            text=True,capture_output=True,timeout=900)
          if r.returncode:
              raise SystemExit('KAGGLE_SMOKE_PRIVATE_OUTPUT_UNAVAILABLE '+r.stderr[-500:])
          print('KAGGLE_PRIVATE_SMOKE_COMPLETE',chosen)
          PY
      - name: Verify narrator, image, thumbnail, video streams, duration and hashes
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          from PIL import Image
          root=pathlib.Path('private-review')
          video=list(root.rglob('smoke-test-001_ep001_MANHUA_REVIEW.mp4'))
          report=list(root.rglob('MANHUA_REVIEW_REPORT.json'))
          thumb=list(root.rglob('THUMBNAIL_REVIEW.png'))
          panels=list(root.rglob('scene-0000-*.png'))
          if len(video)!=1 or len(report)!=1 or len(thumb)!=1 or not panels:
              raise SystemExit('REQUIRED_SMOKE_MEDIA_MISSING')
          p=video[0]
          j=json.loads(report[0].read_text())
          if j.get('story_id')!='smoke-test-001' or j.get('episode')!=1:
              raise SystemExit('WRONG_STORY_OR_EPISODE')
          if j.get('voice_profile')!='audiobook_ryan_qwen_1p7b_approved_2026_11_06_v1':
              raise SystemExit('RYAN_PROFILE_NOT_VERIFIED')
          if j.get('review_video_sha256')!=hashlib.sha256(p.read_bytes()).hexdigest():
              raise SystemExit('VIDEO_HASH_MISMATCH')
          if j.get('thumbnail_sha256')!=hashlib.sha256(thumb[0].read_bytes()).hexdigest():
              raise SystemExit('THUMBNAIL_HASH_MISMATCH')
          with Image.open(thumb[0]) as im:
              if im.size!=(1280,720):raise SystemExit('THUMBNAIL_WRONG_SIZE')
          with Image.open(panels[0]) as im:
              if im.size!=(1024,576):raise SystemExit('MANHUA_SCENE_WRONG_SIZE')
          probe=subprocess.run(['ffprobe','-v','error','-show_entries',
                'format=duration:stream=codec_type,width,height','-of','json',str(p)],
                text=True,capture_output=True,check=True)
          d=json.loads(probe.stdout)
          kinds=[s['codec_type'] for s in d['streams']]
          if 'video' not in kinds or 'audio' not in kinds:raise SystemExit('AV_STREAM_MISSING')
          if not any(s.get('width')==1920 and s.get('height')==1080 for s in d['streams']):
              raise SystemExit('VIDEO_NOT_16_9_1080P')
          seconds=float(d['format']['duration'])
          if not 3<=seconds<=10:raise SystemExit('SMOKE_DURATION_OUTSIDE_APPROX_FIVE_SECONDS')
          aud=subprocess.run(['ffmpeg','-hide_banner','-i',str(p),'-vn','-af',
                'volumedetect','-f','null','-'],capture_output=True,text=True,timeout=120)
          if 'mean_volume: -inf' in aud.stderr or 'mean_volume:' not in aud.stderr:
              raise SystemExit('AUDIO_IS_SILENT_OR_UNVERIFIED')
          if j.get('ready_for_youtube') is not False or j.get('publicly_published') is not False:
              raise SystemExit('RELEASE_GATE_BROKEN')
          with open('SMOKE_PATHS','w') as f:
              f.write(str(p)+'\n'+str(report[0])+'\n')
          print('ALL_SMOKE_TECHNICAL_CHECKS_PASS',
                {'duration_s':round(seconds,2),'panels':len(panels),
                 'thumbnail':'1280x720','video':'1920x1080',
                 'narrator':'Qwen Ryan','has_audio':True,
                 'private_review_only':True,'sha256':j['review_video_sha256']})
          PY
      - name: Deliver to PRIVATE Google Drive only when separately authorized
        run: |
          set -euo pipefail
          if [ -z "$DRIVE_OAUTH_CLIENT_JSON" ] || [ -z "$DRIVE_REFRESH_TOKEN" ] || [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "DRIVE_OAUTH_NOT_CONFIGURED; private Kaggle output remains available to the account owner"
            exit 0
          fi
          v="$(sed -n '1p' SMOKE_PATHS)"
          r="$(sed -n '2p' SMOKE_PATHS)"
          python -m video.audiobook_studio.drive_review_delivery --video "$v" --report "$r"
          echo "PRIVATE_DRIVE_DELIVERY_DONE"
      - name: Final publication hold
        run: echo "SMOKE_TEST_ONLY; no YouTube upload or public sharing"
