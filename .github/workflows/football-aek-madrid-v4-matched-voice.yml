name: "Football: AEK Madrid V4 matching real-clip Qwen voice"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-aek-madrid-v4-matched-voice.yml'
      - 'video/football_edits/aek_madrid_v4_real_footage_voice.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg sox
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -q 'transformers==4.57.3' 'accelerate==1.12.0' soundfile librosa sox onnxruntime einops 'numpy<2.3'
          python -m pip install -q --no-deps 'qwen-tts==0.1.1'
      - name: Generate real-footage-synced original studio narration
        run: python video/football_edits/aek_madrid_v4_real_footage_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-Madrid-V4-Verified-Real-Match-Qwen17-Ryan-Narration
          path: |
            football_edit_output/aek_madrid_v4_replacement_voice/*_v4_ryan.wav
            football_edit_output/aek_madrid_v4_replacement_voice/voice_manifest_v4.json
          if-no-files-found: error
          retention-days: 15