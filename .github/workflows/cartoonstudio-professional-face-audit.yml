name: CartoonStudio Real Studio Mouth Rig Bone Test

on:
  workflow_dispatch:
  push:
    paths:
      - video/test_real_studio_face_bones.py
      - .github/workflows/cartoonstudio-professional-face-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-artist-face-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 40226616719
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-verified-professional-cat-dog-glb
          path: artifacts/original-actors
      - name: Install Blender with mesh evaluation and proper imported shape deformation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Measure actual mouth bone motion on authentic Cat model without any render
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/test_real_studio_face_bones.py -- \
            artifacts/original-actors/verified-professional-pets/cat-professional.glb \
            artifacts/face-check/cat-real-mouth-audit.json
      - name: Measure actual mouth bone motion on authentic Dog model without any render
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/test_real_studio_face_bones.py -- \
            artifacts/original-actors/verified-professional-pets/dog-professional.glb \
            artifacts/face-check/dog-real-mouth-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-actual-bone-mouth-movement-evidence
          path: artifacts/face-check/*.json
          retention-days: 30
          if-no-files-found: error
