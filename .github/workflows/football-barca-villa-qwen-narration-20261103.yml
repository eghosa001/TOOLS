name: 'Football: actual Qwen3 Ryan Barcelona Aston Villa historical preview narration'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-barca-villa-qwen-narration-20261103.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-natural-qwen-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine CPU Qwen3 TTS
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -q --disable-pip-version-check 'transformers==4.57.3' 'accelerate==1.12.0' soundfile librosa sox onnxruntime einops
          python -m pip install -q --no-deps 'qwen-tts==0.1.1'
          python -c 'import torch,qwen_tts; print("QWEN_TTS_IMPORT_OK",torch.__version__)'
      - name: Generate historically verified original voice, no substitute
        run: |
          set -euo pipefail
          python video/football_edits/qwen_barca_villa_voice_20261103.py
      - name: Preserve actual voice evidence
        uses: actions/upload-artifact@v4
        with:
          name: Barcelona-Villa-Actual-Qwen3-Ryan-Voice
          path: football_edit_output/qwen_barca_villa_20261103/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish Qwen audio as private editorial review candidate via repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='football-barca-villa-qwen-h2h-20261103'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" football_edit_output/qwen_barca_villa_20261103/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" football_edit_output/qwen_barca_villa_20261103/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Barcelona v Aston Villa verified H2H | actual Qwen3 Ryan voice only' --notes 'Original actual Qwen3 CustomVoice Ryan narration. Audio only, not a delivered football video. Do not publish without real footage and rights review.' --prerelease --latest=false
          fi
