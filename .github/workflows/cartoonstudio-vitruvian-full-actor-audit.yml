name: CartoonStudio Verify Original High-Detail CC0 Face with Rigged Body (No Episode)

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_vitruvian_complete_actor.py
      - .github/workflows/cartoonstudio-vitruvian-full-actor-audit.yml

permissions:
  contents: read

jobs:
  verify-real-matched-body-and-face:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned actual Vitruvian CC0 face and original linked rigged body without redistribution
        run: |
          mkdir -p artifacts/licensed-originals
          for model in vitruvian_head vitruvian_body; do
            curl --fail --location --retry 3 --silent --show-error --max-time 300 \
              "https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/$model.glb" \
              -o "artifacts/licensed-originals/$model.glb"
            test "$(stat -c '%s' "artifacts/licensed-originals/$model.glb")" -gt 1000000
            sha256sum "artifacts/licensed-originals/$model.glb"
          done
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/NOTICE.md \
            -o artifacts/licensed-originals/NOTICE.md
          grep -F 'Character assets — CC0' artifacts/licensed-originals/NOTICE.md
      - name: Install Blender glTF native evaluation for genuine original head and matching body
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Audit original body bones and skin; original moving facial visemes; actual non-episode render images
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_vitruvian_complete_actor.py -- \
            artifacts/licensed-originals/vitruvian_head.glb \
            artifacts/licensed-originals/vitruvian_body.glb \
            artifacts/full-actor-body-screen
      - name: Require actual original 3D evidence without any story/canon/full-video changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/full-actor-body-screen')
          info=json.loads((root/'full-body-source-and-quality-evidence.json').read_text())
          assert info['total_skin_vertex_count']>2000
          assert info['existing_body_armatures']
          assert sum(1 for v in info['face_morphs_after_full_body_import'].values() if v['real_world_deformation'])>=4
          assert not info['actor_ready_for_episode']
          assert not info['episode_preview_mp4_rendered']
          assert not info['original_glbs_repackaged_for_redistribution']
          assert (root/'vitruvian-original-head-body-neutral-review.png').stat().st_size>5000
          assert (root/'vitruvian-original-head-body-mouth-open-review.png').stat().st_size>5000
          assert not list(Path('artifacts').rglob('*.mp4'))
          print('MATCHED_REAL_CHARACTER_BODY_AND_FACE_GEOMETRY_SCREEN_PASS')
          print('ACTOR_NOT_CANON_APPROVED',not info['user_cast_identity_approved'])
          print('ORIGINAL_MOVIE_STORY_UNMODIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoonstudio-matched-cc0-face-and-original-body-geometry-review-no-mp4
          path: |
            artifacts/full-actor-body-screen/**
            artifacts/licensed-originals/NOTICE.md
          if-no-files-found: warn
          retention-days: 30
