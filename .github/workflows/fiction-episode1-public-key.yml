name: Fiction — protected manuscript transfer public key
on:
  push:
    branches: [main]
    paths: [".github/workflows/fiction-episode1-public-key.yml"]
permissions:
  contents: read
jobs:
  publish-public-transport-key:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q cryptography
      - name: Emit public transport key ONLY
        shell: bash
        run: |
          python - <<'PY'
          import base64,os
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          token=os.environ.get("KAGGLE_API_TOKEN","")
          if len(token)<24:raise RuntimeError("Kaggle authentication secret missing or too short")
          seed=HKDF(algorithm=hashes.SHA256(),length=32,salt=b"fiction-studio-2026-private-transport-v1",info=b"first-episode-transfer-key").derive(token.encode())
          private=X25519PrivateKey.from_private_bytes(seed)
          pub=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          print("FICTION_EPISODE1_TRANSPORT_PUBLIC_KEY="+base64.b64encode(pub).decode())
          print("NO_PRIVATE_KEY_OR_MANUSCRIPT_EXPORTED")
          PY
