name: "Titanic — one continuous 86-minute fifteen-chapter source-first editor review"
on:
  workflow_dispatch:
    inputs:
      new_chapters_run_id:
        description: "Exact successful 5-chapter source-first run (no automatic shot selection)"
        required: true
        default: "40757194391"
permissions:
  contents: read
  actions: read
jobs:
  complete-review-master:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact ten existing + five new manually directed chapter MP4s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIVE_RUN: ${{ inputs.new_chapters_run_id }}
        run: |
          set -euo pipefail
          base=video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair
          mkdir -p "$base/partial_master_sources" /tmp/titanic_all_fifteen
          gh run download 40679010934 --repo "${{ github.repository }}" --name Titanic-2026-Opening-Chapter01-10-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c01
          gh run download 40674982026 --repo "${{ github.repository }}" --name Titanic-2026-Belfast-Chapter02-12-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c02
          gh run download 40661918722 --repo "${{ github.repository }}" --name Titanic-2026-Passengers-Chapter03-11-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c03
          gh run download 40676321226 --repo "${{ github.repository }}" --name Titanic-2026-Lifeboats-Chapter04-11-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c04
          gh run download 40680238875 --repo "${{ github.repository }}" --name Titanic-2026-IceWarnings-Chapter05-10-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c05
          gh run download 40679789241 --repo "${{ github.repository }}" --name Titanic-2026-Wireless-Chapter08-14-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c08
          gh run download 40748760387 --repo "${{ github.repository }}" --name Titanic-2026-Evacuation-Chapter09-16-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c09
          gh run download 40750016581 --repo "${{ github.repository }}" --name Titanic-2026-Survival-Chapter10-15-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c10
          gh run download 40659379378 --repo "${{ github.repository }}" --name Titanic-2026-Rescue-Chapter12-16-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c12
          gh run download 40660158841 --repo "${{ github.repository }}" --name Titanic-2026-Inquiry-Chapter13-12-Authentic-Sources-1080p-REVIEW --dir /tmp/titanic_all_fifteen/c13
          for ch in 6 7 11 14 15; do
            gh run download "$FIVE_RUN" --repo "${{ github.repository }}" --name "Titanic-2026-Chapter$ch-Exact-Audio-Shot-Review" --dir "/tmp/titanic_all_fifteen/new$ch"
          done
          for ch in $(seq 1 15); do
            n=TITANIC_CHAPTER$(printf '%02d' "$ch")_AUTHENTIC_FIRST_1080p_REVIEW.mp4
            file=$(find /tmp/titanic_all_fifteen -type f -name "$n" -print -quit)
            test -n "$file" && test -s "$file"
            cp "$file" "$base/partial_master_sources/$n"
            echo "FIXED_EDITOR_CHAPTER_OBTAINED $ch $n"
          done
          gh run download 40650071315 --repo "${{ github.repository }}" --name Titanic-2026-Original-Scored-86Minute-1080p-FILM-REVIEW --dir /tmp/titanic_all_fifteen/score
          s=$(find /tmp/titanic_all_fifteen/score -type f -name TITANIC_15CHAPTERS_1080P_24FPS_ORIGINAL_SCORE_REVIEW.mp4 -print -quit)
          test -n "$s" && test -s "$s"
          cp "$s" "$base/partial_master_sources/"
          gh run download 40644694317 --repo "${{ github.repository }}" --name Titanic-2026-302-Silence-Aligned-Shot-Map-REVIEW --dir "$base"
          test -s "$base/TIMED_SHOTS_REVIEW.json"
      - name: Install FFmpeg and create one fixed-source continuous film with original audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Assemble immutable 15 fixed chapter order, preserve original score and verify full decode
        timeout-minutes: 65
        run: |
          python -u video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/assemble_all_fifteen_manually_directed_review.py
      - name: Verify technical export is real but NEVER auto-grant release or YouTube upload approval
        run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path("video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/all_15_source_first_editor_review")
          x=json.loads((d/"FINAL_TECHNICAL_NOT_EDITORIAL_QA.json").read_text())
          assert x["chapters"]==15 and x["original_shots"]==302
          assert x["continuous_movie"] and x["video_decode"]=="PASS"
          assert x["original_narration_and_score_preserved"]
          assert x["full_repository_302_shot_source_first_gate"]=="FAIL"
          assert not x["approved_for_publication"] and not x["youtube_private_draft_uploaded"]
          assert (d/x["master_name"]).stat().st_size>100_000_000
          print("FIFTEEN_CHAPTERS_CONTINUOUS_MASTER_TECHNICALLY_VERIFIED_RELEASE_STILL_BLOCKED",x["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Titanic-2026-Fifteen-Manually-Directed-86Min-Continuous-REVIEW
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/all_15_source_first_editor_review/TITANIC_86MIN_FIFTEEN_MANUALLY_DIRECTED_CHAPTERS_1080P_REVIEW.mp4
            video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair/all_15_source_first_editor_review/FINAL_TECHNICAL_NOT_EDITORIAL_QA.json
