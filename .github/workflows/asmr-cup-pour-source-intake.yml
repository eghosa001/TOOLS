name: ASMR single-video cup-pour footage intake
on:
  pull_request:
    paths:
      - "video/ai_asmr_experiments/stock_first_edit/download_cup_pour.py"
      - ".github/workflows/asmr-cup-pour-source-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -q requests
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m py_compile video/ai_asmr_experiments/stock_first_edit/download_cup_pour.py
      - name: Download and verify free Pexels cup pours
        run: python video/ai_asmr_experiments/stock_first_edit/download_cup_pour.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-cup-pour-licensed-source
          path: /tmp/asmr-cup-pour/
          retention-days: 7
          if-no-files-found: warn
