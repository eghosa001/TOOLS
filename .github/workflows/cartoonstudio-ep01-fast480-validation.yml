name: CartoonStudio E01 Fast480 — Static Preview Safety, No Render

on:
  push:
    paths:
      - "video/episodes/tiny-trails/ep01/render_ep01_fast480.py"
      - "video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_preview.py"
      - "video/episodes/tiny-trails/ep01/test_fast480_kaggle_mount.py"
      - ".github/workflows/cartoonstudio-ep01-fast480-preview.yml"
      - ".github/workflows/cartoonstudio-ep01-fast480-validation.yml"
  pull_request:
    paths:
      - "video/episodes/tiny-trails/ep01/render_ep01_fast480.py"
      - "video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_preview.py"
      - "video/episodes/tiny-trails/ep01/test_fast480_kaggle_mount.py"
      - ".github/workflows/cartoonstudio-ep01-fast480-preview.yml"
      - ".github/workflows/cartoonstudio-ep01-fast480-validation.yml"
permissions:
  contents: read

jobs:
  fast480-no-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile accelerated renderer and Kaggle loader without Blender GPU
        run: |
          python -m py_compile \
            video/episodes/tiny-trails/ep01/render_ep01_fast480.py \
            video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_preview.py
      - name: Exercise extracted read-only private Kaggle mount without GPU or render
        run: python video/episodes/tiny-trails/ep01/test_fast480_kaggle_mount.py
      - name: Validate exact unchanged story, 11 contiguous shots and 15 lines
        run: |
          python video/episodes/tiny-trails/ep01/episode_preflight.py --output /tmp/e01-fast480-story-check
          test ! -e /tmp/e01-fast480-story-check/tiny-trails-ep01-preview-3s.mp4
      - name: Verify Kaggle read-only source is copied to clean writable storage
        run: |
          python - <<'PY'
          import importlib.util,tempfile
          from pathlib import Path
          mod=Path("video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_preview.py")
          spec=importlib.util.spec_from_file_location("fast480_kaggle",mod)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              original=root/"input/datasets/episode-pack"
              story=original/"video/episodes/tiny-trails/ep01/story.json"
              story.parent.mkdir(parents=True)
              story.write_text('{"unchanged":true}',encoding="utf-8")
              dest=root/"working/ep01_source"
              dest.mkdir(parents=True)
              (dest/"obsolete.txt").write_text("stale")
              result=module.prepare_writable_source(original,dest)
              assert result==dest.resolve()
              assert (result/"video/episodes/tiny-trails/ep01/story.json").read_text()=='{"unchanged":true}'
              assert not (dest/"obsolete.txt").exists()
              assert story.read_text()=='{"unchanged":true}'
              assert result!=original
          print("EP01_TESTED_READONLY_INPUT_COPY_AND_NO_STALE_OVERLAY_PASS")
          PY
      - name: Verify explicit 72-frame, 480p, genuine-rig GPU restrictions
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('video/episodes/tiny-trails/ep01')
          renderer=(root/'render_ep01_fast480.py').read_text()
          kaggle=(root/'kaggle_ep01_fast480_preview.py').read_text()
          workflow=Path('.github/workflows/cartoonstudio-ep01-fast480-preview.yml').read_text()
          config=yaml.safe_load(workflow)
          on=config.get('on',config.get(True))
          assert list(on)==['push']
          assert on['push']['branches']==['main']
          assert on['push']['paths']==['video/episodes/tiny-trails/ep01/EP01_FAST480_PREVIEW_REQUEST.txt']
          assert 'CartoonStudio E01 approved Fast480 3s GPU preview' in workflow
          assert 'EP01_FAST480_PREVIEW_APPROVED_72_FRAMES_ONLY' in workflow
          assert 'tiny-trails-ep01-fast480-gpu' in workflow
          assert 'NvidiaTeslaT4' in workflow and 'is_private' in workflow
          assert 'secrets.KAGGLE_API_TOKEN' in workflow
          assert 'kaggle kernels push' in workflow
          assert 'kaggle datasets create' not in workflow
          assert '854,480' in workflow and '1280,720' not in workflow
          assert 'scene.render.resolution_x=854' in renderer and 'scene.render.resolution_y=480' in renderer
          assert 'scene.frame_end=72' in renderer and 'scene.frame_end=72 if' not in renderer
          assert 'scene.cycles.use_adaptive_sampling=True' in renderer
          assert 'scene.render.use_persistent_data=True' in renderer
          assert '"fast":{"samples":12,"threshold":0.08,"max_bounces":2}' in renderer
          assert 'EP01_FAST_480_REQUIRES_CUDA_NO_CPU_OR_EEVEE' in renderer
          assert '"--mode","preview"' in kaggle and '"--preview-profile",FAST_PROFILE' in kaggle
          assert 'PINNED_RENDERER_COMMIT="a39a75ddca2aca2ad1b03eac0aa6ef8c40e04517"' in kaggle
          assert 'render_ep01_fast480.py' in kaggle
          assert 'v[0]["height"])!=(854,480)' in kaggle
          assert 'EP01_MP4_MUST_CONTAIN_EXACTLY_72_DECODED_FRAMES' in kaggle
          assert 'EP01_FAST480_MUST_RENDER_EXACTLY_72_FRAMES' in renderer
          assert "'nb_read_frames'" in workflow
          assert "'24/1'" in workflow
          assert 'def prepare_writable_source' in kaggle
          assert 'shutil.copytree(source,target,symlinks=False)' in kaggle
          assert '"resolution":[854,480]' in kaggle
          assert 'KAGGLE_API_TOKEN' not in kaggle
          authorization=root/'EP01_FAST480_PREVIEW_REQUEST.txt'
          assert authorization.is_file()
          assert '72 frames' in authorization.read_text()
          assert 'full-story render' in authorization.read_text()
          assert 'preview' in authorization.read_text().lower()
          assert 'full_render' not in on
          print('EP01_FAST480_PREVIEW_SAFE_NO_RENDER_AND_NO_MANUAL_STEPS')
          PY
