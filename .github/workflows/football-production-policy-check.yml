name: Football production rules and default tempo validation
on:
  push:
    branches: [main]
    paths:
      - video/football_edits/football_video_defaults.json
      - video/football_edits/production_intake.py
      - video/football_edits/football_audio.py
      - video/football_edits/tests/**
      - video/football_edits/qwen_barca_villa_shot_synced_v4.py
      - video/football_edits/render_barca_villa_shot_synced_v4.py
      - .github/workflows/football-barca-villa-qwen-shot-synced-v4.yml
      - .github/workflows/football-production-policy-check.yml
  pull_request:
    paths:
      - video/football_edits/football_video_defaults.json
      - video/football_edits/production_intake.py
      - video/football_edits/football_audio.py
      - video/football_edits/tests/**
      - video/football_edits/qwen_barca_villa_shot_synced_v4.py
      - video/football_edits/render_barca_villa_shot_synced_v4.py
      - .github/workflows/football-barca-villa-qwen-shot-synced-v4.yml
      - .github/workflows/football-production-policy-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile, validate 1.35 tempo, and run all fail-closed football regression tests
        run: |
          set -euo pipefail
          python -m py_compile video/football_edits/production_intake.py video/football_edits/football_audio.py video/football_edits/qwen_barca_villa_shot_synced_v4.py video/football_edits/render_barca_villa_shot_synced_v4.py
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('video/football_edits')
          d=json.loads((base/'football_video_defaults.json').read_text())
          assert d['audio']['tempo']==1.35
          for f in ('qwen_barca_villa_shot_synced_v4.py','render_barca_villa_shot_synced_v4.py'):
              script=(base/f).read_text()
              assert 'football_video_defaults.json' in script
              assert '1.48x pitch-preserving' not in script
          assert 'push:' not in pathlib.Path('.github/workflows/football-barca-villa-qwen-shot-synced-v4.yml').read_text().split('permissions:')[0]
          print('CANONICAL_135_NO_AUTORENDER_PASSED')
          PY
          python -m json.tool video/football_edits/football_video_defaults.json >/dev/null
          python video/football_edits/football_audio.py --show-defaults
          python -m unittest discover -s video/football_edits/tests -p 'test_football_production_intake.py' -v
      - name: Confirm policy update does not attempt any production
        run: |
          set -euo pipefail
          echo 'All checks run without Qwen synthesis, FFmpeg rendering, YouTube publishing, or media downloads.'
