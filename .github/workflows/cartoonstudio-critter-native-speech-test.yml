name: CartoonStudio Real Critter Talking Face Test — Native Original 3D

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_native_critter_speech.py
      - .github/workflows/cartoonstudio-critter-native-speech-test.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-original-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 40232793948
          name: cartoonstudio-native-singularity-original-studio-creatures
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/original-actors
      - name: Install official 5.1 Blender engine for original artist's character file
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1000 \
            https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          mkdir -p /tmp/artist-blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/artist-blender
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libosmesa6
      - name: Measure actual lip morphs and jaw bone mesh displacement on real Critter
        run: |
          /tmp/artist-blender/blender-5.1.2-linux-x64/blender \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_native_critter_speech.py -- \
            artifacts/original-actors/critter-native-studio.blend \
            artifacts/real-critter-mouth-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-critter-actual-mouth-and-bone-deformation-report
          path: artifacts/real-critter-mouth-evidence/*.json
          retention-days: 30
          if-no-files-found: error
