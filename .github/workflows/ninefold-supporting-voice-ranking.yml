name: Choose one best voice for each Ninefold supporting character
on:
  push:
    branches: [main]
    paths:
      - "video/ninefold_tide/ops/select_supporting_cast_voices.py"
      - ".github/workflows/ninefold-supporting-voice-ranking.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "video/ninefold_tide/ops/select_supporting_cast_voices.py"
      - ".github/workflows/ninefold-supporting-voice-ranking.yml"
permissions:
  contents: read
concurrency:
  group: ninefold-supporting-cast-selection
  cancel-in-progress: false
jobs:
  pick-best:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate selection code
        run: python -m py_compile video/ninefold_tide/ops/select_supporting_cast_voices.py
      - name: Install free open-source voice analysis tools on GitHub runner
        run: |
          python -m pip install -q --disable-pip-version-check kaggle faster-whisper soundfile numpy
          python -m pip install -q --disable-pip-version-check torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve only dedicated private 17-actor Kaggle WAV archive
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python video/ninefold_tide/ops/collect_supporting_cast_kaggle.py \
            --kernel aighewieghosa/ninefold-17-supporting-cast-voices \
            --out /tmp/ninefold-new-cast-input --max-minutes 23
      - name: Compare all 34 audition WAVs and retain best available 17
        env:
          HF_HOME: /tmp/ninefold-voice-hf
          TORCH_HOME: /tmp/ninefold-voice-torch
          OMP_NUM_THREADS: '4'
        run: |
          python video/ninefold_tide/ops/select_supporting_cast_voices.py \
            --archive /tmp/ninefold-new-cast-input/ninefold_17_supporting_cast_UNAPPROVED.zip \
            --out /tmp/ninefold-best-new-voices
      - name: Retain only selected audio archive and internal quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninefold-17-best-supporting-character-voice-references
          path: |
            /tmp/ninefold-best-new-voices/NINEFOLD_17_BEST_SUPPORTING_VOICE_REFERENCES_UNAPPROVED.zip
            /tmp/ninefold-best-new-voices/supporting_cast_selections.json
            /tmp/ninefold-best-new-voices/supporting_cast_all_scores.json
            /tmp/ninefold-new-cast-input/collection_verification.json
          if-no-files-found: warn
          retention-days: 14
