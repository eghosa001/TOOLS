name: "Facts Uncovered — Giza fast media check (no apt)"
on:
  push:
    paths:
      - ".github/workflows/facts-uncovered-giza-fast-media-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only Python imaging libraries
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31" -q
      - name: Retrieve and license-check Giza photos
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          s=importlib.util.spec_from_file_location("giza",Path("video/history_studio/films/giza_hidden_history_2026/produce.py"))
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          a=m.get_assets(["Great Pyramid of Giza","Pyramid of Khufu"],Path("preflight-images"),limit=5)
          assert len(a)>=3
          for item in a:
              print("VERIFIED_CC_MEDIA",item["name"],item["license"],item["source"])
          m.scene_plate("THE SPACE NOBODY HAS ENTERED","Scientists detected a large unknown void above the Grand Gallery.",a[0]["local"],0,0).save("scene_preview_1080p.jpg",quality=89)
          m.scene_plate("THE BIG VOID","A scientific mystery remains unresolved.",a[1]["local"],0,0,True).save("short_preview_1080x1920.jpg",quality=89)
          print("GIZA_MEDIA_READY",len(a))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Giza-Archival-Art-Direction-Preview
          path: |
            scene_preview_1080p.jpg
            short_preview_1080x1920.jpg
          if-no-files-found: error
