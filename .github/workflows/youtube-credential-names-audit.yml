name: "YouTube — check configured credential names (read-only)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-credential-names-audit.yml"
permissions:
  contents: read
jobs:
  names-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report presence only; never use or print values
        shell: bash
        env:
          CHECK_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHECK_YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          CHECK_YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          CHECK_YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CHECK_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          CHECK_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          CHECK_YOUTUBE_ASMR_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ASMR_REFRESH_TOKEN }}
          CHECK_YOUTUBE_ASMR_CHANNEL_ID: ${{ vars.YOUTUBE_ASMR_CHANNEL_ID }}
        run: |
          set -euo pipefail
          {
            echo "## YouTube credentials — configured names only"
            echo "Repository: $GITHUB_REPOSITORY"
            echo
            echo "| Credential name | Status |"
            echo "|---|---|"
            for name in YOUTUBE_API_KEY YOUTUBE_DATA_API_KEY YOUTUBE_OAUTH_CLIENT_JSON YOUTUBE_REFRESH_TOKEN YOUTUBE_OAUTH_CLIENT_ID YOUTUBE_OAUTH_CLIENT_SECRET YOUTUBE_ASMR_REFRESH_TOKEN YOUTUBE_ASMR_CHANNEL_ID; do
              variable="CHECK_${name}"
              if [[ -n "${!variable}" ]]; then
                echo "| ${name} | Present |"
              else
                echo "| ${name} | Missing |"
              fi
            done
          } | tee "$GITHUB_STEP_SUMMARY"
          echo "Only presence was checked. No secret value, token or key was used in an API call."
