name: "Football: Barca Villa authentic critical analysis review cut"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-barca-villa-transformative-cut-20261103.yml"
      - "video/football_edits/render_barca_villa_analysis_20261103.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg, fonts, image utilities and exact-media downloader
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null; fi
          python -m pip install -q yt-dlp pillow numpy
          ffprobe -version | head -1
      - name: Recover previously rendered genuine Qwen3 Ryan original WAV artifact
        uses: actions/download-artifact@v4
        with:
          name: Barcelona-Villa-Actual-Qwen3-Ryan-Voice
          run-id: 41679024281
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: football_edit_output/qwen_barca_villa_20261103
      - name: Fetch actual October Barcelona match and actual 2026 Villa match, no unrelated fallback
        run: |
          set -euo pipefail
          mkdir -p football_edit_source/barca_villa
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          source=Path('football_edit_source/barca_villa')
          selections=[
            ("barca_raphinha_oct31",
               [("https://streamin.link/v/4c51f7e1","Barcelona Alaves Raphinha 41st-minute goal"),
                ("https://v.redd.it/qqr0qhtc1vyh1/DASH_720.mp4","Barcelona Alaves Raphinha opening goal"),
                ("https://v.redd.it/qqr0qhtc1vyh1","Barcelona Alaves Raphinha opening goal")]),
            ("barca_yamal_oct31",
               [("https://streamin.link/v/84a038d5","Barcelona Alaves Yamal 45+1-minute goal"),
                ("https://v.redd.it/aibhpkgffvyh1/DASH_720.mp4","Barcelona Alaves Yamal 64th-minute goal"),
                ("https://v.redd.it/aibhpkgffvyh1","Barcelona Alaves Yamal 64th-minute goal")]),
            ("villa_bournemouth_2026",
               [("https://commons.wikimedia.org/wiki/File:Rayan_scores_his_first_goal_for_AFC_Bournemouth_against_Aston_Villa_in_the_2025-26_Premier_League.webm","Bournemouth Aston Villa February 2026")]),
          ]
          reports=[]
          for key,alternatives in selections:
            last=None
            for url,description in alternatives:
              print('FETCH_SAME_MATCH_ORIGINAL',key,url,flush=True)
              dest=str(source/(key+'.%(ext)s'))
              cmd=['yt-dlp','--no-playlist','--no-warnings','--socket-timeout','12',
                   '--retries','1','--fragment-retries','1',
                   '--max-filesize','150M','--format','bestvideo[height<=1080]+bestaudio/best[height<=1080]/best',
                   '--merge-output-format','mp4','--output',dest,url]
              try:
                proc=subprocess.run(cmd,capture_output=True,text=True,timeout=80)
                files=[f for f in source.glob(key+'.*') if f.suffix.lower() in ('.mp4','.webm','.mkv')]
                last={'id':key,'source_url':url,'description':description,'exit_code':proc.returncode,
                      'files':[(f.name,f.stat().st_size) for f in files],'stderr':proc.stderr[-600:]}
              except subprocess.TimeoutExpired:
                last={'id':key,'source_url':url,'description':description,'exit_code':124,'files':[],
                      'stderr':'Download timed out'}
              print('EXACT_CLIP_RESULT',key,last['exit_code'],last['files'],last['stderr'][-220:],flush=True)
              if last['exit_code']==0 and last['files']:break
            reports.append(last)
                    (source/'source_fetch_audit.json').write_text(json.dumps(reports,indent=2))
          usable={r['id'] for r in reports if r['exit_code']==0 and r['files']}
          if not {'barca_raphinha_oct31','barca_yamal_oct31','villa_bournemouth_2026'}.issubset(usable):
            raise RuntimeError('Critical exact-match footage missing; refuse unrelated fallback or slideshow')
          PY
      - name: Produce real match-action Short with source credit and existing Qwen narration
        run: |
          set -euo pipefail
          python video/football_edits/render_barca_villa_analysis_20261103.py
      - name: Persist actual MP4 as editorial-review artifact, NEVER auto-post unreviewed content
        uses: actions/upload-artifact@v4
        with:
          name: Barcelona-Villa-Transformative-Real-Footage-Qwen-Review
          path: |
            football_edit_output/barca_villa_transformative/*.mp4
            football_edit_output/barca_villa_transformative/*.jpg
            football_edit_output/barca_villa_transformative/*.json
            football_edit_output/barca_villa_transformative/*.md
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
