name: "Football: source actual Villa scoring clip and licensed player portraits"
on:
  push:
    branches: [main]
    paths: [".github/workflows/football-barca-villa-authentic-assets-20261103.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real footage and photo tools
        run: |
          python -m pip install -q yt-dlp Pillow requests
      - name: Download actual Jackson scores-for-Villa highlight
        run: |
          set -euo pipefail
          mkdir -p football_source_verify
          yt-dlp --no-playlist --no-warnings --socket-timeout 16 --retries 1 \
            -f 'bestvideo[height<=1080]+bestaudio/best[height<=1080]/best' \
            --merge-output-format mp4 \
            -o 'football_source_verify/Villa_Jackson_SCORES_vs_Fulham_2026.%(ext)s' \
            'https://x.com/CanalplusFoot/status/2116632450260517357'
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height -of json football_source_verify/Villa_Jackson_SCORES_vs_Fulham_2026.mp4
      - name: Download original camera stills for verified player versus player faceoff
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import urllib.parse,hashlib,requests,json
          dest=Path('football_source_verify')
          players=[
           ("Yamal_2026_REAL","Lamine Yamal Argentina v Spain 19 July 2026-214 (new cropped).jpg",
             "https://commons.wikimedia.org/wiki/File:Lamine_Yamal_Argentina_v_Spain_19_July_2026-214_(new_cropped).jpg","CC BY-SA 4.0","Bryan Berlin"),
           ("Maatsen_2025_REAL","St. Louis City vs Aston Villa (Jul 2025) 06 (Ian Maatsen).jpg",
             "https://commons.wikimedia.org/wiki/File:St._Louis_City_vs_Aston_Villa_(Jul_2025)_06_(Ian_Maatsen).jpg","CC BY 4.0","u/reepers_hellcat"),
           ("Cubarsi_2025_REAL","Pau Cubarsí.jpg",
             "https://commons.wikimedia.org/wiki/File:Pau_Cubars%C3%AD.jpg","CC BY 4.0","Biso"),
          ]
          results=[]
          for label,name,page,license,creator in players:
            norm=name.replace(" ","_")
            md5=hashlib.md5(norm.encode()).hexdigest()
            direct="https://upload.wikimedia.org/wikipedia/commons/"+md5[0]+"/"+md5[:2]+"/"+urllib.parse.quote(norm)
            special="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+urllib.parse.quote(norm)
            output=None
            for url in [direct,special]:
              try:
                r=requests.get(url,timeout=24,headers={"User-Agent":"FootballFairUseReview/1.0 (editorial source verification)"})
                if r.status_code!=200:raise RuntimeError(f"HTTP {r.status_code}")
                photo=Image.open(BytesIO(r.content)).convert('RGB')
                if min(photo.size)<450:raise RuntimeError("Image too small")
                output=dest/(label+'.jpg');photo.save(output,quality=92)
                print("PHOTO_SUCCESS",label,photo.size,len(r.content),url,flush=True)
                break
              except Exception as e:print("PHOTO_ATTEMPT",label,url,str(e)[:140],flush=True)
            results.append({"name":label,"url":page,"license":license,"creator":creator,
                            "status":"downloaded" if output else "not_available",
                            "width":photo.size[0] if output else None,
                            "height":photo.size[1] if output else None})
          (dest/'portrait_rights.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Barca-Villa-Actual-Jackson-Goal-Player-Portraits
          path: football_source_verify/*
          if-no-files-found: error
          retention-days: 10
          compression-level: 0
