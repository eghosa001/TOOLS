name: "Football: inspect genuine match footage sources for AEK Madrid analysis"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aek-madrid-20261104-footage-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q yt-dlp
      - name: Test accessible original AEK moving footage (not permission assertion)
        run: |
          mkdir -p candidate
          set +e
          yt-dlp --no-playlist --no-warnings --socket-timeout 12 --retries 1 -f 'bv*[height<=720]+ba/b[height<=720]/b' --download-sections '*00:00:10-00:00:34' --force-keyframes-at-cuts --merge-output-format mp4 -o 'candidate/AEK_2026_original_camera.%(ext)s' 'https://www.youtube.com/watch?v=cjyyMkKVvfQ'
          echo "AEK_EXIT=$?"
          yt-dlp --no-playlist --no-warnings --socket-timeout 12 --retries 1 -f 'bv*[height<=720]+ba/b[height<=720]/b' --download-sections '*00:00:14-00:00:38' --force-keyframes-at-cuts --merge-output-format mp4 -o 'candidate/Madrid_2026_club_footage.%(ext)s' 'https://www.youtube.com/@realmadrid/videos'
          echo "MADRID_EXIT=$?"
          ls -lh candidate
          for v in candidate/*.mp4; do test -f "$v" && ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$v"; done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: football-original-club-camera-preflight-20261104
          path: candidate/*
          if-no-files-found: warn
          retention-days: 7