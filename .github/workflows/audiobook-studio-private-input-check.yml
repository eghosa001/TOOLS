name: Audiobook Studio — check private Kaggle source availability
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audiobook-studio-private-input-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-private-input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q kaggle six
      - name: Locate existing approved private input without publishing dataset names
        run: |
          python - <<'PY'
          import csv,io,json,os,subprocess,pathlib
          root=pathlib.Path('artifacts/audiobook-private-source-check')
          root.mkdir(parents=True,exist_ok=True)
          if not os.getenv('KAGGLE_API_TOKEN'):
              raise SystemExit('Kaggle auth is absent')
          p=subprocess.run(['kaggle','datasets','list','--mine','--page-size','100','--csv'],
                           capture_output=True,text=True,timeout=70)
          report={'authentication':True,'dataset_list_status':p.returncode,
                  'matching_private_dataset_count':0,'approved_pipeline_zip_found':False}
          if p.returncode==0:
              rows=list(csv.DictReader(io.StringIO(p.stdout)))
              hits=[r for r in rows if 'audiobook' in str(r.get('ref','')).lower() or 'audiobook' in str(r.get('title','')).lower()]
              report['matching_private_dataset_count']=len(hits)
              for entry in hits:
                  ref=entry.get('ref','')
                  if not ref:continue
                  q=subprocess.run(['kaggle','datasets','files',ref,'--csv'],
                                   capture_output=True,text=True,timeout=70)
                  if q.returncode==0 and 'AUDIOBOOK_STUDIO_QWEN_VIDEO_PIPELINE' in q.stdout:
                      report['approved_pipeline_zip_found']=True
                      break
          else:
              report['listing_error_type']='Kaggle dataset listing unavailable'
          (root/'source_status.json').write_text(json.dumps(report,indent=2))
          print('PRIVATE_SOURCE_INPUT_STATUS',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audiobook-private-input-preflight
          path: artifacts/audiobook-private-source-check/
          if-no-files-found: warn
          retention-days: 7
