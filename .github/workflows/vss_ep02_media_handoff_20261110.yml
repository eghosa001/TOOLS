name: Temporary VSS EP02 Media Handoff
on:
  push:
    paths:
      - '.github/workflows/vss_ep02_media_handoff_20261110.yml'
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Transfer existing finished review files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KdWpuNzrU4I4JXokiW6lLNr1fO/123c94c3-980f-4a6e-926f-739c9e839161.mp4' -o VSS_EP02_FULL_ILLUSTRATED_REVIEW_KOKORO_MICHAEL.mp4
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KdWpuNzrU4I4JXokiW6lLNr1fO/8238b24b-ff92-443b-b37c-95e919010afa.mp3' -o VSS_EP02_FULL_APPROVED_KOKORO_MICHAEL.mp3
          test "$(wc -c < VSS_EP02_FULL_ILLUSTRATED_REVIEW_KOKORO_MICHAEL.mp4)" -eq 64212321
          test "$(wc -c < VSS_EP02_FULL_APPROVED_KOKORO_MICHAEL.mp3)" -eq 19671596
          sha256sum VSS_EP02_FULL_ILLUSTRATED_REVIEW_KOKORO_MICHAEL.mp4 VSS_EP02_FULL_APPROVED_KOKORO_MICHAEL.mp3
      - name: Store one-day private handoff package
        uses: actions/upload-artifact@v4
        with:
          name: vss-ep02-media-handoff
          path: |
            VSS_EP02_FULL_ILLUSTRATED_REVIEW_KOKORO_MICHAEL.mp4
            VSS_EP02_FULL_APPROVED_KOKORO_MICHAEL.mp3
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
