name: Audiobook episode naming policy
on:
  push:
    paths:
      - 'video/audiobook_studio/release_naming.py'
      - 'video/audiobook_studio/mandatory_release_gate.py'
      - 'video/audiobook_studio/tests/test_mandatory_release_gate.py'
      - 'video/audiobook_studio/ALL_RULES_MANDATORY.md'
      - 'video/audiobook_studio/AGENTS.md'
      - 'video/audiobook_studio/tests/test_release_naming.py'
      - 'video/audiobook_studio/EPISODE_NAMING_STANDARD.md'
      - 'video/audiobook_studio/episode_quality_gate.py'
      - 'video/audiobook_studio/tests/test_episode_quality_gate.py'
      - 'video/audiobook_studio/manhua_pipeline/compose_reusable.py'
      - 'video/audiobook_studio/manhua_pipeline/assemble_existing.py'
      - 'video/audiobook_studio/manhua_pipeline/test_music_first.py'
      - 'video/audiobook_studio/EPISODE_TEAM_SCORECARD_8_PLUS_STANDARD.md'
      - 'video/audiobook_studio/EPISODE_TEAM_SCORECARD_TEMPLATE.json'
      - '.github/workflows/audiobook-episode-naming-policy.yml'
  pull_request:
    paths:
      - 'video/audiobook_studio/release_naming.py'
      - 'video/audiobook_studio/mandatory_release_gate.py'
      - 'video/audiobook_studio/tests/test_mandatory_release_gate.py'
      - 'video/audiobook_studio/ALL_RULES_MANDATORY.md'
      - 'video/audiobook_studio/AGENTS.md'
      - 'video/audiobook_studio/tests/test_release_naming.py'
      - 'video/audiobook_studio/EPISODE_NAMING_STANDARD.md'
      - 'video/audiobook_studio/episode_quality_gate.py'
      - 'video/audiobook_studio/tests/test_episode_quality_gate.py'
      - 'video/audiobook_studio/manhua_pipeline/compose_reusable.py'
      - 'video/audiobook_studio/manhua_pipeline/assemble_existing.py'
      - 'video/audiobook_studio/manhua_pipeline/test_music_first.py'
      - 'video/audiobook_studio/EPISODE_TEAM_SCORECARD_8_PLUS_STANDARD.md'
      - 'video/audiobook_studio/EPISODE_TEAM_SCORECARD_TEMPLATE.json'
      - '.github/workflows/audiobook-episode-naming-policy.yml'
permissions:
  contents: read
jobs:
  naming-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test canonical titles, filenames, thumbnails, channel and approvals
        run: python -m unittest discover -s video/audiobook_studio/tests -p 'test_*.py' -v && python -m unittest video.audiobook_studio.manhua_pipeline.test_music_first video.audiobook_studio.manhua_pipeline.test_production_gates -v
