name: Molasses 7m36 - male factual narration for original script
on:
  push:
    branches: [production/molasses-real-7m36-20261105]
    paths:
      - video/history_studio/remakes/molasses_20261105/narrate_original.py
      - .github/workflows/molasses-7m36-male-narration.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  male-history-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install voice editor and licensed male narrator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check "numpy>=1.26,<3" "soundfile>=0.12" "kokoro-onnx>=0.6"
      - name: Fetch free commercial model and Michael voice
        run: |
          mkdir -p model
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -L --fail --retry 4 "$BASE/kokoro-v1.0.onnx" -o model/kokoro-v1.0.onnx
          curl -L --fail --retry 4 "$BASE/voices-v1.0.bin" -o model/voices-v1.0.bin
          test $(stat -c %s model/kokoro-v1.0.onnx) -gt 300000000
      - name: Record narrated existing Molasses documentary with male voice
        run: python video/history_studio/remakes/molasses_20261105/narrate_original.py
      - uses: actions/upload-artifact@v4
        with:
          name: Facts-Molasses-7m36-MALE-MICHAEL-voice-and-timings
          path: |
            delivery/molasses_voice/Molasses_Michael_7m36s_48k.wav
            delivery/molasses_voice/scene_timings.json
            delivery/molasses_voice/subtitles.srt
            delivery/molasses_voice/VOICE_QC.json
          retention-days: 10
          compression-level: 0
          if-no-files-found: error
