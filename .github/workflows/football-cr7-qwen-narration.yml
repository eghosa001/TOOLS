name: 'Football: authentic natural Qwen voice for Ronaldo tactical short'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-cr7-qwen-narration.yml'
      - 'video/football_edits/qwen_ronaldo_voice.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-qwen-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CPU-compatible Qwen3-TTS and sound dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -q --disable-pip-version-check 'transformers==4.57.3' 'accelerate==1.12.0' soundfile librosa sox onnxruntime einops
          python -m pip install -q --no-deps 'qwen-tts==0.1.1'
          python -c 'import torch,qwen_tts; print("QWEN_TTS_IMPORT_OK",torch.__version__)'
      - name: Synthesize original tactical script with Qwen3 voice Ryan
        run: |
          set -euo pipefail
          python video/football_edits/qwen_ronaldo_voice.py
      - name: Publish downloadable Qwen WAV (NOT YouTube upload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='football-cr7-natural-qwen-voice-20261103'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" football_edit_output/qwen/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" football_edit_output/qwen/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Ronaldo edit: natural Qwen3 Ryan narration (editorial review)' --notes 'Actual Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice English Ryan voice, original tactical analysis. No fallback voices. Voice only, not a completed video or YouTube publication.' --prerelease --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,url --jq '.url, (.assets[] | [.name,.size,.url] | @tsv)'
