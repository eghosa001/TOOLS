name: CartoonStudio Studio Actor Native Library Portability Check

on:
  workflow_dispatch:
  push:
    paths:
      - video/verify_saved_native_studio_actor.py
      - .github/workflows/cartoonstudio-native-rig-portability.yml

permissions:
  contents: read
  actions: read

jobs:
  check-actual-original-character-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve actual already-rendered native artist-rig library
        uses: actions/download-artifact@v4
        with:
          run-id: 40232639258
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-artist-original-materials-dogwalk-native
          path: artifacts/native-actors
      - name: Install matching Blender 4.5.13 for native scene reimport
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1000 \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          mkdir -p /tmp/binary
          tar -xJf /tmp/blender.tar.xz -C /tmp/binary
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libosmesa6
      - name: Open and append Pinda and Chocomel from extracted native rig libraries in a fresh Blender process
        run: |
          for name in pinda chocomel; do
            /tmp/binary/blender-4.5.13-linux-x64/blender \
              -b -t 2 --disable-autoexec --python-exit-code 1 \
              --python video/verify_saved_native_studio_actor.py -- \
              "artifacts/native-actors/${name}-native-studio.blend" \
              "artifacts/native-actor-verified/${name}.json"
          done
      - name: Upload truthful self-contained Blender actor rig portability report
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-dogwalk-real-native-rig-portability
          path: artifacts/native-actor-verified/*.json
          retention-days: 30
          if-no-files-found: error
