name: CartoonStudio Story Preflight

on:
  push:
    paths:
      - video/story.json
      - video/kaggle_actions_runner.py
      - video/cartoonstudio_source_patch.py
      - video/cartoonstudio_preflight.py
      - video/CartoonStudio-Kaggle-HighQuality.ipynb
      - .github/workflows/cartoonstudio-preflight.yml
      - .github/workflows/cartoonstudio-kaggle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate story and patched embedded CartoonStudio parser (no Kaggle GPU)
        run: python video/cartoonstudio_preflight.py
