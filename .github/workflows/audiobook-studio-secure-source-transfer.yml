name: Audiobook Studio — transfer approved source privately and render Chapter 1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audiobook-studio-secure-source-transfer.yml"
      - "video/audiobook_studio/private_transfer/READY.json"

permissions:
  contents: read

jobs:
  sealed-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q --disable-pip-version-check cryptography kaggle six
      - name: Verify encrypted archive and create private Kaggle dataset
        shell: bash
        run: |
          python - <<'PY'
          import os,json,hashlib,base64,pathlib,subprocess,sys
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          token=os.environ.get('KAGGLE_API_TOKEN','')
          if len(token)<20:raise SystemExit('Private Kaggle credential missing')
          # Derive a stable per-repository transfer recipient without exposing the credential.
          seed=hashlib.sha256(b'audiobook-private-source-recipient-v1:'+token.encode()).digest()
          key=X25519PrivateKey.from_private_bytes(seed)
          from cryptography.hazmat.primitives import serialization
          public=key.public_key().public_bytes(encoding=serialization.Encoding.Raw,format=serialization.PublicFormat.Raw)
          print('AUDIOBOOK_SECURE_TRANSFER_RECIPIENT_PUBLIC_KEY',base64.b64encode(public).decode(),flush=True)
          root=pathlib.Path('video/audiobook_studio/private_transfer')
          marker=root/'READY.json'
          if not marker.is_file():
              print('RECIPIENT_READY_WAITING_FOR_SEALED_SOURCE; no manuscript or credential exposed',flush=True)
              sys.exit(0)
          config=json.loads(marker.read_text(encoding='utf-8'))
          if config.get('version')!=1 or config.get('cipher')!='x25519-chacha20poly1305-v1':
              raise SystemExit('Unsupported encrypted transfer version')
          parts=config.get('parts',[])
          if not 1<=len(parts)<=20:raise SystemExit('Invalid encrypted input parts')
          encoded=b''
          for filename in parts:
              if '/' in filename or '..' in filename or not filename.startswith('sealed_part_'):
                  raise SystemExit('Invalid encrypted part')
              encoded+=(root/filename).read_bytes().strip()
          blob=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(blob).hexdigest()!=config.get('encrypted_sha256'):
              raise SystemExit('Encrypted payload checksum mismatch')
          if len(blob)<64 or len(blob)>20000000:
              raise SystemExit('Encrypted payload size invalid')
          e_pub=X25519PublicKey.from_public_bytes(blob[:32]);nonce=blob[32:44]
          shared=key.exchange(e_pub)
          session=HKDF(algorithm=hashes.SHA256(),length=32,salt=None,info=b'AUDIOBOOK_STUDIO_PRIVATE_SOURCE_V1').derive(shared)
          plain=ChaCha20Poly1305(session).decrypt(nonce,blob[44:],b'AUDIOBOOK_STUDIO_ORIGINAL_FICTION_V1')
          if hashlib.sha256(plain).hexdigest()!=config.get('archive_sha256'):
              raise SystemExit('Decrypted source checksum mismatch')
          if not plain.startswith(b'PK') or len(plain)>10000000:
              raise SystemExit('Source archive type/size invalid')
          owner=os.environ['KAGGLE_USERNAME'].strip()
          ref=owner+'/audiobook-studio-private-source'
          stage=pathlib.Path('/tmp/audiobook-authorized-private-source')
          stage.mkdir(parents=True,exist_ok=True)
          (stage/'AUDIOBOOK_STUDIO_QWEN_VIDEO_PIPELINE_2026-11-06.zip').write_bytes(plain)
          metadata={'title':'Audiobook Studio Private Approved Narration Source',
                    'id':ref,'licenses':[{'name':'other'}],
                    'subtitle':'Unpublished original fiction and approved narrator references (PRIVATE)',
                    'isPrivate':True}
          (stage/'dataset-metadata.json').write_text(json.dumps(metadata))
          check=subprocess.run(['kaggle','datasets','files',ref,'--csv'],capture_output=True,text=True,timeout=90)
          if check.returncode==0:
              operation=['kaggle','datasets','version','-p',str(stage),'-m','Owner-approved Ryan voice source update']
          else:
              operation=['kaggle','datasets','create','-p',str(stage)]
          result=subprocess.run(operation,capture_output=True,text=True,timeout=480)
          if result.returncode!=0:
              print('PRIVATE_KAGGLE_DATASET_UPLOAD_FAILED',result.stderr[-2500:],flush=True)
              raise SystemExit(1)
          verify=subprocess.run(['kaggle','datasets','files',ref,'--csv'],capture_output=True,text=True,timeout=90)
          if verify.returncode!=0 or 'AUDIOBOOK_STUDIO_QWEN_VIDEO_PIPELINE_2026-11-06.zip' not in verify.stdout:
              raise SystemExit('PRIVATE_SOURCE_UPLOAD_NOT_VERIFIED')
          print('PRIVATE_SOURCE_VERIFIED_IN_KAGGLE',ref,'sha256',config['archive_sha256'],flush=True)

          # Start the real full-chapter GPU renderer, keeping all draft outputs private on Kaggle.
          runner=pathlib.Path('video/audiobook_studio/kaggle_private_chapter_video.py').read_bytes()
          code='import base64\nCONFIG='+repr({'phase':'full','book':1,'chapter':1,'max_images':14})+'\nexec(compile(base64.b64decode('+repr(base64.b64encode(runner).decode())+'),"audiobook_private_video.py","exec"),{"__name__":"__main__","CONFIG":CONFIG})\n'
          job=pathlib.Path('/tmp/audiobook-kaggle-private-chapter')
          job.mkdir(exist_ok=True)
          (job/'runner.py').write_text(code)
          kernel={'id':owner+'/audiobook-studio-production-private',
                  'title':'Audiobook Studio Production Private',
                  'code_file':'runner.py','language':'python','kernel_type':'script',
                  'is_private':True,'enable_gpu':True,'enable_internet':True,
                  'dataset_sources':[ref],'competition_sources':[],
                  'kernel_sources':[],'model_sources':[]}
          (job/'kernel-metadata.json').write_text(json.dumps(kernel,indent=2))
          launch=subprocess.run(['kaggle','kernels','push','-p',str(job)],capture_output=True,text=True,timeout=480)
          if launch.returncode!=0:
              print('GPU_SUBMISSION_FAILED',launch.stderr[-2500:],flush=True)
              raise SystemExit(1)
          print('PRIVATE_CHAPTER_01_GPU_JOB_SUBMITTED')
          print('KAGGLE_PRIVATE_NOTEBOOK','https://www.kaggle.com/code/'+owner+'/audiobook-studio-production-private')
          PY
