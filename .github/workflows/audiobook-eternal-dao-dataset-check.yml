name: Audiobook Eternal Dao private Kaggle source processing diagnosis
on:
  push:
    paths:
      - .github/workflows/audiobook-eternal-dao-dataset-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || 'aighewieghosa' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q kaggle six
      - name: Read private source processing status without downloading manuscript
        run: |
          python - <<'PY'
          import os,subprocess
          ref=os.environ['KAGGLE_USERNAME']+'/eternal-dao-d03-approved-private-manuscript'
          for args in [('kaggle','datasets','status',ref),('kaggle','datasets','files',ref,'--csv')]:
              p=subprocess.run(args,text=True,capture_output=True,timeout=85)
              lines=(p.stdout+'\n'+p.stderr).splitlines()
              safe=[x[:250] for x in lines if 'MANHUA_STORY_PACKAGE' in x or 'status' in x.lower() or 'error' in x.lower() or 'processing' in x.lower() or 'complete' in x.lower() or 'not found' in x.lower()]
              print('PRIVATE_DATASET_DIAG',args[2],p.returncode,safe[:8],'filename_listing',[(x[:180] if args[2]=='files' else x[:120]) for x in lines[:35]],flush=True)
          PY
