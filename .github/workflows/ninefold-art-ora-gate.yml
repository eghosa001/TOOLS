name: Check hand-drawn 2D artist layer readiness for Ninefold
on:
  pull_request:
    paths:
      - "video/ninefold_tide/ops/check_ora_paint_readiness.py"
      - "video/ninefold_tide/ops/tests/test_ora_paint_readiness.py"
      - ".github/workflows/ninefold-art-ora-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tiny Pillow dependency (no TTS or image-generation model)
        run: python -m pip install -q pillow
      - name: Verify empty artist sources and visible puppet guides are rejected
        run: |
          python -m py_compile video/ninefold_tide/ops/check_ora_paint_readiness.py
          python -m unittest discover -s video/ninefold_tide/ops/tests -v
