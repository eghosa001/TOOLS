name: "Facts Uncovered — Giza deliver public MP4s after approved render"
on:
  workflow_run:
    workflows:
      - "FACTS UNCOVERED — Great Pyramid Long Documentary and 7 Shorts"
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  public-download-links:
    if: false # disabled: original V1 visual QC failed; only quality-reviewed V2 should publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download only successful verified final artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name Facts-Uncovered-Giza-Long-Film-1080p-and-Seven-Shorts --dir delivery
          test -s delivery/Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4
          test -s delivery/QC_REPORT.json
          test "$(find delivery -maxdepth 1 -name 'short_*.mp4' | wc -l)" -eq 7
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('delivery')
          s=json.loads((p/'QC_REPORT.json').read_text())
          assert s['chapter_count']==15 and s['short_count']==7
          assert s['verified_video_minutes']>50
          print('PUBLIC_MEDIA_GATED_ON_SUCCESSFUL_QC',s['verified_video_minutes'])
          PY
      - name: Correct source-type caption on the full documentary
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          master="delivery/Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$master" \
            -vf "drawbox=x=0:y=985:w=iw:h=95:color=black@0.86:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='LICENSED SOURCE IMAGE - CONTEXT':x=65:y=1008:fontsize=25:fontcolor=white" \
            -c:v libx264 -preset veryfast -crf 24 -c:a copy -movflags +faststart delivery/corrected_master.mp4
          test "$(stat -c %s delivery/corrected_master.mp4)" -gt 10000000
          mv delivery/corrected_master.mp4 "$master"
      - name: Burn legible mobile captions into all seven vertical Shorts
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          fc-match DejaVuSans >/dev/null 2>&1 || sudo apt-get install -y fonts-dejavu-core
          for n in 01 02 03 04 05 06 07; do
            src="delivery/short_${n}.mp4"
            captions="delivery/short_${n}.srt"
            test -s "$src" && test -s "$captions"
            ffmpeg -hide_banner -loglevel error -y -i "$src" \
              -vf "drawbox=x=0:y=1815:w=iw:h=105:color=black@0.84:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='LICENSED SOURCE IMAGE - CONTEXT':x=65:y=1850:fontsize=24:fontcolor=white,subtitles=${captions}:force_style='FontName=DejaVu Sans,FontSize=20,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=3,Outline=2,Shadow=0,Alignment=2,MarginV=220'" \
              -c:v libx264 -preset veryfast -crf 20 -c:a copy -movflags +faststart "delivery/captioned_${n}.mp4"
            test "$(stat -c %s "delivery/captioned_${n}.mp4")" -gt 1000000
            mv "delivery/captioned_${n}.mp4" "$src"
            echo "CAPTIONED_SHORT_READY $src"
          done
      - name: Create or update public downloadable release for YouTube/Zernio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="facts-uncovered-giza-long-2026"
          notes="Facts Uncovered: Stories & Evidence — Great Pyramid original evidence-led documentary and seven Shorts. Verified historical claims and image attributions are included. Downloadable media only: creating this release does not upload to YouTube."
          files=(delivery/*.mp4 delivery/*.srt delivery/*.jpg delivery/IMAGE_CREDITS.json delivery/CHAPTERS.json delivery/QC_REPORT.json delivery/RESEARCH_BIBLE.md)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Facts Uncovered — Great Pyramid Full Documentary + 7 Shorts" --notes "$notes" --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | [.name, .size, .url] | @tsv)'
