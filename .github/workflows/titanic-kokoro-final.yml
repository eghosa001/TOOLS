# PAUSED: User requires hands-on, scene-by-scene editorial review before any video assembly.
# No scheduled, push-triggered, chained, or manual video generation is permitted until editorial sign-off.
name: Titanic premium Kokoro voice replacement
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  voice:
    if: ${{ false }} # HUMAN_EDITORIAL_APPROVAL_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install freely licensed Kokoro British narration engine
        run: |
          command -v ffmpeg || sudo apt-get install -y ffmpeg
          sudo apt-get install -y espeak-ng
          python -m pip install --disable-pip-version-check "numpy<2" kokoro soundfile Pillow requests
      - name: Locate completed premium edit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$TARGET_RUN" ]; then runid="$TARGET_RUN"; else
            runid=$(gh run list --workflow "titanic-premium-release.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$runid"
          if [ "${{ github.event.workflow_run.name }}" = "Titanic expedited premium recovery — full film + 3 Shorts" ]; then
            artifact="Titanic-Premium-Recovered-Review-Film-and-3-Shorts"
          else
            artifact="Titanic-Premium-Release-Candidate-Review"
          fi
          echo "RUN_ID=$runid" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Download complete premium video, source log, scripts and subtitles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p video/history_studio/episodes/titanic-1912/premium_exports
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$SOURCE_ARTIFACT" --dir video/history_studio/episodes/titanic-1912/premium_exports
      - name: Replace voice shot by shot, preserve subtitle synchronization
        run: python video/history_studio/episodes/titanic-1912/replace_voice_kokoro.py
      - name: Export narrated premium film and license manifest
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-Premium-British-Kokoro-Narration-Review
          path: |
            video/history_studio/episodes/titanic-1912/premium_exports/Titanic_Complete_Story_KOKORO_British_Narrator_1080p.mp4
            video/history_studio/episodes/titanic-1912/premium_exports/Titanic_*_KOKORO_NARRATION.mp4
            video/history_studio/episodes/titanic-1912/premium_exports/KOKORO_VOICE_MANIFEST.json
            video/history_studio/episodes/titanic-1912/premium_exports/Titanic_Complete_Story_1080p.srt
          retention-days: 30
