name: Generate original voices for 17 supporting cast on free Kaggle
on:
  push:
    branches: [main]
    paths:
      - "video/ninefold_tide/audio/cast.json"
      - "video/ninefold_tide/audio/supporting_cast_worker.py"
      - "video/ninefold_tide/audio/kaggle_supporting_cast_20.ipynb"
      - "video/ninefold_tide/ops/launch_supporting_cast_kaggle.py"
      - "video/ninefold_tide/ops/collect_supporting_cast_kaggle.py"
      - ".github/workflows/ninefold-supporting-cast-voices.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ninefold-supporting-voice-casting
  cancel-in-progress: false
jobs:
  submit-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Local source validation; do not spend GPU time on bad code
        run: |
          python -m py_compile video/ninefold_tide/audio/supporting_cast_worker.py \
            video/ninefold_tide/ops/launch_supporting_cast_kaggle.py \
            video/ninefold_tide/ops/collect_supporting_cast_kaggle.py
          python - <<'PY'
          import json
          p="video/ninefold_tide/audio/kaggle_supporting_cast_20.ipynb"
          nb=json.load(open(p))
          for c in nb["cells"]:
              if c["cell_type"]=="code":
                  compile("".join(c["source"]),p,"exec")
          c=json.load(open("video/ninefold_tide/audio/cast.json"))
          assert len(c["characters"])==c["character_count"]==20
          PY
      - name: Install official Kaggle CLI on GitHub hosted runner
        run: python -m pip install -q --disable-pip-version-check kaggle
      - name: Submit one private GPU job without changing any existing notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/launch_supporting_cast_kaggle.py
      - name: Verify 17 additional original voices and 34 actual WAVs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python video/ninefold_tide/ops/collect_supporting_cast_kaggle.py \
            --kernel aighewieghosa/ninefold-17-supporting-cast-voices \
            --out /tmp/ninefold-supporting-cast-audio --max-minutes 24
      - name: Preserve private auditions for internal evaluation, never commit voices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninefold-17-supporting-cast-original-voice-auditions-UNAPPROVED
          path: |
            /tmp/ninefold-supporting-cast-audio/ninefold_17_supporting_cast_UNAPPROVED.zip
            /tmp/ninefold-supporting-cast-audio/collection_verification.json
            /tmp/ninefold-supporting-cast-audio/kaggle_job_status.json
          if-no-files-found: warn
          retention-days: 14
