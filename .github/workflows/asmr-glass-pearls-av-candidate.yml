name: ASMR full real-glass 3D audiovisual audition (not approved)
on:
  push:
    paths:
      - ".github/workflows/asmr-glass-pearls-av-candidate.yml"
      - "video/satisfying_studio/production/crystal_pearls_bake_and_proof.py"
      - "video/satisfying_studio/production/crystal_pearls_foley_mix.py"
      - "video/satisfying_studio/production/crystal_pearls_rigidbody_scene.py"
  pull_request:
    paths:
      - ".github/workflows/asmr-glass-pearls-av-candidate.yml"
      - "video/satisfying_studio/production/crystal_pearls_bake_and_proof.py"
      - "video/satisfying_studio/production/crystal_pearls_foley_mix.py"
      - "video/satisfying_studio/production/crystal_pearls_rigidbody_scene.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blender-full-motion-with-recorded-foley:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASMR_OUT: /tmp/asmr_glass_av_candidate
      ASMR_DEVICE: CPU
      ASMR_EXECUTE_PROOF: "1"
      ASMR_RENDER_FULL_PREVIEW: "1"
      ASMR_PREVIEW_WIDTH: "480"
      ASMR_PREVIEW_HEIGHT: "854"
      ASMR_PREVIEW_CYCLES_SAMPLES: "10"
      ASMR_PROOF_SAMPLES: "8"
      ASMR_SAMPLES: "10"
      ASMR_W: "480"
      ASMR_H: "854"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reuse official verified Blender binaries from GitHub cache
        uses: actions/cache@v4
        with:
          path: /tmp/asmr_tools_cache
          key: blender-4.5.15-linux-x64-official-v1
      - name: Install ffmpeg and official verified Blender, no premium credits
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; }
          python - <<'PY'
          import sys
          sys.path.insert(0,"video/satisfying_studio/production")
          from official_blender import install
          print("OFFICIAL_BLENDER",install("/tmp/asmr_tools_cache"),flush=True)
          PY
          mkdir -p "$ASMR_OUT"
      - name: Fetch authenticated public-domain studio HDRI on the worker only
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,os
          url="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
          with urlopen(Request(url,headers={"User-Agent":"SatisfyingStudio-CC0-Worker/1.0"}),timeout=55) as r:
              data=r.read(4_500_000)
          if not (100_000<len(data)<4_500_000 and data.startswith((b"#?RADIANCE",b"#?RGBE"))):
              raise RuntimeError("Invalid verified Poly Haven HDRI, stop")
          out=Path(os.environ["ASMR_OUT"])
          (out/"studio_small_09_1k.hdr").write_bytes(data)
          (out/"CC0_HDRI_SOURCE.json").write_text(json.dumps({
             "url":url,"license":"CC0",
             "sha256":hashlib.sha256(data).hexdigest()},indent=2)+"\n")
          PY
      - name: Real Bullet bake and all 120 Cycles frames, no animation shortcuts
        run: |
          export ASMR_HDRI_FILE="$ASMR_OUT/studio_small_09_1k.hdr"
          "/tmp/asmr_tools_cache/blender-4.5.15-linux-x64/blender" -b -t 4 \
            --python video/satisfying_studio/production/crystal_pearls_rigidbody_scene.py
          test -s "$ASMR_OUT/MARBLE_PHYSICAL_FOLEY_EVENTS.json"
          test -s "$ASMR_OUT/MARBLE_REAL_PHYSICS_PROOF.json"
          test "$(find "$ASMR_OUT/full_motion_frames" -name 'frame_*.png' | wc -l)" -eq 120
      - name: Get original free recorded CC0 glass hits (no generic synthesized bed)
        run: |
          python video/satisfying_studio/production/crystal_pearls_foley_inventory.py
          test -s "$ASMR_OUT/rubberduck_cc0_original_sfx.zip"
          python video/satisfying_studio/production/crystal_pearls_foley_mix.py
          test -s "$ASMR_OUT/ORIGINAL_RECORDED_CC0_GLASS_FOLEY_UNAPPROVED.wav"
      - name: Encode complete 5-second unique-frame original CGI plus Foley
        run: |
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -framerate 24 -start_number 1 \
            -i "$ASMR_OUT/full_motion_frames/frame_%04d.png" \
            -i "$ASMR_OUT/ORIGINAL_RECORDED_CC0_GLASS_FOLEY_UNAPPROVED.wav" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -r 24 \
            -c:a aac -b:a 256k -ar 48000 \
            -t 5 -movflags +faststart \
            "$ASMR_OUT/GLASS_PEARLS_BLENDER_5S_AV_UNAPPROVED.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error -xerror \
            -i "$ASMR_OUT/GLASS_PEARLS_BLENDER_5S_AV_UNAPPROVED.mp4" -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          root=Path(os.environ["ASMR_OUT"])
          video=root/"GLASS_PEARLS_BLENDER_5S_AV_UNAPPROVED.mp4"
          p=subprocess.run(["ffprobe","-v","error","-count_frames",
             "-show_entries","format=duration:stream=codec_type,width,height,avg_frame_rate,nb_read_frames",
             "-of","json",str(video)],capture_output=True,text=True,check=True,timeout=45)
          data=json.loads(p.stdout)
          v=next(x for x in data["streams"] if x["codec_type"]=="video")
          if (int(v["width"])!=480 or int(v["height"])!=854 or
             int(v["nb_read_frames"])!=120 or
             abs(float(data["format"]["duration"])-5)>.08 or
             not any(x["codec_type"]=="audio" for x in data["streams"])):
              raise RuntimeError("Real 3D audiovisual candidate failed exact mux/frame verification")
          (root/"FULL_AV_ENGINEERING_PROOF_UNAPPROVED.json").write_text(json.dumps({
             "master_sha256":hashlib.sha256(video.read_bytes()).hexdigest(),
             "image_source":"120 distinct original Blender Cycles 3D frames",
             "physics_source":"120-frame native Bullet point cache",
             "audio_source":"recorded rubberduck CC0 glass impacts; exact 9 frame contacts",
             "video_metadata":data,"artistic_approved":False,
             "audio_headphone_approved":False,
             "reason":"Original tactile material/audio pairing and 3D fidelity must be personally reviewed"
          },indent=2)+"\n")
          print("COMPLETE_5S_ORIGINAL_BLENDER_ASMR_REVIEW_CANDIDATE_NOT_APPROVED",
                video,video.stat().st_size,flush=True)
          PY
      - name: Save SMALL review candidate; exclude 120 large PNGs and tool binaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ASMR-GLASS-PEARLS-REAL-5S-AUDIOVISUAL-REVIEW-CANDIDATE
          path: |
            /tmp/asmr_glass_av_candidate/GLASS_PEARLS_BLENDER_5S_AV_UNAPPROVED.mp4
            /tmp/asmr_glass_av_candidate/FULL_AV_ENGINEERING_PROOF_UNAPPROVED.json
            /tmp/asmr_glass_av_candidate/GLASS_FOLEY_CUE_SHEET_NOT_APPROVED.json
            /tmp/asmr_glass_av_candidate/MARBLE_REAL_PHYSICS_PROOF.json
            /tmp/asmr_glass_av_candidate/MARBLE_PHYSICAL_FOLEY_EVENTS.json
            /tmp/asmr_glass_av_candidate/RECORDED_GLASS_CC0_INVENTORY.json
          if-no-files-found: warn
          retention-days: 3
