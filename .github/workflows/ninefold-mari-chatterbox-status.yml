name: Ninefold Mari Chatterbox private Kaggle status (read-only)
on:
  pull_request:
    paths:
      - ".github/workflows/ninefold-mari-chatterbox-status.yml"
      - "video/ninefold_tide/ops/check_mari_chatterbox_status.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q kaggle
      - name: Read only dedicated private Chatterbox notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/check_mari_chatterbox_status.py
