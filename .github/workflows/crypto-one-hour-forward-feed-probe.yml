name: Crypto ETH 1h - inspect public Kraken feed availability
# Automatic research runs paused; use Run workflow when needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'ccxt>=4.4,<5'
      - name: Read public ETH futures candles, funding and order book without keys
        run: python crypto-consensus/probe_one_hour_forward_feeds.py
