name: Ninefold Blender 4.5 — real GPv3 compatibility
on:
  pull_request:
    paths:
      - 'video/ninefold_tide/director/blender45_public_smoke.py'
      - '.github/workflows/ninefold-blender45-real-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'video/ninefold_tide/director/blender45_public_smoke.py'
      - '.github/workflows/ninefold-blender45-real-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-headless-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      VERSION: '4.5.15'
      FILE: blender-4.5.15-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v4
      - name: Verify static source has no user art
        run: |
          python -m py_compile video/ninefold_tide/director/blender45_public_smoke.py
          test ! -e NINEFOLD_2D_GREASE_PENCIL_KAGGLE_TRANSFER_v07.zip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ninefold/blender-4.5.15-linux-x64.tar.xz
          key: blender-4.5.15-linux-x64-verified
      - name: Install verified official free Blender 4.5.15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ninefold"
          cd "$HOME/.cache/ninefold"
          curl -fsSL --retry 3 --max-time 180 "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" -o checksum.list
          grep -E 'blender-4.5.15-linux-x64.tar.xz' checksum.list > checksum.selected
          if [ ! -s checksum.selected ]; then echo "Missing official Blender checksum"; exit 1; fi
          if ! sha256sum --check --status checksum.selected; then
            rm -f "$FILE"
            curl -fSL --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.5/$FILE" -o "$FILE"
            sha256sum --check checksum.selected
          fi
          mkdir -p "$RUNNER_TEMP/ninefold-blender"
          tar -xJf "$FILE" -C "$RUNNER_TEMP/ninefold-blender"
          "$RUNNER_TEMP/ninefold-blender/blender-4.5.15-linux-x64/blender" --version | head -2
      - name: Execute actual headless Blender 4.5 GPv3 scene and CPU render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ninefold-smoke"
          BLENDER="$RUNNER_TEMP/ninefold-blender/blender-4.5.15-linux-x64/blender"
          LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER" --background --factory-startup \
            --python video/ninefold_tide/director/blender45_public_smoke.py \
            -- "$RUNNER_TEMP/ninefold-smoke" 2>&1 | tee "$RUNNER_TEMP/ninefold-smoke/blender.log"
          python - "$RUNNER_TEMP/ninefold-smoke/compatibility_report.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["renders_real_3d_scene"] and p["render_bytes"] > 1000
          assert len(p["grease_pencil"]) == 3
          assert all(a["type"] == "GREASEPENCIL" and a["layers"] == 9 for a in p["grease_pencil"])
          assert not p["user_art_included"] and not p["characters_drawn"] and not p["art_approval"]
          print("REAL_BLENDER45_GP3_COMPATIBILITY_SUCCEEDED_NOT_ART_APPROVED")
          PY
      - name: Retain public synthetic diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender45-ninefold-gp3-synthetic-compatibility
          path: |
            ${{ runner.temp }}/ninefold-smoke/compatibility_report.json
            ${{ runner.temp }}/ninefold-smoke/blender.log
          if-no-files-found: warn
          retention-days: 14
