name: "Football: 720p source-specific AEK Madrid action excerpt review"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/football-aek-madrid-720p-action-review.yml','video/football_edits/aek_madrid_720p_action_review.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q beautifulsoup4 requests
      - name: Extract only short source-specific game sequences for internal editorial review
        run: python video/football_edits/aek_madrid_720p_action_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-Madrid-2026-Relevant-Match-Footage-720p-Editor-Proof
          path: football_edit_output/aek_madrid_2026_action_720p/*
          if-no-files-found: error
          retention-days: 3