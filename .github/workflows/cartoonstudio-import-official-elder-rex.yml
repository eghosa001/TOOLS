name: CartoonStudio Real Free Blender Studio Elder Sprite and Rex Native Rig Imports

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_official_elder_rex.py
      - .github/workflows/cartoonstudio-import-official-elder-rex.yml

permissions:
  contents: read

jobs:
  import-genuine-first-party-character-rigs:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Download TWO verified official free CC-BY published original assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-author-source
          curl --fail --location --retry 3 --silent --show-error --max-time 360 \
            https://studio.blender.org/download-source/files/ae/ae8df61cc1daf7d3d1a2ac41c992f3ca/ae8df61cc1daf7d3d1a2ac41c992f3ca.blend \
            -o /tmp/original-author-source/elder_sprite.blend
          curl --fail --location --retry 3 --silent --show-error --max-time 500 \
            https://studio.blender.org/download-source/files/cb/cb8d453b64a548d03bcee7671f83e599/cb8d453b64a548d03bcee7671f83e599.blend \
            -o /tmp/original-author-source/rex.blend
          test "$(stat -c '%s' /tmp/original-author-source/elder_sprite.blend)" -gt 2000000
          test "$(stat -c '%s' /tmp/original-author-source/rex.blend)" -gt 30000000
          python - <<'PY'
          from pathlib import Path
          for f in (Path('/tmp/original-author-source/elder_sprite.blend'),
                    Path('/tmp/original-author-source/rex.blend')):
              assert f.open('rb').read(7)==b'BLENDER'
              print('GENUINE_FIRST_PARTY_NATIVE_BLENDER_BINARY',f.name,f.stat().st_size)
          PY
          sha256sum /tmp/original-author-source/*.blend
      - name: Install verified compatible native Blender 3.6 LTS from publisher
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1200 \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            -o /tmp/blender-original.tar.xz
          curl --fail --location --retry 3 --silent --show-error \
            https://download.blender.org/release/Blender3.6/blender-3.6.23.sha256 \
            -o /tmp/blender-check.sha256
          grep blender-3.6.23-linux-x64.tar.xz /tmp/blender-check.sha256 \
            | sed 's|blender-3.6.23-linux-x64.tar.xz|/tmp/blender-original.tar.xz|' \
            >/tmp/verify-blender.sha256
          sha256sum --check /tmp/verify-blender.sha256
          mkdir -p /tmp/true-blender36
          tar -xJf /tmp/blender-original.tar.xz -C /tmp/true-blender36
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libosmesa6 libx11-6
      - name: Independently import official Elder Sprite in the author-compatible Blender and measure face morphs
        run: |
          /tmp/true-blender36/blender-3.6.23-linux-x64/blender \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_official_elder_rex.py -- \
            /tmp/original-author-source/elder_sprite.blend artifacts/official-elder-rex-original-rigs elder_sprite
      - name: Independently import official Rex in the same original-compatible Blender and measure face morphs
        run: |
          /tmp/true-blender36/blender-3.6.23-linux-x64/blender \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_official_elder_rex.py -- \
            /tmp/original-author-source/rex.blend artifacts/official-elder-rex-original-rigs rex
      - name: Summarize two real source rigs, without prematurely assigning series identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/official-elder-rex-original-rigs')
          records=[json.loads((root/f'{key}-official-native-character-audit.json').read_text())
                   for key in ('elder_sprite','rex')]
          for r in records:
              assert r['actual_native_blender_project_opened']
              assert r['real_polygon_count']>1000
              assert r['original_armature_count']>=1
              assert not r['full_speaking_role_verified']
              assert not r['episode_rendered']
          (root/'TWO_REAL_OFFICIAL_BLENDER_STUDIO_RIGS_INTAKE.json').write_text(json.dumps({
              'original_rigs_opened':len(records),
              'distinct_source_creatures':[r['identity'] for r in records],
              'nonhuman_source_candidates_only':True,
              'series_cast_approved':False,'character_source_stats':records,
              'kaggle_render_started':False},indent=2)+'\n')
          print('TWO_TRUE_NATIVE_BLENDER_STUDIO_ORIGINAL_CREATURE_RIGS_QA_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoonstudio-first-party-elder-sprite-and-rex-original-rig-qa-no-episode
          path: artifacts/official-elder-rex-original-rigs/*.json
          if-no-files-found: warn
          retention-days: 30
