name: Facts Uncovered - 1906 genuine archival film pilot
on:
  push:
    branches: [production/sf1906-real-archive-20261103]
    paths:
      - 'video/history_studio/productions/sf1906_real/**'
      - '.github/workflows/facts-uncovered-1906-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-archive-film:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and licensed Kokoro narration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "kokoro-onnx>=0.4" "numpy>=1.26,<3" "soundfile>=0.12" "requests>=2.31"
      - name: Obtain licensed model for original narration
        run: |
          set -euo pipefail
          mkdir -p models
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 4 --retry-delay 4 "$BASE/kokoro-v1.0.onnx" -o models/kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 4 "$BASE/voices-v1.0.bin" -o models/voices-v1.0.bin
          test "$(stat -c %s models/kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s models/voices-v1.0.bin)" -gt 25000000
      - name: Produce 1906 San Francisco genuine moving archive documentary
        run: |
          set -euo pipefail
          python video/history_studio/productions/sf1906_real/produce.py \
            --media archive --output delivery \
            --model models/kokoro-v1.0.onnx --voices models/voices-v1.0.bin
      - name: Fail closed on absent real film, invalid rights or bad video export
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          out=Path('delivery')
          qc=json.loads((out/'PREVIEW_QC.json').read_text())
          assert qc['status']=='PREVIEW_NOT_APPROVED_FOR_PUBLICATION',qc
          assert qc['real_film_share']>=.99,qc
          assert qc['shot_count']==8,qc
          film=out/'Facts_Uncovered_1906_REAL_ARCHIVE_PREVIEW.mp4'
          assert film.is_file() and film.stat().st_size>1500000
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(film)]))
          assert float(probe['format']['duration'])>50
          assert any(s.get('width')==1920 and s.get('height')==1080 for s in probe['streams'])
          assert any(s['codec_type']=='audio' for s in probe['streams'])
          digest=hashlib.sha256(film.read_bytes()).hexdigest()
          assert digest==qc['master_sha256']
          print('VERIFIED_REAL_FILM_PREVIEW',film,digest,'seconds',probe['format']['duration'])
          PY
      - name: Deliver MP4, genuine footage provenance, caption SRT and source ledger
        uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-San-Francisco-1906-REAL-FOOTAGE-MP4
          path: |
            delivery/Facts_Uncovered_1906_REAL_ARCHIVE_PREVIEW.mp4
            delivery/1906_real_footage_thumbnail.jpg
            delivery/REAL_ONLY_SOURCE_MANIFEST.json
            delivery/REAL_ONLY_MOTION_MANIFEST.json
            delivery/PREVIEW_QC.json
            delivery/subtitles.srt
            delivery/VIDEO_DESCRIPTION.txt
            delivery/SOURCES_AND_RIGHTS.md
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
