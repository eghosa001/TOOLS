name: CartoonStudio Assemble 15+ Genuine Professional Native 3D Cast Candidates

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CartoonStudio Native Singularity — Seven Genuine Studio Creature Rigs
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  combine-studio-actors:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Download 8 previously verified first-party native Blender Studio actor masters
        uses: actions/download-artifact@v4
        with:
          run-id: 40230434307
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-eight-original-blender-studio-rig-masters
          path: artifacts/hq-8
      - name: Download real high-fidelity DOGWALK actor files and image QC
        uses: actions/download-artifact@v4
        with:
          run-id: 40232639258
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-artist-original-materials-dogwalk-native
          path: artifacts/hq-dogwalk
      - name: Download newly audited author-created Singularity native characters
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || 40232793948 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-native-singularity-original-studio-creatures
          path: artifacts/hq-singularity
      - name: Assemble at least fifteen truly different original rigged actor sources
        run: |
          python video/assemble_professional_candidate_library.py \
            --eight artifacts/hq-8 \
            --dogwalk artifacts/hq-dogwalk \
            --singularity artifacts/hq-singularity \
            --output artifacts/high-quality-native-library
      - name: Create an actual-render contact sheet for choosing candidate designs
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import json,math
          from pathlib import Path
          root=Path('artifacts/high-quality-native-library')
          manifest=json.loads((root/'PROFESSIONAL_REUSABLE_CAST_CANDIDATES.json').read_text())
          samples=[(k,root/v['preview_file']) for k,v in manifest['models'].items() if 'preview_file' in v]
          assert len(samples)>=7,'Studio-native stills are missing'
          cols=4
          w,h=320,430
          rows=math.ceil(len(samples)/cols)
          image=Image.new('RGB',(cols*w,rows*h+75),(236,241,245))
          draw=ImageDraw.Draw(image)
          draw.text((18,16),'CartoonStudio: Original Blender Studio characters • Review, not approved',
                    fill=(25,37,51))
          try:font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          except OSError:font=ImageFont.load_default()
          for i,(key,path) in enumerate(samples):
              x=(i%cols)*w
              y=(i//cols)*h+60
              src=Image.open(path).convert('RGB')
              src.thumbnail((w-16,h-50))
              image.paste(src,(x+(w-src.width)//2,y))
              draw.text((x+15,y+h-35),key+' • Studio CC BY',font=font,fill=(25,37,51))
          image.save(root/'NATIVE_STUDIO_CAST_VISUAL_REVIEW.jpg',quality=92)
          print('REAL_MODEL_CONTACT_SHEET',len(samples),image.size)
          PY
      - name: Upload actual 3D asset library and visual reference board; never submit any episode
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-15plus-licensed-professional-original-rig-candidates
          path: artifacts/high-quality-native-library/**
          retention-days: 30
          if-no-files-found: error
