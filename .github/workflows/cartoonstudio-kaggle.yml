name: CartoonStudio Kaggle Render

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: "Render a short preview first; select full only after reviewing it"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - full
      confirm_full_render:
        description: "Required confirmation when render_mode is full"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cartoonstudio-kaggle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Check out TOOLS repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Submit, monitor, and retrieve the render
        run: >-
          python video/kaggle_actions_runner.py
          --mode "${{ inputs.render_mode }}"
          --confirm-full "${{ inputs.confirm_full_render }}"
          --notebook video/CartoonStudio-Kaggle-HighQuality.ipynb
          --story video/story.json
          --output artifacts/cartoonstudio
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-video
          path: artifacts/cartoonstudio/**/*.mp4
          if-no-files-found: error
          retention-days: 14
