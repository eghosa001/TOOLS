name: "BLOCKED LEGACY — CartoonStudio Kaggle Low-Detail Render"

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: "Render a short preview first; select full only after reviewing it"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - full
      confirm_full_render:
        description: "Required confirmation when render_mode is full"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cartoonstudio-kaggle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Check out TOOLS repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: BLOCK REJECTED LEGACY CAST - professional-asset quality gate
        run: |
          if [ ! -f video/professional-cast-approved.json ]; then
            echo "::error::CartoonStudio legacy procedural characters are NOT approved. No render: missing the 15-character high-quality approved asset manifest. This manual workflow cannot submit an old low-detail episode to Kaggle."
            exit 1
          fi
          if [ ! -d video/professional-approved-assets ]; then
            echo "::error::Professional 3D character assets are not mounted in this run. Never fall back to clay/low-poly rigs."
            exit 1
          fi
          python video/verify_professional_cast_mapping.py \
            --manifest video/professional-cast-approved.json \
            --models video/professional-approved-assets
      - name: Preflight story with embedded CartoonStudio parser (no GPU)
        run: python video/cartoonstudio_preflight.py
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Submit, monitor, and retrieve the render
        run: >-
          python video/kaggle_actions_runner.py
          --mode "${{ inputs.render_mode }}"
          --confirm-full "${{ inputs.confirm_full_render }}"
          --notebook video/CartoonStudio-Kaggle-HighQuality.ipynb
          --story video/story.json
          --output artifacts/cartoonstudio
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-video
          path: artifacts/cartoonstudio/**/*.mp4
          if-no-files-found: error
          retention-days: 14
