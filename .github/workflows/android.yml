name: Android ReadAloud CI
concurrency:
  group: readaloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint, debug APK and unsigned release bundle
        run: gradle :apps:readaloud:testDebugUnitTest :apps:readaloud:lintDebug :apps:readaloud:assembleDebug :apps:readaloud:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: readaloud-debug-apk
          path: apps/readaloud/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: readaloud-unsigned-release-aab
          path: apps/readaloud/build/outputs/bundle/release/*.aab
          retention-days: 14

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install compilation SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Functional Android document import tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: ./gradlew :apps:readaloud:connectedDebugAndroidTest --stacktrace
