name: Audiobook - one approved full-color Kokoro pipeline
on:
  push:
    paths:
      - 'video/audiobook_studio/**'
      - '.github/workflows/manhua-color-first-tests.yml'
  pull_request:
    paths:
      - 'video/audiobook_studio/**'
      - '.github/workflows/manhua-color-first-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test actual full-color pixels and exact source coverage
        run: |
          python -m pip install --disable-pip-version-check -q pillow
          python -m unittest video.audiobook_studio.manhua_pipeline.test_color_panel_policy video.audiobook_studio.manhua_pipeline.test_kokoro_scene_locked -v
          python -m py_compile video/audiobook_studio/manhua_pipeline/assemble_existing.py video/audiobook_studio/manhua_pipeline/kokoro_cpu_episode.py
      - name: Fail closed if old mandatory production instructions return
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('video/audiobook_studio')
          docs=[(p/'AGENTS.md').read_text(),(p/'manhua_pipeline/README.md').read_text(),(p/'manhua_pipeline/QUALITY_GATES.md').read_text()]
          assert all('Kokoro Michael' in t for t in docs)
          assert all('FULL-COLOR' in t or 'full-color' in t for t in docs)
          assert 'default="full_color_panels"' in (p/'manhua_pipeline/assemble_existing.py').read_text()
          assert not (p/'FULL_STORY_ILLUSTRATIONS_FIRST.md').exists()
          assert not (p/'manhua_pipeline/kaggle_runner.py').exists()
          assert not (p/'manhua_pipeline/dual_gpu_dispatch.py').exists()
          print('CURRENT_OWNER_PIPELINE_IS_ONLY_ACTIVE_PATH')
          PY
