name: Fast 3D Short - existing rig and animation compatibility
on:
  push:
    branches: [feat/3d-motion-and-fast-short-20261103]
    paths:
      - "video/shorts3d/ready_motion/**"
      - "video/shorts3d/godot/ready_motion/**"
      - ".github/workflows/shorts3d-real-motion-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rig-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve real castle, knight and animation GLBs and inspect skeletons
        run: python video/shorts3d/ready_motion/inspect_and_stage.py
      - name: Install Godot 4.7.2 for native rig compatibility test
        run: |
          curl --fail --location --retry 3 --silent --show-error -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import all three modern KayKit animation libraries into actual 3D scene
        run: |
          mkdir -p video/shorts3d/godot/assets
          cp video/shorts3d/ready_motion/stage_assets/*.glb video/shorts3d/godot/assets/
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path video/shorts3d/godot --editor --quit
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path video/shorts3d/godot --script res://ready_motion/rig_probe.gd
      - name: Save exact reusable GLBs and rig validation report
        uses: actions/upload-artifact@v4
        with:
          name: original-cc0-castle-knight-motion-rig
          path: video/shorts3d/ready_motion/stage_assets/
          retention-days: 30
          compression-level: 3
          if-no-files-found: error
