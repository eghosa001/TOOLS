name: "Football: authentic AEK Athens home-stadium picture"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-aek-home-stadium-photo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pillow requests
      - name: Fetch original CC BY-SA photograph of AEK's Athens home stadium (May 2023)
        run: |
          python - <<'PY'
          import io,requests
          from pathlib import Path
          from PIL import Image
          filename='AEK_fans_during_the_last_league_winning_match_in_Agia_Sophia_Stadium.jpg'
          direct='https://upload.wikimedia.org/wikipedia/commons/6/6a/'+filename
          urls=['https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/commons/6/6a/'+filename+'&w=1800&output=jpg',direct]
          last=None
          for url in urls:
              try:
                  r=requests.get(url,timeout=65,headers={'User-Agent':'OriginalStadiumAttributionVideo/1.0'})
                  r.raise_for_status()
                  img=Image.open(io.BytesIO(r.content)).convert('RGB')
                  if img.width<850:raise RuntimeError('Image too small')
                  Path('aek_stadium_home.jpg').write_bytes(r.content)
                  print('AEK_ACTUAL_HOME_STADIUM_READY',img.size,len(r.content),flush=True)
                  break
              except Exception as e:
                  print('SOURCE_RETRY',str(e)[:160],flush=True);last=e
          else:raise RuntimeError('Original photo unavailable '+str(last))
          Path('AEK_STADIUM_LICENSE.txt').write_text('AEK home stadium photo: AEK–Volos, 14 May 2023, Agia Sophia Stadium in Athens; author Demian vi; Creative Commons BY-SA 4.0. Original source: https://commons.wikimedia.org/wiki/File:AEK_fans_during_the_last_league_winning_match_in_Agia_Sophia_Stadium.jpg . Cropped and placed behind original historical results graphics.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-Athens-Genuine-Home-Stadium-2023-CC-BY-SA
          path: |
            aek_stadium_home.jpg
            AEK_STADIUM_LICENSE.txt
          retention-days: 30
          if-no-files-found: error