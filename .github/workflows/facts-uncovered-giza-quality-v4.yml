name: "Facts Uncovered — Great Pyramid Quality-Controlled v4 + 7 Shorts"
on:
  push:
    paths:
      - ".github/workflows/facts-uncovered-giza-quality-v4.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: facts-uncovered-giza-quality-v4
  cancel-in-progress: false
jobs:
  documentary-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chapter: ["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free static encoder (no apt-get)
        run: |
          python -m pip install --disable-pip-version-check -q "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31" "imageio-ffmpeg>=0.5"
          BIN=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          sudo ln -sf "$BIN" /usr/local/bin/ffmpeg
          test -s "$BIN"
          ffmpeg -version | head -1
      - name: Reuse proven locally generated original chapter voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voices
          gh run download 40382408830 --repo "$GITHUB_REPOSITORY" --name "giza-voice-${{ matrix.chapter }}" --dir voices
          test -s "voices/chapter_${{ matrix.chapter }}.wav"
          test -s "voices/chapter_${{ matrix.chapter }}.json"
      - name: Render v2 editorially matched unique archival motion shots
        run: |
          python -m py_compile video/history_studio/films/giza_hidden_history_2026/produce.py
          python video/history_studio/films/giza_hidden_history_2026/produce.py chapter --index "${{ matrix.chapter }}" --voice-dir voices --work scratch --output rendered
      - name: Verify each image used once and save chapter film
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,glob
          p=Path(glob.glob('rendered/chapter_*.json')[0])
          j=json.loads(p.read_text())
          media=[x['media'] for x in j['shots'] if x['media']!='original_programmatic_diagram']
          assert len(set(media))==len(media), 'Visual repeated inside chapter'
          assert j['duration_seconds']>120
          print('CHAPTER_V2_QC',j['title'],round(j['duration_seconds']/60,2),'min',len(j['shots']),'shots',len(media),'unique licensed sources')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: giza-v4-chapter-${{ matrix.chapter }}
          path: rendered/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  seven-vertical-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        short: ["01","02","03","04","05","06","07"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free static encoder
        run: |
          python -m pip install --disable-pip-version-check -q "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31" "imageio-ffmpeg>=0.5"
          BIN=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          sudo ln -sf "$BIN" /usr/local/bin/ffmpeg
      - name: Retrieve original independently narrated Short
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voices
          gh run download 40382408830 --repo "$GITHUB_REPOSITORY" --name "giza-shortvoice-${{ matrix.short }}" --dir voices
      - name: Render subject-relevant vertical Short with visual credits
        run: |
          python video/history_studio/films/giza_hidden_history_2026/produce.py short --index "${{ matrix.short }}" --voice-dir voices --work scratch --output rendered
      - uses: actions/upload-artifact@v4
        with:
          name: giza-v4-short-${{ matrix.short }}
          path: rendered/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  final-film:
    needs: [documentary-chapters, seven-vertical-shorts]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install multimedia assembler and analytic dependencies
        run: |
          python -m pip install --disable-pip-version-check -q "numpy>=1.26,<3" "Pillow>=10,<13" "requests>=2.31" "soundfile>=0.12" "imageio-ffmpeg>=0.5"
          BIN=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          sudo ln -sf "$BIN" /usr/local/bin/ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: giza-v4-chapter-*
          path: chapter_output
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: giza-v4-short-*
          path: short_output
          merge-multiple: true
      - name: Assemble complete motion documentary with original soundtrack
        run: |
          python video/history_studio/films/giza_hidden_history_2026/produce.py assemble --chapters chapter_output --shorts short_output --output delivery
          cp video/history_studio/films/giza_hidden_history_2026/YOUTUBE_PUBLISHING.md delivery/YOUTUBE_PUBLISHING.md
          cp video/history_studio/films/giza_hidden_history_2026/SOURCE_NOTES.json delivery/SOURCE_NOTES.json
          cp video/history_studio/films/giza_hidden_history_2026/RESEARCH_BIBLE.md delivery/RESEARCH_BIBLE.md
          cat delivery/QC_REPORT.json
      - name: Burn truly readable Shorts subtitles without oversized font or duplicate panel
        run: |
          set -euo pipefail
          for n in 01 02 03 04 05 06 07; do
            python video/history_studio/films/giza_hidden_history_2026/burn_mobile_captions.py               "delivery/short_${n}.mp4" "delivery/short_${n}.srt"               "delivery/captioned_${n}.mp4" --work "cue_${n}"
            test -s "delivery/captioned_${n}.mp4"
            mv "delivery/captioned_${n}.mp4" "delivery/short_${n}.mp4"
          done
      - name: Add licensed original low-level stereo ambient score to all Shorts
        run: |
          set -euo pipefail
          for n in 01 02 03 04 05 06 07; do
            ffmpeg -hide_banner -loglevel error -nostdin -y               -i "delivery/short_${n}.mp4" -stream_loop -1               -i "delivery/Original_Ambient_Score.wav"               -filter_complex "[0:a]acompressor=threshold=0.15:ratio=2:attack=20:release=160[v];[1:a]volume=0.22[m];[v][m]amix=inputs=2:duration=first:dropout_transition=0,loudnorm=I=-16:TP=-1.5:LRA=10[a]"               -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k               -ar 48000 -ac 2 -shortest -movflags +faststart               "delivery/mastered_${n}.mp4"
            mv "delivery/mastered_${n}.mp4" "delivery/short_${n}.mp4"
          done
      - name: Create complete creator attribution and license/change disclosure
        run: |
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path('delivery')
          photos=json.loads((folder/'IMAGE_CREDITS.json').read_text())
          rows=['FACTS UNCOVERED — IMAGE LICENSE AND MODIFICATIONS LEDGER',
                'Version: Great Pyramid documentary v4',
                'Archival images used for context; no claim of ancient photographic footage.',
                'Changes: reframing, cropping, color correction, motion treatment and text overlay.',
                'Creative Commons Attribution-ShareAlike source derivatives retain applicable terms.',
                'Original narration/music are distinct creator-produced works; source permissions vary.',
                '']
          for n,x in enumerate(photos,1):
            if x.get('license','').startswith('CC BY'): assert x.get('creator','').strip(),x['name']
            rows.extend([str(n)+'. '+x['name'],'Creator: '+str(x.get('creator') or 'Source record'),
                         'License: '+x.get('license',''),'License URL: '+str(x.get('license_url','')),
                         'Source: '+str(x['source']),'Modified: cropped, recolored, motion / graphic frame',''])
          (folder/'IMAGE_ATTRIBUTION_AND_LICENSES.txt').write_text('\n'.join(rows))
          assert len(photos)>=40,('Unexpectedly low archive image count',len(photos))
          print('USED_AND_ATTRIBUTED_MEDIA',len(photos))
          PY
      - name: Validate 15 chapter sources, repeated shots and rights before delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections,json,subprocess
          qdir=Path('chapter_output')
          allshots=[];credits=[]
          for i in range(1,16):
            d=json.loads((qdir/f'chapter_{i:02d}.json').read_text())
            assert d['duration_seconds']>150
            real=[x['media'] for x in d['shots'] if x['media']!='original_programmatic_diagram']
            assert len(real)==len(set(real)),('within-chapter duplicate',i)
            used={x['source'] for x in d['image_credits']}
            assert used==set(real),('image rights / usage mismatch',i)
            allshots+=real;credits+=d['image_credits']
          repeated=[(k,n) for k,n in collections.Counter(allshots).items() if n>1]
          problems=[p for p in allshots if any(w in p.lower() for w in
                     ('jerusalem','anâta','anathoth','christmas','eiffel','bethlehem'))]
          assert not problems,problems
          print('CROSS_CHAPTER_REPEAT_SOURCES',len(repeated),'of',len(set(allshots)),
                'unique archive assets')
          if len(repeated)>12:
            raise RuntimeError('More than twelve historical photographs duplicated across chapters')
          out=Path('delivery')
          videos=[out/'Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4']+[out/f'short_{i:02d}.mp4' for i in range(1,8)]
          for p in videos:
            assert p.exists() and p.stat().st_size>600_000,p
            r=subprocess.run(['ffmpeg','-hide_banner','-i',str(p)],capture_output=True,text=True)
            assert 'Video: h264' in r.stderr and 'Audio: aac' in r.stderr,p.name
            assert '1920x1080' in r.stderr if p==videos[0] else '1080x1920' in r.stderr,p.name
          summary=json.loads((out/'QC_REPORT.json').read_text())
          summary['release_grade']='AUTOMATED_TECHNICAL_PASS; human/editorial and legal review remains required'
          summary['cross_chapter_duplicate_source_count']=len(repeated)
          summary['all_eight_videos_have_audio']=True
          summary['shorts_have_burned_pillow_captions']=True
          summary['source_shots_used']=len(allshots)
          (out/'QC_REPORT.json').write_text(json.dumps(summary,indent=2))
          print('GIZA_V4_TECHNICAL_QC_PASS',summary['verified_video_minutes'],'minutes')
          PY
      - name: Verify final master, chapter boundaries, and Shorts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('delivery')
          q=json.loads((p/'QC_REPORT.json').read_text())
          assert len(q['chapters'])==15
          assert q['short_count']==7
          assert q['verified_video_minutes']>50
          assert all((p/f'short_{i:02d}.mp4').stat().st_size>300000 for i in range(1,8))
          assert (p/'Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4').stat().st_size>250000000
          assert (p/'thumbnail.jpg').stat().st_size>100000
          print('FULL_PREMIUM_V2_VIDEO_VALIDATED',q['verified_video_minutes'],'minutes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Giza-V4-Quality-Controlled-88-Minute-Master-and-Seven-Shorts
          path: |
            delivery/Great_Pyramid_Secrets_2026_Facts_Uncovered.mp4
            delivery/short_*.mp4
            delivery/short_*.srt
            delivery/subtitles.srt
            delivery/thumbnail.jpg
            delivery/CHAPTERS.json
            delivery/IMAGE_CREDITS.json
            delivery/IMAGE_ATTRIBUTION_AND_LICENSES.txt
            delivery/QC_REPORT.json
            delivery/YOUTUBE_PUBLISHING.md
            delivery/RESEARCH_BIBLE.md
            delivery/SOURCE_NOTES.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
