name: CartoonStudio E01 — One-Time Private Kaggle GPU Mount Repair and 3s Preview

on:
  push:
    branches: [main]
    paths:
      - "video/episodes/tiny-trails/ep01/EP01_KAGGLE_MOUNT_REPAIR_RUN_ONCE.txt"

permissions:
  contents: read

jobs:
  retrieve-existing-authorized-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL: aighewieghosa/tiny-trails-ep01-preview-gpu
    steps:
      - name: Require exact existing-preview retrieval approval and Kaggle Secret
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="$(echo "$COMMIT_MESSAGE" | head -n 1)"
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$TITLE" != "CartoonStudio E01 one-time Kaggle mount repair preview" ]]; then
            echo "::error::Not the authorized one-time Episode 1 asset-mount repair."
            exit 1
          fi
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::Kaggle token missing from repository Actions Secret."
            exit 1
          fi
          echo "EP01_EXPLICITLY_AUTHORIZED_MOUNT_REPAIR_PREVIEW_ONLY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI for read-only job status and preview retrieval
        run: |
          python -m pip install --disable-pip-version-check 'kaggle==2.2.5'
          kaggle --version
      - name: Submit ONLY repaired Episode 1 first-72-frames GPU preview to private Kaggle
        run: |
          set -euo pipefail
          mkdir -p artifacts/ep01/private-kernel
          cp video/episodes/tiny-trails/ep01/kaggle_ep01_gpu_preview.py artifacts/ep01/private-kernel/
          python - <<'PY'
          import json
          from pathlib import Path
          data={
             "id":"aighewieghosa/tiny-trails-ep01-preview-gpu",
             "title":"Tiny Trails Ep01 Preview GPU",
             "code_file":"kaggle_ep01_gpu_preview.py",
             "language":"python","kernel_type":"script",
             "is_private":True,"enable_gpu":True,"enable_internet":True,
             "machine_shape":"NvidiaTeslaT4",
             "dataset_sources":["aighewieghosa/tiny-trails-ep01-original-gpu-assets"],
             "competition_sources":[],"kernel_sources":[],"model_sources":[]}
          Path('artifacts/ep01/private-kernel/kernel-metadata.json').write_text(json.dumps(data,indent=2))
          PY
          kaggle kernels push -p artifacts/ep01/private-kernel --accelerator NvidiaTeslaT4
          echo "EP01_REPAIRED_PRIVATE_GPU_PREVIEW_VERSION_SUBMITTED"
      - name: Wait for the corrected private Kaggle GPU preview; never run a full episode
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 180); do
            echo "EP01_REPAIRED_KAGGLE_STATUS_CHECK=$i"
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1)"
            echo "$STATUS"
            LOWER="$(printf "%s" "$STATUS" | tr '[:upper:]' '[:lower:]')"
            if echo "$LOWER" | grep -Eq '(^|[^a-z])(error|failed|failure|cancelled|canceled)([^a-z]|$)'; then
              echo "::error::Private Kaggle GPU preview reported a failure."
              kaggle kernels logs "$KERNEL" | tail -150 || true
              exit 1
            fi
            if echo "$LOWER" | grep -Eq '(^|[^a-z])(complete|completed|success)([^a-z]|$)'; then
              READY=1
              break
            fi
            if (( i % 4 == 0 )); then
              kaggle kernels logs "$KERNEL" | grep -E 'EP01_(FRAME|VERIFIED|KAGGLE|PREVIEW)' | tail -20 || true
            fi
            sleep 20
          done
          if (( READY != 1 )); then
            echo "::error::The repaired Kaggle three-second preview did not complete."
            exit 1
          fi
      - name: Retrieve original three-second MP4 and check every frame, codec and audio
        run: |
          set -euo pipefail
          mkdir -p artifacts/ep01/review
          kaggle kernels output "$KERNEL" -p artifacts/ep01/review
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=Path('artifacts/ep01/review')
          def only(name):
              files=list(root.rglob(name))
              if len(files)!=1:
                  raise RuntimeError(f'EP01_REQUIRED_KAGGLE_PREVIEW_OUTPUT_MISSING {name} count={len(files)}')
              return files[0]
          video=only('tiny-trails-ep01-preview-3s.mp4')
          evidence=json.loads(only('tiny-trails-ep01-gpu-preview-verification.json').read_text())
          assert evidence['frames']==72 and evidence['full_rendered'] is False
          assert evidence['real_cuda_cycles_required'] is True
          frame_log=only('tiny-trails-ep01-frame-timings.jsonl')
          frames=[json.loads(l)['frame'] for l in frame_log.read_text().splitlines() if l.strip()]
          assert sorted(frames)==list(range(1,73)),f'Missing frame timing records: {len(frames)}'
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(video)],text=True))
          streams=probe['streams']
          v=[s for s in streams if s.get('codec_type')=='video']
          a=[s for s in streams if s.get('codec_type')=='audio']
          assert len(v)==1 and v[0].get('codec_name')=='h264'
          assert (v[0].get('width'),v[0].get('height'))==(1280,720)
          assert any(s.get('codec_name')=='aac' for s in a)
          duration=float(probe['format']['duration'])
          assert 2.8<=duration<=3.3
          subprocess.run(['ffmpeg','-v','error','-i',str(video),'-f','null','-'],check=True,timeout=180)
          print('EP01_ACTUAL_KAGGLE_GPU_72_FRAME_PREVIEW_MP4_VERIFIED',video,'seconds',duration)
          print('EP01_FULL_RENDER_NOT_AUTHORIZED_AND_NOT_CREATED')
          PY
      - name: Publish actual verified three-second preview for user review
        uses: actions/upload-artifact@v4
        with:
          name: tiny-trails-e01-authentic-kaggle-gpu-3-second-preview
          path: artifacts/ep01/review/
          retention-days: 30
          if-no-files-found: error
      - name: Report sanitized Kaggle run logs if verification fails
        if: failure()
        run: |
          kaggle kernels logs "$KERNEL" | tail -150 || true
