name: Audiobook — approved Kokoro Michael CPU source-lock regression
on:
  push:
    paths:
      - 'video/audiobook_studio/**'
      - '.github/workflows/audiobook-kokoro-scene-locked-ci.yml'
  pull_request:
    paths:
      - 'video/audiobook_studio/**'
      - '.github/workflows/audiobook-kokoro-scene-locked-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kokoro-source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline source and voice regression tests
        run: |
          python -m pip -q install numpy
          python -m unittest video.audiobook_studio.manhua_pipeline.test_music_first -v
          python -m unittest video.audiobook_studio.manhua_pipeline.test_kokoro_scene_locked -v
          python -m py_compile video/audiobook_studio/manhua_pipeline/scene_locked_quality.py video/audiobook_studio/manhua_pipeline/kokoro_cpu_episode.py video/audiobook_studio/manhua_pipeline/music_bed.py video/audiobook_studio/manhua_pipeline/assemble_existing.py video/audiobook_studio/mandatory_release_gate.py
      - name: Enforce the latest narrator and no-regeneration contract
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('video/audiobook_studio')
          agent=(root/'AGENTS.md').read_text()
          current=(root/'CURRENT_PRODUCTION_DEFAULT_2026-11-08.md').read_text()
          code=(root/'manhua_pipeline/kokoro_cpu_episode.py').read_text()
          assert 'Kokoro Michael' in agent and 'Kokoro Michael' in current
          assert 'am_michael' in agent and 'am_michael' in code
          assert '1.25' in agent
          assert 'full_color_panels' in (root/'manhua_pipeline/assemble_existing.py').read_text()
          assert not (root/'manhua_pipeline/kaggle_runner.py').exists()
          print('CURRENT_KOKORO_FULL_COLOR_ONLY')
          PY
