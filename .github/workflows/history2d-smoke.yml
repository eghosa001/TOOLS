name: "History Studio 2D — real rigged and illustrated previews"
on:
  workflow_dispatch:
  push:
    paths:
      - "video/history_studio/2d/**"
      - ".github/workflows/history2d-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free renderer and development voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak
          python -m pip install pillow
      - name: Test rigging, disclosure, original art, and timing rules
        run: python -m unittest discover -s video/history_studio/2d/tests -v
      - name: Render actual joint-driven character preview
        run: |
          python video/history_studio/2d/make_demo.py --dir artifacts/history2d-demo
          python video/history_studio/2d/render2d.py artifacts/history2d-demo/demo.json \
            --output artifacts/history2d-demo/character.mp4 --quality preview --gpu off \
            --workers 2 --cache-dir artifacts/history2d-cache
      - name: Generate original illustrative historical-style scene plates
        run: |
          python video/history_studio/2d/art_director.py --output artifacts/history2d-demo/sets --size 1280x720
      - name: Prepare one real moving-camera narration scene
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/history2d-demo')
          sample=json.loads((root/'demo.json').read_text())
          wav=sample['scenes'][0]['audio']
          sample['scenes']=[{'chapter':'The Routes of Trade • Illustrated Study',
            'visual_label':'ILLUSTRATED RECONSTRUCTION • NOT ARCHIVAL FOOTAGE',
            'audio':wav,'speaker':'narrator','actors':[],
            'shot_type':'illustrated_broll', 'camera_move':'right',
            'background':'sets/sahel_market.png'}]
          (root/'illustrated.json').write_text(json.dumps(sample,indent=2)+'\n')
          PY
      - name: Render and verify genuine moving-background MP4
        run: |
          python video/history_studio/2d/render2d.py artifacts/history2d-demo/illustrated.json \
            --output artifacts/history2d-demo/illustrated.mp4 --quality standard --gpu auto \
            --workers 1 --cache-dir artifacts/history2d-cache
          python - <<'PY'
          import json,subprocess
          for path in ('artifacts/history2d-demo/character.mp4','artifacts/history2d-demo/illustrated.mp4'):
            info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',path]))
            kinds={x['codec_type'] for x in info['streams']}
            assert {'audio','video'}<=kinds,(path,kinds)
            assert 1<float(info['format']['duration'])<180, path
            print('TECHNICAL_REAL_MP4_PASS',path)
          PY
      - name: Prove no automatic publication of development assets
        shell: bash
        run: |
          if python video/history_studio/2d/release_check.py artifacts/history2d-demo/demo.json \
            --mp4 artifacts/history2d-demo/character.mp4 --allow-short-preview; then
            echo "::error::Unreviewed demo incorrectly release ready"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: history2d-character-and-broll-technical-previews
          path: |
            artifacts/history2d-demo/character.mp4
            artifacts/history2d-demo/illustrated.mp4
            artifacts/history2d-demo/sets/*.png
            artifacts/history2d-demo/sets/manifest.json
          retention-days: 30
          if-no-files-found: error