name: "History Studio 2D — real rigged preview and tests"
on:
  workflow_dispatch:
  push:
    paths:
      - "video/history_studio/2d/**"
      - ".github/workflows/history2d-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install no-cost CPU renderer and TTS test voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak
          python -m pip install pillow
      - name: Validate rigging, scene specification, and audio fail-closed rules
        run: python -m unittest discover -s video/history_studio/2d/tests -v
      - name: Render original articulated puppet demonstration (NOT production quality)
        run: |
          python video/history_studio/2d/make_demo.py --dir artifacts/history2d-demo
          python video/history_studio/2d/render2d.py artifacts/history2d-demo/demo.json \
            --output artifacts/history2d-demo/preview.mp4 --quality preview --gpu off \
            --workers 2 --cache-dir artifacts/history2d-cache
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json artifacts/history2d-demo/preview.mp4
      - name: Prove unreleased demo is blocked by publication gate
        shell: bash
        run: |
          if python video/history_studio/2d/release_check.py artifacts/history2d-demo/demo.json \
              --mp4 artifacts/history2d-demo/preview.mp4 --allow-short-preview; then
            echo "::error::Unreviewed demonstrator incorrectly release-ready"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: history2d-real-rigged-technical-preview-not-final
          path: |
            artifacts/history2d-demo/preview.mp4
            artifacts/history2d-demo/demo.json
          retention-days: 14
          if-no-files-found: error
