name: "Football: Inspect current relevant club highlights video footage"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-aek-madrid-action-footage-inspection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install media inspection tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -U 'yt-dlp[default]'
      - name: Fetch official/relevant footage for editorial inspection only
        shell: bash
        run: |
          mkdir -p candidate
          set +e
          for entry in 'city_aek|RKdtcQYFBxE' 'madrid_leipzig|9rwJOtTrwz4' 'aek_aris|w1cJZNwFI24'; do
            key="${entry%%|*}"
            id="${entry##*|}"
            echo "ASSESSING_VIDEO=$key ID=$id"
            yt-dlp --ignore-config --no-playlist --socket-timeout 12 --retries 1 --fragment-retries 1 -f 'bv*[height<=480]+ba/b[height<=480]/b' --merge-output-format mp4 --max-filesize 40m -o "candidate/${key}.%(ext)s" "https://www.youtube.com/watch?v=${id}"
            echo "RESULT_${key}=$?"
          done
          for f in candidate/*.mp4; do
            test -f "$f" || continue
            ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$f"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -vf 'fps=1/15,scale=400:-1' -frames:v 12 "candidate/$(basename "$f" .mp4)_frame_%02d.jpg"
          done
          ls -lh candidate/
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-Real-2026-Actual-Match-Candidate-Clips-Editorial-Only
          path: candidate/*
          if-no-files-found: warn
          retention-days: 5