name: CartoonStudio REAL Godot Rigged Hair Spring Physics and Body Colliders (No Episode)
on:
  workflow_dispatch:
  push:
    paths:
      - video/test_actual_godot_hair_spring.gd
      - .github/workflows/cartoonstudio-godot-hair-physics-real.yml
permissions:
  contents: read
jobs:
  inspect-source-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Download actual creator GLBs and original MIT HairSpring script (no handmade asset)
        run: |
          set -euo pipefail
          mkdir -p /tmp/cartoonstudio-godot-physics
          BASE="https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0"
          for asset in vitruvian_head vitruvian_body vitruvian_hair_rigged; do
            curl --fail --location --retry 3 --silent --show-error --max-time 420 \
              "$BASE/godot_project/$asset.glb" \
              -o "/tmp/cartoonstudio-godot-physics/$asset.glb"
            test "$(stat -c '%s' "/tmp/cartoonstudio-godot-physics/$asset.glb")" -gt 500000
          done
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/godot_project/scenes/hair_spring.gd" \
            -o /tmp/cartoonstudio-godot-physics/hair_spring.gd
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/LICENSE" -o /tmp/cartoonstudio-godot-physics/LICENSE-source-MIT
          cp video/test_actual_godot_hair_spring.gd /tmp/cartoonstudio-godot-physics/test_hair_spring.gd
          cat >/tmp/cartoonstudio-godot-physics/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="CartoonStudio isolated licensed original HairSpring QA"
          run/main_scene=""

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
      - name: Download original official Godot 4.7.2 headless-capable engine
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 420 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-binary.zip
          mkdir -p /tmp/godot-binary
          unzip -q /tmp/godot-binary.zip -d /tmp/godot-binary
          chmod +x /tmp/godot-binary/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot-binary/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import three original files in real Godot and fail on broken scripts/models
        run: |
          /tmp/godot-binary/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path /tmp/cartoonstudio-godot-physics \
            --editor --import --quit \
            --log-file /tmp/true-godot-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading script' /tmp/true-godot-import.log; then
            exit 1
          fi
      - name: Simulate original HairSpring physics and collisions on genuinely imported body/hair
        run: |
          /tmp/godot-binary/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path /tmp/cartoonstudio-godot-physics \
            --script res://test_hair_spring.gd \
            --log-file /tmp/true-godot-hair-physics.log
          grep -F 'ACTUAL_ORIGINAL_GODOT_HAIR_SPRING_PHYSICS_PASS' /tmp/true-godot-hair-physics.log
          mkdir -p artifacts/genuine-hair-spring-physics
          cp /tmp/cartoonstudio-godot-physics/hair-spring-qa.json artifacts/genuine-hair-spring-physics/
          python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('artifacts/genuine-hair-spring-physics/hair-spring-qa.json').read_text())
          assert record['actual_source_spring_physics_tested']
          assert record['body_bones']>=50
          assert record['hair_bones']>=5
          assert record['simulated_hair_joints']>=3
          assert record['collision_spheres_attached_to_body']>=6
          assert record['max_simulated_hair_bone_rotation_radians']>0.003
          assert record['max_original_hair_tail_motion_world_units']>0.003
          assert record['physics_steps_executed']==100
          assert not record['pixel_perfect_hair_render_quality_verified']
          assert not record['rendered_episode_mp4']
          print('REAL_GODOT_HAIR_PHYSICS_ACTUAL_MEASUREMENTS_PASS',record['simulated_hair_joints'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoonstudio-real-godot-hair-spring-physics-evidence-no-episode
          path: artifacts/genuine-hair-spring-physics/*.json
          if-no-files-found: warn
          retention-days: 30
