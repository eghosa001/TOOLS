name: CartoonStudio Check Missing Artist Studio Materials (Native Cat & Dog)

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_blender_studio_material_dependencies.py
      - .github/workflows/cartoonstudio-studio-material-audit.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch original CC-BY production rig scene data from official Blender.org
        run: |
          python video/audit_official_blender_movie.py pet-projects-splash artifacts/source-pets
      - name: Install Blender for actual image and shader dependency inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
      - name: Find unresolved texture and node-library dependencies in the original Cat
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_blender_studio_material_dependencies.py -- \
            artifacts/source-pets/source/blender-3.6-splash/pro/lib/char/cat/publish/cat.v001.blend \
            artifacts/source-pets/source artifacts/diagnostics/cat-missing-resources.json
      - name: Find unresolved texture and node-library dependencies in the original Dog
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_blender_studio_material_dependencies.py -- \
            artifacts/source-pets/source/blender-3.6-splash/pro/lib/char/dog/publish/dog.v001.blend \
            artifacts/source-pets/source artifacts/diagnostics/dog-missing-resources.json
      - name: Upload concrete source-path repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-studio-material-dependency-report
          path: artifacts/diagnostics/*.json
          retention-days: 30
          if-no-files-found: error
