name: ASMR real liquid Foley CC0 free download intake
on:
  pull_request:
    paths:
      - "video/ai_asmr_experiments/stock_first_edit/fetch_real_liquid_foley.py"
      - ".github/workflows/asmr-real-liquid-foley-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -q requests
          ffprobe -version | head -1
      - name: Retrieve free licensed original pour and splash recordings
        run: python video/ai_asmr_experiments/stock_first_edit/fetch_real_liquid_foley.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-liquid-foley-with-license-ledger
          path: /tmp/asmr-real-liquid-sounds/
          retention-days: 7
          if-no-files-found: warn
