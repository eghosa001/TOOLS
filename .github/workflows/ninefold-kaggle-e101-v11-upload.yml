name: Upload Ninefold E101 v11 privately to Kaggle via TOOLS
on:
  pull_request:
    paths:
      - 'video/ninefold_tide/ops/ninefold_ep101_cam03b_v11_kaggle.ipynb'
      - 'video/ninefold_tide/ops/launch_kaggle_e101_v11.py'
      - 'video/ninefold_tide/tests/test_kaggle_e101_v11_upload.py'
      - '.github/workflows/ninefold-kaggle-e101-v11-upload.yml'
  push:
    branches: [main]
    paths:
      - 'video/ninefold_tide/ops/ninefold_ep101_cam03b_v11_kaggle.ipynb'
      - 'video/ninefold_tide/ops/launch_kaggle_e101_v11.py'
      - 'video/ninefold_tide/tests/test_kaggle_e101_v11_upload.py'
      - '.github/workflows/ninefold-kaggle-e101-v11-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ninefold-ep101-v11-private-kaggle-upload
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safe notebook, no source assets and non-destructive launcher
        run: |
          python -m py_compile video/ninefold_tide/ops/launch_kaggle_e101_v11.py
          python -m unittest discover -s video/ninefold_tide/tests -p 'test_kaggle_e101_v11_upload.py' -v
          test ! -e NINEFOLD_2D_GREASE_PENCIL_KAGGLE_TRANSFER_v07.zip
          test ! -e Ninefold_S1_Private_Kaggle_Kit_v11.zip
  upload-private-notebook:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI on runner
        run: python -m pip install -q --disable-pip-version-check kaggle
      - name: Submit new PRIVATE E101 v11 notebook without enabling Kaggle GPU
        id: uploader
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
        run: python video/ninefold_tide/ops/launch_kaggle_e101_v11.py
      - name: Read private notebook run state only, never change other notebooks
        if: steps.uploader.outputs.submitted == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          URL: ${{ steps.uploader.outputs.kaggle_url }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          u=os.environ['URL']
          ref=u.split('/code/',1)[1]
          p=subprocess.run(['kaggle','kernels','status',ref],capture_output=True,text=True,timeout=90)
          print(json.dumps({'uploaded_url':u,'kaggle_status_query_success':p.returncode==0,
            'note':'Kernel upload and runtime verification are distinct; missing artwork keeps the notebook staged.'}))
          PY