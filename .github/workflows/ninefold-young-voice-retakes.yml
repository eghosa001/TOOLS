name: Rerender and rank Ninefold child-teen voices (Elen and Mari)
on:
  pull_request:
    paths:
      - "video/ninefold_tide/audio/young_voice_retakes.py"
      - "video/ninefold_tide/audio/kaggle_elen_mari_retakes.ipynb"
      - "video/ninefold_tide/ops/launch_young_voice_retakes.py"
      - "video/ninefold_tide/ops/collect_young_voice_retakes.py"
      - "video/ninefold_tide/ops/select_young_voice_retakes.py"
      - ".github/workflows/ninefold-young-voice-retakes.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ninefold-one-time-young-voice-retakes
  cancel-in-progress: false
jobs:
  private-youth-retakes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canon and Python before spending GPU quota
        run: |
          python -m py_compile video/ninefold_tide/audio/young_voice_retakes.py \
             video/ninefold_tide/ops/launch_young_voice_retakes.py \
             video/ninefold_tide/ops/collect_young_voice_retakes.py \
             video/ninefold_tide/ops/select_young_voice_retakes.py
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("video/ninefold_tide/audio/kaggle_elen_mari_retakes.ipynb")
          nb=json.loads(path.read_text())
          code=[x for x in nb["cells"] if x["cell_type"]=="code"]
          assert len(code)==1
          compile("".join(code[0]["source"]),str(path),"exec")
          cast=json.loads(Path("video/ninefold_tide/audio/cast.json").read_text())
          actors={p["id"]:p for p in cast["characters"]}
          assert len(actors)==20 and actors["elen"]["age"]==14 and actors["mari"]["age"]==6
          print("Eight youth voice audition candidates preflight validated")
          PY
      - name: Install official Kaggle CLI
        run: python -m pip install -q --disable-pip-version-check kaggle
      - name: Submit new PRIVATE Elen and Mari voice retake notebook if absent
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/launch_young_voice_retakes.py
      - name: Verify all eight retake WAVs from the private Kaggle notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python video/ninefold_tide/ops/collect_young_voice_retakes.py \
            --kernel aighewieghosa/ninefold-elen-mari-retakes-01 \
            --out /tmp/ninefold-young-retakes --max-minutes 25
      - name: Install free offline-capable voice scoring tools on runner
        run: |
          python -m pip install -q --disable-pip-version-check faster-whisper soundfile numpy
          python -m pip install -q --disable-pip-version-check torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Rank all eight alternatives; retain only youth voices meeting quality threshold
        env:
          HF_HOME: /tmp/ninefold-young-hf
          TORCH_HOME: /tmp/ninefold-young-torch
          OMP_NUM_THREADS: '4'
        run: |
          python video/ninefold_tide/ops/select_young_voice_retakes.py \
             --archive /tmp/ninefold-young-retakes/ninefold_elen_mari_retakes_UNAPPROVED.zip \
             --output /tmp/ninefold-selected-young
      - name: Keep audition report and only best voice candidates privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninefold-elen-mari-youth-voice-retakes-and-independent-quality-report
          path: |
            /tmp/ninefold-selected-young/NINEFOLD_ELEN_MARI_BEST_RETAKES_UNAPPROVED.zip
            /tmp/ninefold-selected-young/YOUTH_RETAKE_SELECTION_REPORT.json
            /tmp/ninefold-selected-young/ALL_EIGHT_YOUTH_AUDITION_SCORES.json
            /tmp/ninefold-young-retakes/collection_verification.json
            /tmp/ninefold-young-retakes/kaggle_job_status.json
          if-no-files-found: warn
          retention-days: 14
