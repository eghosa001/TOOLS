name: Forex - four-week rotation of best validated signal candidates
on:
  push:
    paths:
      - 'forex-gpt/ensemble_walkforward_fetch.cjs'
      - 'forex-gpt/ensemble_rotation_research.py'
      - '.github/workflows/forex-ensemble-rotation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forex-strategy-rotation-paper
  cancel-in-progress: false
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Static syntax and pre-existing safety tests
        run: |
          python3 -m py_compile forex-gpt/ensemble_ml_backtest.py forex-gpt/ensemble_rotation_research.py
          node --check forex-gpt/ensemble_walkforward_fetch.cjs
          python3 -m unittest discover -s forex-gpt -p 'test_*.py' -v
      - name: Install historic GBPUSD reader
        run: npm ci --prefix forex-gpt --ignore-scripts --no-audit --no-fund
      - name: Install research ML libraries
        run: python3 -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pandas==2.3.3' 'scikit-learn==1.7.2' 'lightgbm==4.6.0' 'xgboost==3.1.1' 'catboost==1.2.8'
      - name: Read verified six-month minute bid-ask history
        run: node forex-gpt/ensemble_walkforward_fetch.cjs
      - name: Screen candidates before each separate week and evaluate 6-7-8 votes
        run: python3 forex-gpt/ensemble_rotation_research.py
      - name: Preserve full selection, validation, trade and equity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-ten-engine-rotation-four-folds
          path: forex-gpt/.tmp/ensemble_rotation_results.json
          if-no-files-found: warn
          retention-days: 30
