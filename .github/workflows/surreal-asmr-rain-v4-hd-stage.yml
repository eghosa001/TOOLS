name: ASMR - stage verified MP4 for direct YouTube publishing (GitHub + Zernio)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary direct HTTPS MP4 source URL (never commit a token or URL)"
        type: string
        required: true
      expected_sha256:
        description: "Exact SHA256 of editor-approved MP4"
        type: string
        required: true
      expected_size:
        description: "Exact size in bytes of editor-approved MP4"
        type: string
        required: true
      release_tag:
        description: "Unique staging release tag for the approved video"
        type: string
        required: true
      asset_filename:
        description: "MP4 filename in the release, e.g. ASMR_Rain_1080p.mp4"
        type: string
        required: true
permissions:
  contents: write
jobs:
  stage-verified-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download only the explicitly approved master
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_HASH: ${{ inputs.expected_sha256 }}
          EXPECTED_BYTES: ${{ inputs.expected_size }}
          OUTPUT_NAME: ${{ inputs.asset_filename }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == https://* ]]
          [[ "$EXPECTED_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BYTES" =~ ^[0-9]+$ ]]
          [[ "$OUTPUT_NAME" =~ ^[a-zA-Z0-9._-]+\.mp4$ ]]
          mkdir -p staged
          curl --fail --location --retry 2 --silent --show-error "$SOURCE_URL" -o "staged/$OUTPUT_NAME"
          test "$(stat -c '%s' "staged/$OUTPUT_NAME")" -eq "$EXPECTED_BYTES"
          echo "$EXPECTED_HASH  staged/$OUTPUT_NAME" | sha256sum -c -
      - name: Put exact approved media on public download-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          OUTPUT_NAME: ${{ inputs.asset_filename }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]
          gh release create "$RELEASE_TAG" "staged/$OUTPUT_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ASMR verified media: $OUTPUT_NAME" --notes "Download-only staging for separately authorized publishing. File hash and bytes verified on runner; this action does NOT itself publish to YouTube." --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | [.name,.size,.url] | @tsv)'
