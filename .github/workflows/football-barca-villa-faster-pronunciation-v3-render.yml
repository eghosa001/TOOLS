name: 'Football: Barcelona Villa v3 faster name-corrected genuine match video'
on:
  workflow_run:
    workflows:
      - 'Football: Barcelona Villa v3 real shot-synced Qwen Ryan narration'
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  eight-beat-quality-render:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      FOOTBALL_V3_SOURCES: football_v3_sources
      FOOTBALL_V3_VOICE: football_v3_voice
      FOOTBALL_V3_OUTPUT: football_v3_rendered
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual video renderer and high-quality attribution compositor
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null; fi
          if ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core >/dev/null; fi
          python -m pip install -q Pillow numpy soundfile
          python -m py_compile video/football_edits/render_barca_villa_shot_synced_v3.py
          ffmpeg -version | head -1
      - name: Retrieve actual 2026 Barcelona goal footage (both complete actions)
        uses: actions/download-artifact@v4
        with:
          name: Barca-Alaves-2026-Actual-Goal-Video-Review-Sources
          run-id: 41690688518
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: football_v3_sources
      - name: Retrieve actually scoring Villa video (NOT previous clip of Villa conceding) and real Yamal/Maatsen photos
        uses: actions/download-artifact@v4
        with:
          name: Barca-Villa-Actual-Jackson-Goal-Player-Portraits
          run-id: 41700862204
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: football_v3_sources
      - name: Retrieve genuine photos for Jackson and Cubarsi matchup
        uses: actions/download-artifact@v4
        with:
          name: Real-Cubarsi-Jackson-Photo-Portraits-2026
          run-id: 41701831512
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: football_v3_sources
      - name: Retrieve eight actual Qwen Ryan narration clips individually matched to action
        uses: actions/download-artifact@v4
        with:
          name: Barcelona-Villa-Shot-Synced-Real-Qwen-Ryan-v3
          run-id: ${{ github.event.workflow_run.id || '41709586264' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: football_v3_voice
      - name: Confirm every indispensable genuine recording before rendering
        run: |
          set -euo pipefail
          test -s football_v3_sources/Barcelona_Alaves_Raphinha_41_2026.mp4
          test -s football_v3_sources/Barcelona_Alaves_Yamal_451_2026.mp4
          test -s football_v3_sources/NBC_AstonVilla_Jackson_SCORES_2026.mp4
          test -s football_v3_sources/Yamal_2026_REAL.jpg
          test -s football_v3_sources/Maatsen_2025_REAL.jpg
          test -s football_v3_sources/Jackson_REAL.jpg
          test -s football_v3_sources/Cubarsi_REAL.jpg
          test -s football_v3_voice/shot_synced_narration_manifest.json
          python - <<'PY'
          import json,pathlib
          voice=json.loads(pathlib.Path('football_v3_voice/shot_synced_narration_manifest.json').read_text())
          assert voice['model']=='Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice'
          assert len(voice['scenes'])==8
          assert voice['speed_final_edit']=='1.40x pitch-preserving'
          for clip in voice['scenes']:
            assert (pathlib.Path('football_v3_voice')/clip['audio_file']).stat().st_size>150000
          print('ALL_SOURCE_MEDIA_AND_QWEN_BEATS_VERIFIED',len(voice['scenes']))
          PY
      - name: Render full-quality real-action intro, goal for Villa, dual player comparisons and beat-locked narration
        run: |
          set -euo pipefail
          python video/football_edits/render_barca_villa_shot_synced_v3.py
      - name: Preserve actual completed MP4 and every quality proof frame for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: Barca-Villa-V3-Fast-Pronunciation-Matchups-Qwen-Review
          path: |
            football_v3_rendered/*.mp4
            football_v3_rendered/*.jpg
            football_v3_rendered/*.json
            football_v3_rendered/*.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
