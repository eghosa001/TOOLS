name: Audiobook Eternal Dao D03 Episode 01 private manhua GPU asset generation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobook-eternal-dao-d03-ep01-private.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eternal-dao-d03-ep01-source-and-assets
  cancel-in-progress: false
jobs:
  private-ingest-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      SEALED_EP01_SOURCE: '{"version":1,"ephemeral_pub":"VYQLjfQ39NkilvQsmiY3o0DnVfmUtLP8SZs/panPCys=","nonce":"BgIiaejbUN+1GczM","ciphertext":""}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private authentication and package verification tools
        run: python -m pip install -q --disable-pip-version-check kaggle six cryptography requests
      - name: Decrypt ephemeral private package link, verify full D03 source and submit quality assets
        run: python -m video.audiobook_studio.manhua_pipeline.secure_eternal_dao_ep01_launch
      - name: Public repository contains no story data or finished media
        run: echo 'PRIVATE_EP01_ONLY; CPU assembly follows verified Kaggle assets; owner approval required for YouTube'
