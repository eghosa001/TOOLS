name: CartoonStudio Professional Cat and Dog — Godot and Visual Quality Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - video/render_real_glb_quality_still.py
      - .github/workflows/cartoonstudio-professional-pets-qa.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Reuse successful original Blender Studio animal export artifact
        uses: actions/download-artifact@v4
        with:
          name: cartoonstudio-verified-professional-cat-dog-glb
          run-id: 40226616719
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pets
      - name: Install Blender Cycles software and native materials support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Render actual Blender Studio Cat GLB under comparable lighting
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/render_real_glb_quality_still.py -- \
            artifacts/pets/verified-professional-pets/cat-professional.glb \
            artifacts/verified-pets-qa/cat-real-render.png
      - name: Render actual Blender Studio Dog GLB under comparable lighting
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/render_real_glb_quality_still.py -- \
            artifacts/pets/verified-professional-pets/dog-professional.glb \
            artifacts/verified-pets-qa/dog-real-render.png
      - name: Validate actual GLB skeleton and facial shapes in Godot 4
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p artifacts/test-godot/assets
          cp artifacts/pets/verified-professional-pets/{cat,dog}-professional.glb artifacts/test-godot/assets/
          cat > artifacts/test-godot/project.godot <<'PROJECT'
          config_version=5
          [application]
          config/name="CartoonStudio Professional Cat Dog Acceptance"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          PROJECT
          cat > artifacts/test-godot/check.gd <<'GODOT'
          extends SceneTree
          func _init() -> void:
              for key in ["cat","dog"]:
                  var p: String = "res://assets/" + String(key) + "-professional.glb"
                  var resource := load(p) as PackedScene
                  if resource == null:
                      push_error("IMPORT_FAILED "+key)
                      quit(1)
                      return
                  var actor := resource.instantiate()
                  var rigs := actor.find_children("*","Skeleton3D",true,false)
                  var meshes := actor.find_children("*","MeshInstance3D",true,false)
                  var facial := 0
                  for node in meshes:
                      var mesh := node as MeshInstance3D
                      if mesh.mesh:
                          facial+=mesh.mesh.get_blend_shape_count()
                  print("GODOT_STUDIO_ANIMAL ",key," skeletons=",rigs.size(),
                      " meshes=",meshes.size()," shape_keys=",facial)
                  if rigs.size()<1 or meshes.size()<10 or facial<5:
                      push_error("CHARACTER_QUALITY_INVALID "+key)
                      quit(1)
                      return
                  actor.free()
              print("GODOT_PROFESSIONAL_CAT_DOG_BOTH_PASS")
              quit(0)
          GODOT
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path artifacts/test-godot --editor --import --quit
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path artifacts/test-godot --script res://check.gd \
            --log-file /tmp/pet-actors-godot.log
          grep -q 'GODOT_PROFESSIONAL_CAT_DOG_BOTH_PASS' /tmp/pet-actors-godot.log
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-professional-pets-real-visuals-and-godot-tests
          path: |
            artifacts/verified-pets-qa/**
            artifacts/pets/verified-professional-pets/*.glb
          retention-days: 30
          if-no-files-found: error
