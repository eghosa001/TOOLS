name: Satisfying Studio real five-second Blender and Foley production proof
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/satisfying-studio-real-five-second.yml"
      - "video/satisfying_studio/production/blender_softbody_prepare.py"
      - "video/satisfying_studio/production/prismatic_gel_scene.py"
      - "video/satisfying_studio/production/kaggle_five_second_preview.py"
  workflow_dispatch:
concurrency:
  group: satisfying-studio-single-full-motion-proof
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q kaggle
      - name: Submit genuine 120-frame Blender Cycles OptiX scene and manual Foley mix
        run: |
          python - <<'PY'
          import json,os,pathlib,shutil,subprocess
          if not os.environ.get("KAGGLE_API_TOKEN"):raise SystemExit("Private Kaggle authorization missing")
          root=pathlib.Path("artifacts/five_second_kernel");root.mkdir(parents=True,exist_ok=True)
          # Bundle the EXACT Git-checked-out scene/installer/foley into the kernel.
          # Do not execute stale source code from a separately versioned dataset.
          source=pathlib.Path("video/satisfying_studio/production")
          commit=os.environ["GITHUB_SHA"].lower()
          kernel_slug="asmr-pinned-"+commit[:12]
          print("UNIQUE_KERNEL_VERSION",kernel_slug,"COMMIT",commit,flush=True)
          bundle=["from pathlib import Path as _BPath",
                  "import os as _BOS",
                  f"_BOS.environ['ASMR_SOURCE_GIT_SHA']={commit!r}",
                  "_BROOT=_BPath('/kaggle/working/satisfying_asmr_source_snapshot')",
                  "_BROOT.mkdir(parents=True,exist_ok=True)"]
          for filename in ("prismatic_gel_scene.py","official_blender.py","blender_softbody_prepare.py","hand_authored_foley.py"):
              body=(source/filename).read_text(encoding="utf-8")
              bundle.append(f"(_BROOT/{filename!r}).write_text({body!r},encoding='utf-8')")
          print("PINNED_GEL_SOURCE_SHA256",__import__("hashlib").sha256(
              (source/"prismatic_gel_scene.py").read_bytes()).hexdigest(),flush=True)
          runner=(source/"kaggle_five_second_preview.py").read_text(encoding="utf-8")
          (root/"kaggle_five_second_preview.py").write_text(
              "\n".join(bundle)+"\n"+runner,encoding="utf-8")
          print("GIT_PINNED_ASMR_SNAPSHOT_BUNDLED",len(bundle),flush=True)
          meta={
            "id":"aighewieghosa/"+kernel_slug,
            "title":"asmr pinned "+commit[:12],
            "code_file":"kaggle_five_second_preview.py",
            "language":"python","kernel_type":"script","is_private":True,
            "enable_gpu":True,"enable_internet":True,
            "dataset_sources":["aighewieghosa/satisfying-studio-cc0-asmr-v1"],
            "competition_sources":[],"kernel_sources":[],"model_sources":[]}
          (root/"kernel-metadata.json").write_text(json.dumps(meta,indent=2))
          subprocess.run(["kaggle","datasets","files",meta["dataset_sources"][0],"--page-size","1"],
                         check=True,timeout=40)
          subprocess.run(["kaggle","kernels","push","-p",str(root)],check=True,timeout=90)
          print("ONE_FIVE_SECOND_TECHNICAL_PROOF_SUBMITTED; NOT EDITORIAL APPROVAL")
          PY
      - name: Observe actual Kaggle video render and preserve approved-scope outputs
        run: |
          python - <<'PY'
          import pathlib,subprocess,time,os
          commit=os.environ["GITHUB_SHA"].lower()
          kernel="aighewieghosa/asmr-pinned-"+commit[:12]
          state=""
          for i in range(245):
              p=subprocess.run(["kaggle","kernels","status",kernel],capture_output=True,text=True,timeout=30)
              state=(p.stdout+p.stderr).strip()
              print("FIVE_SECOND_KAGGLE_STATUS",i+1,state[-220:],flush=True)
              if "KernelWorkerStatus.COMPLETE" in state or "KernelWorkerStatus.ERROR" in state:break
              if i<244:time.sleep(10)
          else:raise SystemExit("Kaggle render did not finish within bounded observation")
          out=pathlib.Path("artifacts/five_second_output");out.mkdir(parents=True,exist_ok=True)
          p=subprocess.run(["kaggle","kernels","output",kernel,"-p",str(out),"--force",
                 "--file-pattern",r".*(INTERNAL_UNAPPROVED[.]mp4|original_CC0_foley_5sec[.]wav|premium_softbody_physics_source[.]blend|physics_bake_manifest[.]json|TECHNICAL_PROOF_NOT_APPROVED[.]txt|[.]log)$",
                 "--page-size","200"],capture_output=True,text=True,timeout=150)
          print("KAGGLE_RESULT_FETCH",p.returncode,(p.stdout+p.stderr)[-700:],flush=True)
          for f in out.rglob("*.log"):
              print("KAGGLE_RENDER_LOG_TAIL",f.read_text(errors="replace")[-7200:],flush=True)
          found=list(out.rglob("*INTERNAL_UNAPPROVED.mp4"))
          print("VIDEO_FILES_FOUND",[(str(f),f.stat().st_size) for f in found],flush=True)
          markers=list(out.rglob("TECHNICAL_PROOF_NOT_APPROVED.txt"))
          manifest=markers[0].read_text(errors="replace") if len(markers)==1 else ""
          if "SOURCE_GIT_SHA="+commit not in manifest:
              raise SystemExit("STALE ARTIFACT REJECTED: source commit in output does not match current Git SHA")
          if "KernelWorkerStatus.COMPLETE" not in state or len(found)!=1:
              raise SystemExit("A playable five-second video was NOT technically produced; never quality approve")
          import json,hashlib
          reports=list(out.rglob("physics_bake_manifest.json"))
          if len(reports)!=1:
              raise SystemExit("ASMR physics gate: no real baked cache manifest")
          proof=json.loads(reports[0].read_text())
          if proof.get("solver")!="blender_softbody" or proof.get("baked_point_cache") is not True or proof.get("cached_frames")!=120:
              raise SystemExit("ASMR physics gate: incomplete or unverified 120-frame bake")
          blends=list(out.rglob("premium_softbody_physics_source.blend"))
          if len(blends)!=1 or hashlib.sha256(blends[0].read_bytes()).hexdigest()!=proof.get("source_blend_sha256"):
              raise SystemExit("ASMR physics gate: editable Blender scene missing or changed")
          print("Genuine baked 120-frame 3D physics confirmed; no editorial approval",flush=True)
          print("FIVE_SECOND_MOVING_AV_EXISTENCE_CONFIRMED_NOT_QUALITY_APPROVED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satisfying-original-five-second-technical-proof-unapproved
          path: artifacts/five_second_output/
          if-no-files-found: warn
          retention-days: 14
# Only the isolated non-generative satisfying-studio pipeline.
