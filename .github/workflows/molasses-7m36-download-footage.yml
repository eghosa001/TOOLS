name: Molasses - download individually cleared 1080p live-action sources
on:
  push:
    branches: [production/molasses-real-7m36-20261105]
    paths: [.github/workflows/molasses-7m36-download-footage.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  licensed-footage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install video tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch matched real camera clips, inspect source tracks and record provenance
        run: |
          set -euo pipefail
          mkdir -p media
          python - <<'PY'
          import urllib.request,hashlib,json,subprocess
          from pathlib import Path
          clips=[[8061569,"legal_documents",17],[4475907,"legal_discussion",18],[8061377,"legal_paper",15],[5115941,"factory_aerial",21],[8853518,"pipe_fitting",10],[9455503,"industrial_chain",10],[10723791,"metal_grinding",9],[13368021,"water_pump",32],[7408979,"road_washing",24],[4778069,"industrial_tanks",10],[12595925,"boston_aerial",16],[5930444,"fire_hose",6],[4941457,"metal_welding",12]]
          result=[]
          for id,tag,expected in clips:
            b="https://videos.pexels.com/video-files/"+str(id)+"/"+str(id)+"-"
            variants=[f"hd_1920_1080_{fps}fps.mp4" for fps in (24,25,30,60)]+[f"hd_1280_720_{fps}fps.mp4" for fps in (24,25,30,60)]+["sd_960_540_25fps.mp4"]
            path=Path('media')/("p_"+str(id)+"_"+tag+".mp4");ok=False;issues=[]
            for variant in variants:
              url=b+variant
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.pexels.com/"})
                with urllib.request.urlopen(req,timeout=45) as src,path.open('wb') as out:
                  while data:=src.read(1<<20):
                    out.write(data)
                    if out.tell()>55000000: raise RuntimeError("clip over 55MB")
                if path.stat().st_size<400000:raise RuntimeError("tiny response")
                j=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-show_entries','stream=codec_type,width,height','-of','json',str(path)]))
                dur=float(j['format']['duration']);streams=j['streams']
                if dur<2 or not any(z.get('codec_type')=='video' for z in streams):raise RuntimeError("not video")
                result.append({"filename":path.name,"pexels_page":"https://www.pexels.com/video/"+str(id)+"/","url":url,"seconds":dur,"id":id,"tag":tag,"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"license":"Pexels free commercial-use license; property/people constraints still apply","label":"MODERN CONTEXT FOOTAGE - NOT 1919 DISASTER"})
                print("VERIFIED_LIVE_VIDEO",path.name,round(dur,2),path.stat().st_size,flush=True)
                ok=True
                break
              except Exception as e:
                issues.append(str(e)[:60]);path.unlink(missing_ok=True)
            if not ok:print("UNAVAILABLE",id,issues[-2:],flush=True)
          Path('media/RIGHTS_AND_PROBE.json').write_text(json.dumps(result,indent=2)+"\n")
          if len(result)<8:raise RuntimeError("Insufficient usable live camera sources; stop")
          PY
      - name: Acquire public-domain 1904 factory footage for period evidence context
        continue-on-error: true
        run: |
          set -euo pipefail
          URL=https://archive.org/download/westinghouse-works-1904/westinghouse-works-1904-10mbps.mp4
          curl --fail --location --retry 3 --retry-delay 4 --max-time 360 "$URL" -o media/westinghouse_1904_raw.mp4
          ffprobe -v error -show_entries format=duration,size -of json media/westinghouse_1904_raw.mp4
          ffmpeg -v error -nostdin -y -i media/westinghouse_1904_raw.mp4 -an -vf "scale=960:720:flags=lanczos" -r 24 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p media/westinghouse_1904_public_domain_context.mp4
          rm media/westinghouse_1904_raw.mp4
          test "$(stat -c %s media/westinghouse_1904_public_domain_context.mp4)" -gt 5000000
          echo "Westinghouse Works 1904 original film; public domain in United States; archival context from Pennsylvania, NOT Boston tank. Source: https://www.loc.gov/collections/films-of-westinghouse-works-1904/" > media/westinghouse_1904_RIGHTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Facts-Molasses-GENUINE-CAMERA-FILM-STOCK-COLLECTION
          path: media/
          retention-days: 10
          compression-level: 0
          if-no-files-found: error
