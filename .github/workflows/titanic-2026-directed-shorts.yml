name: "Titanic 2026 — Two manually directed 1080p Shorts review exports"
on:
  push:
    paths:
      - ".github/workflows/titanic-2026-directed-shorts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: titanic-2026-2-directed-shorts-review
  cancel-in-progress: false
jobs:
  export:
    name: "Render only manually-authored fixed sequence; human QA still required"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      KOKORO_MODEL: /tmp/titanic-kokoro/kokoro-v1.0.onnx
      KOKORO_VOICES: /tmp/titanic-kokoro/voices-v1.0.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile manually authored Shorts renderer and check fixed script input
        run: |
          python -m py_compile video/history_studio/episodes/titanic-1912/2026_rebuild/render_two_directed_shorts.py
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("video/history_studio/episodes/titanic-1912/2026_rebuild/SHORTS_FINAL_SCRIPTS_AND_VISUAL_DIRECTION.json")
          a=json.loads(p.read_text())
          assert len(a['deliverables'])==2
          print("TWO_EXPLICIT_EDITOR_SCENES_READY_NO_AUTOMATIC_VISUAL_SELECTION")
          PY
      - name: Install free CPU audio and film tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "soundfile>=0.12" "Pillow>=10,<13" "kokoro-onnx>=0.6.1,<1"
      - name: Download Apache-2 Kokoro model
        run: |
          mkdir -p /tmp/titanic-kokoro
          curl -fsSL --retry 3 --retry-delay 4 -o "$KOKORO_MODEL" https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fsSL --retry 3 --retry-delay 4 -o "$KOKORO_VOICES" https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s "$KOKORO_MODEL")" -gt 300000000
          test "$(stat -c%s "$KOKORO_VOICES")" -gt 20000000
      - name: Render two original precisely audio-timed fixed Shorts picture edits
        timeout-minutes: 90
        run: |
          python -u video/history_studio/episodes/titanic-1912/2026_rebuild/render_two_directed_shorts.py
      - name: Verify all media decode and export report is candid about editor sign-off
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path("video/history_studio/episodes/titanic-1912/2026_rebuild/shorts_review_2026")
          report=json.loads((p/"DELIVERY_REPORT.json").read_text())
          assert len(report["technical_exports"])==2 and not report["release_approved"]
          for entry in report["technical_exports"]:
            movie=p/entry["file"]
            assert movie.stat().st_size>400000
            assert 40<=entry["seconds"]<=65
            stem=movie.name.replace("_review_1080x1920.mp4","")
            assert (p/(stem+"_review.srt")).exists()
            subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-xerror","-i",str(movie),"-f","null","-"],check=True)
            print("DECODE_PASS",movie.name,entry["seconds"],movie.stat().st_size)
          print("NOT_YET_PUBLICATION_APPROVED; FULL_AUDIOVISUAL_REVIEW_REQUIRED")
          PY
      - name: Deliver Shorts MP4/SRT contact art and timed edit manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-2026-Two-Hand-Directed-Shorts-REVIEW
          retention-days: 30
          if-no-files-found: warn
          path: |
            video/history_studio/episodes/titanic-1912/2026_rebuild/shorts_review_2026/*.mp4
            video/history_studio/episodes/titanic-1912/2026_rebuild/shorts_review_2026/*.srt
            video/history_studio/episodes/titanic-1912/2026_rebuild/shorts_review_2026/*.json
            video/history_studio/episodes/titanic-1912/2026_rebuild/shorts_review_2026/*/scene_*.png
