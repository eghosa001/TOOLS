name: "Titanic 2026 — Two original Shorts voice masters (audio only)"
on:
  push:
    paths:
      - ".github/workflows/titanic-2026-shorts-voice-only.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: titanic-2026-shorts-voice-only
  cancel-in-progress: false
jobs:
  voice_only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check explicit two Shorts and audio-only boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("video/history_studio/episodes/titanic-1912/2026_rebuild")
          data=json.loads((p/"SHORTS_FINAL_SCRIPTS_AND_VISUAL_DIRECTION.json").read_text())
          assert len(data["deliverables"]) == 2
          for s in data["deliverables"]:
            assert "subscribe to facts uncovered" in s["narration"].lower()
          print("TWO_AUTHORED_SHORTS_SCRIPT_VERIFIED; NO_AUTOMATIC_VIDEO_ASSEMBLY")
          PY
      - name: Install free CPU narration-only libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "soundfile>=0.12" "kokoro-onnx>=0.6.1,<1"
      - name: Get Apache-2.0 Kokoro narration model and voices
        run: |
          mkdir -p /tmp/titanic-voice
          curl -fsSL --retry 3 --retry-delay 4 -o /tmp/titanic-voice/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fsSL --retry 3 --retry-delay 4 -o /tmp/titanic-voice/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s /tmp/titanic-voice/kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c%s /tmp/titanic-voice/voices-v1.0.bin)" -gt 20000000
      - name: Record and measure both separately scripted Shorts
        run: |
          python -u video/history_studio/episodes/titanic-1912/2026_rebuild/record_shorts_audio_only.py --model /tmp/titanic-voice/kokoro-v1.0.onnx --voices /tmp/titanic-voice/voices-v1.0.bin
      - name: Encode lossless archival FLAC and verify complete audio decode
        run: |
          cd video/history_studio/episodes/titanic-1912/2026_rebuild/recorded_shorts
          for wav in titanic_short_01.wav titanic_short_02.wav; do
            ffmpeg -hide_banner -loglevel error -xerror -i "$wav" -f null -
            ffmpeg -hide_banner -loglevel error -y -i "$wav" -c:a flac "${wav%.wav}.flac"
          done
      - name: Deliver audio-only evidence, never label as a finished Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-2026-Two-Shorts-Voice-Only-NO-VIDEO
          retention-days: 30
          if-no-files-found: warn
          path: |
            video/history_studio/episodes/titanic-1912/2026_rebuild/recorded_shorts/*.wav
            video/history_studio/episodes/titanic-1912/2026_rebuild/recorded_shorts/*.flac
            video/history_studio/episodes/titanic-1912/2026_rebuild/recorded_shorts/VOICE_ONLY_LEDGER.json
