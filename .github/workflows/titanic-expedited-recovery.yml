name: Titanic expedited premium recovery — full film + 3 Shorts
on:
  workflow_dispatch:
  push:
    paths:
      - "video/history_studio/episodes/titanic-1912/recover_failed_premium.py"
      - ".github/workflows/titanic-expedited-recovery.yml"
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check recovery source and acquire free audio/video tools
        run: |
          python -m py_compile video/history_studio/episodes/titanic-1912/recover_failed_premium.py
          command -v ffmpeg || sudo apt-get install -y ffmpeg
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || sudo apt-get install -y fonts-dejavu-core
          python -m pip install "numpy<2" Pillow requests piper-tts
      - name: Restore previously completed 380-shot 68-minute cinematic picture from failed-audio export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p video/history_studio/episodes/titanic-1912/premium_exports
          gh run download 40389781232 --repo "${{ github.repository }}" --name Titanic-Premium-Release-Candidate-Review --dir video/history_studio/episodes/titanic-1912/premium_exports
          test -s video/history_studio/episodes/titanic-1912/premium_exports/Titanic_Complete_Story_1080p.mp4
          test -s video/history_studio/episodes/titanic-1912/premium_exports/shot_list.json
      - name: Rebuild 380 pristine original-voice WAVs, replace damaged audio and render three captioned Shorts
        timeout-minutes: 75
        run: python video/history_studio/episodes/titanic-1912/recover_failed_premium.py
      - name: Confirm full program audio decodes and is in sync
        run: |
          p=video/history_studio/episodes/titanic-1912/premium_exports
          ffmpeg -hide_banner -loglevel error -xerror -i "$p/Titanic_Complete_Story_1080p.mp4" -map 0:a -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('video/history_studio/episodes/titanic-1912/premium_exports')
          data=json.loads((p/'RECOVERY_QA.json').read_text())
          assert data['shots']>=270
          assert data['film_seconds']>=3600
          assert len(data['all_four_video_streams'])==4
          print('REBUILT_FILM_AND_THREE_SHORTS_TECHNICALLY_VERIFIED',data['film_seconds'])
          PY
      - name: Upload clean premium video, three Shorts, metadata, rights and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-Premium-Recovered-Review-Film-and-3-Shorts
          path: |
            video/history_studio/episodes/titanic-1912/premium_exports/Titanic_Complete_Story_1080p.mp4
            video/history_studio/episodes/titanic-1912/premium_exports/Titanic_*_SHORT_1080x1920.mp4
            video/history_studio/episodes/titanic-1912/premium_exports/*.srt
            video/history_studio/episodes/titanic-1912/premium_exports/*.jpg
            video/history_studio/episodes/titanic-1912/premium_exports/*.json
            video/history_studio/episodes/titanic-1912/premium_exports/*.md
            video/history_studio/episodes/titanic-1912/premium_exports/*.txt
          retention-days: 30
          if-no-files-found: warn
