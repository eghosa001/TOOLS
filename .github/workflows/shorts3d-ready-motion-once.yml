name: Reusable 3D motion starter - one-time CC0 cloud cache
on:
  push:
    branches:
      - feat/reusable-3d-motion-starter-20261103
    paths:
      - video/shorts3d/ready_motion/**
      - .github/workflows/shorts3d-ready-motion-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pre-animated CC0 packs and inspect animation files
        run: |
          python video/shorts3d/ready_motion/fetch_ready_motion.py --output artifacts/shorts3d-ready-motion
      - name: Require exactly two verified archives with 3D animations
        run: |
          python - <<'PY'
          import json, pathlib,zipfile
          root=pathlib.Path('artifacts/shorts3d-ready-motion')
          m=json.loads((root/'MOTION_ASSET_MANIFEST.json').read_text())
          assert len(m['packs'])==2
          for p in m['packs']:
              assert p['license']=='CC0-1.0' and p['rigged_file_count']>=1
              assert zipfile.is_zipfile(root/p['archive_file'])
          print('VALIDATED_TWO_REUSABLE_MOTION_PACKS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cc0-ready-humanoid-animation-packs
          path: artifacts/shorts3d-ready-motion/*
          retention-days: 30
          if-no-files-found: error
