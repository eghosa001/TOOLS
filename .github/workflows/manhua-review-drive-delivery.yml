name: Audiobook — deliver verified manhua review MP4 privately to Drive
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story ID from private manhua package"
        required: true
        type: string
      episode:
        description: "Episode number (1-based)"
        required: true
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: audiobook-manhua-private-drive-${{ inputs.story_id }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.DRIVE_OAUTH_CLIENT_JSON }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ vars.AUDIOBOOK_DRIVE_FOLDER_ID }}
      STORY_ID: ${{ inputs.story_id }}
      EPISODE: ${{ inputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only verification and Drive transfer tools
        run: |
          python -m pip install -q kaggle six requests
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Retrieve PRIVATE Qwen narration + manhua art and assemble fast on CPU
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys
          sid=os.environ["STORY_ID"];ep=os.environ["EPISODE"]
          if not re.fullmatch(r"[a-z][a-z0-9-]{1,62}",sid) or not ep.isdecimal() or not 1<=int(ep)<=999:
              raise SystemExit("Invalid story or episode")
          if not all(os.environ.get(k) for k in
                     ("DRIVE_OAUTH_CLIENT_JSON","DRIVE_REFRESH_TOKEN","DRIVE_FOLDER_ID")):
              raise SystemExit("Separate Google Drive write authorization is required")
          owner=os.environ["KAGGLE_USERNAME"]
          if not re.fullmatch(r"[A-Za-z0-9_-]+",owner):raise SystemExit("Invalid Kaggle owner")
          slug="manhua-"+sid[:22].rstrip("-")+"-"+hashlib.sha256(sid.encode()).hexdigest()[:9]
          ref=owner+"/"+slug
          status=subprocess.run(["kaggle","kernels","status",ref],capture_output=True,text=True,timeout=80)
          if status.returncode or "COMPLETE" not in (status.stdout+status.stderr).upper():
              raise SystemExit("Private source-linked Kaggle assets not complete")
          root=pathlib.Path("private-review");root.mkdir(exist_ok=True)
          result=subprocess.run(["kaggle","kernels","output",ref,"-p",str(root),"--force"],
                                capture_output=True,text=True,timeout=900)
          if result.returncode:raise SystemExit("Cannot fetch owner-only Kaggle assets")
          def single(pattern):
              matches=list(root.rglob(pattern))
              if len(matches)!=1:raise SystemExit("Missing or ambiguous private asset "+pattern)
              return matches[0]
          timeline=single("PRIVATE_SCENE_TIMELINE.json")
          audio=single("narration_review.m4a")
          thumb=single("THUMBNAIL_REVIEW.png")
          qa=single("PRIVATE_VISUAL_QA_REPORT.json")
          source=single("PRIVATE_ASSETS_REPORT.json")
          meta=json.loads(source.read_text())
          if meta.get("story_id")!=sid or meta.get("episode")!=int(ep):
              raise SystemExit("Private asset story/episode does not match")
          if meta.get("voice_profile")!="audiobook_ryan_qwen_1p7b_approved_2026_11_06_v1":
              raise SystemExit("Unexpected narrator; Ryan only")
          if meta.get("audio_sha256")!=hashlib.sha256(audio.read_bytes()).hexdigest():
              raise SystemExit("Audio SHA changed after Qwen synthesis")
          if meta.get("thumbnail_sha256")!=hashlib.sha256(thumb.read_bytes()).hexdigest():
              raise SystemExit("Thumbnail hash mismatch")
          target=root/(sid+f"_ep{int(ep):03}_CPU_MANHUA_REVIEW.mp4")
          args=[sys.executable,"-m","video.audiobook_studio.manhua_pipeline.assemble_existing",
                "--audio",str(audio),"--timeline",str(timeline),
                "--thumbnail",str(thumb),"--visual-qa-report",str(qa),
                "--require-visual-qa",
                "--output",str(target),"--motion","none","--preset","ultrafast"]
          subprocess.run(args,check=True,timeout=540)
          assembled=json.loads(target.with_name(target.stem+".assembly.json").read_text())
          if assembled.get("ready_for_youtube") is not False:
              raise SystemExit("Release gate violated")
          with open(os.environ["GITHUB_ENV"],"a") as env:
              env.write("MANHUA_REVIEW_PATH="+str(target)+"\n")
              env.write("MANHUA_REPORT_PATH="+str(target.with_name(target.stem+".assembly.json"))+"\n")
          print("PRIVATE_CPU_MANHUA_REVIEW_ASSEMBLED",
                {"story_id":sid,"episode":ep,"assembly_seconds":assembled["assembly_seconds"],
                 "visual_triage":assembled["visual_quality"]["status"],
                 "full_human_review_required":True,"publicly_published":False})
          PY
      - name: Upload verified owner-review MP4 to private Drive folder (resumable)
        run: python -m video.audiobook_studio.drive_review_delivery --video "$MANHUA_REVIEW_PATH" --report "$MANHUA_REPORT_PATH"
      - name: Confirm no YouTube publication or public sharing
        run: echo 'PRIVATE_DRIVE_COPY_ONLY; no story source printed or released'