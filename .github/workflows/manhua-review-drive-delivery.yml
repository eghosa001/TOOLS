name: Audiobook — deliver verified manhua review MP4 privately to Drive
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story ID from private manhua package"
        required: true
        type: string
      episode:
        description: "Episode number (1-based)"
        required: true
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: audiobook-manhua-private-drive-${{ inputs.story_id }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.DRIVE_OAUTH_CLIENT_JSON }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ vars.AUDIOBOOK_DRIVE_FOLDER_ID }}
      STORY_ID: ${{ inputs.story_id }}
      EPISODE: ${{ inputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only verification and Drive transfer tools
        run: |
          python -m pip install -q kaggle six requests
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Retrieve only matching finished PRIVATE story video
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          sid=os.environ['STORY_ID'];ep=os.environ['EPISODE']
          if not re.fullmatch(r'[a-z][a-z0-9-]{1,62}',sid) or not ep.isdecimal() or not 1<=int(ep)<=999:
              raise SystemExit('Invalid story/episode')
          if not all(os.environ.get(k) for k in ('DRIVE_OAUTH_CLIENT_JSON','DRIVE_REFRESH_TOKEN','DRIVE_FOLDER_ID')):
              raise SystemExit('Connect Drive OAuth once; no video has been uploaded')
          slug='manhua-'+sid[:22].rstrip('-')+'-'+hashlib.sha256(sid.encode()).hexdigest()[:9]
          owner=os.environ['KAGGLE_USERNAME']
          if not re.fullmatch(r'[A-Za-z0-9_-]+',owner):raise SystemExit('Invalid Kaggle account')
          ref=owner+'/'+slug
          status=subprocess.run(['kaggle','kernels','status',ref],capture_output=True,text=True,timeout=80)
          if status.returncode or 'COMPLETE' not in (status.stdout+status.stderr).upper():
              raise SystemExit('Private Kaggle episode is not complete')
          dest=pathlib.Path('private-review');dest.mkdir(exist_ok=True)
          result=subprocess.run(['kaggle','kernels','output',ref,'-p',str(dest),'--force'],capture_output=True,text=True,timeout=900)
          if result.returncode:raise SystemExit('Cannot access private Kaggle output')
          report_matches=list(dest.rglob('MANHUA_REVIEW_REPORT.json'))
          media_matches=list(dest.rglob(f'{sid}_ep{int(ep):03}_MANHUA_REVIEW.mp4'))
          if len(report_matches)!=1 or len(media_matches)!=1:
              raise SystemExit('Expected verified story episode report and MP4 are missing')
          data=json.loads(report_matches[0].read_text())
          if data.get('story_id')!=sid or data.get('episode')!=int(ep) or data.get('ready_for_youtube') is not False:
              raise SystemExit('Wrong story/episode or unexpected publication flag')
          if data.get('voice_profile')!='audiobook_ryan_qwen_1p7b_approved_2026_11_06_v1':
              raise SystemExit('Approved male Ryan narrator not confirmed by source profile')
          if data.get('review_video_sha256')!=hashlib.sha256(media_matches[0].read_bytes()).hexdigest():
              raise SystemExit('MP4 SHA256 does not match private Kaggle report')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('MANHUA_REVIEW_PATH='+str(media_matches[0])+'\n')
              f.write('MANHUA_REPORT_PATH='+str(report_matches[0])+'\n')
          print('MANHUA_PRIVATE_MP4_VERIFIED',{'story_id':sid,'episode':ep,
                                               'private_review_only':True})
          PY
      - name: Upload verified owner-review MP4 to private Drive folder (resumable)
        run: python -m video.audiobook_studio.drive_review_delivery --video "$MANHUA_REVIEW_PATH" --report "$MANHUA_REPORT_PATH"
      - name: Confirm no YouTube publication or public sharing
        run: echo 'PRIVATE_DRIVE_COPY_ONLY; no story source printed or released'