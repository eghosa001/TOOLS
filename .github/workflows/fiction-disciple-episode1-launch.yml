name: Fiction Studio — produce Disciple Episode 1 on private Kaggle
on:
  push:
    branches: [main]
    paths: [".github/workflows/fiction-disciple-episode1-launch.yml"]
permissions:
  contents: read
concurrency:
  group: fiction-disciple-first-episode-production
  cancel-in-progress: false
jobs:
  submit-real-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle client and confidential-source decryption
        run: python -m pip install -q kaggle cryptography
      - name: Decrypt unpublished Episode 1 INSIDE the trusted runner only
        shell: bash
        run: |
          python - <<'PY'
          import base64,io,json,os,pathlib,re,zipfile
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives import hashes
          raw=base64.b64decode(pathlib.Path("video/audiobook_studio/private_inputs/disciple_ep01_sealed.b64").read_text().strip())
          if raw[:5]!=b"FICT1":raise SystemExit("Confidential manuscript transport header wrong")
          token=os.environ["KAGGLE_API_TOKEN"]
          seed=HKDF(algorithm=hashes.SHA256(),length=32,salt=b"fiction-studio-2026-private-transport-v1",info=b"first-episode-transfer-key").derive(token.encode())
          priv=X25519PrivateKey.from_private_bytes(seed)
          pub=X25519PublicKey.from_public_bytes(raw[5:37])
          nonce=raw[37:49]
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=b"fiction-studio-2026-ep1",info=b"private-episode1-manuscript").derive(priv.exchange(pub))
          plaintext=AESGCM(key).decrypt(nonce,raw[49:],b"FICTION_EPISODE_01")
          with zipfile.ZipFile(io.BytesIO(plaintext)) as z:
              if set(z.namelist())!={"story.txt","metadata.json"}:raise SystemExit("Manuscript format invalid")
              meta=json.loads(z.read("metadata.json"))
              script=z.read("story.txt")
          if meta.get("novel")!="The Disciple Who Lost His Name" or len(script.split())<4500:
              raise SystemExit("Unexpected story or missing Episode 1 text")
          if __import__("hashlib").sha256(script).hexdigest()!=meta.get("private_source_sha256"):
              raise SystemExit("Story integrity check failed")
          owner=os.environ["KAGGLE_USERNAME"].strip()
          stage=pathlib.Path("artifacts/fiction-disciple-episode1-private")
          stage.mkdir(parents=True,exist_ok=True)
          runner=pathlib.Path("video/audiobook_studio/kaggle_produce_episode1.py").read_text()
          kernel=("import base64\nPRIVATE_SOURCE_ZIP=base64.b64decode("+repr(base64.b64encode(plaintext).decode())+")\n"+runner)
          (stage/"runner.py").write_text(kernel)
          metadata={"id":owner+"/fiction-disciple-episode1-private-video",
                    "title":"Fiction Studio Disciple Episode 1 — Private 25-Minute Review",
                    "code_file":"runner.py","language":"python","kernel_type":"script",
                    "is_private":True,"enable_gpu":True,"enable_internet":True,
                    "dataset_sources":[],
                    "competition_sources":[],"kernel_sources":[],"model_sources":[]}
          (stage/"kernel-metadata.json").write_text(json.dumps(metadata,indent=2))
          print("EPISODE1_KAGGLE_UPLOAD_READY",
                {"story":"The Disciple Who Lost His Name","private":True,
                 "approved_qwen_ryan_profile_pinned":True,"source_integrity":True,
                 "spoken_content_in_public_GitHub":False})
          PY
      - name: Launch real 25-minute Qwen Ryan narration and illustrated MP4 in PRIVATE Kaggle
        shell: bash
        run: |
          kaggle kernels push -p artifacts/fiction-disciple-episode1-private
          echo "REAL_EPISODE1_PRIVATE_KAGGLE_PRODUCTION_SUBMITTED"
          echo "Notebook: https://www.kaggle.com/code/$KAGGLE_USERNAME/fiction-disciple-episode1-private-video"
          echo "A successful submission does NOT claim finished audio or a finished MP4."
      - name: Confirm output must be checked before presentation or publishing
        if: always()
        run: |
          echo "Private Kaggle kernel output is authoritative for generated MP4."
          echo "No public YouTube upload, public GitHub artifact, or owner audio approval is implied."
