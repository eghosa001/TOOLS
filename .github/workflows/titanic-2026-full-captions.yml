name: "Titanic 2026 — 86-minute full-documentary exact speech subtitles"
on:
  push:
    paths: [".github/workflows/titanic-2026-full-captions.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aligned:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore original 151 Kokoro paragraph recordings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          p=video/history_studio/episodes/titanic-1912/2026_rebuild/recorded_longform
          mkdir -p "$p"
          gh run download 40641194465 --repo "${{ github.repository }}" --name Titanic-2026-151-Paragraph-Kokoro-Audio-Only --dir "$p"
          test -s "$p/NARRATION_TIME_LEDGER.json"
      - name: Install open-source true audio forced alignment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "numpy<2" "stable-ts>=2.19,<3" "soundfile>=0.12"
      - name: Align spoken text throughout 86.88-minute main film to original clean audio
        timeout-minutes: 95
        run: |
          python -u video/history_studio/episodes/titanic-1912/2026_rebuild/force_align_all15_captions.py
      - name: Verify 15 chapters and preserve published master gate
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('video/history_studio/episodes/titanic-1912/2026_rebuild/aligned_captions_all15')
          d=json.loads((p/'ALIGNMENT_QA.json').read_text())
          assert d["chapters"]==15 and d["source_paragraphs"]==151
          assert d["srt_cue_count"]>=900 and not d["estimated_word_timing"]
          assert d["last_caption_seconds"]>=5100 and not d["publication_approved"]
          print("FULL_DOCUMENTARY_SRT_ACTUAL_VOICE_ALIGNED",d['srt_cue_count'])
          PY
      - name: Upload complete accurate draft captions and forced alignment findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-2026-Entire86Minute-Actual-Audio-Aligned-SRT
          retention-days: 30
          if-no-files-found: warn
          path: |
            video/history_studio/episodes/titanic-1912/2026_rebuild/aligned_captions_all15/*.srt
            video/history_studio/episodes/titanic-1912/2026_rebuild/aligned_captions_all15/*.json
