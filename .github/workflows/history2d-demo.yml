name: "History 2D — CPU animated MP4 smoke test"
on:
  workflow_dispatch:
  push:
    paths:
      - "video/history_studio/animation2d/**"
      - ".github/workflows/history2d-demo.yml"
permissions:
  contents: read
jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and FFmpeg
        run: |
          python -m pip install -r video/history_studio/animation2d/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Static tests
        run: python -m unittest discover -s video/history_studio/animation2d/tests -v
      - name: Render actual example with real motion
        run: |
          python video/history_studio/animation2d/engine.py video/history_studio/animation2d/examples/episode.json --output artifacts/history2d-sample.mp4 --encoder cpu --draft
      - name: Verify streams and duration
        run: |
          python - <<'PY'
          import json,subprocess
          v='artifacts/history2d-sample.mp4'
          obj=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',v]))
          tracks={s['codec_type'] for s in obj['streams']}
          assert {'audio','video'}<=tracks,tracks
          assert 4.8<float(obj['format']['duration'])<5.2,obj['format']
          print('REAL_MP4_STREAMS_AND_DURATION_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: history2d-first-motion-test
          path: |
            artifacts/history2d-sample.mp4
            artifacts/history2d-sample.manifest.json
          retention-days: 30
          if-no-files-found: error
