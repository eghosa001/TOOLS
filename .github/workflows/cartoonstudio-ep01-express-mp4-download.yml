name: CartoonStudio E01 Express Existing Video Download NO RENDER
on:
  push:
    branches: [main]
    paths: ["video/episodes/tiny-trails/ep01/EP01_EXPRESS_MP4_RECOVERY_ONCE.txt"]
permissions:
  contents: read
jobs:
  recover-existing-video-only:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client only; never download Blender or install ffprobe
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.5'
      - name: Download EXISTING 480p MP4 with rate-limit retries without GPU calls
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git log -1 --format=%s)" == "CartoonStudio user-authorized existing 480p MP4 express recovery" ]]
          [[ -n "${KAGGLE_API_TOKEN:-}" ]]
          KERNEL="aighewieghosa/tiny-trails-ep01-fast480-gpu"
          mkdir -p actual-video
          SUCCESS=0
          for attempt in 1 2 3 4; do
            if kaggle kernels output "$KERNEL" --file-pattern '.*preview-3s\.mp4$' -p actual-video --page-size 200 -o -q; then
              if find actual-video -name 'tiny-trails-ep01-preview-3s.mp4' -type f -size +10k | grep -q .; then
                SUCCESS=1; break
              fi
            fi
            if (( attempt < 4 )); then sleep $((attempt*20)); fi
          done
          if (( SUCCESS != 1 )); then echo "::error::No MP4 downloaded from Kaggle; do not rerender"; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          p=list(Path("actual-video").rglob("tiny-trails-ep01-preview-3s.mp4"))
          assert len(p)==1 and p[0].stat().st_size>10000
          with p[0].open("rb") as stream:
              header=stream.read(32)
          assert b"ftyp" in header[:12],"Not an MP4 container"
          print("EP01_EXISTING_KAGGLE_MP4_DOWNLOADED",p[0],p[0].stat().st_size)
          print("EP01_NO_GPU_RENDER_OR_KERNEL_UPDATE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Tiny-Trails-E01-480p-Kaggle-Video-Actual-MP4
          path: actual-video/**/*.mp4
          if-no-files-found: error
          retention-days: 30
