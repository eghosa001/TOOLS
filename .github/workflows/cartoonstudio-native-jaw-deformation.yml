name: CartoonStudio Verify Real Native Jaw Deformation on Studio Cat Dog Sprite

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_actual_native_jaw_bone_motion.py
      - .github/workflows/cartoonstudio-native-jaw-deformation.yml

permissions:
  contents: read
  actions: read

jobs:
  test-actual-3d-mouth-deformation:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 40230434307
          name: cartoonstudio-eight-original-blender-studio-rig-masters
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/original-master-library
      - name: Install real Blender deformation evaluator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Test Cat original Blender mesh reacts to physical jaw bone motion
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_actual_native_jaw_bone_motion.py -- \
            artifacts/original-master-library/pets/blender-3.6-splash/pro/lib/char/cat/publish/cat.v001.blend \
            artifacts/evidence/cat-native-jaw.json cat
      - name: Test Dog original Blender mesh reacts to physical jaw bone motion
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_actual_native_jaw_bone_motion.py -- \
            artifacts/original-master-library/pets/blender-3.6-splash/pro/lib/char/dog/publish/dog.v001.blend \
            artifacts/evidence/dog-native-jaw.json dog
      - name: Test Sprite original Blender mesh reacts to physical jaw bone motion
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_actual_native_jaw_bone_motion.py -- \
            artifacts/original-master-library/sprite_fright/030_0020_A/lib/char/sprite/sprite.blend \
            artifacts/evidence/sprite-native-jaw.json sprite
      - name: Upload bone-vertex movement evidence (no stories modified or rendered)
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-three-native-studio-speaker-jaw-geometry-evidence
          path: artifacts/evidence/*.json
          retention-days: 30
          if-no-files-found: error
