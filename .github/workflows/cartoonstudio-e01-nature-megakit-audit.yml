name: CartoonStudio E01 — Verify and Stage Free Quaternius Nature Models (No Render)
on:
  push:
    branches: [main]
    paths:
      - "video/episodes/tiny-trails/ep01/EP01_STYLIZED_NATURE_PACK_CHECK.txt"
  pull_request:
    paths:
      - "video/episodes/tiny-trails/ep01/source_quaternius_nature.py"
      - "video/episodes/tiny-trails/ep01/quaternius_stage.py"
      - "video/episodes/tiny-trails/ep01/test_quaternius_stage.py"
      - "video/episodes/tiny-trails/ep01/build_cc0_woodland.py"
      - "video/episodes/tiny-trails/ep01/attest_asset_pack.py"
      - ".github/workflows/cartoonstudio-e01-nature-megakit-audit.yml"
permissions:
  contents: read
jobs:
  inspect-original-licensed-model-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test no-render ZIP inspection and safety, never generate assets
        run: |
          python -m py_compile video/episodes/tiny-trails/ep01/source_quaternius_nature.py
          python - <<'PY'
          import importlib.util,zipfile,tempfile
          from pathlib import Path
          p=Path('video/episodes/tiny-trails/ep01/source_quaternius_nature.py')
          s=importlib.util.spec_from_file_location('nature_audit',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as d:
              z=Path(d)/'broken.zip'
              with zipfile.ZipFile(z,'w') as f:f.writestr('../malicious.glb',b'glTF')
              try:m.inspect(z)
              except RuntimeError:pass
              else:raise AssertionError('Unsafe archive accepted')
          print('EP01_CC0_NATURE_ZIP_PATH_TRAVERSAL_PROTECTION_PASS')
          PY
      - name: Run ZIP licensing, dependency, checksums and hostile ZIP safety tests
        run: |
          python video/episodes/tiny-trails/ep01/test_quaternius_stage.py -v
          python -m py_compile video/episodes/tiny-trails/ep01/quaternius_stage.py
      - name: Download actual creator-uploaded CC0 models, never paid Source kit
        run: |
          python video/episodes/tiny-trails/ep01/source_quaternius_nature.py \
            --archive artifacts/ep01/real-cc0-nature/stylized_nature_megakitstandard.zip \
            --output artifacts/ep01/real-cc0-nature/original-asset-register.json
      - name: Extract selected original glTF files with complete dependencies, no Blender render
        run: |
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0, 'video/episodes/tiny-trails/ep01')
          from quaternius_stage import select_and_extract
          root=Path('artifacts/ep01/real-cc0-nature')
          report=select_and_extract(root/'stylized_nature_megakitstandard.zip',
                                    root/'selected-source-glTF')
          assert len(report['selected_models'])==15
          assert report['dependency_file_count']>=15
          (root/'SELECTED_SCENERY_EVIDENCE.json').write_text(json.dumps(report,indent=2))
          print('EP01_REAL_ORIGINAL_QUATERNIUS_GLTF_15_DEPENDENCIES_VERIFIED')
          PY
      - name: Save verified REAL original free 3D assets outside git history
        uses: actions/upload-artifact@v4
        with:
          name: ep01-QUATERNIUS-FREE-CC0-stylized-nature-real-models
          path: artifacts/ep01/real-cc0-nature/
          if-no-files-found: error
          retention-days: 14
