name: Audiobook — check private Drive source transfer authorization
on:
  push:
    branches: [main]
    paths: [".github/workflows/audiobook-drive-source-access-check.yml"]
permissions:
  contents: read
jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Check existing Google token can privately read audiobook archive metadata
        run: |
          node - <<'JS'
          (async()=>{
            const raw=process.env.YOUTUBE_OAUTH_CLIENT_JSON||'';
            const refresh=process.env.YOUTUBE_REFRESH_TOKEN||'';
            if(!raw||!refresh){console.log('GOOGLE_REFRESH_CREDS_UNAVAILABLE');return}
            const config=JSON.parse(raw);
            const c=config.installed||config.web||config;
            const rsp=await fetch('https://oauth2.googleapis.com/token',{
              method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
              body:new URLSearchParams({client_id:c.client_id,client_secret:c.client_secret,refresh_token:refresh,grant_type:'refresh_token'})
            });
            if(!rsp.ok){console.log('OAUTH_TOKEN_REFRESH_STATUS',rsp.status);return}
            const token=await rsp.json();
            const scopes=String(token.scope||'').split(' ').map(s=>s.split('/').pop());
            console.log('DRIVE_SCOPE_FOUND',scopes.some(s=>s.startsWith('drive')));
            const id='1mfoSEa_djICTrw_I1nIo9nHqZmDaqR6t';
            const res=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?fields=id%2Cname%2Csize%2CmimeType',{headers:{Authorization:'Bearer '+token.access_token}});
            console.log('PRIVATE_DRIVE_METADATA_STATUS',res.status);
            console.log('PRIVATE_BYTES_FETCHED',0);
          })().catch(e=>{console.log('READ_ONLY_CHECK_FAILED',e.name);process.exitCode=1});
          JS
