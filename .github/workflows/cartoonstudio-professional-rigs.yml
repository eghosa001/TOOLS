name: CartoonStudio Professional Rig Intake — Genuine Blender Studio Assets

on:
  workflow_dispatch:
  push:
    paths:
      - video/fetch_real_studio_rig.py
      - video/high_quality_rig_audit.py
      - video/render_real_studio_rig_still.py
      - .github/workflows/cartoonstudio-professional-rigs.yml

permissions:
  contents: read

jobs:
  audit-real-licensed-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate importer and technical inspection scripts
        run: python -m py_compile video/fetch_real_studio_rig.py video/high_quality_rig_audit.py video/render_real_studio_rig_still.py
      - name: Fetch real historical Blender Studio Rain rig, pin archive Git object hash
        run: |
          python video/fetch_real_studio_rig.py --output artifacts/professional-rigs/rain \
            --env-file "$GITHUB_ENV"
      - name: Install Blender on free CPU runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender libegl1 libgl1-mesa-dri
      - name: Audit artist-authored high-detail Rain topology, full rig and blend shapes
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/high_quality_rig_audit.py -- \
            "$RAIN_MODEL" artifacts/professional-rigs/rain/rig_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/professional-rigs/rain/rig_audit.json").read_text())
          assert x["technical_gate"]
          print("ACTUAL_STUDIO_RIG_VERIFIED", x["mesh_objects"],x["faces"],x["pose_bones"])
          PY
      - name: Render genuine high-quality character (static real-mesh visual inspection only)
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/render_real_studio_rig_still.py -- \
            "$RAIN_MODEL" artifacts/professional-rigs/rain/real_rig_still.png
          test -s artifacts/professional-rigs/rain/real_rig_still.png
      - name: Upload source Rain Blender rig and reproducible inspection report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-verified-professional-rain-rig
          path: |
            artifacts/professional-rigs/rain/source/**
            artifacts/professional-rigs/rain/rig_audit.json
            artifacts/professional-rigs/rain/real_rig_still.png
            artifacts/professional-rigs/rain/VISUAL_QC.json
            artifacts/professional-rigs/rain/IMPORT_MANIFEST.json
          retention-days: 30
          if-no-files-found: error
