name: CartoonStudio CC0 HDRI and PBR Quality Pack

on:
  workflow_dispatch:
  push:
    paths:
      - video/quality_asset_downloads.py
      - video/quality_asset_bridge.py
      - .github/workflows/cartoonstudio-quality-assets.yml

permissions:
  contents: read

concurrency:
  group: cartoonstudio-quality-assets
  cancel-in-progress: true

jobs:
  quality-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve official CC0 HDRI and PBR materials
        run: python video/quality_asset_downloads.py --output artifacts/quality --resolution 2k
      - name: Verify hashes, image formats, licence metadata
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('artifacts/quality')
          meta=json.loads((root/'quality_manifest.json').read_text())
          assert len(meta['materials'])>=2
          assert 'Powered by Poly Haven' in meta['api_credit']
          assert all(set(material['maps'])=={'color','normal','roughness'} for material in meta['materials'])
          for file in meta['files']:
              data=(root/file['file']).read_bytes()
              assert len(data)==file['bytes']
              assert hashlib.sha256(data).hexdigest()==file['sha256']
              assert file['license']=='CC0-1.0'
              assert len(data)>2048
          print('QUALITY_PACK_VERIFIED',len(meta['files']),'downloaded CC0 files')
          PY
      - name: Upload lighting and material library
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-cc0-hdri-pbr
          path: artifacts/quality/**
          if-no-files-found: error
          retention-days: 30
