name: "YouTube ASMR — public channel API audit (read-only)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "video/youtube_research_cloud/src/channel.mjs"
      - "video/youtube_research_cloud/tools/audit_asmr_channel.mjs"
      - ".github/workflows/youtube-asmr-channel-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify audit behavior without credentials
        run: node --test video/youtube_research_cloud/tests/channel.test.mjs
      - name: Read public channel metrics using YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node video/youtube_research_cloud/tools/audit_asmr_channel.mjs
      - name: Store evidence report (no secrets or private analytics)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: surreal-asmr-public-channel-audit
          path: audit-output/surreal-asmr-public.json
          retention-days: 7
