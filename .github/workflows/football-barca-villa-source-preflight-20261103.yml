name: 'Football: Barcelona Villa source-media availability preflight'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-barca-villa-source-preflight-20261103.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-actual-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media introspection tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -U yt-dlp requests
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; fi
          ffprobe -version | head -1
      - name: Check original match video sources from named fixtures
        run: |
          set -u
          mkdir -p football_edit_output/barca_villa_source_preflight
          python - <<'PY'
          import json,subprocess,time
          from pathlib import Path
          checks=[
             {"id":"barca_oct31_sky","match":"Barcelona 6-1 Alaves 2026-10-31",
              "url":"https://www.skysports.com/football/video/13606532/barcelona-6-1-alaves-la-liga-highlights"},
             {"id":"villa_oct31_sky","match":"Aston Villa 1-1 Fulham 2026-10-31",
              "url":"https://www.skysports.com/football/video/13606510/aston-villa-1-1-fulham-premier-league-highlights"},
             {"id":"barca_oct31_club","match":"Barcelona 6-1 Alaves 2026-10-31",
              "url":"https://www.fcbarcelona.com/en/matches/138382/fc-barcelona-alaves-la-liga-2026-2027"},
             {"id":"villa_oct31_club","match":"Aston Villa 1-1 Fulham 2026-10-31",
              "url":"https://next.avfc.co.uk/videos"},
             {"id":"barca_oct31_laliga","match":"Barcelona 6-1 Alaves 2026-10-31",
              "url":"https://www.laliga.com/es-US/videos/el-barca-golea-al-alaves-y-vuelve-a-mirar-arriba"},
             {"id":"historic_1983_footballia","match":"Aston Villa 3-0 Barcelona 1983-01-26",
              "url":"https://footballia.eu/matches/aston-villa-fc-barcelona"},
             {"id":"barca_alaves_official_youtube_lookup","match":"Barcelona 6-1 Alaves 2026-10-31",
              "url":"ytsearch1:FC BARCELONA 6 vs 1 ALAVES LALIGA 2026 27 MD11 official highlights"},
             {"id":"villa_fulham_official_youtube_lookup","match":"Aston Villa 1-1 Fulham 2026-10-31",
              "url":"ytsearch1:Aston Villa Fulham 1-1 31 October 2026 official Premier League highlights"},
             {"id":"villa_barca_1983_youtube_lookup","match":"Aston Villa 3-0 Barcelona 1983-01-26",
              "url":"ytsearch1:Aston Villa FC Barcelona 1983 European Super Cup 3-0 video goals"},
             {"id":"villa_2026_commons","match":"Bournemouth vs Aston Villa 2026-02-08",
              "url":"https://commons.wikimedia.org/wiki/File:Rayan_scores_his_first_goal_for_AFC_Bournemouth_against_Aston_Villa_in_the_2025-26_Premier_League.webm"},
          ]
          out=[]
          for src in checks:
              print('PROBING',src['id'],src['match'],flush=True)
              cmd=['yt-dlp','--dump-single-json','--skip-download','--no-playlist','--no-warnings',
                   '--socket-timeout','10','--retries','1','--extractor-retries','1',src['url']]
              try:
                  run=subprocess.run(cmd,capture_output=True,text=True,timeout=54)
                  if run.returncode!=0:
                      src['status']='blocked_or_unsupported'; src['note']=run.stderr[-600:]
                  else:
                      v=json.loads(run.stdout)
                      src.update({'status':'metadata_accessible','video_id':v.get('id'),
                                  'title':v.get('title'),'uploader':v.get('uploader'),
                                  'duration':v.get('duration'),'width':v.get('width'),
                                  'height':v.get('height'),
                                  'media_url':v.get('webpage_url')})
              except Exception as e:
                  src.update({'status':'error','note':str(e)[:350]})
              print('RESULT',src['id'],src['status'],src.get('title',''),'ERR',src.get('note','')[:320],flush=True)
              out.append(src)
          path=Path('football_edit_output/barca_villa_source_preflight/candidates.json')
          path.write_text(json.dumps(out,indent=2))
          print('ACCESSIBLE',sum(x['status']=='metadata_accessible' for x in out),'OF',len(out))
          PY
      - name: Inspect independent match-highlights indexing for direct authorized media candidates
        run: |
          python - <<'PY'
          import requests,re,html
          from urllib.parse import urlparse
          sites=[
            'https://topbin.app/highlights/barcelona-vs-deportivo-alaves-2026-10-31',
            'https://www.oddsivio.com/matches/115184?tab=videos',
            'https://www.ysscores.com/en/video/384113',
            'https://www.ysscores.com/en/video/385113',
          ]
          for u in sites:
            print('INDEPENDENT_INDEX',u,flush=True)
            try:
              rr=requests.get(u,timeout=14,headers={'User-Agent':'Mozilla/5.0 (compatible; research-review/1.0)'})
              print('INDEX_STATUS',rr.status_code,len(rr.content),flush=True)
              links=[]
              for v in re.findall(r'https?[^"<> ]+',html.unescape(rr.text)):
                if any(z in v for z in ('v.redd.it','streamin.link','streama.in','youtube.com/watch','youtu.be','video.twimg')):
                  clean=v.split('\\')[0].split('&quot;')[0][:250]
                  if clean not in links: links.append(clean)
              print('INDEX_MEDIA_CANDIDATES',links[:15],flush=True)
            except Exception as e: print('INDEX_ERROR',repr(e)[:250],flush=True)
          PY
      - name: Preserve exact observed source status, not imaginary video
        uses: actions/upload-artifact@v4
        with:
          name: Barca-Villa-Actual-Footage-Source-Preflight
          path: football_edit_output/barca_villa_source_preflight/candidates.json
          if-no-files-found: error
          retention-days: 10
