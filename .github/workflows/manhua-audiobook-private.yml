name: Audiobook — private Modal cost-first production
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Approved private story ID"
        required: true
        type: string
      episode:
        description: "Episode (1–999)"
        required: true
        default: "1"
        type: string
      phase:
        description: "CPU preflight, full-story illustration approval audit, or private review"
        required: true
        type: choice
        options: [preflight, illustrations, review]
        default: preflight
      quality:
        description: "Animagine XL 3.1 quality or SDXL Turbo preview"
        required: true
        type: choice
        options: [quality, fast]
        default: quality
      tts_gpu:
        description: "Legacy Ryan inference GPU (review only; previously approved voice standards still apply)"
        required: true
        type: choice
        options: [L4, A10, L40S, A100-40GB, H100]
        default: L4
      art_gpu:
        description: "Legacy art GPU setting (unused by illustration-first default)"
        required: true
        type: choice
        options: [L4, A10, L40S, A100-40GB, H100]
        default: L4
      drive_source_file_id:
        description: "Optional: one-time private Google Drive ZIP ID for migration"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: audiobook-modal-private-studio
  cancel-in-progress: false
jobs:
  modal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.DRIVE_OAUTH_CLIENT_JSON }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ vars.AUDIOBOOK_DRIVE_FOLDER_ID }}
      STORY_ID: ${{ inputs.story_id }}
      EPISODE: ${{ inputs.episode }}
      PHASE: ${{ inputs.phase }}
      QUALITY: ${{ inputs.quality }}
      TTS_GPU: ${{ inputs.tts_gpu }}
      ART_GPU: ${{ inputs.art_gpu }}
      DRIVE_SOURCE_FILE_ID: ${{ inputs.drive_source_file_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU-only source/configuration preflight
        run: |
          python -m compileall -q video/audiobook_studio/manhua_pipeline/modal_production.py
          python -m compileall -q video/audiobook_studio/manhua_pipeline/modal_private_source_transfer.py
          python -m unittest video.audiobook_studio.manhua_pipeline.test_full_story_illustration_gate -v
          python -m unittest video.audiobook_studio.manhua_pipeline.test_dense_illustration_coverage -v
          python - <<'PY'
          import os,re
          if not re.fullmatch(r'[a-z][a-z0-9-]{1,62}', os.environ['STORY_ID']):
              raise SystemExit('Invalid story ID')
          if not os.environ['EPISODE'].isdecimal() or not 1<=int(os.environ['EPISODE'])<=999:
              raise SystemExit('Invalid episode number')
          if not os.environ.get('MODAL_TOKEN_ID') or not os.environ.get('MODAL_TOKEN_SECRET'):
              raise SystemExit('Modal secrets absent. No GPU job has been launched.')
          print('MODAL_CPU_CONFIGURATION_PASS')
          PY
      - name: Install CLI dependencies (no GPU)
        run: python -m pip install -q --disable-pip-version-check modal requests
      - name: Optional one-time private Google Drive to Modal migration
        if: ${{ inputs.drive_source_file_id != '' }}
        run: python -m video.audiobook_studio.manhua_pipeline.modal_private_source_transfer
      - name: Private CPU preflight, whole-story illustration audit, or gated review
        shell: bash
        run: |
          set -euo pipefail
          modal run -m video.audiobook_studio.manhua_pipeline.modal_production \
            --story-id "$STORY_ID" --episode "$EPISODE" --phase "$PHASE" \
            --quality "$QUALITY" --tts-gpu "$TTS_GPU" --art-gpu "$ART_GPU"
          echo 'MODAL_STAGE_PASSED_NO_PUBLISHING'
      - name: Privately deliver the verified review MP4 to Google Drive
        if: ${{ inputs.phase == 'review' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DRIVE_OAUTH_CLIENT_JSON" ] || [ -z "$DRIVE_REFRESH_TOKEN" ] || [ -z "$DRIVE_FOLDER_ID" ]; then
            echo 'DRIVE_DELIVERY_NOT_CONFIGURED; reviewed MP4 remains private in Modal Volume'
            exit 0
          fi
          python - <<'PY'
          import json,os,pathlib,subprocess,tempfile
          from video.audiobook_studio.manhua_pipeline.core import open_package
          from video.audiobook_studio.drive_review_delivery import authorized_token,upload_private_review
          with tempfile.TemporaryDirectory(prefix='private-review-') as tmp:
              folder=pathlib.Path(tmp)
              zip_path=folder/'MANHUA_STORY_PACKAGE.zip'
              story=os.environ['STORY_ID'];ep=int(os.environ['EPISODE'])
              subprocess.run(['modal','volume','get','--force',
                  'audiobook-manhua-private-sources',
                  'source/'+story+'/MANHUA_STORY_PACKAGE.zip',str(zip_path)],
                  check=True,stdout=subprocess.DEVNULL)
              meta,_,_=open_package(zip_path,expected_story_id=story,episode=ep)
              fingerprint=meta['episodes'][ep-1]['sha256'][:16]
              prefix=story+'/ep%03d-'%ep+fingerprint+'/'
              title=story+'_ep%03d_MANHUA_REVIEW.mp4'%ep
              video=folder/title
              report=folder/'MANHUA_REVIEW_REPORT.json'
              for name,dest in ((title,video),('MANHUA_REVIEW_REPORT.json',report)):
                  subprocess.run(['modal','volume','get','--force',
                       'audiobook-manhua-private-reviews',prefix+name,str(dest)],
                       check=True,stdout=subprocess.DEVNULL)
              token=authorized_token(refresh_token=os.environ['DRIVE_REFRESH_TOKEN'],
                      client_json=os.environ['DRIVE_OAUTH_CLIENT_JSON'])
              outcome=upload_private_review(video,folder_id=os.environ['DRIVE_FOLDER_ID'],
                                             token=token,report_path=report)
              if not outcome.get('review_only'): raise SystemExit('Drive review copy was not private')
              print('PRIVATE_GOOGLE_DRIVE_REVIEW_UPLOADED_AND_HASH_VERIFIED')
          PY
