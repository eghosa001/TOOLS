name: Ninefold Tide pipeline checks
on:
  push:
    paths:
      - 'video/ninefold_tide/**'
      - '.github/workflows/ninefold-pipeline.yml'
  pull_request:
    paths:
      - 'video/ninefold_tide/**'
      - '.github/workflows/ninefold-pipeline.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source code and director-approved timecode model
        run: |
          python -m compileall -q video/ninefold_tide
          python -m unittest discover -s video/ninefold_tide/tests -v
          python video/ninefold_tide/pipeline.py validate --stage structure
      - name: Confirm unfinished low-quality proof is rejected
        run: |
          python video/ninefold_tide/pipeline.py init --workspace /tmp/ninefold-first-proof
          if python video/ninefold_tide/quality_gate.py --review /tmp/ninefold-first-proof/07_review/ep101_first_proof.json; then
            echo "::error::An unfinished quality template incorrectly passed"
            exit 1
          fi
      - name: Verify the 14-character voice cast and original seven lines
        run: |
          python -m compileall -q video/ninefold_tide/audio
          python -m unittest discover -s video/ninefold_tide/audio/tests -v
          python video/ninefold_tide/audio/voice_pipeline.py audit --stage structure
          python video/ninefold_tide/audio/voice_pipeline.py prepare --workspace /tmp/ninefold-audio
          if python video/ninefold_tide/audio/voice_pipeline.py audit --stage release --workspace /tmp/ninefold-audio; then
            echo "::error::Unheard synthetic voices incorrectly passed the full-quality release gate"
            exit 1
          fi
      - name: Verify workspace bootstrap and tooling manifest
        run: |
          python video/ninefold_tide/pipeline.py init --workspace /tmp/ninefold-work
          python video/ninefold_tide/pipeline.py doctor > ninefold-tool-report.json
          cat ninefold-tool-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ninefold-preproduction-tool-report
          path: ninefold-tool-report.json
          retention-days: 14
