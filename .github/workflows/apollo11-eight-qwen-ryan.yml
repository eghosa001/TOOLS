name: "Facts Uncovered - Apollo 11 eight-minute Qwen Ryan voice"
on:
  push:
    branches: [production/apollo11-8min-real-archival-20261104]
    paths:
      - "video/history_studio/productions/apollo11_eight_minute/qwen_voice.py"
      - ".github/workflows/apollo11-eight-qwen-ryan.yml"
permissions:
  contents: read
jobs:
  qwen-ryan:
    strategy:
      fail-fast: false
      matrix:
        chapter: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install CPU Qwen3 1.7B CustomVoice Ryan with FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libsndfile1
          python -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -q --disable-pip-version-check 'transformers==4.57.3' 'accelerate==1.12.0' soundfile librosa sox onnxruntime einops
          python -m pip install -q --no-deps 'qwen-tts==0.1.1'
          python -c 'import qwen_tts,torch; print("QWEN_1P7_MODEL_CPU_READY",torch.__version__)'
      - name: Generate genuine Qwen3 1.7B Ryan audio; no substitute
        run: |
          python video/history_studio/productions/apollo11_eight_minute/qwen_voice.py --chapter ${{ matrix.chapter }}
      - name: Preserve exact narration and per-beat time ledger for assembly
        uses: actions/upload-artifact@v4
        with:
          name: Apollo11Eight-QwenRyan-Chapter-${{ matrix.chapter }}
          path: delivery/apollo11_eight/qwen/ch*/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
