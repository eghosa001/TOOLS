name: CartoonStudio High-Detail Pet Material Restoration — Real GLB Visual Test

on:
  workflow_dispatch:
  push:
    paths:
      - video/restore_original_studio_pet_materials.py
      - .github/workflows/cartoonstudio-restore-pets-materials.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-materials-and-rigs:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve passing original full-quality Cat/Dog GLBs
        uses: actions/download-artifact@v4
        with:
          run-id: 40226616719
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-verified-professional-cat-dog-glb
          path: artifacts/original-assets
      - name: Restore review PBR colours (without changing artist meshes)
        run: |
          python video/restore_original_studio_pet_materials.py \
            artifacts/original-assets/verified-professional-pets \
            artifacts/material-restored
          test -s artifacts/material-restored/cat-studio-restored.glb
          test -s artifacts/material-restored/dog-studio-restored.glb
      - name: Install Blender CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Actually render colour-restored Cat and Dog
        run: |
          for actor in cat dog; do
            blender -b -t 2 --disable-autoexec --python-exit-code 1 \
              --python video/render_real_glb_quality_still.py -- \
              "artifacts/material-restored/$actor-studio-restored.glb" \
              "artifacts/material-restored/$actor-studio-restored.png"
            test -s "artifacts/material-restored/$actor-studio-restored.png"
          done
      - name: Check real armatures and facial shapes survive Godot import
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p artifacts/review-godot/assets
          cp artifacts/material-restored/*-studio-restored.glb artifacts/review-godot/assets/
          cat > artifacts/review-godot/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="High Detail Character Materials Audit"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          cat > artifacts/review-godot/inspect.gd <<'EOF'
          extends SceneTree
          func _init() -> void:
              for key in ["cat", "dog"]:
                  var path: String = "res://assets/" + String(key) + "-studio-restored.glb"
                  var scene := load(path) as PackedScene
                  if scene == null:
                      push_error("COLOUR_RESTORATION_GLB_IMPORT_FAILED "+key)
                      quit(1)
                      return
                  var actor := scene.instantiate()
                  var rig := actor.find_children("*", "Skeleton3D", true, false)
                  var meshes := actor.find_children("*", "MeshInstance3D", true, false)
                  var morph := 0
                  for item in meshes:
                      var mesh := item as MeshInstance3D
                      if mesh.mesh != null:
                          morph += mesh.mesh.get_blend_shape_count()
                  print("REAL_STUDIO_RESTORED ",key," rigs=",rig.size()," meshes=",meshes.size()," facial_morphs=",morph)
                  if rig.is_empty() or meshes.size()<20 or morph<10:
                      push_error("PROFESSIONAL_CHARACTER_DATA_DAMAGED "+key)
                      quit(1)
                      return
                  actor.free()
              print("STUDIO_PETS_RESTORED_MATERIALS_GODOT_PASS")
              quit(0)
          EOF
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path artifacts/review-godot --editor --import --quit
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path artifacts/review-godot --script res://inspect.gd \
            --log-file /tmp/restore-godot.log
          grep -q "STUDIO_PETS_RESTORED_MATERIALS_GODOT_PASS" /tmp/restore-godot.log
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-original-rig-recolored-review
          path: artifacts/material-restored/*
          retention-days: 30
          if-no-files-found: error
