name: Ninefold S1 art source preflight

on:
  pull_request:
    paths:
      - "video/ninefold_tide/ops/art_preflight.py"
      - "video/ninefold_tide/ops/cam03b_blender_probe.py"
      - "video/ninefold_tide/ops/ART_PREFLIGHT.md"
      - "video/ninefold_tide/tests/test_art_preflight.py"
      - ".github/workflows/ninefold-art-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-offline-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check offline scripts
        run: python -m py_compile video/ninefold_tide/ops/art_preflight.py video/ninefold_tide/ops/cam03b_blender_probe.py
      - name: Run art source intake unit tests
        run: python -m unittest discover -s video/ninefold_tide/tests -p test_art_preflight.py -v
      - name: Verify missing private art blocks release
        run: |
          python video/ninefold_tide/ops/art_preflight.py --report "$RUNNER_TEMP/art_preflight.json" >/dev/null
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/art_preflight.json')); assert d['status']=='BLOCKED' and d['creative_release_approval'] is False"
