name: Satisfying Studio quality-gate tests

on:
  pull_request:
    paths:
      - "video/satisfying_studio/**"
      - ".github/workflows/satisfying-studio-gates.yml"
  push:
    branches: [main]
    paths:
      - "video/satisfying_studio/**"
      - ".github/workflows/satisfying-studio-gates.yml"

jobs:
  fail-closed-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg required by existing video-focused tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffprobe -version | head -1
      - name: Run unit tests
        run: python -m unittest discover -v -s video/satisfying_studio -p 'test_*.py'
      - name: Check real physics scripts for syntax and shell errors
        run: |
          python -m py_compile \
            video/satisfying_studio/production/build_cohesive_episode.py \
            video/satisfying_studio/production/make_three_minute_texture_lab.py \
            video/satisfying_studio/production/prismatic_gel_scene.py \
            video/satisfying_studio/production/blender_softbody_prepare.py \
            video/satisfying_studio/production/kaggle_five_second_preview.py \
            video/satisfying_studio/production/sph_fluid_pipeline.py \
            video/satisfying_studio/production/director_logic.py \
            video/satisfying_studio/production/director_commands.py \
            video/satisfying_studio/production/director_apply.py \
            video/satisfying_studio/production/director_vision.py \
            video/satisfying_studio/production/director_export_context.py \
            video/satisfying_studio/production/director_render_checkpoints.py \
            video/satisfying_studio/physics_verify.py
          bash -n video/satisfying_studio/production/install_sph_tools.sh
          echo "SCRIPT_SYNTAX_GATE_PASSED_NOT_SIMULATION_APPROVAL"
