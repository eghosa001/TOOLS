name: "Titanic Chapter10 — targeted source-specific survival evidence tests"
on:
  push:
    branches: [fix/titanic-ch09-evacuation-authentic-first]
    paths: [".github/workflows/titanic-2026-chapter10-sourcing-tests.yml"]
permissions:
  contents: read
jobs:
  sourcing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test only Titanic Chapter10 original scene IDs, photo types, licence safeguards and source captions
        run: python -m unittest discover -s video/history_studio/episodes/titanic-1912/2026_rebuild/source_first_repair -p 'test_ch10_real_survival_sources.py' -v
