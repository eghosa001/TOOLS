name: CartoonStudio Actual MP4 Delivery Format Regression (Synthetic QA Only)

on:
  workflow_dispatch:
  push:
    paths:
      - video/cartoonstudio_video_delivery_gate.py
      - video/test_cartoonstudio_video_delivery.py
      - .github/workflows/cartoonstudio-video-delivery-qa.yml

permissions:
  contents: read

jobs:
  verify-delivery-guards-with-synthetic-test-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify real H264 720p 24fps with AAC and reject broken examples
        run: |
          python -m py_compile video/cartoonstudio_video_delivery_gate.py video/test_cartoonstudio_video_delivery.py
          python video/test_cartoonstudio_video_delivery.py
      - name: Report honest limits
        run: |
          echo "SUCCESS: synthetic non-episode MP4 acceptance tests passed."
          echo "NOT CLAIMED: approved 3D character, actual Kaggle render, series preview or production-ready cast."
