name: Audiobook — unlimited manhua offline integrity tests
on:
  pull_request:
    paths:
      - 'video/audiobook_studio/manhua_pipeline/**'
      - 'video/audiobook_studio/tests/test_manhua_unlimited.py'
      - 'video/audiobook_studio/tests/test_dual_gpu_dispatch.py'
      - '.github/workflows/manhua-*.yml'
      - 'video/audiobook_studio/drive_review_delivery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate YAML and imports without GPU/network
        run: |
          python -m pip install -q pyyaml requests
          python - <<'PY'
          import pathlib,yaml
          for file in pathlib.Path('.github/workflows').glob('manhua-*.yml'):
              obj=yaml.safe_load(file.read_text())
              assert isinstance(obj,dict) and 'jobs' in obj
          PY
          python -m compileall -q video/audiobook_studio/manhua_pipeline
      - name: Compile private dual-GPU dispatch and generated Kaggle bootstrap offline
        run: |
          python - <<'PY'
          import ast, json, os, pathlib, yaml
          path=pathlib.Path('.github/workflows/manhua-dual-t4-auto-dispatch.yml')
          stages=yaml.safe_load(path.read_text())['jobs']['enqueue-and-launch']['steps']
          scripts=[]
          for stage in stages:
              shell=stage.get('run','')
              if "python - <<'PY'\n" in shell:
                  script=shell.split("python - <<'PY'\n",1)[1].rsplit("\nPY",1)[0]
                  ast.parse(script,filename=stage.get('name','inline Python'))
                  scripts.append((stage.get('name',''),script))
          assert len(scripts)==3,'Expected 3 checked Python program blocks'
          name,build=next((n,c) for n,c in scripts if n.startswith('Build PRIVATE'))
          os.environ.update(KAGGLE_USERNAME='ci-test-owner',
              QUEUE_REF='ci-test-owner/private-queue',
              RESULTS_REF='ci-test-owner/private-results')
          exec(compile(build,'private-controller-bootstrap','exec'),{})
          out=pathlib.Path('artifacts/manhua-dual-gpu')
          ast.parse((out/'runner.py').read_text(),filename='generated Kaggle supervisor')
          metadata=json.loads((out/'kernel-metadata.json').read_text())
          assert metadata['is_private'] and metadata['enable_gpu']
          assert metadata['machine_shape']=='NvidiaTeslaT4'
          assert 'MANHUA_KAGGLE_API_TOKEN' in (out/'runner.py').read_text()
          print('DUAL_T4_WORKFLOW_SCRIPT_SYNTAX_PASS')
          PY
      - name: Test unlimited registry, private source, cache and scene/video integrity
        run: python -m unittest video.audiobook_studio.tests.test_manhua_unlimited video.audiobook_studio.tests.test_dual_gpu_dispatch -v
      - name: Confirm no GPU and no publication
        run: echo 'MANHUA_OFFLINE_CHECKS_ONLY; no private manuscripts or media accessed'