name: CartoonStudio Import Ready-Made CC0 Rigs

on:
  workflow_dispatch:
  push:
    paths:
      - video/import_ready_rigged_cast.py
      - video/godot_studio/scripts/online_rigged_gallery.gd
      - video/godot_studio/scenes/online_rigged_gallery.tscn
      - .github/workflows/cartoonstudio-import-ready-rigs.yml

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import published commercial-use CC0 character assets
        run: python video/import_ready_rigged_cast.py artifacts/godot-ready/assets/online_ready
      - name: Assemble reusable Godot character gallery
        run: |
          mkdir -p artifacts/godot-ready/scripts artifacts/godot-ready/scenes
          cp video/godot_studio/scripts/online_rigged_gallery.gd artifacts/godot-ready/scripts/
          cp video/godot_studio/scenes/online_rigged_gallery.tscn artifacts/godot-ready/scenes/
          cat > artifacts/godot-ready/project.godot <<'GODOT'
          config_version=5

          [application]
          config/name="CartoonStudio Ready-Made 3D Character Rig Review"
          run/main_scene="res://scenes/online_rigged_gallery.tscn"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          GODOT
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/godot-ready/assets/online_ready/ready_cast_manifest.json')
          m=json.loads(p.read_text())
          assert len(m['variants']) == 15
          assert len(m['original_models']) == 5
          assert all(item['built_in_animations'] >= 5 and item['skeleton_skins'] >= 1 for item in m['original_models'].values())
          print('VERIFIED_ARTIST_MADE_RIGS five base GLBs; fifteen reusable configurable cast slots')
          PY
      - name: Download official Godot
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/cartoon-godot.zip
          mkdir -p /tmp/cartoon-godot
          unzip -q /tmp/cartoon-godot.zip -d /tmp/cartoon-godot
          chmod +x /tmp/cartoon-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import actual artist-authored GLBs into Godot
        run: |
          /tmp/cartoon-godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path artifacts/godot-ready --editor --import --quit \
            --log-file /tmp/ready-rig-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading script' /tmp/ready-rig-import.log; then
            exit 1
          fi
      - name: Test fifteen live instances contain skeletons and play animations
        run: |
          /tmp/cartoon-godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path artifacts/godot-ready --quit-after 90 \
            --log-file /tmp/ready-rig-gallery.log
          grep -q 'ONLINE_GODOT_READY base_models=5 variants=15 skeletons=15 animated=15' /tmp/ready-rig-gallery.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading script' /tmp/ready-rig-gallery.log; then
            exit 1
          fi
      - name: Upload verified ready-made Godot character pack
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-online-animated-rigged-characters
          path: artifacts/godot-ready/**
          retention-days: 30
          if-no-files-found: error
