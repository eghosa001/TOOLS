name: CartoonStudio Studio-Fidelity Native DOGWALK Character Assets

on:
  workflow_dispatch:
  push:
    paths:
      - video/export_native_blender_studio_actor_review.py
      - .github/workflows/cartoonstudio-native-dogwalk-quality.yml

permissions:
  contents: read

jobs:
  build-authentic-native-rigs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download original licensed professional Blender Studio DOGWALK source project
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1200 \
            https://download.blender.org/demo/splash/blender-4.5-splash.blend \
            -o /tmp/dogwalk-original.blend
          test -s /tmp/dogwalk-original.blend
      - name: Install official Blender 4.5 artist version with hash verification
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 1200 \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
            -o /tmp/blender-original.tar.xz
          curl --fail --location --retry 3 --silent --show-error \
            https://download.blender.org/release/Blender4.5/blender-4.5.13.sha256 \
            -o /tmp/original-hashes.sha256
          grep blender-4.5.13-linux-x64.tar.xz /tmp/original-hashes.sha256 \
            | sed 's|blender-4.5.13-linux-x64.tar.xz|/tmp/blender-original.tar.xz|' \
            > /tmp/blender-verify.sha256
          sha256sum --check /tmp/blender-verify.sha256
          mkdir -p /tmp/hq-blender
          tar -xJf /tmp/blender-original.tar.xz -C /tmp/hq-blender
      - name: Install runtime graphics libraries required by official Blender 4.5 Cycles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libosmesa6 libx11-6
      - name: Preserve authentic Chocomel rig and materials in separate native Blender actor
        run: |
          /tmp/hq-blender/blender-4.5.13-linux-x64/blender \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_native_blender_studio_actor_review.py -- \
            /tmp/dogwalk-original.blend artifacts/native-dogwalk dogwalk chocomel
      - name: Preserve authentic Pinda rig and materials in separate native Blender actor
        run: |
          /tmp/hq-blender/blender-4.5.13-linux-x64/blender \
            -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_native_blender_studio_actor_review.py -- \
            /tmp/dogwalk-original.blend artifacts/native-dogwalk dogwalk pinda
      - name: Require original Blender character assets and real rendered material previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('artifacts/native-dogwalk')
          names=('chocomel','pinda')
          for name in names:
              blend=root/f'{name}-native-studio.blend'
              png=root/f'{name}-actual-native-render.png'
              assert blend.stat().st_size>70000
              assert png.stat().st_size>15000
          print('TRUE_HIGH_FIDELITY_NATIVE_DOGWALK_CHARACTER_LIBRARIES',names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-artist-original-materials-dogwalk-native
          path: artifacts/native-dogwalk/*
          if-no-files-found: error
          retention-days: 30
