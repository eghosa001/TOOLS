name: Audiobook — encrypted private MP4 handoff to connected Google Drive
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobook-private-encrypted-drive-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiobook-eternal-dao-private-encrypted-handoff
  cancel-in-progress: false
jobs:
  encrypted-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      TRANSFER_PUBLIC_KEY_B64: laqbx56p5H9pz9fQxuOKfb+rT7QlDSUO1A8h71bhjkU=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated Kaggle client and authenticated encryption
        run: python -m pip install -q --disable-pip-version-check kaggle six cryptography
      - name: Recover finished private MP4 and encrypt BEFORE uploading to public-repo artifact service
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zipfile,secrets
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives.ciphers import Cipher,algorithms,modes
          assert os.environ['KAGGLE_USERNAME']=='aighewieghosa'
          data=pathlib.Path('private_input');data.mkdir()
          ref='aighewieghosa/eternal-dao-d03-ep01-fast-private-review'
          subprocess.run(['kaggle','datasets','download','-d',ref,'-p',str(data),'--unzip'],check=True,timeout=850)
          video=data/'Eternal_Dao_D03_Ep01_FAST_PRIVATE_REVIEW.mp4'
          thumbnail=data/'THUMBNAIL_REVIEW.png'
          summary=data/'PRIVATE_REVIEW_SUMMARY.json'
          if not all(p.is_file() for p in (video,thumbnail,summary)):
              raise RuntimeError('Required private video, thumbnail or review report missing')
          expected_hash='e309e040ec488359053a85cec957c35cba17773f138e88da6d59d5f69771f4de'
          h=hashlib.sha256()
          with video.open('rb') as f:
              for block in iter(lambda:f.read(4*1024*1024),b''):h.update(block)
          if h.hexdigest()!=expected_hash or video.stat().st_size!=207104862:
              raise RuntimeError('Source MP4 differs from the previously verified complete video')
          print('PRIVATE_MP4_SHA_AND_BYTES_VERIFIED',video.stat().st_size,flush=True)
          package=pathlib.Path('private_package.zip')
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for item in (video,thumbnail,summary):
                  z.write(item,item.name)
          # One-time X25519 exchange with local private key kept OUT of GitHub.
          recipient=X25519PublicKey.from_public_bytes(base64.b64decode(os.environ['TRANSFER_PUBLIC_KEY_B64']))
          ephemeral=X25519PrivateKey.generate()
          salt=secrets.token_bytes(16)
          nonce=secrets.token_bytes(12)
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=salt,
                   info=b'private-eternal-dao-ep01-google-drive-relay-v1').derive(ephemeral.exchange(recipient))
          encryptor=Cipher(algorithms.AES(key),modes.GCM(nonce)).encryptor()
          encryptor.authenticate_additional_data(b'eternal-dao-d03-ep01-approved-review')
          folder=pathlib.Path('cipher');folder.mkdir()
          size_limit=32*1024*1024
          idx=0;received=0;current=None;size=0
          def add(data):
              global idx,current,size,received
              while data:
                  if current is None:
                      current=(folder/('part-%02d.bin'%idx)).open('wb')
                      size=0
                  part=data[:size_limit-size]
                  current.write(part)
                  size+=len(part);received+=len(part)
                  data=data[len(part):]
                  if size==size_limit:
                      current.close();current=None;idx+=1
          with package.open('rb') as f:
              for block in iter(lambda:f.read(4*1024*1024),b''):
                  add(encryptor.update(block))
          add(encryptor.finalize())
          if current is not None:
              current.close()
          parts=sorted(folder.glob('part-*.bin'))
          manifest={
              'v':1,'algorithm':'AES-256-GCM+X25519+HKDF-SHA256',
              'ephemeral_b64':base64.b64encode(ephemeral.public_key().public_bytes(
                  serialization.Encoding.Raw,serialization.PublicFormat.Raw)).decode(),
              'salt_b64':base64.b64encode(salt).decode(),
              'nonce_b64':base64.b64encode(nonce).decode(),
              'tag_b64':base64.b64encode(encryptor.tag).decode(),
              'cipher_bytes':received,'part_count':len(parts),
              'package_sha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'verified_mp4_sha256':expected_hash,
              'private_file_names':[video.name,thumbnail.name,summary.name],
          }
          (folder/'manifest.json').write_text(json.dumps(manifest))
          if not 6<=len(parts)<=8:
              raise RuntimeError('Expected seven encrypted chunks for full private video')
          print('PRIVATE_DRIVE_TRANSFER_ENCRYPTED_ONLY',json.dumps({
              'part_count':len(parts),'cipher_bytes':received,
              'all_parts_encrypted':True,'plaintext_uploaded_to_GitHub':False}),flush=True)
          # Remove the private source bytes before artifact upload begins.
          import shutil
          shutil.rmtree(data)
          package.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-metadata, path: cipher/manifest.json, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-00, path: cipher/part-00.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-01, path: cipher/part-01.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-02, path: cipher/part-02.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-03, path: cipher/part-03.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-04, path: cipher/part-04.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-05, path: cipher/part-05.bin, retention-days: 1, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: audiobook-encrypted-06, path: cipher/part-06.bin, retention-days: 1, compression-level: 0}
      - name: Confirm no plaintext media was included in public-repository artifacts
        run: |
          test ! -e private_input
          test ! -e private_package.zip
          test -f cipher/manifest.json
          echo 'ONLY ENCRYPTED 32MB CHUNKS UPLOADED FOR PRIVATE DRIVE HANDOFF'
