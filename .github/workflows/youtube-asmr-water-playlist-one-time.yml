name: "ASMR — apply approved water playlist (one time)"
on:
  push:
    branches: [main]
    paths:
      - "video/youtube_research_cloud/requests/water-playlist-2026-11-02.json"
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'eghosa001/TOOLS'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check exact one-time scope
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('video/youtube_research_cloud/requests/water-playlist-2026-11-02.json','utf8'));
          const expected=['YQByazV5lWU','fn_pI5rHo6c'];
          if(m.channelId!=='UC9PFLzcnIYHVGy_svH86jyw' ||
             m.playlistTitle!=='Water & Rain ASMR' ||
             JSON.stringify(m.videoIds)!==JSON.stringify(expected) ||
             m.userAuthorizedRequest!=='So make improvements' ||
             m.action!=='create-or-extend-public-playlist') {
            throw Error('Unrecognized or expanded ASMR playlist request; refusing dispatch');
          }
          console.log('Approved scope: verified ASMR channel, one playlist, two videos');
          JS
      - name: Run existing manual-confirmation playlist workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run youtube-asmr-water-playlist.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm=yes
          echo "Dispatched playlist workflow with explicit confirm=yes; check the separate run for actual YouTube verification."
