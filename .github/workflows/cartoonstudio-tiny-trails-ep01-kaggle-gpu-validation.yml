name: CartoonStudio E01 Kaggle GPU — No-Render Syntax and Safety Validation

on:
  push:
    paths:
      - ".github/workflows/cartoonstudio-tiny-trails-ep01-kaggle-gpu.yml"
      - ".github/workflows/cartoonstudio-tiny-trails-ep01-kaggle-gpu-validation.yml"
      - "video/episodes/tiny-trails/ep01/**"
  pull_request:
    paths:
      - ".github/workflows/cartoonstudio-tiny-trails-ep01-kaggle-gpu.yml"
      - ".github/workflows/cartoonstudio-tiny-trails-ep01-kaggle-gpu-validation.yml"
      - "video/episodes/tiny-trails/ep01/**"

permissions:
  contents: read

jobs:
  gpu-gates-no-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile real CUDA renderer, Kaggle packager and private kernel source
        run: |
          python -m py_compile \
            video/episodes/tiny-trails/ep01/render_ep01_native.py \
            video/episodes/tiny-trails/ep01/prepare_kaggle_gpu.py \
            video/episodes/tiny-trails/ep01/kaggle_ep01_gpu_preview.py
      - name: Install offline workflow YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Assert operation gates, secrets, private Kaggle kernel and no full mode
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path(".github/workflows/cartoonstudio-tiny-trails-ep01-kaggle-gpu.yml")
          raw=p.read_text()
          workflow=yaml.safe_load(raw)
          trigger=workflow.get("on",workflow.get(True))
          assert "workflow_dispatch" in trigger and len(trigger)==1
          inputs=trigger["workflow_dispatch"]["inputs"]
          assert inputs["operation"]["options"]==["prepare_only","preview_3_seconds"]
          assert inputs["operation"]["default"]=="prepare_only"
          assert inputs["confirm_public_preview"]["default"] is False
          assert "secrets.KAGGLE_API_TOKEN" in raw
          assert "RUN_EP01_3_SECOND_PREVIEW" in raw
          assert "kaggle kernels push" in raw and "--no-run" in raw
          assert "NvidiaTeslaT4" in raw and "kaggle datasets create" in raw
          assert "--mode preview" not in raw or "--mode preview" in Path("video/episodes/tiny-trails/ep01/kaggle_ep01_gpu_preview.py").read_text()
          assert "full_render" not in inputs
          source=Path("video/episodes/tiny-trails/ep01/kaggle_ep01_gpu_preview.py").read_text()
          assert '"--mode","preview"' in source and '"--render-device","cuda_cycles"' in source
          assert "KAGGLE_API_TOKEN" not in source
          renderer=Path("video/episodes/tiny-trails/ep01/render_ep01_native.py").read_text()
          assert "EP01_NO_USABLE_CUDA_DEVICE_STOP_BEFORE_RENDER" in renderer
          assert "EP01_FRAME_DONE" in renderer
          assert "set_gpu_cycles(scene)" in renderer
          assert "scene.frame_end=72 if opts.mode==" in renderer
          assert "check_legacy()" in renderer
          print("EP01_KAGGLE_GPU_OFFLINE_MANUAL_GATES_PREVIEW_ONLY_PASS")
          PY
      - name: Confirm old 74-line story is still protected and story QA passes without rendering
        run: |
          python video/episodes/tiny-trails/ep01/episode_preflight.py --output /tmp/ep01-cues
          test -f /tmp/ep01-cues/subtitles.srt
          test ! -e /tmp/ep01-cues/tiny-trails-ep01-preview-3s.mp4
      - name: Ensure packager fails without any genuine source asset pack
        run: |
          if python video/episodes/tiny-trails/ep01/prepare_kaggle_gpu.py \
               --repo . --asset-dir /tmp/ep01-does-not-exist \
               --audio-dir /tmp/ep01-no-audio --destination /tmp/ep01-unused \
               --kaggle-owner dummyaccount; then
            echo "::error::The GPU asset packager accepted missing artist models."
            exit 1
          fi
          echo "EP01_GPU_FAIL_CLOSED_WHEN_ASSET_BYTES_NOT_ATTACHED"
