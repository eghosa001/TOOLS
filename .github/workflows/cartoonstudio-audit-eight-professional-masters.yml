name: CartoonStudio Audit Eight Real Professional Character Master Rigs

on:
  workflow_dispatch:
  push:
    paths:
      - video/audit_native_professional_library.py
      - .github/workflows/cartoonstudio-audit-eight-professional-masters.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Import verified original eight character masters (not low-detail GLBs)
        uses: actions/download-artifact@v4
        with:
          run-id: 40229628051
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cartoonstudio-eight-original-blender-studio-rig-masters
          path: artifacts/master-library
      - name: Install Blender to open all eight actual original film-rig files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Verify source file riggings, face shape keys, all texture dependencies and node libraries
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/audit_native_professional_library.py -- \
            artifacts/master-library artifacts/quality-audit/eight-character-report.json
          test -s artifacts/quality-audit/eight-character-report.json
      - name: Upload audit report; do not imply an approved cartoon series
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-eight-native-master-integrity-audit
          path: artifacts/quality-audit/eight-character-report.json
          retention-days: 30
          if-no-files-found: error
