name: Audiobook Graves EP01 — private encrypted input relay
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobook-graves-ep01-secure-relay.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: graves-ep01-onetime-relay
  cancel-in-progress: false
jobs:
  secure-input:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install secure transport and Kaggle
        run: python -m pip install -q --disable-pip-version-check cryptography requests kaggle six
      - name: Receive private source encrypted end-to-end and upload directly to private Kaggle
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,time,zipfile
          import requests
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.exceptions import InvalidTag
          repo=os.environ['GH_REPO'];token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          root='https://api.github.com/repos/'+repo+'/contents/'
          pubpath='.private-audiobook/graves-ep01-public.pem'
          encpath='.private-audiobook/graves-ep01-encrypted.json'
          def get(path):
              r=requests.get(root+path,headers=headers,timeout=30)
              if r.status_code==404:return None
              r.raise_for_status()
              return r.json()
          def put(path,content,msg):
              r=requests.put(root+path,headers=headers,timeout=30,json={
                  'message':msg,'content':base64.b64encode(content).decode(),'branch':'main'})
              if r.status_code not in (200,201):raise SystemExit('Private handshake publish failed '+str(r.status_code))
          def delete(path,msg):
              obj=get(path)
              if obj:
                  r=requests.delete(root+path,headers=headers,timeout=30,json={
                      'message':msg,'sha':obj['sha'],'branch':'main'})
                  print('SECURE_RELAY_CLEANUP',path,r.status_code)
          private=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          public=private.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          if get(pubpath) is not None:
              raise SystemExit('Stale handshake public key; avoid wrong-key transfer')
          put(pubpath,public,'Publish ephemeral public key for owner-only audiobook input')
          print('GRAVES_EP01_ONE_TIME_PUBLIC_KEY_READY',flush=True)
          try:
              obj=None
              for _ in range(150):
                  obj=get(encpath)
                  if obj:break
                  time.sleep(2)
              if not obj:raise SystemExit('Encrypted input not received within bounded relay window')
              payload=json.loads(base64.b64decode(obj['content']))
              unwrapped=private.decrypt(base64.b64decode(payload['wrapped_key_b64']),
                  padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),
                               algorithm=hashes.SHA256(),label=None))
              plaintext=AESGCM(unwrapped).decrypt(base64.b64decode(payload['nonce_b64']),
                          base64.b64decode(payload['ciphertext_b64']),b'graves-d05-ep01')
              if hashlib.sha256(plaintext).hexdigest()!=payload['sha256']:
                  raise SystemExit('Encrypted input digest mismatch')
              data=pathlib.Path('private-graves-input');data.mkdir()
              file=data/'MANHUA_STORY_PACKAGE.zip';file.write_bytes(plaintext)
              with zipfile.ZipFile(file) as z:
                  names=set(z.namelist())
                  if not {'manifest.json','episodes/ep001.txt'}.issubset(names) or z.testzip():
                      raise SystemExit('Approved story episode missing or ZIP corrupted')
              if not os.environ.get('KAGGLE_API_TOKEN'):
                  raise SystemExit('Kaggle runner secret unavailable')
              owner=os.environ['KAGGLE_USERNAME']
              if not owner.replace('_','').isalnum():
                  raise SystemExit('Invalid Kaggle owner')
              ref=owner+'/the-graves-that-answer-d05-ep01-private'
              meta={'id':ref,'title':'The Graves That Answer D05 Episode 01 private source',
                    'subtitle':'Owner only audiobook source','isPrivate':True,
                    'licenses':[{'name':'other'}]}
              (data/'dataset-metadata.json').write_text(json.dumps(meta))
              check=subprocess.run(['kaggle','datasets','files',ref,'--csv'],
                      capture_output=True,text=True,timeout=70)
              cmd=(['kaggle','datasets','version','-p',str(data),'-m','Approved D05 EP01 private input']
                  if check.returncode==0 else ['kaggle','datasets','create','-p',str(data)])
              transfer=subprocess.run(cmd,capture_output=True,text=True,timeout=500)
              if transfer.returncode:
                  raise SystemExit('Kaggle private dataset upload refused; return code '+str(transfer.returncode))
              print('GRAVES_EP01_PRIVATE_KAGGLE_PACKAGE_VERIFIED',
                    json.dumps({'dataset':ref,'bytes':len(plaintext),'sha256':payload['sha256'],'private':True}),
                    flush=True)
              dispatch=requests.post('https://api.github.com/repos/'+repo+
                   '/actions/workflows/manhua-audiobook-private.yml/dispatches',
                   headers=headers,timeout=35,json={'ref':'main','inputs':{
                     'story_id':'the-graves-that-answer','episode':'1',
                     'private_dataset':ref,'phase':'preflight','image_quality':'quality'}})
              if dispatch.status_code!=204:
                  raise SystemExit('Story upload succeeded but preflight dispatch failed HTTP '+str(dispatch.status_code))
              print('GRAVES_EP01_PREFLIGHT_STARTED',flush=True)
          finally:
              # Ciphertext has no reusable decryption key; remove relay inputs after use.
              delete(encpath,'Remove ephemeral encrypted audiobook input')
              delete(pubpath,'Remove ephemeral audiobook public key')
          PY