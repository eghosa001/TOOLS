name: Temporary VSS EP03 Corrected Master Handoff
on:
  push:
    paths:
      - '.github/workflows/vss_ep03_corrected_master_handoff_20261111.yml'
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Retrieve source-verified episode media
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KdWpuNzrU4I4JXokiW6lLNr1fO/e111aee1-7eca-47a1-b518-8c139c1c0e35.mp4' -o THE_VILLAINS_SECOND_SON_EP03_FINAL_1080P.mp4
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KdWpuNzrU4I4JXokiW6lLNr1fO/735a6225-29df-4dd0-9b85-f596c142bf4b.mp3' -o THE_VILLAINS_SECOND_SON_EP03_KOKORO_MICHAEL.mp3
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KdWpuNzrU4I4JXokiW6lLNr1fO/3df4e636-3362-491e-a1f3-662b053fb1a7.jpg' -o THE_VILLAINS_SECOND_SON_EP03_THUMBNAIL.jpg
          test "$(wc -c < THE_VILLAINS_SECOND_SON_EP03_FINAL_1080P.mp4)" -eq 205808438
          test "$(wc -c < THE_VILLAINS_SECOND_SON_EP03_KOKORO_MICHAEL.mp3)" -eq 25436589
          test "$(wc -c < THE_VILLAINS_SECOND_SON_EP03_THUMBNAIL.jpg)" -eq 219646
          printf '%s  %s\n' '933824590d5c16276aa63b132512c5c88d58fa4cf34fb68c2d20eb3601f06fb9' THE_VILLAINS_SECOND_SON_EP03_FINAL_1080P.mp4 '9c700b794838bf88e43a738d7f890e2b8b34685bbf1a1e256d9fd70e646c17c1' THE_VILLAINS_SECOND_SON_EP03_KOKORO_MICHAEL.mp3 '5699d94a58e315a5ceb9028b9f99b3f813b804194c5889ab053b1f16a48953dc' THE_VILLAINS_SECOND_SON_EP03_THUMBNAIL.jpg | sha256sum --check --status
          echo MEDIA_SHA256_PASS
      - name: Temporary private Drive intake package
        uses: actions/upload-artifact@v4
        with:
          name: vss-ep03-verified-corrected-media-handoff
          path: |
            THE_VILLAINS_SECOND_SON_EP03_FINAL_1080P.mp4
            THE_VILLAINS_SECOND_SON_EP03_KOKORO_MICHAEL.mp3
            THE_VILLAINS_SECOND_SON_EP03_THUMBNAIL.jpg
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
