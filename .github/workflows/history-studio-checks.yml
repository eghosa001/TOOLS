name: "History Studio — editorial/asset-contract checks"
on:
  push:
    paths:
      - "video/history_studio/**"
      - ".github/workflows/history-studio-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Editorial and licensing contract unit tests
        run: python -m unittest discover -s video/history_studio/tests -v
      - name: Actual researched example storyboard schema
        run: python video/history_studio/episode_spec.py video/history_studio/examples/molasses_1919.json
      - name: Confirm unapproved episode cannot publish
        shell: bash
        run: |
          if python video/history_studio/episode_spec.py video/history_studio/examples/molasses_1919.json --release; then
            echo "::error::Unapproved documentary passed release gate"
            exit 1
          fi
          echo "Unapproved episode correctly blocked."
