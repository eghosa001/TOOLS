name: 'Football: mandatory authentic-footage analysis visual gates'
on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'video/football_edits/**'
      - '.github/workflows/football-analysis-visual-standard.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'video/football_edits/**'
      - '.github/workflows/football-analysis-visual-standard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prevent-slideshow-football-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Ensure old Barcelona Villa autogenerated slideshow is quarantined
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/football-barca-villa-2026-qwen-preview.yml')
          text=p.read_text(encoding='utf-8')
          disabled_marker='if: 
          required=('video/football_edits/analysis_visual_gate.py','video/football_edits/FOOTBALL_VISUAL_STANDARD.md')
          assert all(Path(s).is_file() for s in required), 'Real-footage policy or gate missing'
          print('STATIC_PREVIEW_DISABLED_AND_STANDARD_PRESENT')
          PY
      - name: Compile football analysis + source-rights gates
        run: |
          python3 -m py_compile video/football_edits/analysis_visual_gate.py video/football_edits/release_gate.py video/edit_studio/release_gate.py
      - name: Reject synthetic portraits, misleading clips, unlicensed footage and excessive static cards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s video/football_edits -p 'test_*.py' -v
      - name: Explain release rules
        run: |
          echo 'Passing tests do not grant picture/sound approval, legal footage rights, Content ID immunity or YouTube monetization.'
          echo 'For each new football analysis, run analysis_visual_gate.py --phase plan and --phase release on its manually authored shot manifest.'
 + '{' + '{ false }' + '}'
          assert disabled_marker in text, 'Old static preview must stay disabled'
          required=('video/football_edits/analysis_visual_gate.py','video/football_edits/FOOTBALL_VISUAL_STANDARD.md')
          assert all(Path(s).is_file() for s in required), 'Real-footage policy or gate missing'
          print('STATIC_PREVIEW_DISABLED_AND_STANDARD_PRESENT')
          PY
      - name: Compile football analysis + source-rights gates
        run: |
          python3 -m py_compile video/football_edits/analysis_visual_gate.py video/football_edits/release_gate.py video/edit_studio/release_gate.py
      - name: Reject synthetic portraits, misleading clips, unlicensed footage and excessive static cards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s video/football_edits -p 'test_*.py' -v
      - name: Explain release rules
        run: |
          echo 'Passing tests do not grant picture/sound approval, legal footage rights, Content ID immunity or YouTube monetization.'
          echo 'For each new football analysis, run analysis_visual_gate.py --phase plan and --phase release on its manually authored shot manifest.'
