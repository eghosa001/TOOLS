name: 'Football: mandatory authentic-footage analysis visual gates'
on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'video/football_edits/**'
      - '.github/workflows/football-analysis-visual-standard.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'video/football_edits/**'
      - '.github/workflows/football-analysis-visual-standard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prevent-slideshow-football-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Confirm old autogenerated slideshow is quarantined
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/football-barca-villa-2026-qwen-preview.yml')
          old=p.read_text(encoding='utf-8')
          assert any(line.strip().startswith('if: ') and 'false' in line for line in old.splitlines()), 'Old slideshow must stay disabled'
          needed=('video/football_edits/analysis_visual_gate.py','video/football_edits/FOOTBALL_VISUAL_STANDARD.md')
          assert all(Path(f).is_file() for f in needed), 'Missing football preproduction standard'
          print('OLD_SLIDESHOW_DISABLED_AND_RESEARCH_GATE_PRESENT')
          PY
      - name: Compile source and research checks
        run: |
          python3 -m py_compile video/football_edits/analysis_visual_gate.py video/football_edits/release_gate.py video/edit_studio/release_gate.py
      - name: Reject missing research, AI visuals, irrelevant footage and unlicensed match clips
        run: |
          set -euo pipefail
          python3 -m unittest discover -s video/football_edits -p 'test_*.py' -v
      - name: Explain full-video human review requirement
        run: |
          echo 'A passing automated plan gate does not grant picture/sound approval or football footage rights.'
          echo 'Before any upload run both visual plan and verified human-reviewed release gates.'
