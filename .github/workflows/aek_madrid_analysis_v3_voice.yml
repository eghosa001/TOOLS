name: "Football AEK Madrid v3 actual tactical analysis Qwen 1.7B"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aek_madrid_analysis_v3_voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make_voices:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg sox
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -q 'transformers==4.57.3' 'accelerate==1.12.0' soundfile librosa sox onnxruntime einops 'numpy<2.3'
          python -m pip install -q --no-deps 'qwen-tts==0.1.1'
      - name: Create six genuine Qwen studio narration scenes
        run: python video/football_edits/aek_madrid_analysis_v3_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: AEK-Real-Madrid-v3-Genuine-Qwen17-Studio-Analysis-Voice
          path: |
            football_edit_output/aek_real_match_analysis_v3_voice/*narration.wav
            football_edit_output/aek_real_match_analysis_v3_voice/narration_manifest.json
          if-no-files-found: error
          retention-days: 21