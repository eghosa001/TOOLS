name: ASMR licensed stock footage intake
on:
  pull_request:
    paths:
      - "video/ai_asmr_experiments/stock_asmr/**"
      - ".github/workflows/asmr-stock-footage-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests and check FFmpeg
        run: |
          python -m pip install -q requests
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffprobe -version | head -1
          python -m py_compile video/ai_asmr_experiments/stock_asmr/download_stock.py
      - name: Download eight individually licensed Mixkit videos
        env:
          STOCK_OUT: /tmp/asmr_stock_sources
        run: python video/ai_asmr_experiments/stock_asmr/download_stock.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asmr-licensed-stock-footage-and-source-ledger
          path: /tmp/asmr_stock_sources/
          retention-days: 7
          if-no-files-found: error
