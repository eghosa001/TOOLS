name: Still Here HQ Vimeo source preflight
on:
  push:
    paths:
      - '.github/workflows/still-here-hq-source-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q --break-system-packages 'yt-dlp[default,curl-cffi]'
      - name: Acquire authentic high-resolution Riot cinematic from collaborator
        run: |
          mkdir -p source
          FILE=''
          URLS=(
            'https://www.dailymotion.com/video/x8rc70p'
            'https://www.dailymotion.com/video/x8rekrn'
            'https://www.dailymotion.com/video/x99v14g'
            'https://www.gamespot.com/videos/league-of-legends-official-still-here-season-2024-cinematic-music-video/2300-6463181/'
            'https://player.vimeo.com/video/901572104'
          )
          for i in "${!URLS[@]}"; do
            URL="${URLS[$i]}"
            echo "CHECKING CANDIDATE $i - $URL"
            timeout 25s yt-dlp -F "$URL" | tail -n 22 || true
            if timeout 130s yt-dlp --no-playlist --socket-timeout 15 --retries 1 \
              -f 'bv*[height>=720]+ba/b[height>=720]/bestvideo[height>=720]' \
              --merge-output-format mp4 \
              -o "source/still_here_$i.%(ext)s" "$URL"; then
              FILE="$(find source -type f -name "still_here_$i.*" | head -1)"
              if [ -n "$FILE" ]; then
                H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nk=1:nw=1 "$FILE")"
                echo "CANDIDATE $i HEIGHT=$H"
                if [ "$H" -ge 720 ]; then break; fi
              fi
            fi
            FILE=''
          done
          test -n "$FILE"
          test -s "$FILE"
          echo "SOURCE DIMENSIONS:"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=nw=1 "$FILE"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nk=1:nw=1 "$FILE")"
          test "$H" -ge 720
          echo "SOURCE DURATION:"
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$FILE"
          # Freljord Kindred/Tryndamere story from second half.
          ffmpeg -hide_banner -loglevel error -ss 125 -i "$FILE" -t 132 \
            -c:v libx264 -preset veryfast -crf 20 -an -movflags +faststart \
            -y source/STILL_HERE_TRYN_720P_SOURCE.mp4
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of default=nw=1 source/STILL_HERE_TRYN_720P_SOURCE.mp4
      - name: Attach source for locally authored edits
        uses: actions/upload-artifact@v4
        with:
          name: high-quality-original-footage-tryndamere
          path: source/STILL_HERE_TRYN_720P_SOURCE.mp4
          retention-days: 7
          if-no-files-found: error
