name: CartoonStudio Kaggle Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cartoonstudio-kaggle-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Read latest Kaggle notebook logs (no render)
        shell: bash
        run: |
          set -o pipefail
          kaggle kernels logs aighewieghosa/cartoonstudio-3d-video-pipeline 2>&1 | tee kaggle-render.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-kaggle-diagnostics
          path: kaggle-render.log
          if-no-files-found: warn
          retention-days: 7
