name: CartoonStudio Real CC0 Source Material Fidelity (No Episode)

on:
  workflow_dispatch:
  push:
    paths:
      - video/apply_original_vitruvian_pbr.py
      - .github/workflows/cartoonstudio-vivt-source-pbr.yml

permissions:
  contents: read

jobs:
  test-real-original-facial-and-body-textures:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original Vitruvian CC0 meshes and seven real Godot source PBR images
        run: |
          set -euo pipefail
          mkdir -p /tmp/vivt-real-pbr
          BASE="https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project"
          for model in vitruvian_head.glb vitruvian_body.glb; do
            curl --fail --location --retry 3 --silent --show-error --max-time 300 \
              "$BASE/$model" -o "/tmp/vivt-real-pbr/$model"
            test "$(stat -c '%s' "/tmp/vivt-real-pbr/$model")" -gt 1000000
          done
          for image in vit_face_bc.png vit_face_n.png vit_face_rough.png vit_body_bc.png vit_body_n.png vit_body_rough.png vit_mouth.png; do
            curl --fail --location --retry 3 --silent --show-error --max-time 300 \
              "$BASE/$image" -o "/tmp/vivt-real-pbr/$image"
            test "$(stat -c '%s' "/tmp/vivt-real-pbr/$image")" -gt 100000
            sha256sum "/tmp/vivt-real-pbr/$image"
          done
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/NOTICE.md \
            -o /tmp/vivt-real-pbr/NOTICE.md
          grep -F 'Character assets — CC0' /tmp/vivt-real-pbr/NOTICE.md
      - name: Install Blender image-based PBR shader evaluator (real head and body)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Restore artist-original albedo, normal and roughness textures into Blender material translation
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/apply_original_vitruvian_pbr.py -- \
            /tmp/vivt-real-pbr/vitruvian_head.glb \
            /tmp/vivt-real-pbr/vitruvian_body.glb \
            /tmp/vivt-real-pbr \
            artifacts/true-studio-pbr-qa
      - name: Enforce 7 genuine original image sets and no raw asset or video release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/true-studio-pbr-qa')
          r=json.loads((root/'original-cc0-source-materials-report.json').read_text())
          assert r['real_source_textures_loaded']==7
          assert len(r['original_material_assignments'])>=3
          assert r['no_generated_character_geometry']
          assert r['no_synthetic_material_textures']
          assert r['blender_pbr_translation_only']
          assert not r['beauty_render_approved']
          assert not r['no_episode_render'] is False
          assert (root/'original-authored-textures-pbr-review.png').stat().st_size>10000
          assert not list(Path('artifacts').rglob('*.glb'))
          assert not list(Path('artifacts').rglob('*.blend'))
          assert not list(Path('artifacts').rglob('*.mp4'))
          print('ORIGINAL_LICENSED_VITRUVIAN_TEXTURING_QUALITY_QA_PASS')
          PY
      - name: Upload PBR review PNG and evidence only — do not redistribute source 3D or body animations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoonstudio-real-vivt-cc0-original-source-maps-and-pbr-review
          path: artifacts/true-studio-pbr-qa/*
          retention-days: 30
          if-no-files-found: warn
