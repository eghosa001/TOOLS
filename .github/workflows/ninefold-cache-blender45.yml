name: Cache checksum-verified Blender 4.5 once in free private Kaggle notebook
on:
  pull_request:
    paths:
      - "video/ninefold_tide/ops/kaggle_blender_45_cache.ipynb"
      - "video/ninefold_tide/ops/launch_blender_45_cache.py"
      - "video/ninefold_tide/ops/check_blender_45_cache.py"
      - ".github/workflows/ninefold-cache-blender45.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ninefold-private-blender-45-cache
  cancel-in-progress: false
jobs:
  install-once-verify-remotely:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check isolated private, no-GPU Blender notebook source before starting
        run: |
          python -m py_compile video/ninefold_tide/ops/launch_blender_45_cache.py \
             video/ninefold_tide/ops/check_blender_45_cache.py
          python - <<'PY'
          import json
          p="video/ninefold_tide/ops/kaggle_blender_45_cache.ipynb"
          n=json.load(open(p))
          cells=[x for x in n["cells"] if x["cell_type"]=="code"]
          assert len(cells)==1
          code="".join(cells[0]["source"])
          compile(code,p,"exec")
          assert "download.blender.org" in code and "sha256" in code
          assert 'estimated_package_megabytes' in code
          assert '/kaggle/working' in code
          print("Verified isolated source: free Kaggle CPU, Blender.org with official SHA-256")
          PY
      - name: Install official Kaggle CLI on GitHub (not on user's phone)
        run: python -m pip install -q kaggle
      - name: Submit only new private CPU Blender cache if none exists
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/launch_blender_45_cache.py
      - name: Check final official Blender 4.5 checksum and smoke tests remotely by metadata
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python video/ninefold_tide/ops/check_blender_45_cache.py \
             --kernel aighewieghosa/ninefold-blender-4-5-15-cache \
             --out /tmp/ninefold-blender-cache-proof --minutes 19
      - name: Save tiny remote proof only; never download 378 MB archive into GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninefold-private-blender-45-cache-official-checksum-proof
          path: /tmp/ninefold-blender-cache-proof/blender_cache_verification.json
          if-no-files-found: warn
          retention-days: 14
