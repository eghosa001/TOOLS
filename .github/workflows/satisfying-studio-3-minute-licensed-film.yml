name: ASMR 3-minute coherent episode from editor-reviewed footage and Foley
on:
  workflow_dispatch:
    inputs:
      asset_run_id:
        description: "GitHub Actions run containing reviewed-cohesive-asmr-assets artifact (episode manifest, takes, licensed Foley)"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: satisfying-studio-cohesive-3-minute-film
  cancel-in-progress: false
jobs:
  render-approved-timeline-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve only editor-approved ASMR episode sources (no automatic downloads)
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_RUN: ${{ inputs.asset_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/asmr_3min
          gh run download "$ASSET_RUN" --repo "${{ github.repository }}" \
            --name reviewed-cohesive-asmr-assets --dir artifacts/asmr_3min
          test -s artifacts/asmr_3min/episode_manifest.json
          test -s artifacts/asmr_3min/foley.json
          ffmpeg -version | head -1
      - name: Build one-material 180-second episode with sound aligned to contact frames
        run: |
          set -euo pipefail
          python video/satisfying_studio/production/build_cohesive_episode.py \
            artifacts/asmr_3min/episode_manifest.json \
            artifacts/asmr_3min/COHESIVE_ASMR_3_MINUTES_720x1280.mp4
      - name: Data-saving version from the exact same editorial timeline
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i artifacts/asmr_3min/COHESIVE_ASMR_3_MINUTES_720x1280.mp4 \
            -vf "scale=360:640:flags=lanczos" -c:v libx264 -preset veryfast -crf 28 \
            -pix_fmt yuv420p -c:a aac -b:a 96k -ar 48000 -ac 2 \
            -movflags +faststart artifacts/asmr_3min/COHESIVE_ASMR_3_MINUTES_MOBILE.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of json artifacts/asmr_3min/COHESIVE_ASMR_3_MINUTES_MOBILE.mp4 \
            > artifacts/asmr_3min/mobile_technical_probe.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coherent-three-minute-asmr-candidate-not-artistically-approved
          path: |
            artifacts/asmr_3min/COHESIVE_ASMR_3_MINUTES_720x1280.mp4
            artifacts/asmr_3min/COHESIVE_ASMR_3_MINUTES_MOBILE.mp4
            artifacts/asmr_3min/mobile_technical_probe.json
          if-no-files-found: error
          retention-days: 14
