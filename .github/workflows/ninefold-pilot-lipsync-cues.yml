name: Generate 24fps lip-sync cues from real Ninefold pilot audio
on:
  pull_request:
    paths:
      - "video/ninefold_tide/audio/pilot_lipsync_from_wavs.py"
      - ".github/workflows/ninefold-pilot-lipsync-cues.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lip-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and edit timeline
        run: |
          python -m py_compile video/ninefold_tide/audio/pilot_lipsync_from_wavs.py
          python - <<'PY'
          import json
          root="video/ninefold_tide/audio/"
          t=json.load(open(root+"pilot_34s_proposed_timing.json"))
          s=json.load(open(root+"pilot_voice_selection_provisional.json"))
          assert t["total_frames"]==816 and t["fps"]==24
          assert len([x for x in s["selected"] if x["id"].startswith("ep101")])==7
          print("Correct 34s pilot and 7 original chosen speaking WAVs")
          PY
      - name: Install official Kaggle client for existing small voice ZIP only
        run: python -m pip install -q kaggle
      - name: Retrieve previously generated first pilot WAV auditions; NO new GPU use
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p /tmp/ninefold-pilot-audio /tmp/ninefold-pilot-mouth
          kaggle kernels output aighewieghosa/ninefold-tide-qwen3-voice-cast-auditions \
            -p /tmp/ninefold-pilot-audio --quiet
          test -s /tmp/ninefold-pilot-audio/ninefold_voice_ep101_UNAPPROVED.zip
      - name: Install MIT-licensed official Rhubarb Lip Sync v1.14.0 on runner
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip \
            --output /tmp/ninefold-rhubarb.zip
          test $(stat -c%s /tmp/ninefold-rhubarb.zip) -lt 100000000
          unzip -q /tmp/ninefold-rhubarb.zip -d /tmp/ninefold-rhubarb
          find /tmp/ninefold-rhubarb -type f -name rhubarb -exec chmod +x {} \;
          find /tmp/ninefold-rhubarb -type f -name rhubarb | head -1 > /tmp/ninefold-rhubarb-path
          test -s /tmp/ninefold-rhubarb-path
          "$(cat /tmp/ninefold-rhubarb-path)" --version
      - name: Derive real dialogue cues using accurate written pilot text
        run: |
          python video/ninefold_tide/audio/pilot_lipsync_from_wavs.py \
            --source-auditions /tmp/ninefold-pilot-audio/ninefold_voice_ep101_UNAPPROVED.zip \
            --rhubarb "$(cat /tmp/ninefold-rhubarb-path)" \
            --output /tmp/ninefold-pilot-mouth
      - name: Preserve editable 34s lip-sync timing cue package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninefold-ep101-34s-real-voice-visemes-24fps
          path: |
            /tmp/ninefold-pilot-mouth/NINEFOLD_PILOT_34S_24FPS_VISEME_CUES.json
            /tmp/ninefold-pilot-mouth/README.md
          if-no-files-found: warn
          retention-days: 14
