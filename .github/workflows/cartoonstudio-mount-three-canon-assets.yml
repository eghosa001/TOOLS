name: CartoonStudio Mount Actual Three Canonical GLBs — Kaggle Mapping Test (No Episode)

on:
  workflow_dispatch:
  push:
    paths:
      - video/prepare_canon_kaggle_character_files.py
      - .github/workflows/cartoonstudio-mount-three-canon-assets.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-extracted-real-canon-model-file-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve TRUE three exported source actor files from completed GitHub successful run
        uses: actions/download-artifact@v4
        with:
          run-id: 40277244616
          name: cartoonstudio-Lelli-Brin-Odo-original-three-real-3D-character-files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/canon-extract
      - name: Verify exact canonical story and original GLB checksums; create mount map
        run: |
          python video/prepare_canon_kaggle_character_files.py \
            --asset-dir artifacts/canon-extract \
            --story video/story.json \
            --output artifacts/verified-character_files.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/verified-character_files.json').read_text())
          assert set(data)=={'lelli','brin','odo'}
          for path in data.values():
              assert Path(path).is_file() and Path(path).stat().st_size>30000
          print('THREE_VERIFIED_CANON_CHARACTER_FILES_READY_FOR_KAGGLE_INPUT_MOUNT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-verified-real-three-character-file-mapping
          path: artifacts/verified-character_files.json
          if-no-files-found: error
          retention-days: 30
