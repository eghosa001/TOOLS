name: Eternal Dao EP01 — restore original Ryan audio and generate fast private MP4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobook-eternal-dao-ep01-fast-recover.yml
      - video/audiobook_studio/manhua_pipeline/recover_fast_ep1.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eternal-dao-ep01-original-ryan-fast-review
  cancel-in-progress: false
jobs:
  original-ryan-to-turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private Kaggle SDK and CLI
        run: python -m pip install -q --disable-pip-version-check kaggle kagglesdk six requests
      - name: Recover the existing Ryan WAVs and master, then submit 3-step illustrations plus MP4
        run: python -m video.audiobook_studio.manhua_pipeline.recover_fast_ep1
      - name: Confidentiality and release gate
        run: echo 'Owner-private Kaggle audio and MP4 only. Never upload source or audio to public GitHub; no public release.'
