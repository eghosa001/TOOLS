name: Ninefold Kaggle storage inventory - READ ONLY
on:
  workflow_dispatch:
  push:
    paths:
      - "video/ninefold_tide/ops/kaggle_inventory.py"
      - ".github/workflows/ninefold-kaggle-inventory.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle CLI
        run: python -m pip install -q --disable-pip-version-check kaggle
      - name: Audit account counts and size only; no deletions or private IDs logged
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/kaggle_inventory.py
