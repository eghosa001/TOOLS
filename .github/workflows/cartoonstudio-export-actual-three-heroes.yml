name: CartoonStudio DELIVER Three Existing Canonical Character GLBs and Blender Cast

on:
  workflow_dispatch:
  push:
    paths:
      - video/export_existing_canon_cast.py
      - video/studio_world.py
      - .github/workflows/cartoonstudio-export-actual-three-heroes.yml

permissions:
  contents: read

jobs:
  export-real-three-canon-models:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Blender and no paid/cloud AI character generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
          blender --version | head -2
      - name: Export existing exact Lelli Brin Odo meshes, morphs and poses to actual GLBs
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_existing_canon_cast.py -- \
            artifacts/reusable-original-three-heroes
      - name: Re-import real GLBs and verify their original viseme geometry survived
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/reusable-original-three-heroes')
          record=json.loads((root/'EXISTING-CANON-CAST-PACKAGE-EVIDENCE.json').read_text())
          assert record['unchanged_dialogue_entries']==74
          assert set(record['cast'])=={'lelli','brin','odo'}
          assert not record['episode_mp4_rendered']
          assert record['puppet_node_rig_not_complex_skeletal_rig']
          for name,item in record['cast'].items():
              assert item['original_mesh_polygons']>2500
              assert len(item['facial_visemes'])==9
              assert (root/item['source_filename']).stat().st_size>30000
          assert (root/record['real_review_image']).stat().st_size>18000
          assert (root/record['real_blender_cast_scene']).stat().st_size>100000
          assert not list(root.rglob('*.mp4'))
          print('THREE_ACTUAL_REUSABLE_CANON_MODELS_AND_REAL_BLENDER_LINEUP_EXPORTED')
          PY
      - name: Upload THREE true reusable model files, native Blender and real PNG
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoonstudio-Lelli-Brin-Odo-original-three-real-3D-character-files
          path: artifacts/reusable-original-three-heroes/*
          retention-days: 30
          if-no-files-found: warn
