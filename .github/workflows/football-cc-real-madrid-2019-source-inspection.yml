name: "Football: Inspect original CC Real Madrid 2019 behind-scenes match footage"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-cc-real-madrid-2019-source-inspection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch Commons independently license-reviewed Real Madrid source
        run: |
          set -euo pipefail
          mkdir -p review
          curl -fL --retry 2 --retry-delay 3 -A 'FootballVideoEditorial/1.0 (source attribution)' -o review/real_madrid_2019_ccby3.webm 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Ajax_v_Real_Madrid_2019.webm'
          ffprobe -v error -show_entries format=duration,size:stream=width,height -of json review/real_madrid_2019_ccby3.webm >review/source_probe.json
          # Eight actual consecutive samples from different timestamps, no synthetic replacements
          for second in 5 25 45 65 85 105 135 170; do
            ffmpeg -hide_banner -loglevel error -y -ss "$second" -i review/real_madrid_2019_ccby3.webm -frames:v 1 "review/frame_$second.jpg"
          done
          printf '%s\n' 'Title: Ajax v Real Madrid 2019 (Behind the Scenes), Johan Cruyff Arena, 13 Feb 2019' 'Author: Real Madrid via YouTube CC BY 3.0, independently reviewed on Wikimedia Commons 25 Feb 2026' 'Original: https://commons.wikimedia.org/wiki/File:Ajax_v_Real_Madrid_2019.webm' 'Includes club-made footage, not UEFA-owned footage. Date 2019. Do not present as 2026/AΕΚ match action.' > review/license.txt
          ls -lh review
      - uses: actions/upload-artifact@v4
        with:
          name: Real-Madrid-2019-CCBY-Original-Camera-Footage-Editorial-Review
          path: review/*
          retention-days: 7
          if-no-files-found: error
