name: CartoonStudio Professional Cat and Dog — First-Party Animated Rigs

on:
  workflow_dispatch:
  push:
    paths:
      - video/export_professional_blend_to_glb.py
      - video/audit_official_blender_movie.py
      - .github/workflows/cartoonstudio-professional-pets-glb.yml

permissions:
  contents: read

jobs:
  import-real-blender-studio-animals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original 3D production models from Blender.org, not an asset mirror
        run: |
          python video/audit_official_blender_movie.py pet-projects-splash artifacts/official-pets
          test -s artifacts/official-pets/source/blender-3.6-splash/pro/lib/char/cat/publish/cat.v001.blend
          test -s artifacts/official-pets/source/blender-3.6-splash/pro/lib/char/dog/publish/dog.v001.blend
      - name: Install Blender with export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1
      - name: Export real professional Cat skin and facial shape keys
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_professional_blend_to_glb.py -- \
            artifacts/official-pets/source/blender-3.6-splash/pro/lib/char/cat/publish/cat.v001.blend \
            artifacts/verified-professional-pets/cat-professional.glb
      - name: Export real professional Dog skin and facial shape keys
        run: |
          blender -b -t 2 --disable-autoexec --python-exit-code 1 \
            --python video/export_professional_blend_to_glb.py -- \
            artifacts/official-pets/source/blender-3.6-splash/pro/lib/char/dog/publish/dog.v001.blend \
            artifacts/verified-professional-pets/dog-professional.glb
      - name: Validate BOTH full-resolution exported animals, not previews
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"video")
          from verify_original_assets import read_glb
          folder=Path("artifacts/verified-professional-pets")
          report={}
          for key in ("cat","dog"):
              path=folder/(key+"-professional.glb")
              gltf=read_glb(path)
              faces=sum(len(m.get("primitives",[])) for m in gltf.get("meshes",[]))
              morph=sum(len(p.get("targets",[])) for m in gltf.get("meshes",[]) for p in m.get("primitives",[]))
              entry={"bytes":path.stat().st_size,"meshes":len(gltf.get("meshes",[])),
                     "skins":len(gltf.get("skins",[])),"morph_target_sets":morph,
                     "primitives":faces}
              assert entry["bytes"]>1_000_000
              assert entry["skins"]>0 and entry["meshes"]>1 and morph>0
              report[key]=entry
          (folder/"AUDIT.json").write_text(json.dumps(report,indent=2)+"\n")
          print("REAL_HIGH_DETAIL_CARTOON_ANIMALS",json.dumps(report),flush=True)
          PY
      - name: Deliver only verified CC-BY actor files plus provenance
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-verified-professional-cat-dog-glb
          path: |
            artifacts/verified-professional-pets/**
            artifacts/official-pets/OFFICIAL_SOURCE.json
          retention-days: 30
          if-no-files-found: error
