name: Eternal Dao Episode 1 — 8 PM safe cancel and restart
on:
  push:
    paths:
      - .github/workflows/audiobook-eternal-dao-cutoff-restart.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eternal-dao-ep01-cutoff-restart-20261107
  cancel-in-progress: false
jobs:
  owner-cutoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle SDK and CLI
        run: python -m pip install -q --disable-pip-version-check kaggle kagglesdk
      - name: Cancel overdue active Kaggle session and only then restart verified source
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, re, subprocess, sys, tempfile, time, types
          from kagglesdk import KaggleClient
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest, ApiCancelKernelSessionRequest

          owner=os.environ.get('KAGGLE_USERNAME','aighewieghosa')
          slug='private-eternal-dao-episode-1-manhua-assets'
          dataset=owner+'/eternal-dao-d03-approved-private-manuscript'
          ref=owner+'/'+slug
          if not os.environ.get('KAGGLE_API_TOKEN') or not re.fullmatch(r'[A-Za-z0-9_-]+',owner):
              raise SystemExit('KAGGLE_AUTH_OR_OWNER_INVALID')
          def state():
              result=subprocess.run(['kaggle','kernels','status',ref],capture_output=True,text=True,timeout=65)
              match=re.search(r'KernelWorkerStatus\.([A-Z_]+)',result.stdout+' '+result.stderr)
              if result.returncode or not match:
                  raise RuntimeError('Kaggle status unavailable: not safe to restart')
              return match.group(1)
          current=state()
          print('CUTOFF_PRIVATE_KERNEL_STATE',current,flush=True)
          if current == 'COMPLETE':
              print('OWNER_CUTOFF_NO_RESTART_ALREADY_COMPLETED_VERIFY_OUTPUTS',flush=True)
              raise SystemExit(0)
          if current in ('RUNNING','QUEUED','NEW_SCRIPT','CANCEL_REQUESTED'):
              api=KaggleClient(api_token=os.environ['KAGGLE_API_TOKEN']).kernels.kernels_api_client
              req=ApiGetKernelRequest()
              req.user_name=owner
              req.kernel_slug=slug
              original=api.get_kernel(req)
              meta=original.metadata
              if not meta or meta.ref!=ref or meta.current_version_number<=0:
                  raise SystemExit('CUTOFF_NO_VERIFIED_SESSION_ID_DO_NOT_CANCEL_WRONG_RUN')
              # The latest Kaggle version number is used as the session identifier
              # for the generated official cancel-session endpoint. If Kaggle does
              # not accept this ID, fail safely rather than delete the notebook.
              cancel=ApiCancelKernelSessionRequest()
              cancel.kernel_session_id=int(meta.current_version_number)
              try:
                  response=api.cancel_kernel_session(cancel)
                  if response.error_message:
                      print('CUTOFF_CANCEL_REJECTED',response.error_message[:180],flush=True)
                      raise SystemExit(2)
                  print('CUTOFF_CANCEL_REQUEST_ACCEPTED',flush=True)
              except Exception as e:
                  print('CUTOFF_CANCEL_API_UNAVAILABLE',type(e).__name__,str(e)[:160],flush=True)
                  raise SystemExit(2)
              for attempt in range(12):
                  time.sleep(5)
                  current=state()
                  if current in ('ERROR','CANCEL_ACKNOWLEDGED','COMPLETE'):
                      break
              print('CUTOFF_AFTER_CANCEL_STATE',current,flush=True)
              if current=='COMPLETE':
                  print('OWNER_CUTOFF_ASSETS_FINISHED_DURING_CANCEL_VERIFY_INSTEAD',flush=True)
                  raise SystemExit(0)
              if current not in ('ERROR','CANCEL_ACKNOWLEDGED'):
                  raise SystemExit('CUTOFF_OLD_KERNEL_NOT_STOPPED_NO_DUPLICATE_GPU')
          elif current not in ('ERROR','CANCEL_ACKNOWLEDGED'):
              raise SystemExit('CUTOFF_UNKNOWN_KERNEL_STATE_NO_DUPLICATE_GPU')
          # No second GPU job while the previous one remains active.
          check=subprocess.run(['kaggle','datasets','files',dataset,'--csv'],capture_output=True,text=True,timeout=65)
          if check.returncode or 'manifest.json' not in check.stdout or 'ep001.txt' not in check.stdout:
              raise SystemExit('CUTOFF_PRIVATE_D03_SOURCE_UNAVAILABLE_NO_RESTART')
          with tempfile.TemporaryDirectory(prefix='dao-approved-quality-restart-') as td:
              root=pathlib.Path(td)
              runner='import base64,sys,types,subprocess\\n'
              for name in ('video','video.audiobook_studio','video.audiobook_studio.manhua_pipeline'):
                  runner+='m=types.ModuleType('+repr(name)+');m.__path__=[];sys.modules['+repr(name)+']=m\\n'
              modules={
                'video.audiobook_studio.episode_fastlane':'video/audiobook_studio/episode_fastlane.py',
                'video.audiobook_studio.manhua_pipeline.visual_quality':'video/audiobook_studio/manhua_pipeline/visual_quality.py',
                'video.audiobook_studio.manhua_pipeline.core':'video/audiobook_studio/manhua_pipeline/core.py',
                'video.audiobook_studio.manhua_pipeline.kaggle_runner':'video/audiobook_studio/manhua_pipeline/kaggle_runner.py'
              }
              for module,path in modules.items():
                  data=base64.b64encode(pathlib.Path(path).read_bytes()).decode()
                  runner+=(f'm=types.ModuleType({module!r});m.__package__={module.rpartition(".")[0]!r};'
                      f'sys.modules[{module!r}]=m;'
                      f'exec(compile(base64.b64decode({data!r}),{path!r},"exec"),m.__dict__)\\n')
              runner+='subprocess.run([sys.executable,"-m","pip","install","-q","qwen-tts","accelerate","soundfile","diffusers","transformers","safetensors","pillow"],check=True)\\n'
              runner+='from video.audiobook_studio.manhua_pipeline import core\\n'
              runner+='from video.audiobook_studio.manhua_pipeline import kaggle_runner\\n'
              runner+='old_split=core.split_chunks;old_plan=core.scene_plan\\n'
              runner+='kaggle_runner.split_chunks=lambda script:old_split(script,max_words=140)\\n'
              runner+='kaggle_runner.scene_plan=lambda chunks,**kw:old_plan(chunks,target_words=80,**kw)\\n'
              runner+='result=kaggle_runner.process(story_id="eternal-dao-of-the-lost-epoch",episode=1,phase="assets",quality="quality")\\n'
              runner+='print("PRIVATE_D03_EP01_RESTART_RESULT",__import__("json").dumps(result),flush=True)\\n'
              (root/'runner.py').write_text(runner)
              metadata={
                  'id':ref,'title':'Private Eternal Dao Episode 1 Manhua Assets',
                  'code_file':'runner.py','language':'python','kernel_type':'script',
                  'is_private':True,'enable_gpu':True,'enable_internet':True,
                  'dataset_sources':[dataset],'competition_sources':[],
                  'kernel_sources':[],'model_sources':[]}
              (root/'kernel-metadata.json').write_text(json.dumps(metadata,indent=2))
              # Final pre-submission state guard (no silent duplicate).
              if state() in ('RUNNING','QUEUED','NEW_SCRIPT','CANCEL_REQUESTED'):
                  raise SystemExit('CUTOFF_LATE_CONFLICT_NO_DUPLICATE_GPU')
              submitted=subprocess.run(['kaggle','kernels','push','-p',str(root)],capture_output=True,text=True,timeout=220)
              if submitted.returncode:
                  print('CUTOFF_RESTART_SUBMISSION_FAILED',(submitted.stderr or '')[-240:],flush=True)
                  raise SystemExit(2)
              print('CUTOFF_FRESH_PRIVATE_GPU_SUBMITTED',json.dumps({
                'ref':ref,'quality':'Animagine XL 3.1 (22 steps)',
                'narrator':'Qwen Ryan 1.7B','source_dataset_private':True,
                'public_release_approved':False}),flush=True)
          PY
