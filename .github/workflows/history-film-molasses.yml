name: "History Studio — FULL 1919 Molasses Documentary MP4"
on:
  workflow_dispatch:
  push:
    paths:
      - 'video/history_studio/films/molasses_1919/**'
      - '.github/workflows/history-film-molasses.yml'
permissions:
  contents: read
jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentary renderer and licensed offline neural voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato fonts-dejavu-core ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3' 'piper-tts==1.3.0'
      - name: Download the public Piper voice and its model licence card
        run: |
          python - <<'PY'
          import pathlib, urllib.request, time
          base='https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/norman/medium/'
          folder=pathlib.Path('artifacts/voice-model');folder.mkdir(parents=True,exist_ok=True)
          names=['en_US-norman-medium.onnx','en_US-norman-medium.onnx.json','MODEL_CARD']
          for name in names:
              ok=False
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(base+name,headers={'User-Agent':'history-studio-research/1.0'})
                      with urllib.request.urlopen(req,timeout=180) as remote,open(folder/name,'wb') as f:
                          while True:
                              block=remote.read(1024*1024)
                              if not block:break
                              f.write(block)
                      print('VOICE_FILE',name,(folder/name).stat().st_size)
                      ok=True;break
                  except Exception as e:
                      print('VOICE_DOWNLOAD_RETRY',name,attempt,str(e)[:300]);time.sleep(attempt+2)
              if not ok:raise RuntimeError('Could not retrieve verified neural voice '+name)
          card=(folder/'MODEL_CARD').read_text(errors='replace').lower()
          if 'public domain' not in card or 'librivox' not in card:
              raise RuntimeError('Fail closed: voice model card does not verify public domain LibriVox training data')
          if (folder/names[0]).stat().st_size<5_000_000:
              raise RuntimeError('Suspiciously small voice model')
          PY
      - name: Generate original narration, illustrated shots and 1919 public-domain historical photographs
        run: |
          python video/history_studio/films/molasses_1919/build_episode.py \
            --piper-model artifacts/voice-model/en_US-norman-medium.onnx \
            --piper-config artifacts/voice-model/en_US-norman-medium.onnx.json
      - name: Check complete movie and professionally usable deliverables
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('video/history_studio/films/molasses_1919/output')
          video=root/'Great_Molasses_Flood_1919.mp4'
          assert video.is_file() and video.stat().st_size>1_000_000
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(video)]))
          tracks={s['codec_type'] for s in meta['streams']}
          assert {'audio','video'}<=tracks,tracks
          duration=float(meta['format']['duration']);print('FULL_MOVIE_MINUTES',round(duration/60,2))
          assert 500<=duration<=1100, 'Short or implausibly long: '+str(duration)
          assert len(list((root/'plates').glob('*.jpg')))==22
          for filename in ('subtitles.srt','thumbnail.jpg','EPISODE_SCRIPT.txt','YOUTUBE_DESCRIPTION.txt','PROVENANCE.json'):
              assert (root/filename).is_file() and (root/filename).stat().st_size>200,filename
          print('FINISHED_MOVIE_AUDIO_VIDEO_SRT_METADATA_OK')
          PY
      - name: Upload full episode, thumbnail, captions and sources
        uses: actions/upload-artifact@v4
        with:
          name: History-Uncovered-EP01-FULL-1919-Molasses-Documentary
          path: |
            video/history_studio/films/molasses_1919/output/Great_Molasses_Flood_1919.mp4
            video/history_studio/films/molasses_1919/output/subtitles.srt
            video/history_studio/films/molasses_1919/output/thumbnail.jpg
            video/history_studio/films/molasses_1919/output/EPISODE_SCRIPT.txt
            video/history_studio/films/molasses_1919/output/YOUTUBE_DESCRIPTION.txt
            video/history_studio/films/molasses_1919/output/PROVENANCE.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30