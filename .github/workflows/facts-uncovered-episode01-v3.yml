name: "Facts Uncovered — Episode 01 v3 fast archival-first video"
on:
  workflow_dispatch:
  push:
    paths:
      - "video/history_studio/films/molasses_1919_v3/**"
      - ".github/workflows/facts-uncovered-episode01-v3.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: facts-uncovered-episode01-v3-lean-independent
  cancel-in-progress: true
jobs:
  authentic-film-from-existing-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only lean photo and video tools (NO machine learning dependencies)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12"
      - name: Retrieve verified Episode 01 v2 sound and subtitles, no voice regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/episode_v2
          gh run download 40328923446 --repo "$GITHUB_REPOSITORY" --name History-Uncovered-EP01-V2-Cinematic-1080p --dir artifacts/episode_v2
          test -s artifacts/episode_v2/Great_Molasses_Flood_1919_v2.mp4
          test -s artifacts/episode_v2/subtitles.srt
          ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 artifacts/episode_v2/Great_Molasses_Flood_1919_v2.mp4
      - name: Generate authentic historical images video with existing excellent narrator
        run: |
          python video/history_studio/films/molasses_1919_v3/build_episode_v3_fast.py \
            --master artifacts/episode_v2/Great_Molasses_Flood_1919_v2.mp4 \
            --captions artifacts/episode_v2/subtitles.srt
      - name: Verify 1080p video, existing narrator, actual sources, CTA, and subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          out=Path('video/history_studio/films/molasses_1919_v3/output')
          video=out/'Great_Molasses_Flood_1919_v3.mp4'
          assert video.stat().st_size>5_000_000
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(video)]))
          assert 780<float(data['format']['duration'])<960
          assert any(s.get('width')==1920 and s.get('height')==1080 for s in data['streams'])
          assert any(s.get('codec_type')=='audio' for s in data['streams'])
          provenance=json.loads((out/'PROVENANCE.json').read_text())
          assert provenance['archival_first'] and provenance['ai_reconstruction_count']==0
          assert provenance['authentic_1919_image_count']>=4
          assert 'FACTS UNCOVERED' in provenance['channel'].upper()
          for f in ('subtitles.srt','thumbnail_v3.jpg','SHOT_SOURCES.json','YOUTUBE_DESCRIPTION.txt'):
            assert (out/f).stat().st_size>30, f
          print('EPISODE_01_V3_ACTUAL_MP4_READY',video.stat().st_size,round(float(data['format']['duration'])/60,2))
          PY
      - name: Upload actual Episode 01 v3 video for download
        uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-EP01-V3-Authentic-Archival-1080p
          path: |
            video/history_studio/films/molasses_1919_v3/output/Great_Molasses_Flood_1919_v3.mp4
            video/history_studio/films/molasses_1919_v3/output/thumbnail_v3.jpg
            video/history_studio/films/molasses_1919_v3/output/subtitles.srt
            video/history_studio/films/molasses_1919_v3/output/EPISODE_SCRIPT.txt
            video/history_studio/films/molasses_1919_v3/output/YOUTUBE_DESCRIPTION.txt
            video/history_studio/films/molasses_1919_v3/output/PROVENANCE.json
            video/history_studio/films/molasses_1919_v3/output/SHOT_SOURCES.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
