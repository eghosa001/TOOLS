name: Facts Uncovered - motion footage source gate
on:
  pull_request:
    paths:
      - 'video/history_studio/**'
      - '.github/workflows/history-video-motion-gate-tests.yml'
  push:
    paths:
      - 'video/history_studio/**'
      - '.github/workflows/history-video-motion-gate-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-source-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate motion footage gate and rights checklist
        run: |
          python -m unittest discover -s video/history_studio/tests -p 'test_video_motion_gate.py' -v
          python -m unittest discover -s video/history_studio/tests -p 'test_source_first_policy.py' -v
          python -m unittest discover -s video/history_studio/tests -p 'test_real_only_release.py' -v
          python -m unittest discover -s video/history_studio/tests -p 'test_real_only_assemble.py' -v
          python -m py_compile video/history_studio/real_only_assemble.py video/history_studio/video_motion_gate.py video/history_studio/source_first_policy.py video/history_studio/youtube_direct/verify_real_only_release.py video/history_studio/youtube_direct/upload_to_youtube.py video/history_studio/films/molasses_1919_v3/build_episode_v3_fast.py
