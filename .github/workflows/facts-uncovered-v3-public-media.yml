name: "Facts Uncovered — public media link for Metricool"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/facts-uncovered-v3-public-media.yml"
permissions:
  contents: write
  actions: read
jobs:
  publish-video-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download already verified v3 YouTube video artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p media
          gh run download 40348375297 --repo "$GITHUB_REPOSITORY" --name Facts-Uncovered-EP01-V3-Authentic-Archival-1080p --dir media
          test -s media/Great_Molasses_Flood_1919_v3.mp4
          test -s media/thumbnail_v3.jpg
          ls -lh media/Great_Molasses_Flood_1919_v3.mp4 media/thumbnail_v3.jpg
      - name: Publish link-accessible MP4 and thumbnail for Metricool ingestion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="facts-uncovered-ep01-v3-media"
          notes="Media delivery endpoint for the original Facts Uncovered Episode 01 v3. This release is PUBLIC so a connected publishing service such as Metricool can download the media, while YouTube upload visibility remains independently PRIVATE. Archival sources and content metadata are in the accompanying build artifact."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "media/Great_Molasses_Flood_1919_v3.mp4" "media/thumbnail_v3.jpg" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "media/Great_Molasses_Flood_1919_v3.mp4" "media/thumbnail_v3.jpg" --repo "$GITHUB_REPOSITORY" --title "Facts Uncovered: Episode 01 v3 media download" --notes "$notes" --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | [.name, .size, .url] | @tsv)'
