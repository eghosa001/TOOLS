# PAUSED: User requires hands-on, scene-by-scene editorial review before any video assembly.
# No scheduled, push-triggered, chained, or manual video generation is permitted until editorial sign-off.
name: Titanic — premium open-source narration auditions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    if: ${{ false }} # HUMAN_EDITORIAL_APPROVAL_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Kokoro Apache-2 TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          pip install "kokoro>=0.9.4" soundfile numpy
      - name: Produce British male narrator audition tracks
        run: python video/history_studio/episodes/titanic-1912/voice_audition_kokoro.py
      - name: Upload voice audition WAVs and license notes
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-Kokoro-Narrator-Auditions
          path: video/history_studio/episodes/titanic-1912/voice_auditions/
          retention-days: 30
