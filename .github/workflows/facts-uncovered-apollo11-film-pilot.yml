name: Facts Uncovered - Apollo 11 genuine 1969 film Short
on:
  push:
    branches: [production/apollo11-real-film-20261103]
    paths:
      - 'video/history_studio/productions/apollo11_real/**'
      - '.github/workflows/facts-uncovered-apollo11-film-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-real-1969-film:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and free licensed natural narration engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'kokoro-onnx>=0.4' 'numpy>=1.26,<3' 'soundfile>=0.12'
      - name: Download freely licensed narration voice model
        run: |
          set -euo pipefail
          mkdir -p models
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 3 "$BASE/kokoro-v1.0.onnx" -o models/kokoro-v1.0.onnx
          curl -fL --retry 3 "$BASE/voices-v1.0.bin" -o models/voices-v1.0.bin
          test "$(stat -c %s models/kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c %s models/voices-v1.0.bin)" -gt 25000000
      - name: Compile and render 1969 actual Apollo 11 camera footage with original commentary
        run: |
          set -euo pipefail
          python -m py_compile video/history_studio/productions/apollo11_real/produce.py
          python video/history_studio/productions/apollo11_real/produce.py \
            --media archive --output delivery \
            --model models/kokoro-v1.0.onnx --voices models/voices-v1.0.bin
      - name: Verify complete portrait MP4, genuine moving source, rights ledger and sound
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,hashlib
          root=pathlib.Path('delivery')
          film=root/'Facts_Uncovered_Apollo11_Real_Footage_Short.mp4'
          q=json.loads((root/'PREVIEW_QC.json').read_text())
          assert q['status']=='PREVIEW_NOT_APPROVED_FOR_PUBLICATION'
          assert q['no_ai_images_or_video'] and q['real_film_share']>=.99
          assert q['shot_count']==10 and not q['youtube_uploaded']
          assert film.stat().st_size > 1000000
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(film)]))
          vid=next(s for s in data['streams'] if s['codec_type']=='video')
          aud=next(s for s in data['streams'] if s['codec_type']=='audio')
          assert (vid['width'],vid['height'])==(1080,1920)
          assert aud['codec_name']=='aac'
          assert 48<float(data['format']['duration'])<121
          assert hashlib.sha256(film.read_bytes()).hexdigest()==q['master_sha256']
          assert (root/'subtitles.srt').read_text().count(' --> ') > 10
          print('REAL_ONLY_APOLLO_SHORT_PASSED',q['master_sha256'],film.stat().st_size)
          PY
      - name: Save genuine-footage preview and source evidence for private review
        uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Apollo11-Real-Footage-1080x1920-REVIEW
          path: |
            delivery/Facts_Uncovered_Apollo11_Real_Footage_Short.mp4
            delivery/apollo11_real_frame_thumbnail.jpg
            delivery/REAL_ONLY_SOURCE_MANIFEST.json
            delivery/REAL_ONLY_MOTION_MANIFEST.json
            delivery/PREVIEW_QC.json
            delivery/subtitles.srt
            delivery/VIDEO_DESCRIPTION.txt
            delivery/SOURCES_AND_RIGHTS.md
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
