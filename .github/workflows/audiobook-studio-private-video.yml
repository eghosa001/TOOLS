name: Audiobook Studio — render private chapter audio and illustrated video
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Render stage; each run creates private Kaggle outputs only"
        required: true
        type: choice
        options: [full, preflight, audition, chapter, images, video]
        default: full
      book:
        description: "Approved book (1–4)"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      chapter:
        description: "Chapter within the book (1–4)"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
permissions:
  contents: read
concurrency:
  group: audiobook-private-video-${{ inputs.book }}-${{ inputs.chapter }}
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
      AUDIOBOOK_PRIVATE_DATASET_REF: ${{ vars.AUDIOBOOK_PRIVATE_DATASET_REF }}
      AUDIOBOOK_PRIVATE_PROGRESS_DATASET_REF: ${{ vars.AUDIOBOOK_PRIVATE_PROGRESS_DATASET_REF }}
      PHASE: ${{ inputs.phase }}
      BOOK: ${{ inputs.book }}
      CHAPTER: ${{ inputs.chapter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q --disable-pip-version-check kaggle six
      - name: Validate and attach PRIVATE approved manuscript dataset
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess,sys,json,base64,pathlib
          if not os.environ.get('KAGGLE_API_TOKEN'):
              raise SystemExit('Kaggle secret missing')
          owner=os.environ['KAGGLE_USERNAME'].strip()
          source=os.environ.get('AUDIOBOOK_PRIVATE_DATASET_REF','').strip() or owner+'/audiobook-studio-private-source'
          references=[source]
          extra=os.environ.get('AUDIOBOOK_PRIVATE_PROGRESS_DATASET_REF','').strip()
          if extra:references.append(extra)
          # Never print dataset listings, manuscript excerpts or private dataset contents.
          for ref in references:
              proc=subprocess.run(['kaggle','datasets','files',ref,'--csv'],capture_output=True,text=True,timeout=70)
              if proc.returncode!=0:
                  raise SystemExit('Required PRIVATE Kaggle source/progress dataset unavailable. Nothing was submitted.')
              if ref==source and 'AUDIOBOOK_STUDIO_QWEN_VIDEO_PIPELINE_2026-11-06.zip' not in proc.stdout:
                  raise SystemExit('Approved private source ZIP not found in Kaggle dataset. Nothing was submitted.')
          phase=os.environ['PHASE'];book=int(os.environ['BOOK']);chapter=int(os.environ['CHAPTER'])
          if phase not in ('full','preflight','audition','chapter','images','video') or book not in (1,2,3,4) or chapter not in (1,2,3,4):
              raise SystemExit('Invalid stage or book/chapter')
          script=pathlib.Path('video/audiobook_studio/kaggle_private_chapter_video.py').read_bytes()
          b64=base64.b64encode(script).decode('ascii')
          config={'phase':phase,'book':book,'chapter':chapter,'max_images':14}
          code='import base64\nCONFIG='+repr(config)+'\nexec(compile(base64.b64decode('+repr(b64)+'),"audiobook_private_video.py","exec"),{"__name__":"__main__","CONFIG":CONFIG})\n'
          stage=pathlib.Path('artifacts/audiobook-private-kaggle')
          stage.mkdir(parents=True,exist_ok=True)
          (stage/'runner.py').write_text(code)
          meta={'id':owner+'/audiobook-studio-production-private',
                'title':'Audiobook Studio Production Private',
                'code_file':'runner.py','language':'python','kernel_type':'script',
                'is_private':True,'enable_gpu':phase in ('full','audition','chapter','images'),
                'enable_internet':True,'dataset_sources':references,
                'competition_sources':[],'kernel_sources':[],'model_sources':[]}
          (stage/'kernel-metadata.json').write_text(json.dumps(meta,indent=2))
          print('PRIVATE_AUDIOBOOK_RUN_READY',{'phase':phase,'book':book,'chapter':chapter,'source_verified':True,'private':True})
          PY
      - name: Launch real production stage privately on Kaggle
        run: |
          kaggle kernels push -p artifacts/audiobook-private-kaggle
          echo 'PRIVATE_AUDIOBOOK_GPU_JOB_SUBMITTED — execution and actual media verification still pending'
      - name: Report private notebook location (no private content disclosed)
        run: |
          echo 'Kaggle notebook: https://www.kaggle.com/code/'"$KAGGLE_USERNAME"'/audiobook-studio-production-private'
          echo 'Do not upload unpublished audio, manuscripts or images to the public GitHub workflow artifacts.'
