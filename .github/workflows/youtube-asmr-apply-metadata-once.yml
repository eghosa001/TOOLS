name: "ASMR — apply verified SEO video improvements once"
on:
  push:
    branches: [main]
    paths:
      - "video/youtube_research_cloud/requests/metadata-improvements-2026-11-02.json"
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'eghosa001/TOOLS'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact user-authorized videos and updates
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('video/youtube_research_cloud/requests/metadata-improvements-2026-11-02.json','utf8'));
          if(m.channelId!=='UC9PFLzcnIYHVGy_svH86jyw'||
             m.playlistId!=='PLcvQlecwMwmo'||
             JSON.stringify(m.videoIds)!==JSON.stringify(['FgUS9hMYEbk','YQByazV5lWU','fn_pI5rHo6c'])||
             m.action!=='fix-sand-title-and-crosslink-water-rain'||
             m.userRequestedWorkNow!==true)throw Error('Out-of-scope or unapproved YouTube metadata operation');
          console.log('Metadata change intent matches approved Surreal ASMR channel and three selected videos');
          JS
      - name: Verify code
        run: node --check video/youtube_research_cloud/tools/apply_asmr_metadata_20261102.mjs
      - name: Apply metadata with exact owner verification and YouTube readback
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node video/youtube_research_cloud/tools/apply_asmr_metadata_20261102.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surreal-asmr-20261102-video-metadata-snapshot
          path: audit-output/surreal-asmr-metadata-change.json
          if-no-files-found: ignore
          retention-days: 30
