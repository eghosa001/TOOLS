name: Audiobook — verify existing Kaggle smoke clip without rerender
on:
  push:
    paths:
      - .github/workflows/audiobook-manhua-smoke-existing-media-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-media:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || vars.KAGGLE_OWNER || 'aighewieghosa' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight verification tools
        run: |
          pip -q install kaggle six pillow
          sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Retrieve and technically check actual failed-Kaggle video and artwork
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,json,hashlib,math,re
          from PIL import Image
          owner=os.environ.get('KAGGLE_USERNAME') or 'aighewieghosa'
          ref=owner+'/private-synthetic-5-second-manhua-smoke-test'
          dest=pathlib.Path('private-kaggle-output');dest.mkdir(exist_ok=True)
          c=subprocess.run(['kaggle','kernels','output',ref,'-p',str(dest),'--force'],capture_output=True,text=True,timeout=180)
          if c.returncode:raise SystemExit('KAGGLE_OUTPUT_RETRIEVAL_FAILED '+c.stderr[-500:])
          vid=list(dest.rglob('smoke-test-001_ep001_MANHUA_REVIEW.partial.mp4'))
          thumbs=list(dest.rglob('THUMBNAIL_REVIEW.png'))
          images=list(dest.rglob('scene-0000-*.png'))
          wavs=list(dest.rglob('0000-*.wav'))
          if len(vid)!=1 or len(thumbs)!=1 or not images or not wavs:
              raise SystemExit('MISSING_ACTUAL_MEDIA '+str({'video':len(vid),'thumbnail':len(thumbs),'art':len(images),'ryan_wav':len(wavs)}))
          with Image.open(thumbs[0]) as img:assert img.size==(1280,720)
          with Image.open(images[0]) as img:assert img.size==(1024,576)
          p=vid[0]
          probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_type,codec_name,width,height,duration','-of','json',str(p)],capture_output=True,text=True,check=True,timeout=60)
          data=json.loads(probe.stdout)
          duration=float(data['format']['duration'])
          streams=data['streams']
          videos=[s for s in streams if s.get('codec_type')=='video']
          audios=[s for s in streams if s.get('codec_type')=='audio']
          if not 3<=duration<=10 or len(videos)!=1 or len(audios)!=1:raise SystemExit('INVALID_FIVE_SECOND_AV '+str((duration,videos,audios)))
          if (videos[0].get('width'),videos[0].get('height'))!=(1920,1080):raise SystemExit('VIDEO_DIMENSION_INVALID')
          if videos[0].get('codec_name')!='h264':raise SystemExit('VIDEO_CODEC_INVALID')
          r=subprocess.run(['ffmpeg','-hide_banner','-i',str(p),'-vn','-af','volumedetect','-f','null','-'],text=True,capture_output=True,timeout=90)
          m=re.search(r'mean_volume:\\s*(-?\\d+(?:\\.\\d+)?)\\s*dB',r.stderr)
          if not m:raise SystemExit('AUDIO_VOL_NOT_VERIFIED '+r.stderr[-1200:])
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          print('EXISTING_SMOKE_AV_TECHNICAL_PASS',json.dumps({'duration_seconds':round(duration,3),'dimensions':'1920x1080','has_audio':True,'mean_volume_db':float(m.group(1)),'one_manhua_panel':True,'thumbnail_1280x720':True,'original_ryan_wav_present':True,'sha256':sha,'private_only':True}))
          PY
