name: Giza photo first 14 chapters real licensed photographs
on:
  push:
    paths: [".github/workflows/giza-photo-first-14chapters.yml"]
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        chapter: ["01","02","04","05","06","07","08","09","10","11","12","13","14","15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install and validate source-first editor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core
          python -m pip install -q --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "requests>=2.31" "soundfile>=0.12"
          python -m unittest discover -v -s video/history_studio/tests -p test_source_first_policy.py
          python video/history_studio/films/giza_hidden_history_2026/build_photo_first_storyboards.py --output photo_first_storyboards
      - name: Download original voice and exactly measured shot timing from previous release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          mkdir -p review
          n="${{ matrix.chapter }}"
          if [ "$n" = 01 ]; then tag=facts-uncovered-giza-chapter01-director-cut-2026-10-28
          else tag="facts-uncovered-giza-chapter-$n-directed-review-2026-10-28"; fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir review --pattern "chapter_$n""_voice_MASTER.wav" --pattern "LOCKED_CHAPTER$n""_SHOT_MAP.json" --pattern "chapter_$n""_ALIGNED_REVIEW.srt"
          test -s "review/chapter_$n""_voice_MASTER.wav"
          test -s "review/LOCKED_CHAPTER$n""_SHOT_MAP.json"
      - name: Enforce actual individual licence and image-byte SHA before rendering
        run: |
          set -euo pipefail
          n="${{ matrix.chapter }}"
          python video/history_studio/films/giza_hidden_history_2026/directed_chapter01.py --chapter "$n" --manifest "photo_first_storyboards/chapter$n""_photo_first.json" --work review --model /dev/null --voices /dev/null --reuse-voice --layout-preview-only
          python -c "import json; a=json.load(open('review/SOURCE_FIRST_ACTUAL_ASSETS.json')); assert a['status']=='PASS' and a['authentic_fraction']>=.6, a['errors'][:15]"
      - name: Render 1080p historical picture against unchanged voice; decode entire film chapter
        run: |
          set -euo pipefail
          n="${{ matrix.chapter }}"
          python video/history_studio/films/giza_hidden_history_2026/directed_chapter01.py --chapter "$n" --manifest "photo_first_storyboards/chapter$n""_photo_first.json" --work review --model /dev/null --voices /dev/null --reuse-voice
          ffmpeg -v error -xerror -nostdin -i "review/Great_Pyramid_Chapter$n""_MANUALLY_DIRECTED_REVIEW.mp4" -f null -
          echo 'Complete H264/AAC decode passed. Continuous human editorial approval not done.' > review/FULL_DECODE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Giza-Photo-First-${{ matrix.chapter }}
          path: |
            review/*MANUALLY_DIRECTED_REVIEW.mp4
            review/*ALIGNED_REVIEW.srt
            review/LOCKED_CHAPTER*_SHOT_MAP.json
            review/ASSET_RIGHTS.json
            review/SOURCE_FIRST_ACTUAL_ASSETS.json
            review/FULL_DECODE.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
      - name: Preserve licensed real-photo edit in separate GitHub release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          n="${{ matrix.chapter }}"
          gh release create "facts-uncovered-giza-ch$n-photo-first-reviewed-2026-10-28" "review/Great_Pyramid_Chapter$n""_MANUALLY_DIRECTED_REVIEW.mp4" "review/chapter_$n""_ALIGNED_REVIEW.srt" "review/LOCKED_CHAPTER$n""_SHOT_MAP.json" review/ASSET_RIGHTS.json review/SOURCE_FIRST_ACTUAL_ASSETS.json review/FULL_DECODE.txt --repo "$GITHUB_REPOSITORY" --latest=false --title "Great Pyramid Ch$n — original real photo director cut" --notes 'Individual source-approved historical photographs; exact original voice preserved. Nonpublic editorial review only.'
