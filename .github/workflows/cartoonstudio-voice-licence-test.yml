name: CartoonStudio Commercial-Safe Audition Voice Test (No Video)

on:
  workflow_dispatch:
  push:
    paths:
      - video/production_voice_tracks.py
      - .github/workflows/cartoonstudio-voice-licence-test.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline Piper synthesis package
        run: python -m pip install --disable-pip-version-check piper-tts==1.3.0
      - name: Check original story voice is not modified and fetch verified public-domain model card
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          story=json.loads(Path("video/story.json").read_text())
          assert all(c["voice"]=="en_GB-alan-medium" for c in story["characters"].values())
          print("ORIGINAL_CANON_VOICES_UNCHANGED")
          PY
      - name: Generate actual audition WAVs covering all 3 distinct speaking roles
        run: |
          python video/production_voice_tracks.py \
            --story video/story.json \
            --output artifacts/voice-test \
            --limit 4
          python - <<'PY'
          import wave
          with wave.open("artifacts/voice-test/line_001.wav","rb") as f:
              length=f.getnframes()/f.getframerate()
              assert length>0.5 and length<120
          from pathlib import Path
          assert all((Path("artifacts/voice-test")/f"line_{i:03}.wav").is_file() for i in range(1,5))
          print("LICENSED_VOICE_AUDITION_THREE_ROLES_PASS",round(length,2))
          PY
      - name: Upload one audition WAV for review (NOT an episode render)
        uses: actions/upload-artifact@v4
        with:
          name: cartoonstudio-licensed-audition-first-line
          path: artifacts/voice-test/**
          retention-days: 14
          if-no-files-found: error
