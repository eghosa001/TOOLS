          python-version: "3.11"
      - name: Install cinematic rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "requests>=2.31,<3"
