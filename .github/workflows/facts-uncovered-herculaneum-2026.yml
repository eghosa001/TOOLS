        run: |
          python -m py_compile video/history_studio/films/herculaneum_2026/build.py
          python video/history_studio/films/herculaneum_2026/build.py
      - name: Check dimensions, voices and all three MP4s
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path("video/history_studio/films/herculaneum_2026/output")
          vids=sorted(p.glob("*.mp4"))
          assert len(vids)==3, vids
          for vid in vids:
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(vid)]))
              streams=probe["streams"]
              assert any(s["codec_type"]=="audio" for s in streams),vid
              videos=[s for s in streams if s["codec_type"]=="video"]
              assert len(videos)==1 and videos[0]["width"]>=1080,vid
              assert 27 < float(probe["format"]["duration"]) < 250,vid
              assert vid.stat().st_size > 250000,vid
              print("VALIDATED",vid.name,"seconds",probe["format"]["duration"],"bytes",vid.stat().st_size)
          assert (p/"thumbnail.jpg").stat().st_size>25000
          assert (p/"IMAGE_CREDITS.json").exists()
          PY
      - name: Upload all downloadable MP4s and publishing assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Facts-Uncovered-Herculaneum-2026-Film-and-Shorts
          path: |
            video/history_studio/films/herculaneum_2026/output/*.mp4
            video/history_studio/films/herculaneum_2026/output/*.jpg
            video/history_studio/films/herculaneum_2026/output/*.json
            video/history_studio/films/herculaneum_2026/SEO_AND_SOURCES.md
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
