name: Temporary VSS EP04 Drive Handoff
on:
  push:
    paths:
      - .github/workflows/temp-vss-ep04-drive-handoff.yml
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - name: Download original approved MP4 and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 800 \
            -o VSS_EP04_The_Road_That_Stayed_Open_REVIEW_1080p.mp4 \
            'https://sb-14exsbliwalp.vercel.run/The_Villains_Second_Son_E04_The_Road_That_Stayed_Open_REVIEW_1080p.mp4'
          actual="$(sha256sum VSS_EP04_The_Road_That_Stayed_Open_REVIEW_1080p.mp4 | cut -d' ' -f1)"
          expected="09a2f8d495d45392c0cd757b50f49bd4958ca87cb3071cee6d1572eb398d0878"
          test "$actual" = "$expected"
          test "$(stat -c %s VSS_EP04_The_Road_That_Stayed_Open_REVIEW_1080p.mp4)" -eq 209720738
      - name: Handoff to ChatGPT connector for private Google Drive upload
        uses: actions/upload-artifact@v4
        with:
          name: VSS_EP04_DRIVE_HANDOFF_DELETE_AFTER_UPLOAD
          path: VSS_EP04_The_Road_That_Stayed_Open_REVIEW_1080p.mp4
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
