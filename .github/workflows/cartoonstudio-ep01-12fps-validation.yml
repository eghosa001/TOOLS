name: CartoonStudio E01 — 480p 12fps-On-Twos Safety Checks (No Render)
on:
  push:
    paths:
      - "video/episodes/tiny-trails/ep01/render_ep01_fast480_on_twos.py"
      - "video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_12fps_preview.py"
      - ".github/workflows/cartoonstudio-ep01-12fps-validation.yml"
  pull_request:
    paths:
      - "video/episodes/tiny-trails/ep01/render_ep01_fast480_on_twos.py"
      - "video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_12fps_preview.py"
      - ".github/workflows/cartoonstudio-ep01-12fps-validation.yml"
permissions:
  contents: read
jobs:
  no-render-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact 12 unique 24 encoded 480p and no Kaggle execution
        run: |
          python -m py_compile video/episodes/tiny-trails/ep01/render_ep01_fast480_on_twos.py video/episodes/tiny-trails/ep01/kaggle_ep01_fast480_12fps_preview.py
          python - <<'PY'
          from pathlib import Path
          root=Path("video/episodes/tiny-trails/ep01")
          a=(root/"render_ep01_fast480_on_twos.py").read_text()
          b=(root/"kaggle_ep01_fast480_12fps_preview.py").read_text()
          assert "scene.render.resolution_x=854" in a and "scene.render.resolution_y=480" in a
          assert "scene.render.fps=24" in a
          assert "scene.frame_end=72" in a and "scene.frame_step=2" in a
          assert "scene.render.image_settings.file_format=\"PNG\"" in a
          assert "range(1,73,2)" in a and "range(1,73,2)" in b
          assert "EP01_TWOS_REQUIRES_EXACT_36_ODD_NUMBERED_PNG_FRAMES" in a
          assert "scene.cycles.use_adaptive_sampling=True" in a
          assert "scene.render.use_persistent_data=True" in a
          assert '"-framerate","12"' in b
          assert '"-r","24","-frames:v","72"' in b
          assert '"-c:v","libx264"' in b and '"-c:a","aac"' in b
          assert '"-t","3"' in b
          assert "line_001.wav" in b and "adelay=1000" in b
          assert '"--mode","preview"' in b
          assert "preview-frames" not in b or "FRAMES=TEMP/" in b
          assert "KAGGLE_API_TOKEN" not in b
          assert "kaggle kernels push" not in b
          assert "full_render" not in b or '"full_rendered":False' in b
          print("EP01_TEST_12_UNIQUE_24_PLAYBACK_FRAMES_480P_NO_RENDER_PASS")
          PY
      - name: Preserve exact dialogue and story with ordinary no-render preflight
        run: |
          python video/episodes/tiny-trails/ep01/episode_preflight.py --output /tmp/e01-twos-story
          test -f /tmp/e01-twos-story/subtitles.srt
          test ! -f /tmp/e01-twos-story/tiny-trails-ep01-preview-3s.mp4
