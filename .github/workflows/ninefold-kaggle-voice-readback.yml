name: Ninefold Voice Kaggle live status
on:
  pull_request:
    paths:
      - "video/ninefold_tide/ops/check_private_voice_status.py"
      - ".github/workflows/ninefold-kaggle-voice-readback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q --disable-pip-version-check kaggle
      - name: Read actual Kaggle voice job and output metadata; no changes
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python video/ninefold_tide/ops/check_private_voice_status.py
