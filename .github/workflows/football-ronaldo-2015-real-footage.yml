name: 'Football: Cristiano Ronaldo 48 goals real-footage Short'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-ronaldo-2015-real-footage.yml'
      - 'video/football_edits/ronaldo_2015_ccby.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  edit-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout TOOLS video editing pipeline
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video editing dependencies
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
          ffmpeg -version | sed -n '1p'
          python -m pip install --disable-pip-version-check --quiet numpy pillow
      - name: Download original Real Madrid match footage with verified Commons hash
        run: |
          set -euo pipefail
          mkdir -p football_edit_source
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 4 --max-time 550 \
            --header 'User-Agent: Wikimedia-CC-Attribution-Editor/1.0 (archive research)' \
            'https://upload.wikimedia.org/wikipedia/commons/7/77/All_48_goals_of_Cristiano_Ronaldo%2C_in_35_league_matches_for_Real_Madrid_%282014-15%29.ogv' \
            --output football_edit_source/ronaldo_48_goals_2014_15.ogv
          test "$(stat -c%s football_edit_source/ronaldo_48_goals_2014_15.ogv)" -eq 207600982
          echo '6a75c744421acb76b827441fd9967d778cc19a4a  football_edit_source/ronaldo_48_goals_2014_15.ogv' | sha1sum -c -
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 football_edit_source/ronaldo_48_goals_2014_15.ogv
      - name: Render 1080x1920 football edit with original rhythm and captions
        run: |
          set -euo pipefail
          python -m py_compile video/football_edits/ronaldo_2015_ccby.py
          python video/football_edits/ronaldo_2015_ccby.py
      - name: Verify output and licensing record
        run: |
          set -euo pipefail
          test -s football_edit_output/CR7_48_Goals_One_Season_Football_Edit_1080x1920.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height:format=duration,size -of json football_edit_output/CR7_48_Goals_One_Season_Football_Edit_1080x1920.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('football_edit_output/technical_and_rights_qa.json').read_text())
          assert data['source_sha1_verified']=='6a75c744421acb76b827441fd9967d778cc19a4a'
          assert data['resolution']=='1080x1920' and data['cuts']==8
          PY
      - name: Retain downloadable edit and attribution
        uses: actions/upload-artifact@v4
        with:
          name: CR7-48-Goals-2014-15-real-footage-editorial-review
          path: |
            football_edit_output/CR7_48_Goals_One_Season_Football_Edit_1080x1920.mp4
            football_edit_output/rights_and_description.md
            football_edit_output/technical_and_rights_qa.json
            football_edit_output/proof_frame.jpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Publish download-only GitHub release (not YouTube)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='football-cr7-48-goals-editorial-20261103'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              football_edit_output/CR7_48_Goals_One_Season_Football_Edit_1080x1920.mp4 \
              football_edit_output/rights_and_description.md \
              football_edit_output/technical_and_rights_qa.json \
              football_edit_output/proof_frame.jpg \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              football_edit_output/CR7_48_Goals_One_Season_Football_Edit_1080x1920.mp4 \
              football_edit_output/rights_and_description.md \
              football_edit_output/technical_and_rights_qa.json \
              football_edit_output/proof_frame.jpg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'CR7 — 48 Goals in 35 Games | Football Short (Editorial Review)' \
              --notes 'Download-only 1080x1920 edit from actual Real Madrid goals match video, recorded CC BY 3.0. Includes original beat, subtitles and licensing. Editorial review only; not published to YouTube. Monetization approval is not guaranteed.' \
              --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | [.name,.size,.url] | @tsv)'
