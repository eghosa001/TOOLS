name: 'Football: fail-closed real-footage and monetization-readiness gates'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-ronaldo-2015-real-footage.yml'
      - 'video/football_edits/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-standards:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run automated football reuse and goal-completeness regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile video/football_edits/release_gate.py video/football_edits/render_from_manifest.py
          python3 -m unittest discover -v -s video/football_edits -p 'test_release_gate.py'
          echo 'Only completed, documented, substantively authored edits with human review can pass the release gate.'
      - name: Quarantine earlier misleading Ronaldo 20.8-second cut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='football-cr7-48-goals-editorial-20261103'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title 'WITHDRAWN EDITORIAL SAMPLE — Cristiano Ronaldo 2014–15 (goals cropped)' \
              --notes 'REJECTED / WITHDRAWN FROM EDITORIAL APPROVAL. The original 20.8-second download uses eight arbitrary 2.6-second cuts and does NOT show all 48 goals; some actions end prematurely. It lacks specific original explanation and may not satisfy YouTube reused-content rules. Retained solely as a historical test sample. Do not upload or monetize this cut. Source footage © Real Madrid, CC BY 3.0, Wikimedia Commons, with attribution and changes noted; licence does not guarantee YouTube monetization. Superseded by mandatory rights, originality and full-goal review gates in video/football_edits/release_gate.py.' \
              --prerelease
          fi
