# Always-on $150 keyless PAPER simulation on an owner-approved Docker host.
# No public ports, no exchange keys, persistent isolated SQLite state.
name: crypto-eth-paper
services:
  init-runtime:
    image: busybox:1.36
    user: "0:0"
    restart: "no"
    volumes:
      - crypto_eth_paper_runtime:/freqtrade/runtime
    command: ["sh", "-c", "mkdir -p /freqtrade/runtime && chown -R 1000:1000 /freqtrade/runtime"]
  freqtrade-dryrun:
    depends_on:
      init-runtime:
        condition: service_completed_successfully
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    volumes:
      - ./:/freqtrade/crypto-consensus:ro
      - ./user_data:/freqtrade/user_data
      - crypto_eth_paper_runtime:/freqtrade/runtime
    environment:
      PYTHONPATH: /freqtrade/crypto-consensus
      CRYPTO_PAPER_PAUSE_FILE: /freqtrade/runtime/PAUSE_ENTRIES
      PYTHONUNBUFFERED: "1"
    entrypoint: ["/bin/sh", "/freqtrade/crypto-consensus/start_dryrun.sh"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys;p='/freqtrade/runtime/freqtrade.log';sys.exit(0 if os.path.isfile(p) and time.time()-os.stat(p).st_mtime<240 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 4m
  paper-watchdog:
    image: python:3.11-slim
    restart: unless-stopped
    depends_on: ["freqtrade-dryrun"]
    volumes:
      - ./watchdog.py:/opt/watchdog.py:ro
      - crypto_eth_paper_runtime:/freqtrade/runtime
    command: ["python", "-u", "/opt/watchdog.py"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  crypto_eth_paper_runtime:
    name: crypto_eth_paper_runtime
